---
name: Warn RPA step/task name changes
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tasks/**/*.yaml"
      - "pipelines/**/*.yaml"
      - ".github/scripts/warn_rpa_step_renames.py"
      - ".github/workflows/warn-rpa-step-renames.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  warn:
    name: Comment on step/task name changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect name changes and comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m pip install --user pyyaml
          python3 .github/scripts/warn_rpa_step_renames.py
