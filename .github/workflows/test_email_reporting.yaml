---
name: Test Email Reporting (Safe)
on:
  workflow_dispatch:
    inputs:
      promotion-type:
        description: The type of promotion to simulate
        type: choice
        required: true
        default: development-to-staging
        options:
          - development-to-staging
          - staging-to-production

jobs:
  test-email-reporting:
    name: Test Email Reporting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for commit analysis
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Test email report generation (NO PROMOTION)
        run: |
          # Determine source and target branches
          if [ "${{ inputs.promotion-type }}" = "development-to-staging" ]; then
            FROM_BRANCH="development"
            TO_BRANCH="staging"
          else
            FROM_BRANCH="staging"
            TO_BRANCH="production"
          fi
          
          echo "🧪 TESTING EMAIL GENERATION ONLY - NO ACTUAL PROMOTION"
          echo "📊 Analyzing commits between $FROM_BRANCH and $TO_BRANCH"
          
          # Generate the promotion report (read-only operation)
          python .github/scripts/generate_promotion_report.py $FROM_BRANCH $TO_BRANCH
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      
      - name: Upload test report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-email-report-${{ inputs.promotion-type }}-${{ github.run_id }}
          path: |
            promotion_reports/
          retention-days: 7