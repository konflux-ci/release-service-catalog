---
name: PR Review Events
run-name: 'Review labels for PR #${{ github.event.pull_request.number }}'

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  review-event:
    runs-on: ubuntu-latest
    steps:
      # Fork review events have read-only tokens; completion starts the writable label workflow.
      - name: Receive review event
        run: echo 'Review received; the label updater will check current approvals.'
