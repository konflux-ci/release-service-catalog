---
name: PR Prod Approval Labeler
run-name: ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: [PR Review Events]
    types: [completed]

permissions: {}

jobs:
  label-pr:
    if: github.event.workflow_run.event == 'pull_request_review'
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pr-prod-approval-label-${{ github.event.workflow_run.display_title }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Identify reviewed PR
        id: review
        shell: bash
        env:
          REVIEW_RUN_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          # Fork runs may have no pull_requests entry. The title only selects the PR;
          # the shared action reads current reviews and permissions from GitHub.
          if [[ ! "${REVIEW_RUN_TITLE}" =~ ^Review\ labels\ for\ PR\ \#([1-9][0-9]*)$ ]]; then
            echo 'Unexpected review run title' >&2
            exit 1
          fi
          echo "pr-number=${BASH_REMATCH[1]}" >> "${GITHUB_OUTPUT}"
      - name: Label PR using shared action
        # main
        uses: konflux-ci/release-service-automations/pr-prod-approval-labeler@d0208b9cc14390cde9a2fc132f72566a20e59aca
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.review.outputs.pr-number }}
          repository: ${{ github.repository }}
