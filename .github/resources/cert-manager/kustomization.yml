---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager.yaml

patches:
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 90m
            memory: 90Mi
          limits:
            cpu: 120m
            memory: 120Mi
    target:
      kind: Deployment
      name: cert-manager
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 90m
            memory: 90Mi
          limits:
            cpu: 120m
            memory: 120Mi
    target:
      kind: Deployment
      name: cert-manager-cainjector
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 90m
            memory: 90Mi
          limits:
            cpu: 120m
            memory: 120Mi
    target:
      kind: Deployment
      name: cert-manager-webhook
