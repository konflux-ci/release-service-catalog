# Email Reporting Configuration
# =============================
# This file contains only actively implemented configuration options.
# Future enhancements can be added here as they are developed.

# AI Configuration
ai:
  # OpenRouter API settings (primary AI provider)
  model: "meta-llama/llama-3-8b-instruct"
  temperature: 0.3
  max_tokens: 2500
  max_commits_for_analysis: 30

# Email Configuration  
email:
  # SMTP Settings (configured via environment variables)
  smtp_server: "smtp.gmail.com"  # Default, override with SMTP_SERVER env var
  smtp_port: 587                 # Default, override with SMTP_PORT env var
  
  # Email Content
  from_address: "release-reports@konflux-ci.com"  # Default, override with EMAIL_FROM env var
  
  # Subject line templates for different promotion types
  subject_templates:
    development_to_staging: "Release Service Catalog - Development to Staging Promotion Report"
    staging_to_production: "Release Service Catalog - Staging to Production Promotion Report"

# Report Configuration
report:
  # Output settings
  save_reports: true
  report_directory: "promotion_reports"
  
  # Content settings - controls what sections are included in reports
  include_commit_links: true      # GitHub links for each commit
  include_task_analysis: true     # Task and pipeline impact analysis  
  include_pipeline_impact: true   # Affected pipeline components
  include_statistics: true        # Summary statistics

# Repository Configuration
repository:
  url: "https://github.com/konflux-ci/release-service-catalog"
  branches:
    development: "development"
    staging: "staging" 
    production: "production"

# Task Analysis Configuration
task_analysis:
  # Folder patterns for scanning task and pipeline changes
  task_folders:
    - "managed"
    - "tenant" 
    - "internal"
    - "collectors"
  
  pipeline_folders:
    - "run-collectors"
    - "managed"
    - "tenant"
    - "internal"
  
  # Regex patterns for identifying task and pipeline files
  task_file_pattern: "tasks/([^/]+)/([^/]+)/[^/]+\\.yaml"
  pipeline_file_pattern: ".*\\.yaml" 