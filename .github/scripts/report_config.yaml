# Konflux Release Service Catalog - AI Changelog Configuration
# ============================================================
# Production configuration for AI-generated changelogs integrated with promotion workflow

# AI Configuration
ai:
  # OpenRouter API settings (primary AI provider)
  model: "meta-llama/llama-3-8b-instruct"
  temperature: 0.3
  max_tokens: 1000  # Reduced for concise changelogs
  max_commits_for_analysis: 20  # Reduced to focus on important changes

# Email Configuration  
email:
  # SMTP Settings (configured via environment variables)
  smtp_server: "smtp.gmail.com"  # Default, override with SMTP_SERVER env var
  smtp_port: 587                 # Default, override with SMTP_PORT env var
  
  # Email Content - Production settings
  from_address: "konflux-announce@redhat.com"  # Default, override with EMAIL_FROM env var
  to_address: "konflux-announce@redhat.com"    # Default recipient
  
  # Subject line templates for different promotion types
  subject_templates:
    development_to_staging: "Konflux Release Service Catalog - Development to Staging Changelog"
    staging_to_production: "Konflux Release Service Catalog - Staging to Production Changelog"

# Report Configuration
report:
  # Output settings
  save_reports: true
  report_directory: "promotion_reports"
  
  # Content settings - optimized for concise changelogs
  include_commit_links: true      # GitHub links for each commit
  include_task_analysis: false    # Disabled for concise format
  include_pipeline_impact: false  # Disabled for concise format
  include_statistics: false       # Disabled for concise format

# Repository Configuration
repository:
  url: "https://github.com/konflux-ci/release-service-catalog"
  branches:
    development: "development"
    staging: "staging" 
    production: "production"

# Task Analysis Configuration
task_analysis:
  # Folder patterns for scanning task and pipeline changes
  task_folders:
    - "managed"
    - "tenant" 
    - "internal"
    - "collectors"
  
  pipeline_folders:
    - "run-collectors"
    - "managed"
    - "tenant"
    - "internal"
  
  # Regex patterns for identifying task and pipeline files
  task_file_pattern: "tasks/([^/]+)/([^/]+)/[^/]+\\.yaml"
  pipeline_file_pattern: ".*\\.yaml" 