---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/konflux-ci/release-service-catalog?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    
    # KEY: Only trigger on specific comment
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "issue_comment" && body.comment.body == "/test-large-snapshot"
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: release-service-catalog
    appstudio.openshift.io/component: release-service-catalog
    pipelines.appstudio.openshift.io/type: test
  name: rh-advisories-large-snapshot-test
  namespace: rhtap-release-2-tenant
spec:
  params:
    - name: SNAPSHOT
      value: '{"application":"release-catalog","artifacts":{},"components":[{"containerImage":"registry.redhat.io/openshift4/ose-cli:latest","name":"test-component","source":{"git":{"revision":"{{revision}}","url":"{{source_url}}"}}}]}'
    - name: PIPELINE_TEST_SUITE
      value: "rh-advisories-large-snapshot"
    - name: VAULT_PASSWORD_SECRET_NAME
      value: 'vault-password-secret'
    - name: GITHUB_TOKEN_SECRET_NAME
      value: 'github-token-secret'
    - name: KUBECONFIG_SECRET_NAME
      value: 'kubeconfig-secret'
  
  # Use the same pipeline as existing tests
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/konflux-ci/release-service-catalog
      - name: revision
        value: '{{target_branch}}'
      - name: pathInRepo
        value: integration-tests/pipelines/e2e-tests-staging-pipeline.yaml
  
  workspaces:
    - name: workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
  
  # Extended timeout for large snapshot tests (8 hours)
  timeouts:
    pipeline: "8h"
