---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: rh-direct-sign-image-batch-concurrency-test
  # Use the staging namespace where the E2E secrets and service account exist.
  namespace: konflux-release-service-tenant
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/konflux-ci/release-service-catalog?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    pipelinesascode.tekton.dev/on-comment: '^/test-batch-concurrency\s*$'
    pipelinesascode.tekton.dev/on-target-branch: '[development]'
    pipelinesascode.tekton.dev/target-namespace: konflux-release-service-tenant
    pac.test.appstudio.openshift.io/branch: '{{source_branch}}'
  labels:
    appstudio.openshift.io/application: release-service-catalog
    appstudio.openshift.io/component: release-service-catalog
    pipelines.appstudio.openshift.io/type: test
    pac.test.appstudio.openshift.io/pull-request: '{{pull_request_number}}'
    test.appstudio.openshift.io/scenario: rh-direct-sign-image-batch-concurrency-test
    test.appstudio.openshift.io/type: component
spec:
  taskRunTemplate:
    serviceAccountName: konflux-integration-runner
  params:
    - name: SNAPSHOT
      value: |
        {
          "application": "release-service-catalog",
          "artifacts": {},
          "components": [
            {
              "containerImage":
                "quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-catalog:on-pr-{{revision}}",
              "name": "release-service-catalog",
              "source": {
                "git": {
                  "revision": "{{revision}}",
                  "url": "{{source_url}}"
                }
              }
            }
          ]
        }
    - name: PIPELINE_TEST_SUITE
      value: rh-direct-sign-image-batch-concurrency
    - name: PIPELINE_USED
      value: rh-advisories
    - name: MANUAL_RUN
      value: "true"
    - name: VAULT_PASSWORD_SECRET_NAME
      value: e2e-test-vault-password
    - name: GITHUB_TOKEN_SECRET_NAME
      value: e2e-test-github-token
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: '{{source_url}}'
      - name: revision
        value: '{{revision}}'
      - name: pathInRepo
        value: integration-tests/pipelines/e2e-tests-staging-pipeline.yaml
  timeouts:
    pipeline: 2h0m0s
    tasks: 1h45m0s
    finally: 0h15m0s
