---
# Build Image Pool PipelineRuns
#
# Triggered by PR comments on the konflux-ci/release-service-catalog repo.
# Builds the pool of multi-arch images used by the rh-advisories large snapshot test.
#
# Supported commands:
#   /build-image-pool              Build missing images to reach 200 components (incremental)
#   /build-image-pool --force      Force-rebuild ALL components from scratch
#   /build-image-pool --count=N    Build/fill to exactly N components
#   /build-image-pool --prefix=XXX Build 200 components with custom name prefix
#
# All runs target: rhtap-release-2-tenant (production cluster)
# Pipeline: integration-tests/pipelines/build-image-pool-pipeline.yaml
#
# Build Creation PipelineRun - triggered by /build-image-pool
# This creates PipelineRuns manually for components, bypassing PAC
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/konflux-ci/release-service-catalog?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    # Trigger ONLY on explicit /build-image-pool comment
    pipelinesascode.tekton.dev/on-event: "[]"
    pipelinesascode.tekton.dev/on-comment: "^/build-image-pool$"
    pipelinesascode.tekton.dev/on-cel-expression: |
      target_branch == "development" &&
      has(body.comment) &&
      body.comment.body.contains("/build-image-pool")
    pac.test.appstudio.openshift.io/branch: '{{source_branch}}'
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: release-service-catalog
    appstudio.openshift.io/component: release-service-catalog
    pipelines.appstudio.openshift.io/type: test
    pac.test.appstudio.openshift.io/pull-request: '{{pull_request_number}}'
    test.appstudio.openshift.io/scenario: build-image-pool
    test.appstudio.openshift.io/type: build
  name: build-image-pool
  namespace: rhtap-release-2-tenant
spec:
  params:
    - name: SNAPSHOT
      value: |
        {
          "application": "release-service-catalog",
          "artifacts": {},
          "components": [
            {
              "containerImage": "quay.io/redhat-user-workloads/rhtap-release-2-tenant/release-service-catalog:on-pr-{{revision}}",
              "name": "release-service-catalog",
              "source": {
                "git": {
                  "revision": "{{revision}}",
                  "url": "https://github.com/konflux-ci/release-service-catalog"
                }
              }
            }
          ]
        }
    - name: PIPELINE_TEST_SUITE
      value: "rh-advisories-large-snapshot"
    - name: SKIP_BUILD
      value: "false"
    - name: TARGET_COMPONENTS
      value: "200"
    - name: FORCE_REBUILD
      value: "false"

  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/konflux-ci/release-service-catalog
      - name: revision
        value: '{{revision}}'
      - name: pathInRepo
        value: integration-tests/pipelines/build-image-pool-pipeline.yaml

  workspaces:
    - name: workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

  timeouts:
    pipeline: 20h0m0s
    tasks: 20h0m0s
---
# /build-image-pool --force variant
# Force-rebuilds ALL components from scratch regardless of current status.
# Use when existing images are stale, corrupted, or you need a completely fresh pool.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/konflux-ci/release-service-catalog?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/on-event: "[]"
    pipelinesascode.tekton.dev/on-comment: "^/build-image-pool\\s+--force$"
    pipelinesascode.tekton.dev/on-cel-expression: |
      target_branch == "development" &&
      has(body.comment) &&
      body.comment.body.matches("^/build-image-pool\\s+--force$")
    pac.test.appstudio.openshift.io/branch: '{{source_branch}}'
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: release-service-catalog
    appstudio.openshift.io/component: release-service-catalog
    pipelines.appstudio.openshift.io/type: test
    pac.test.appstudio.openshift.io/pull-request: '{{pull_request_number}}'
    test.appstudio.openshift.io/scenario: build-image-pool-force
    test.appstudio.openshift.io/type: build
  name: build-image-pool-force
  namespace: rhtap-release-2-tenant
spec:
  params:
    - name: SNAPSHOT
      value: |
        {
          "application": "release-service-catalog",
          "artifacts": {},
          "components": [
            {
              "containerImage": "quay.io/redhat-user-workloads/rhtap-release-2-tenant/release-service-catalog:on-pr-{{revision}}",
              "name": "release-service-catalog",
              "source": {
                "git": {
                  "revision": "{{revision}}",
                  "url": "https://github.com/konflux-ci/release-service-catalog"
                }
              }
            }
          ]
        }
    - name: PIPELINE_TEST_SUITE
      value: "rh-advisories-large-snapshot"
    - name: SKIP_BUILD
      value: "false"
    - name: TARGET_COMPONENTS
      value: "200"
    # Force full rebuild: deletes and recreates all components from scratch
    - name: FORCE_REBUILD
      value: "true"

  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/konflux-ci/release-service-catalog
      - name: revision
        value: '{{revision}}'
      - name: pathInRepo
        value: integration-tests/pipelines/build-image-pool-pipeline.yaml

  workspaces:
    - name: workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

  timeouts:
    pipeline: 20h0m0s
    tasks: 20h0m0s
---
# /build-image-pool --count=N variant
# Builds exactly N components (default: preserve valid, add missing to reach N).
# N is extracted from the comment (e.g. "/build-image-pool --count=50").
# Useful to grow the pool incrementally or test with a specific target count.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/konflux-ci/release-service-catalog?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/on-event: "[]"
    # Capture group {{1}} extracts N from "--count=N"
    pipelinesascode.tekton.dev/on-comment: "^/build-image-pool\\s+--count=(\\d+)$"
    pipelinesascode.tekton.dev/on-cel-expression: |
      target_branch == "development" &&
      has(body.comment) &&
      body.comment.body.matches("^/build-image-pool\\s+--count=\\d+$")
    pac.test.appstudio.openshift.io/branch: '{{source_branch}}'
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: release-service-catalog
    appstudio.openshift.io/component: release-service-catalog
    pipelines.appstudio.openshift.io/type: test
    pac.test.appstudio.openshift.io/pull-request: '{{pull_request_number}}'
    test.appstudio.openshift.io/scenario: build-image-pool-count
    test.appstudio.openshift.io/type: build
  name: build-image-pool-count
  namespace: rhtap-release-2-tenant
spec:
  params:
    - name: SNAPSHOT
      value: |
        {
          "application": "release-service-catalog",
          "artifacts": {},
          "components": [
            {
              "containerImage": "quay.io/redhat-user-workloads/rhtap-release-2-tenant/release-service-catalog:on-pr-{{revision}}",
              "name": "release-service-catalog",
              "source": {
                "git": {
                  "revision": "{{revision}}",
                  "url": "https://github.com/konflux-ci/release-service-catalog"
                }
              }
            }
          ]
        }
    - name: PIPELINE_TEST_SUITE
      value: "rh-advisories-large-snapshot"
    - name: SKIP_BUILD
      value: "false"
    - name: FORCE_REBUILD
      value: "false"
    # Count extracted from comment by PAC regex capture group
    - name: TARGET_COMPONENTS
      value: "{{1}}"

  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/konflux-ci/release-service-catalog
      - name: revision
        value: '{{revision}}'
      - name: pathInRepo
        value: integration-tests/pipelines/build-image-pool-pipeline.yaml

  workspaces:
    - name: workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

  timeouts:
    pipeline: 20h0m0s
    tasks: 20h0m0s
---
# /build-image-pool --single-arch variant
# Builds images using the single-arch pipeline (linux/amd64 only).
# ~4× faster builds, ~4× less signing load — useful for quick iteration or pool validation.
# Multi-arch is the default (/build-image-pool with no flags).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/konflux-ci/release-service-catalog?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/on-event: "[]"
    pipelinesascode.tekton.dev/on-comment: "^/build-image-pool\\s+--single-arch$"
    pipelinesascode.tekton.dev/on-cel-expression: |
      target_branch == "development" &&
      has(body.comment) &&
      body.comment.body.matches("^/build-image-pool\\s+--single-arch$")
    pac.test.appstudio.openshift.io/branch: '{{source_branch}}'
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: release-service-catalog
    appstudio.openshift.io/component: release-service-catalog
    pipelines.appstudio.openshift.io/type: test
    pac.test.appstudio.openshift.io/pull-request: '{{pull_request_number}}'
    test.appstudio.openshift.io/scenario: build-image-pool-single-arch
    test.appstudio.openshift.io/type: build
  name: build-image-pool-single-arch
  namespace: rhtap-release-2-tenant
spec:
  params:
    - name: SNAPSHOT
      value: |
        {
          "application": "release-service-catalog",
          "artifacts": {},
          "components": [
            {
              "containerImage": "quay.io/redhat-user-workloads/rhtap-release-2-tenant/release-service-catalog:on-pr-{{revision}}",
              "name": "release-service-catalog",
              "source": {
                "git": {
                  "revision": "{{revision}}",
                  "url": "https://github.com/konflux-ci/release-service-catalog"
                }
              }
            }
          ]
        }
    - name: PIPELINE_TEST_SUITE
      value: "rh-advisories-large-snapshot"
    - name: SKIP_BUILD
      value: "false"
    - name: TARGET_COMPONENTS
      value: "200"
    - name: FORCE_REBUILD
      value: "false"
    # Single-arch mode: uses docker-build-oci-ta (amd64 only)
    - name: BUILD_ARCH_MODE
      value: "single"

  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/konflux-ci/release-service-catalog
      - name: revision
        value: '{{revision}}'
      - name: pathInRepo
        value: integration-tests/pipelines/build-image-pool-pipeline.yaml

  workspaces:
    - name: workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

  timeouts:
    pipeline: 20h0m0s
    tasks: 20h0m0s
---
# /build-image-pool --prefix=XXX variant
# Builds images using a custom component name prefix (default is "multi").
# XXX is extracted from the comment (e.g. "/build-image-pool --prefix=test").
# Results in component names like: XXX-v4-15-apiserver-watcher-01
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/konflux-ci/release-service-catalog?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/on-event: "[]"
    # Capture group {{1}} extracts XXX from "--prefix=XXX"
    pipelinesascode.tekton.dev/on-comment: "^/build-image-pool\\s+--prefix=([a-zA-Z0-9_-]+)$"
    pipelinesascode.tekton.dev/on-cel-expression: |
      target_branch == "development" &&
      has(body.comment) &&
      body.comment.body.matches("^/build-image-pool\\s+--prefix=[a-zA-Z0-9_-]+$")
    pac.test.appstudio.openshift.io/branch: '{{source_branch}}'
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: release-service-catalog
    appstudio.openshift.io/component: release-service-catalog
    pipelines.appstudio.openshift.io/type: test
    pac.test.appstudio.openshift.io/pull-request: '{{pull_request_number}}'
    test.appstudio.openshift.io/scenario: build-image-pool-prefix
    test.appstudio.openshift.io/type: build
  name: build-image-pool-prefix
  namespace: rhtap-release-2-tenant
spec:
  params:
    - name: SNAPSHOT
      value: |
        {
          "application": "release-service-catalog",
          "artifacts": {},
          "components": [
            {
              "containerImage": "quay.io/redhat-user-workloads/rhtap-release-2-tenant/release-service-catalog:on-pr-{{revision}}",
              "name": "release-service-catalog",
              "source": {
                "git": {
                  "revision": "{{revision}}",
                  "url": "https://github.com/konflux-ci/release-service-catalog"
                }
              }
            }
          ]
        }
    - name: PIPELINE_TEST_SUITE
      value: "rh-advisories-large-snapshot"
    - name: SKIP_BUILD
      value: "false"
    - name: TARGET_COMPONENTS
      value: "200"
    - name: FORCE_REBUILD
      value: "false"
    # Prefix extracted from comment by PAC regex capture group
    - name: COMPONENT_NAME_PREFIX
      value: "{{1}}"

  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/konflux-ci/release-service-catalog
      - name: revision
        value: '{{revision}}'
      - name: pathInRepo
        value: integration-tests/pipelines/build-image-pool-pipeline.yaml

  workspaces:
    - name: workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

  timeouts:
    pipeline: 20h0m0s
    tasks: 20h0m0s
