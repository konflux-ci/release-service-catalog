---
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: use-trusted-artifact-array
spec:
  description: >-
    This stepaction extracts an array of Trusted Artifacts into a folder.
  image: quay.io/konflux-ci/build-trusted-artifacts@sha256:d7e9f457d819b91d5f4b62effea105d54c6e54bedcc3afb2a7a9fcaaf752076b
  env:
    # Set HOME variable to something else than `/` to avoid 'permission denied' problems when writing files.
    - name: HOME
      value: /tekton/home
    - name: CA_FILE
      value: $(params.caCertPath)
  params:
    - name: sourceDataArtifacts
      type: array
      description: Array of artifacts to extract
      default: []
    - name: caCertPath
      type: string
      default: "/mnt/trusted-ca/ca-bundle.crt"
      description: Path to CA certificate bundle for TLS verification with self-hosted certificates
  args:
    - use
    - "$(params.sourceDataArtifacts[*])"
