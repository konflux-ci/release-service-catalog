---
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: create-trusted-artifact-array
spec:
  description: >-
    This stepaction creates trusted artifacts. It does nothing if a .skip-trusted-artifacts file exists
    in root folder.
  image: quay.io/konflux-ci/build-trusted-artifacts@sha256:6df16e808f147926a2ba5f88588350bd8f77e73fde43614e79ddbd6e2b097d2e
  env:
    # Set HOME variable to something else than `/` to avoid 'permission denied' problems when writing files.
    - name: HOME
      value: /tekton/home
    - name: CA_FILE
      value: $(params.caCertPath)
  params:
    - name: ociStorage
      type: string
      default: "empty"
    - name: sourceDataArtifacts
      type: array
      default: []
    - name: caCertPath
      type: string
      default: "/mnt/trusted-ca/ca-bundle.crt"
      description: Path to CA certificate bundle for TLS verification with self-hosted certificates
  args:
    - create
    - --store
    - $(params.ociStorage)
    - "$(params.sourceDataArtifacts[*])"
