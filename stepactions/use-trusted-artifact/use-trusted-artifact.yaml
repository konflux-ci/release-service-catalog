---
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: use-trusted-artifact
spec:
  description: >-
    This stepaction extracts a Trusted Artifact into a folder.
  image: quay.io/lgallovi-test/build-trusted-artifacts@sha256:23fb8dc09bed249d7d72caab3fc2ce6a014452c4f39d4be32b101c0832549811
  env:
    # Set HOME variable to something else than `/` to avoid 'permission denied' problems when writing files.
    - name: HOME
      value: /tekton/home
    - name: ORAS_OPTIONS
      value: $(params.orasOptions)
    - name: CA_FILE
      value: $(params.caCertPath)
  params:
    - name: workDir
      type: string
    - name: sourceDataArtifact
      type: string
      default: ""
    - name: orasOptions
      type: string
      default: ""
      description: oras options to pass to Trusted Artifacts calls
    - name: caCertPath
      type: string
      default: "/mnt/trusted-ca/ca-bundle.crt"
      description: Path to CA certificate bundle for TLS verification with self-signed certificates
  args:
    - use
    - $(params.sourceDataArtifact)=$(params.workDir)
