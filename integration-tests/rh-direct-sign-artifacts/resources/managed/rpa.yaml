---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: ${release_plan_admission_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  applications:
    - ${application_name}
  data:
    cdn:
      env: stage
    intention: staging
    mapping:
      components:
        - name: ${component_name}
          files:
            - source: /releases/e2e-sign-linux-amd64.tar.gz
              arch: amd64
              os: linux
          contentGateway:
            productName: "Konflux Release E2E test product"
            productCode: "KonfluxReleaseE2E"
            productVersionName: "1.0"
            contentType: "binary"
          pushSourceContainer: false
    sign:
      configMapName: "hacbs-signing-pipeline-config-staging-e2e"
  origin: ${tenant_namespace}
  pipeline:
    maxRetries: 0
    pipelineRef:
      params:
        - name: url
          value: "${RELEASE_CATALOG_GIT_URL}"
        - name: revision
          value: "${RELEASE_CATALOG_GIT_REVISION}"
        - name: pathInRepo
          value: pipelines/managed/rh-direct-sign-artifacts/rh-direct-sign-artifacts.yaml
      resolver: git
    serviceAccountName: ${managed_sa_name}
    timeouts:
      pipeline: 4h0m0s
      tasks: 4h0m0s
  policy: standard-${component_name}
