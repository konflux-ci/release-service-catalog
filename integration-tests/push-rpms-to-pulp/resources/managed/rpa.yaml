---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: ${release_plan_admission_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  applications:
    - ${application_name}
  data:
    jira:
      jiraAdvisorySecret: advisory-jira-secret-${component_name}
    intention: "staging"
    pulp:
      domain: konflux-release-integration-tests-unsigned
      secretName: pulp-credentials-${component_name}
    mapping:
      "rpm-repositories": [
        {
          "name": "rpm-x86_64",
          "arch": "x86_64",
          "repository_id": "rpm-x86_64",
          "repository_name": "x86_64",
          "distro": "testdistro"
        },
        {
          "name": "rpm-aarch64",
          "arch": "aarch64",
          "repository_id": "rpm-aarch64",
          "repository_name": "aarch64",
          "distro": "testdistro"
        },
        {
          "name": "rpm-source",
          "arch": "src",
          "repository_id": "rpm-source",
          "repository_name": "source",
          "distro": "testdistro"
        }
      ]
      components:
        - name: ${component_name}
          contentType: rpm
    atlas:
      server: stage
      atlas-sso-secret-name: atlas-staging-sso-secret-${component_name}
      atlas-retry-aws-secret-name: atlas-retry-s3-staging-secret-${component_name}
    pyxis:
      server: stage
      secret: pyxis-${component_name}
    sign:
      configMapName: "hacbs-signing-pipeline-config-staging-e2e-pq"
      cosignSecretName: "konflux-cosign-signing-stage-${component_name}"
    signOptions:
      signKeytab:
        principal: "konflux-release-signing-stage@IPA.REDHAT.COM"
        name: "keytab"
        secret: "konflux-release-signing-stage-sa"
      signPipelineImage: "quay.io/konflux-ci/signing:latest"
      signPipelineServiceAccount: "signing-pipeline-sa"
      skipUploadToPulp: true
      artifactStorageSecret: "signing-artifact-storage-preprod"
      signKeyAlias:
        key: "e2epq,e2e,ima"
      unsignedRpmsDomain: "konflux-release-integration-tests-unsigned"
      signedRpmsDomain: "konflux-release-integration-tests"
    releaseNotes:
      product_id:
        - 932
      product_name: "${application_name}"
      product_version: "1.0.1"
      product_stream: "${component_type}-1.0"
      cpe: "cpe:/a:${application_name}:${component_type}:1.0.1"
      type: "RHBA"
  origin: ${tenant_namespace}
  pipeline:
    pipelineRef:
      params:
        - name: url
          value: "${RELEASE_CATALOG_GIT_URL}"
        - name: revision
          value: "${RELEASE_CATALOG_GIT_REVISION}"
        - name: pathInRepo
          value: pipelines/managed/push-rpms-to-pulp/push-rpms-to-pulp.yaml
      resolver: git
    taskRunSpecs:
      - pipelineTaskName: verify-access-to-resources
        stepSpecs:
          - computeResources:
              limits:
                memory: 100Mi
                cpu: 200m
              requests:
                memory: 100Mi
                cpu: 200m
            name:  verify-access-to-resources
    serviceAccountName: ${managed_sa_name}
    timeouts:
      pipeline: 4h0m0s
      tasks: 4h0m0s
  policy: standard-${component_name}
