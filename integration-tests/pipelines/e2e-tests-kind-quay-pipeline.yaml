---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: e2e-tests-kind-quay-pipeline
spec:
  description: |-
    This pipeline automates e2e testing of release pipelines using a self-hosted Quay
    registry deployed on an ephemeral Kind cluster. It provisions the cluster, deploys
    Konflux with Quay enabled, initializes Quay, and runs the e2e tests.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: ''
      type: string
    - name: ocp-version
      description: 'The OpenShift version to use for the ephemeral cluster deployment.'
      type: string
    - name: test-event-type
      description: 'Indicates if the test is triggered by a Pull Request or Push event.'
      default: 'none'
    - name: konflux-test-infra-secret
      description: The name of the secret where testing infrastructure credentials are stored.
      type: string
    - name: replicas
      description: 'The number of replicas for the cluster nodes.'
      type: string
    - name: machine-type
      description: 'The type of machine to use for the cluster nodes.'
      type: string
    - name: oci-container-repo
      default: 'quay.io/konflux-test-storage/konflux-team/release-service-catalog'
      description: The ORAS container used to store all test artifacts.
    - name: component-image
      default: 'none'
      description: 'Container image built from any konflux git repo. Use this param only when you run Konflux e2e tests
        in another Konflux component repo. Will pass the component built image from the snapshot.'
    - name: artifact-browser-url
      description: "URL to the artifact browser deployment. If provided, a link will be added to PR comments."
      default: ""
      type: string
    - name: pipeline-test-suite
      type: string
      description: 'The name of the test corresponding to a defined Konflux integration test.'
    - name: pipeline-used
      default: ''
      type: string
      description: |
        The pipeline that is used by the test suite.
        If empty, use the pipeline-test-suite as the pipeline to be used
    - name: vault-password-secret-name
      description: The name of the secret containing the ansible vault password.
      type: string
      default: 'e2e-test-vault-password'
    - name: konflux-ready-timeout
      description: Timeout for waiting on the Konflux CR Ready condition.
      type: string
      default: 30m
    - name: konflux-cr-configmap
      description: >-
        ConfigMap in the pipeline namespace containing the Konflux CR to apply.
      type: string
      default: konflux-deploy-cr
  tasks:
    - name: test-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test-metadata/0.1/test-metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: test-name
          value: $(context.pipelineRun.name)
    - name: check-if-related-test
      when:
        - input: "$(tasks.test-metadata.results.pull-request-author)"
          operator: notin
          values: ["red-hat-konflux[bot]"]
      runAfter:
        - test-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/community-catalog
          - name: revision
            value: development
          - name: pathInRepo
            value: tasks/check-if-related-test/check-if-related-test.yaml
      params:
        - name: pipeline-test-suite
          value: $(params.pipeline-test-suite)
        - name: pipeline-used
          value: $(params.pipeline-used)
        - name: component-image
          value: $(tasks.test-metadata.results.container-image)
    # mapt names the IBM resource group "kind-<id>" and IBM rejects names longer than 40 characters.
    # The PipelineRun name (push-to-external-registry-self-hosted-quay-e2e-test-xxxxx) exceeds that.
    - name: short-cluster-id
      runAfter:
        - check-if-related-test
      taskSpec:
        results:
          - name: id
            description: IBM-safe cluster id. mapt prefixes it with "kind-" (40 character limit).
          - name: status
            description: Success when the IBM-safe cluster id was written; Failed otherwise.
        steps:
          - name: shorten
            image: "quay.io/konflux-ci/release-service-utils@sha256:\
              0b35e861c83b9c1141e3a8d7a8924cc9c4ae0b09dc87938971eee66ee9b9aaaf"
            computeResources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 50m
                memory: 64Mi
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # mapt prefixes this id with "kind-"; IBM resource group names allow 40 characters.
              MAX_CLUSTER_ID_LENGTH=20

              # Valid id only. The trap writes this when generation succeeded, including when a later write fails.
              short_id=""

              record_results() {
                local exit_code=$?
                local id_write_status=0
                local status="Failed"
                set +e
                if [ -n "${short_id}" ]; then
                  printf '%s' "${short_id}" > "$(results.id.path)"
                  id_write_status=$?
                fi
                if [ "${exit_code}" -eq 0 ] && [ -n "${short_id}" ] && [ "${id_write_status}" -eq 0 ]; then
                  status="Success"
                fi
                if ! printf '%s' "${status}" > "$(results.status.path)"; then
                  echo "Failed to write status result" >&2
                  if [ "${exit_code}" -eq 0 ]; then
                    exit_code=1
                  fi
                fi
                # ID generation or the ID-result write failed. Exit nonzero so the PipelineRun
                # fails instead of skipping provision through the status when-condition alone.
                if [ "${id_write_status}" -ne 0 ] && [ "${exit_code}" -eq 0 ]; then
                  exit_code=1
                fi
                exit "${exit_code}"
              }
              trap record_results EXIT

              pipeline_uid="$(context.pipelineRun.uid)"
              generated="$(printf '%s' "${pipeline_uid}" | tr -d '-' | cut -c1-"${MAX_CLUSTER_ID_LENGTH}")"
              if [ "${#generated}" -ne "${MAX_CLUSTER_ID_LENGTH}" ]; then
                echo "Cluster id must be ${MAX_CLUSTER_ID_LENGTH} characters, got '${generated}'" >&2
                exit 1
              fi
              short_id="${generated}"
    - name: provision-kind-cluster
      runAfter:
        - short-cluster-id
      when:
        - input: "$(tasks.test-metadata.results.pull-request-author)"
          operator: notin
          values: ["red-hat-konflux[bot]"]
        - input: "$(tasks.check-if-related-test.results.result)"
          operator: in
          values: ["true"]
        - input: "$(tasks.short-cluster-id.results.status)"
          operator: in
          values: ["Success"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/mapt-oci/kind-ibm-provision/0.1/kind-ibm-provision.yaml
      params:
        - name: secret-ibmcloud-credentials
          value: mapt-kind-secret-ibm
        - name: cluster-access-secret-name
          value: kfg-$(context.pipelineRun.name)
        - name: id
          value: $(tasks.short-cluster-id.results.id)
        - name: backed-url
          value: s3://konflux-mapt-state/mapt/kind/$(tasks.short-cluster-id.results.id)
        - name: tags
          value: 'owner=konflux-devprod,project=Konflux,created-by=integration-pipeline,component=release-service-catalog'
        - name: debug
          value: 'false'
        - name: ownerKind
          value: PipelineRun
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: oci-ref
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: oci-credentials
          value: $(params.konflux-test-infra-secret)
    - name: deploy-konflux
      when:
        - input: "$(tasks.test-metadata.results.pull-request-author)"
          operator: notin
          values: ["red-hat-konflux[bot]"]
        - input: "$(tasks.check-if-related-test.results.result)"
          operator: in
          values: ["true"]
      runAfter:
        - provision-kind-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/konflux-ci.git
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/deploy-konflux/task.yaml
      params:
        - name: cluster-access-secret
          value: kfg-$(context.pipelineRun.name)
        - name: git-url
          value: https://github.com/konflux-ci/konflux-ci.git
        - name: revision
          value: main
        - name: konflux-ready-timeout
          value: $(params.konflux-ready-timeout)
        - name: konflux-cr-configmap
          value: $(params.konflux-cr-configmap)
        - name: konflux-cr-configmap-key
          value: konflux-cr.yaml
        - name: oci-container-repo
          value: $(params.oci-container-repo)
        - name: oci-container-repo-credentials-secret
          value: $(params.konflux-test-infra-secret)
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)
    - name: deploy-quay
      when:
        - input: "$(tasks.test-metadata.results.pull-request-author)"
          operator: notin
          values: ["red-hat-konflux[bot]"]
        - input: "$(tasks.check-if-related-test.results.result)"
          operator: in
          values: ["true"]
      runAfter:
        - deploy-konflux
      params:
        - name: cluster-access-secret
          value: kfg-$(context.pipelineRun.name)
      taskSpec:
        params:
          - name: cluster-access-secret
        volumes:
          - name: cluster-kubeconfig
            secret:
              secretName: $(params.cluster-access-secret)
        steps:
          - name: deploy-local-quay
            image: quay.io/konflux-ci/release-service-utils@sha256:0b35e861c83b9c1141e3a8d7a8924cc9c4ae0b09dc87938971eee66ee9b9aaaf
            env:
              - name: KUBECONFIG
                value: /tmp/cluster-kubeconfig/kubeconfig
              - name: SKIP_QUAY_ADMIN_INIT
                value: "true"
            volumeMounts:
              - name: cluster-kubeconfig
                mountPath: /tmp/cluster-kubeconfig
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Wait for cluster API to settle after the operator deployment
              echo "Waiting for cluster API to be reachable..."
              for i in $(seq 1 30); do
                if kubectl get nodes --request-timeout=10s &>/dev/null; then
                  echo "Cluster is reachable"
                  break
                fi
                if [ "${i}" -eq 30 ]; then
                  echo "ERROR: cluster not reachable after 150s"
                  exit 1
                fi
                sleep 5
              done

              REPO=$(mktemp -d)

              git init "${REPO}"
              git -C "${REPO}" fetch --depth 1 \
                https://github.com/konflux-ci/konflux-ci.git main
              git -C "${REPO}" checkout FETCH_HEAD

              # shellcheck source=/dev/null
              source "${REPO}/deploy-deps.sh"

              SKIP_QUAY=false deploy_quay
    - name: self-hosted-quay-test
      timeout: 3h
      when:
        - input: "$(tasks.test-metadata.results.pull-request-author)"
          operator: notin
          values: ["red-hat-konflux[bot]"]
        - input: "$(tasks.check-if-related-test.results.result)"
          operator: in
          values: ["true"]
      runAfter:
        - deploy-quay
      params:
        - name: cluster-access-secret
          value: kfg-$(context.pipelineRun.name)
        - name: git-url
          value: "$(tasks.test-metadata.results.git-url)"
        - name: git-revision
          value: "$(tasks.test-metadata.results.git-revision)"
        - name: vault-password-secret-name
          value: "$(params.vault-password-secret-name)"
      taskSpec:
        params:
          - name: cluster-access-secret
          - name: git-url
          - name: git-revision
          - name: vault-password-secret-name
        volumes:
          - name: cluster-kubeconfig
            secret:
              secretName: $(params.cluster-access-secret)
        steps:
          - name: run-test
            image: quay.io/konflux-ci/release-service-utils@sha256:0b35e861c83b9c1141e3a8d7a8924cc9c4ae0b09dc87938971eee66ee9b9aaaf
            env:
              - name: KUBECONFIG
                value: /tmp/cluster-kubeconfig/kubeconfig
              - name: RELEASE_CATALOG_GIT_URL
                value: $(params.git-url)
              - name: RELEASE_CATALOG_GIT_REVISION
                value: $(params.git-revision)
              - name: VAULT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: $(params.vault-password-secret-name)
                    key: password
            volumeMounts:
              - name: cluster-kubeconfig
                mountPath: /tmp/cluster-kubeconfig
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "Cloning release-service-catalog at revision ${RELEASE_CATALOG_GIT_REVISION}..."
              git init /workspace/catalog
              cd /workspace/catalog
              git fetch --depth 1 "${RELEASE_CATALOG_GIT_URL}" "${RELEASE_CATALOG_GIT_REVISION}"
              git checkout FETCH_HEAD

              echo "Running self-hosted Quay e2e test..."
              /workspace/catalog/integration-tests/push-to-external-registry-self-hosted-quay/test-kind.sh
  finally:
    - name: deprovision-kind-cluster
      when:
        - input: "$(tasks.test-metadata.results.pull-request-author)"
          operator: notin
          values: ["red-hat-konflux[bot]"]
        - input: "$(tasks.check-if-related-test.results.result)"
          operator: in
          values: ["true"]
        - input: "$(tasks.short-cluster-id.results.status)"
          operator: in
          values: ["Success"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/mapt-oci/kind-ibm-deprovision/0.1/kind-ibm-deprovision.yaml
      params:
        - name: secret-ibmcloud-credentials
          value: mapt-kind-secret-ibm
        - name: id
          value: $(tasks.short-cluster-id.results.id)
        - name: backed-url
          value: s3://konflux-mapt-state/mapt/kind/$(tasks.short-cluster-id.results.id)
        - name: cluster-access-secret
          value: kfg-$(context.pipelineRun.name)
        - name: oci-container
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: oci-credentials
          value: konflux-test-infra
    - name: pull-request-status-message
      when:
        - input: "$(tasks.test-metadata.results.pull-request-author)"
          operator: notin
          values: ["red-hat-konflux[bot]"]
        - input: "$(tasks.check-if-related-test.results.result)"
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/pull-request-comment/0.1/pull-request-comment.yaml
      params:
        - name: test-name
          value: "$(context.pipelineRun.name)"
        - name: oci-container
          value: "$(params.oci-container-repo):$(context.pipelineRun.name)"
        - name: pipeline-aggregate-status
          value: "$(tasks.status)"
        - name: pull-request-author
          value: "$(tasks.test-metadata.results.pull-request-author)"
        - name: pull-request-number
          value: "$(tasks.test-metadata.results.pull-request-number)"
        - name: git-repo
          value: "$(tasks.test-metadata.results.git-repo)"
        - name: git-org
          value: "$(tasks.test-metadata.results.git-org)"
        - name: git-revision
          value: "$(tasks.test-metadata.results.git-revision)"
        - name: junit-report-name
          value: e2e-report.xml
        - name: e2e-log-name
          value: e2e-tests.log
        - name: cluster-provision-log-name
          value: cluster-provision.log
        - name: enable-test-results-analysis
          value: "true"
        - name: artifact-browser-url
          value: $(params.artifact-browser-url)
    - name: store-pipeline-status
      when:
        - input: "$(tasks.test-metadata.results.pull-request-author)"
          operator: notin
          values: ["red-hat-konflux[bot]"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/store-pipeline-status/0.1/store-pipeline-status.yaml
      params:
        - name: oci-ref
          value: "$(params.oci-container-repo):$(context.pipelineRun.name)"
        - name: credentials-secret-name
          value: "$(params.konflux-test-infra-secret)"
        - name: pipelinerun-name
          value: $(context.pipelineRun.name)
        - name: pipeline-aggregate-status
          value: $(tasks.status)
