---
kind: Pipeline
apiVersion: tekton.dev/v1
metadata:
  name: e2e-tests-periodic-pipeline
spec:
  params:
    - name: SNAPSHOT
      default: '{"application":"e2eapp-2eb54d79","artifacts":{},"components":[{"containerImage":"registry.redhat.io/openshift4/ose-cli:latest","name":"collector-2eb54d79","source":{"git":{"revision":"4b7d4677ca75a0db09a414df6e4a1fd9cb64208c","url":"https://github.com/scoheb/e2e-base"}}}]}'
      type: string
    - name: VAULT_PASSWORD_SECRET_NAME
      default: 'vault-password-secret'
      type: string
    - name: GITHUB_TOKEN_SECRET_NAME
      default: 'github-token-secret'
      type: string
    - name: TEST_CASES
      type: array
      default:
        - "collectors"
        - "collectors-no-cve"
        - "e2e"
        - "fbc-release"
        - "push-rpms-to-pulp"
        - "push-to-addons-registry"
        - "push-to-external-registry-idempotent"
        - "rh-advisories-idempotent"
        - "push-to-external-registry"
        - "release-to-github"
        - "rh-push-helm-chart-to-registry-redhat-io"
        - "rh-push-to-external-registry"
        - "rh-push-to-external-registry-multi-component"
        - "rh-push-to-registry-redhat-io"
        - "rhtap-service-push"
        - "rh-advisories-large-snapshot"
      description: Integration test suites to run, one dedicated task per test case
  tasks:
    - name: get-snapshot-data
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskSpec:
        params:
          - name: SNAPSHOT
        results:
          - name: CONTAINER_IMAGE
        steps:
          - name: get-container-image
            image: quay.io/konflux-ci/release-service-utils@sha256:0b35e861c83b9c1141e3a8d7a8924cc9c4ae0b09dc87938971eee66ee9b9aaaf
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
            script: |
              #!/usr/bin/env bash

              containerImage=$(jq -r '.components[0].containerImage // ""' <<< "${SNAPSHOT}")
              echo "${SNAPSHOT}"
              echo -n "${containerImage}" | tee "$(results.CONTAINER_IMAGE.path)"
    - name: run-test
      timeout: 3h
      matrix:
        params:
          - name: TEST_CASE
            value: $(params.TEST_CASES)
      params:
        - name: STEP_IMAGE
          value: $(tasks.get-snapshot-data.results.CONTAINER_IMAGE)
        - name: VAULT_PASSWORD_SECRET_NAME
          value: $(params.VAULT_PASSWORD_SECRET_NAME)
        - name: GITHUB_TOKEN_SECRET_NAME
          value: $(params.GITHUB_TOKEN_SECRET_NAME)
      taskSpec:
        params:
          - name: STEP_IMAGE
          - name: PR_GIT_URL
            type: string
            default: 'https://github.com/konflux-ci/release-service-catalog'
          - name: PR_GIT_REVISION
            type: string
            default: 'staging'
          - name: VAULT_PASSWORD_SECRET_NAME
          - name: GITHUB_TOKEN_SECRET_NAME
          - name: TEST_CASE
            type: string
        results:
          - name: TEST_OUTPUT
            description: Test output
        steps:
          - name: run-test
            image: $(params.STEP_IMAGE)
            computeResources:
              limits:
                memory: 3Gi
              requests:
                memory: 3Gi
            env:
              - name: VAULT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: $(params.VAULT_PASSWORD_SECRET_NAME)
                    key: password
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.GITHUB_TOKEN_SECRET_NAME)
                    key: token
              - name: uuid
                value: $(context.pipelineRun.uid)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              TESTCASE="$(params.TEST_CASE)"

              exitfunc() {
                local err=$1
                local line=$2
                local command="$3"

                # After the test finishes, record the result in the RESULT variable
                if [ "$err" -eq 0 ] ; then
                  RESULT="SUCCESS"
                else
                  echo "$0: ERROR $command failed at line $line - exited with status $err"
                  RESULT="FAILURE"
                fi

                # Output the standardized TEST_OUTPUT result in JSON form
                TEST_OUTPUT=$(jq -rc -n \
                    --arg date "$(date -u --iso-8601=seconds)" \
                    --arg RESULT "${RESULT}" \
                    --arg testcase "${TESTCASE}" \
                    '{
                        result: $RESULT,
                        timestamp: $date,
                        testcase: $testcase
                    }'
                )

                # Write to the Tekton results output path.
                echo -n "$TEST_OUTPUT" | tee "$(results.TEST_OUTPUT.path)"

                exit 0 # exit the script cleanly as there is no point in proceeding past an error or exit call
              }

              # due to set -e, this catches all EXIT and ERR calls and the task should never fail with nonzero exit code
              trap 'exitfunc $? $LINENO "$BASH_COMMAND"' EXIT

              VAULT_PASSWORD_FILE=$(mktemp)
              export VAULT_PASSWORD_FILE
              set +x
              echo "${VAULT_PASSWORD:?}" > "${VAULT_PASSWORD_FILE}"
              set -x

              RELEASE_CATALOG_GIT_URL="${PR_GIT_URL:-$(params.PR_GIT_URL)}"
              RELEASE_CATALOG_GIT_REVISION="${PR_GIT_REVISION:-$(params.PR_GIT_REVISION)}"

              export RELEASE_CATALOG_GIT_URL
              export RELEASE_CATALOG_GIT_REVISION

              suite_secret="${TESTCASE}-e2e-github-token"
              set +x
              suite_token=$(kubectl get secret "${suite_secret}" \
                  -o jsonpath='{.data.token}' 2>/dev/null | base64 -d || true)
              if [ -z "${suite_token}" ]; then
                suite_secret="$(params.GITHUB_TOKEN_SECRET_NAME)"
                suite_token="${GITHUB_TOKEN}"
              fi
              set -x
              echo "Running test case: ${TESTCASE} (token: ${suite_secret})"

              GITHUB_TOKEN="${suite_token}" "/home/e2e/tests/run-test.sh" "${TESTCASE}"
      runAfter:
        - get-snapshot-data
  finally:
    - name: notify-slack-results
      when:
        - input: "$(tasks.status)"
          operator: in
          values: ["Succeeded", "Completed"]
      params:
        - name: secretName
          value: "release-team-slack-notification-secret"
        - name: secretKeyName
          value: "release"
        - name: TEST_OUTPUTS
          value: $(tasks.run-test.results.TEST_OUTPUT)
      taskSpec:
        params:
          - name: secretName
          - name: secretKeyName
          - name: TEST_OUTPUTS
            type: array
        volumes:
          - name: slack-token
            secret:
              secretName: $(params.secretName)
              optional: true
        steps:
          - name: send-result-to-slack
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            volumeMounts:
              - name: slack-token
                mountPath: "/tmp/secrets"
                readOnly: true
            env:
              - name: KEYNAME
                value: $(params.secretKeyName)
            args:
              - "$(params.TEST_OUTPUTS[*])"
            script: |
              #!/usr/bin/env bash
              set -eux

              if [ -z "${KEYNAME}" ] ; then
                echo "No secret key name provided via the 'secretKeyName' pipeline parameter"
                echo "No message will be sent to Slack"
                exit 0
              fi

              if [ -f "/tmp/secrets/${KEYNAME}" ]; then
                echo "Setting WEBHOOK_URL from secret"
                set +x
                WEBHOOK_URL=$(cat "/tmp/secrets/${KEYNAME}")
                set -x
              else
                echo "Error: Secret not defined properly. The key to use (${KEYNAME}) is defined in the 'secretKeyName'"
                exit 1
              fi

              failed_test_cases=()
              success_test_cases=()

              for output in "$@"; do
                result=$(jq -r '.result' <<<"${output}")
                testcase=$(jq -r '.testcase' <<<"${output}")
                if [ "${result}" = "SUCCESS" ]; then
                  success_test_cases+=("${testcase}")
                else
                  failed_test_cases+=("${testcase}")
                fi
              done

              failed_test_count=${#failed_test_cases[@]}
              success_test_count=${#success_test_cases[@]}

              if [ "${failed_test_count}" -eq 0 ]; then
                RESULT="SUCCESS"
              else
                RESULT="FAILURE"
              fi

              FAILED_CASES_JSON=$(jq -c -n '$ARGS.positional' --args "${failed_test_cases[@]}")
              SUCCESS_CASES_JSON=$(jq -c -n '$ARGS.positional' --args "${success_test_cases[@]}")

              TEST_RESULT=$(jq -rc \
                  --arg date "$(date -u --iso-8601=seconds)" \
                  --arg RESULT "${RESULT}" \
                  --argjson successcount "${success_test_count}" \
                  --argjson failurecount "${failed_test_count}" \
                  --argjson failed_cases "${FAILED_CASES_JSON}" \
                  --argjson success_cases "${SUCCESS_CASES_JSON}" \
                  --null-input \
                  '{
                      result: $RESULT,
                      timestamp: $date,
                      failures: $failurecount,
                      successes: $successcount,
                      failed_test_cases: $failed_cases,
                      success_test_cases: $success_cases
                  }'
              )

              MESSAGE=$(jq -r '.' <<< "${TEST_RESULT}" | awk NF)

              # need 3 back-ticks around message for code-block
              # ping @ic-konflux-release group
              MESSAGE=$(echo -n "<!subteam^S09N535GS4E>"\
                " Catalog Nightly Staging test result: \`\`\`$MESSAGE\`\`\`" | jq -Rsa)

              cat > /tmp/payload.json << EOF
              {"text": $MESSAGE}
              EOF

              echo "Calling Slack API with curl...."
              set +x
              curl -H "Content-type: application/json" --data-binary "@/tmp/payload.json"  \
                "${WEBHOOK_URL}"
              set -x
    - name: notify-slack-failure
      when:
        - input: "$(tasks.status)"
          operator: notin
          values: ["Succeeded", "Completed"]
      params:
        - name: secretName
          value: "release-team-slack-notification-secret"
        - name: secretKeyName
          value: "release"
        - name: TASKS_STATUS
          value: "$(tasks.status)"
      taskSpec:
        params:
          - name: secretName
          - name: secretKeyName
          - name: TASKS_STATUS
        volumes:
          - name: slack-token
            secret:
              secretName: $(params.secretName)
              optional: true
        steps:
          - name: send-failure-to-slack
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            volumeMounts:
              - name: slack-token
                mountPath: "/tmp/secrets"
                readOnly: true
            env:
              - name: KEYNAME
                value: $(params.secretKeyName)
              - name: TASKS_STATUS
                value: $(params.TASKS_STATUS)
            script: |
              #!/usr/bin/env bash
              set -eux

              if [ -z "${KEYNAME}" ] ; then
                echo "No secret key name provided via the 'secretKeyName' pipeline parameter"
                echo "No message will be sent to Slack"
                exit 0
              fi

              if [ -f "/tmp/secrets/${KEYNAME}" ]; then
                echo "Setting WEBHOOK_URL from secret"
                set +x
                WEBHOOK_URL=$(cat "/tmp/secrets/${KEYNAME}")
                set -x
              else
                echo "Error: Secret not defined properly. The key to use (${KEYNAME}) is defined in the 'secretKeyName'"
                exit 1
              fi

              # need 3 back-ticks around message for code-block
              # ping @ic-konflux-release group
              MESSAGE=$(echo -n "<!subteam^S09N535GS4E>" \
                " Catalog Nightly Staging pipeline failed before test results were available" \
                " (tasks status: ${TASKS_STATUS}). Check the PipelineRun logs." | jq -Rsa)

              cat > /tmp/payload.json << EOF
              {"text": $MESSAGE}
              EOF

              echo "Calling Slack API with curl...."
              set +x
              curl -H "Content-type: application/json" --data-binary "@/tmp/payload.json"  \
                "${WEBHOOK_URL}"
              set -x
    - name: cleanup-resources
      params:
        - name: STEP_IMAGE
          value: $(tasks.get-snapshot-data.results.CONTAINER_IMAGE)
        - name: GITHUB_TOKEN_SECRET_NAME
          value: $(params.GITHUB_TOKEN_SECRET_NAME)
        - name: VAULT_PASSWORD_SECRET_NAME
          value: $(params.VAULT_PASSWORD_SECRET_NAME)
        - name: TEST_OUTPUTS
          value: $(tasks.run-test.results.TEST_OUTPUT)
      taskSpec:
        params:
          - name: STEP_IMAGE
          - name: GITHUB_TOKEN_SECRET_NAME
          - name: VAULT_PASSWORD_SECRET_NAME
          - name: TEST_OUTPUTS
            type: array
        steps:
          - name: cleanup-resources
            image: $(params.STEP_IMAGE)
            env:
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.GITHUB_TOKEN_SECRET_NAME)
                    key: token
              - name: uuid
                value: $(context.pipelineRun.uid)
              - name: VAULT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: $(params.VAULT_PASSWORD_SECRET_NAME)
                    key: password
            args:
              - "$(params.TEST_OUTPUTS[*])"
            script: |
              #!/usr/bin/env bash
              set -eu
              # shellcheck source=/dev/null

              . "/home/e2e/tests/lib/test-functions.sh"

              # prepare what's needed to delete k8s resources
              VAULT_PASSWORD_FILE=$(mktemp)
              export VAULT_PASSWORD_FILE
              set +x
              echo "${VAULT_PASSWORD:?}" > "${VAULT_PASSWORD_FILE}"
              set -x

              RUN_TESTCASES=()
              for output in "$@"; do
                RUN_TESTCASES+=("$(jq -r '.testcase' <<<"${output}")")
              done

              for testcase in "${RUN_TESTCASES[@]}"; do
                # shellcheck disable=SC1090
                . "/home/e2e/tests/${testcase}/test.env"

                # decrypt the secrets since they are part of the resources to be deleted
                decrypt_secrets "/home/e2e/tests/${testcase}"

                # delete GH repo
                "/home/e2e/tests/scripts/delete-repository.sh" "${component_repo_name:?}"

                tmpDir=$(mktemp -d)
                # we need to rebuild the resources (without applying them)
                # so that we can use their names to delete them
                echo "Building tenant resources to prepare for deletion..."
                kustomize build "/home/e2e/tests/${testcase}/resources/tenant" \
                  | envsubst > "$tmpDir/tenant-resources.yaml"

                echo "Building managed resources to prepare for deletion..."
                kustomize build "/home/e2e/tests/${testcase}/resources/managed" \
                  | envsubst > "$tmpDir/managed-resources.yaml"

                # actually delete the k8s resources and ignore failures since
                # they might be already deleted from the cleanup trap
                echo "Deleting resources..."
                kubectl delete -f "$tmpDir/tenant-resources.yaml" --ignore-not-found || true
                kubectl delete -f "$tmpDir/managed-resources.yaml" --ignore-not-found || true

                # Delete Release CRs created by this specific test
                # Use both uuid and originating-tool labels to scope deletion per test suite
                if [ -n "$uuid" ] && [ -n "$tenant_namespace" ] && [ -n "$originating_tool" ]; then
                  echo "Deleting Release CRs with originating-tool=${originating_tool}" \
                    "in namespace ${tenant_namespace}..."
                  kubectl delete release -n "${tenant_namespace}" \
                    -l "test-run-uuid=${uuid},originating-tool=${originating_tool}" \
                    --ignore-not-found || echo "Warning: Failed to delete some Release CRs"
                fi

                # Delete large snapshot created outside kustomize manifests (rh-advisories-large-snapshot)
                if [ -n "${large_snapshot_name:-}" ] && [ -n "${tenant_namespace:-}" ]; then
                  echo "Deleting large snapshot ${large_snapshot_name} in namespace ${tenant_namespace}..."
                  kubectl delete snapshot "${large_snapshot_name}" -n "${tenant_namespace}" \
                    --ignore-not-found || echo "Warning: Failed to delete snapshot ${large_snapshot_name}"
                fi
              done
