---
kind: Pipeline
apiVersion: tekton.dev/v1
metadata:
  name: e2e-tests-periodic-pipeline
spec:
  params:
    - name: SNAPSHOT
      default: '{"application":"e2eapp-2eb54d79","artifacts":{},"components":[{"containerImage":"registry.redhat.io/openshift4/ose-cli:latest","name":"collector-2eb54d79","source":{"git":{"revision":"4b7d4677ca75a0db09a414df6e4a1fd9cb64208c","url":"https://github.com/scoheb/e2e-base"}}}]}'
      type: string
    - name: VAULT_PASSWORD_SECRET_NAME
      default: 'vault-password-secret'
      type: string
    - name: GITHUB_TOKEN_SECRET_NAME
      default: 'github-token-secret'
      type: string
    - name: TEST_CASES
      type: array
      default:
        - "collectors"
        - "collectors-no-cve"
        - "e2e"
        - "fbc-release-happy"
        - "fbc-release-optin"
        - "fbc-release-staged"
        - "fbc-release-prega-hotfix"
        - "push-rpms-to-pulp"
        - "push-to-addons-registry"
        - "push-to-external-registry-idempotent"
        - "rh-advisories-idempotent"
        - "push-to-external-registry"
        - "release-to-github"
        - "rh-push-helm-chart-to-registry-redhat-io"
        - "rh-push-to-external-registry"
        - "rh-push-to-external-registry-multi-component"
        - "rh-push-to-registry-redhat-io"
        - "rhtap-service-push"
        - "rh-advisories-large-snapshot"
      description: Integration test suites to run, one dedicated task per test case
  tasks:
    - name: get-snapshot-data
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskSpec:
        params:
          - name: SNAPSHOT
        results:
          - name: CONTAINER_IMAGE
        steps:
          - name: get-container-image
            image: quay.io/konflux-ci/release-service-utils@sha256:6d4dee971855fe55724c16b049e21a396287b53766ffd3fa984ee91895e9f099
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
            script: |
              #!/usr/bin/env bash

              containerImage="$(jq -r '.components[0].containerImage // ""' <<< "${SNAPSHOT}")"
              echo "${SNAPSHOT}"
              echo -n "${containerImage}" | tee "$(results.CONTAINER_IMAGE.path)"
    - name: run-test
      timeout: 3h
      matrix:
        params:
          - name: TEST_CASE
            value: $(params.TEST_CASES)
      params:
        - name: STEP_IMAGE
          value: $(tasks.get-snapshot-data.results.CONTAINER_IMAGE)
        - name: VAULT_PASSWORD_SECRET_NAME
          value: $(params.VAULT_PASSWORD_SECRET_NAME)
        - name: GITHUB_TOKEN_SECRET_NAME
          value: $(params.GITHUB_TOKEN_SECRET_NAME)
      taskSpec:
        params:
          - name: STEP_IMAGE
          - name: PR_GIT_URL
            type: string
            default: 'https://github.com/konflux-ci/release-service-catalog'
          - name: PR_GIT_REVISION
            type: string
            default: 'staging'
          - name: VAULT_PASSWORD_SECRET_NAME
          - name: GITHUB_TOKEN_SECRET_NAME
          - name: TEST_CASE
            type: string
        results:
          - name: TEST_OUTPUT
            description: Test output
        steps:
          - name: run-test
            image: $(params.STEP_IMAGE)
            computeResources:
              limits:
                memory: 1Gi
              requests:
                memory: 1Gi
            env:
              - name: VAULT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: $(params.VAULT_PASSWORD_SECRET_NAME)
                    key: password
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.GITHUB_TOKEN_SECRET_NAME)
                    key: token
              - name: uuid
                value: $(context.pipelineRun.uid)
              - name: TEST_CASE
                value: $(params.TEST_CASE)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # shellcheck disable=SC2153
              TESTCASE="${TEST_CASE}"

              # fbc-release runs as grouped scenario checks: a TEST_CASE of
              # "fbc-release-<group>" runs the fbc-release suite with that group's
              # scenarios (PTSV_FBC_SCENARIO_GROUP; group map lives in the suite's
              # test.sh). Each group gets a distinct uuid derived from the shared
              # pipelineRun uid so the parallel fbc matrix instances don't collide
              # on resource names; the cleanup finally derives it the same way.
              # TESTCASE stays the group name (for reporting); SUITE is the dir.
              SUITE="${TESTCASE}"
              if [[ "${TESTCASE}" == fbc-release-* ]]; then
                  export PTSV_FBC_SCENARIO_GROUP="${TESTCASE#fbc-release-}"
                  uuid="$(printf '%s-%s' "${uuid}" "${PTSV_FBC_SCENARIO_GROUP}" \
                      | sha256sum | cut -c1-8)"
                  export uuid
                  SUITE="fbc-release"
              fi

              exitfunc() {
                local err=$1
                local line=$2
                local command="$3"

                # After the test finishes, record the result in the RESULT variable
                if [ "$err" -eq 0 ] ; then
                  RESULT="SUCCESS"
                  successcount=1
                  failurecount=0
                else
                  echo "$0: ERROR $command failed at line $line - exited with status $err"
                  RESULT="FAILURE"
                  successcount=0
                  failurecount=1
                fi

                # Output the standardized TEST_OUTPUT result in JSON form
                # Schema matches Integration Service expectations (result, timestamp, failures, successes, warnings)
                # plus testcase field for Slack aggregation
                TEST_OUTPUT="$(jq -rc -n \
                    --arg date "$(date -u --iso-8601=seconds)" \
                    --arg RESULT "${RESULT}" \
                    --arg testcase "${TESTCASE}" \
                    --argjson successcount "${successcount}" \
                    --argjson failurecount "${failurecount}" \
                    '{
                        result: $RESULT,
                        timestamp: $date,
                        failures: $failurecount,
                        successes: $successcount,
                        warnings: 0,
                        testcase: $testcase
                    }'
                )"

                # Write to the Tekton results output path.
                echo -n "$TEST_OUTPUT" | tee "$(results.TEST_OUTPUT.path)"

                # Clean up temporary files
                if [ -n "${VAULT_PASSWORD_FILE:-}" ] && [ -f "${VAULT_PASSWORD_FILE}" ]; then
                  rm -f "${VAULT_PASSWORD_FILE}"
                fi

                exit 0 # exit the script cleanly as there is no point in proceeding past an error or exit call
              }

              # due to set -e, this catches all EXIT and ERR calls and the task should never fail with nonzero exit code
              trap 'exitfunc $? $LINENO "$BASH_COMMAND"' EXIT

              VAULT_PASSWORD_FILE="$(mktemp)"
              export VAULT_PASSWORD_FILE
              set +x
              echo "${VAULT_PASSWORD:?}" > "${VAULT_PASSWORD_FILE}"
              set -x

              RELEASE_CATALOG_GIT_URL="$(params.PR_GIT_URL)"
              RELEASE_CATALOG_GIT_REVISION="$(params.PR_GIT_REVISION)"
              export RELEASE_CATALOG_GIT_URL
              export RELEASE_CATALOG_GIT_REVISION

              suite_secret="${SUITE}-e2e-github-token"
              set +x
              suite_token="$(kubectl get secret "${suite_secret}" \
                  -o jsonpath='{.data.token}' 2>/dev/null | base64 -d || true)"
              if [ -z "${suite_token}" ]; then
                suite_secret="$(params.GITHUB_TOKEN_SECRET_NAME)"
                suite_token="${GITHUB_TOKEN}"
              fi

              echo "Running test case: ${TESTCASE} (suite: ${SUITE}, token: ${suite_secret})"
              GITHUB_TOKEN="${suite_token}" "/home/e2e/tests/run-test.sh" "${SUITE}"
              unset suite_token
              set -x
      runAfter:
        - get-snapshot-data
  finally:
    - name: notify-slack
      params:
        - name: secretName
          value: "release-team-slack-notification-secret"
        - name: secretKeyName
          value: "release"
        - name: TEST_CASES
          value: $(params.TEST_CASES[*])
        - name: TASKS_STATUS
          value: "$(tasks.status)"
      taskSpec:
        params:
          - name: secretName
          - name: secretKeyName
          - name: TEST_CASES
            type: array
          - name: TASKS_STATUS
        results:
          - name: NOTIFICATION_STATUS
            description: Status of the notification attempt
        volumes:
          - name: slack-token
            secret:
              secretName: $(params.secretName)
              optional: true
        steps:
          - name: send-notification-to-slack
            image: quay.io/konflux-ci/release-service-utils@sha256:6d4dee971855fe55724c16b049e21a396287b53766ffd3fa984ee91895e9f099
            computeResources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 512Mi
                cpu: 200m
            volumeMounts:
              - name: slack-token
                mountPath: "/tmp/secrets"
                readOnly: true
            env:
              - name: KEYNAME
                value: $(params.secretKeyName)
              - name: PIPELINERUN_NAME
                value: $(context.pipelineRun.name)
              - name: NAMESPACE
                value: $(context.pipelineRun.namespace)
              - name: TASKS_STATUS
                value: $(params.TASKS_STATUS)
            args:
              - "$(params.TEST_CASES[*])"
            script: |
              #!/usr/bin/env bash
              set -eux

              if [ -z "${KEYNAME}" ] ; then
                echo "No secret key name provided via the 'secretKeyName' pipeline parameter"
                echo "No message will be sent to Slack"
                echo -n "skipped" > "$(results.NOTIFICATION_STATUS.path)"
                exit 0
              fi

              if [ -f "/tmp/secrets/${KEYNAME}" ]; then
                echo "Setting WEBHOOK_URL from secret"
                set +x
                WEBHOOK_URL="$(cat "/tmp/secrets/${KEYNAME}")"
                set -x
              else
                echo "Error: Secret not defined properly. The key to use (${KEYNAME}) is defined in the 'secretKeyName'"
                echo -n "failed-missing-secret" > "$(results.NOTIFICATION_STATUS.path)"
                exit 0
              fi

              # Read the Konflux UI URL that was set on this PipelineRun
              # Integration Tests use pac.test.appstudio.openshift.io/log-url
              PLR_URL="$(kubectl get pipelinerun "${PIPELINERUN_NAME}" -n "${NAMESPACE}" \
                -o jsonpath='{.metadata.annotations.pac\.test\.appstudio\.openshift\.io/log-url}' 2>/dev/null || true)"
              if [ -z "${PLR_URL}" ]; then
                PLR_URL="PipelineRun ${PIPELINERUN_NAME} in namespace ${NAMESPACE}"
              fi

              # Get expected test cases from args
              expected_test_cases=("$@")
              echo "Expected ${#expected_test_cases[@]} test case(s): ${expected_test_cases[*]}"

              # Query for test outputs from run-test TaskRuns
              # This won't fail if run-test never ran (e.g., get-snapshot-data failed)
              echo "Querying for test results from run-test matrix instances..."
              test_outputs=()
              attempted_test_cases=()

              # Get both TEST_OUTPUT results and TEST_CASE params from run-test TaskRuns
              jsonpath_query='{range .items[*]}'
              jsonpath_query+='{.spec.params[?(@.name=="TEST_CASE")].value}{"|"}'
              jsonpath_query+='{.status.results[?(@.name=="TEST_OUTPUT")].value}'
              jsonpath_query+='{"\n"}{end}'

              while IFS='|' read -r testcase result; do
                if [ -n "${testcase}" ] && [ "${testcase}" != "null" ]; then
                  attempted_test_cases+=("${testcase}")
                  if [ -n "${result}" ] && [ "${result}" != "null" ]; then
                    test_outputs+=("${result}")
                  fi
                fi
              done < <(kubectl get taskrun -n "${NAMESPACE}" \
                -l "tekton.dev/pipelineRun=${PIPELINERUN_NAME},tekton.dev/pipelineTask=run-test" \
                -o jsonpath="${jsonpath_query}" 2>/dev/null || true)

              # Check if we have test outputs to aggregate
              if [ "${#test_outputs[@]}" -gt 0 ] || [ "${#attempted_test_cases[@]}" -gt 0 ]; then
                echo "Found ${#attempted_test_cases[@]} attempted, ${#test_outputs[@]} completed"

                failed_test_cases=()
                success_test_cases=()
                completed_test_cases=()

                # Categorize completed tests
                for output in "${test_outputs[@]}"; do
                  result="$(jq -r '.result' <<<"${output}")"
                  testcase="$(jq -r '.testcase' <<<"${output}")"
                  completed_test_cases+=("${testcase}")
                  if [ "${result}" = "SUCCESS" ]; then
                    success_test_cases+=("${testcase}")
                  else
                    failed_test_cases+=("${testcase}")
                  fi
                done

                # Find crashed tests (TaskRun created but never completed)
                for testcase in "${attempted_test_cases[@]}"; do
                  # shellcheck disable=SC2076
                  if [[ ! " ${completed_test_cases[*]} " =~ " ${testcase} " ]]; then
                    echo "Test case '${testcase}' produced no output (crashed/OOM/timeout)"
                    failed_test_cases+=("${testcase}")
                  fi
                done

                # Find tests that never got a TaskRun (scheduler/quota issues)
                for testcase in "${expected_test_cases[@]}"; do
                  # shellcheck disable=SC2076
                  if [[ ! " ${attempted_test_cases[*]} " =~ " ${testcase} " ]]; then
                    echo "Test case '${testcase}' never started (no TaskRun created)"
                    failed_test_cases+=("${testcase}")
                  fi
                done

                failed_test_count=${#failed_test_cases[@]}
                success_test_count=${#success_test_cases[@]}

                if [ "${failed_test_count}" -eq 0 ]; then
                  RESULT="SUCCESS"
                else
                  RESULT="FAILURE"
                fi

                FAILED_CASES_JSON="$(jq -c -n '$ARGS.positional' --args "${failed_test_cases[@]}")"
                SUCCESS_CASES_JSON="$(jq -c -n '$ARGS.positional' --args "${success_test_cases[@]}")"

                TEST_RESULT="$(jq -rc \
                    --arg date "$(date -u --iso-8601=seconds)" \
                    --arg RESULT "${RESULT}" \
                    --argjson successcount "${success_test_count}" \
                    --argjson failurecount "${failed_test_count}" \
                    --argjson failed_cases "${FAILED_CASES_JSON}" \
                    --argjson success_cases "${SUCCESS_CASES_JSON}" \
                    --null-input \
                    '{
                        result: $RESULT,
                        timestamp: $date,
                        failures: $failurecount,
                        successes: $successcount,
                        failed_test_cases: $failed_cases,
                        success_test_cases: $success_cases
                    }'
                )"

                MESSAGE="$(jq -r '.' <<< "${TEST_RESULT}" | awk NF)"

                # need 3 back-ticks around message for code-block
                # ping @ic-konflux-release group
                MESSAGE="$(echo -n "<!subteam^S09N535GS4E>"\
                  " Catalog Nightly Staging test result: \`\`\`${MESSAGE}\`\`\`" \
                  "${PLR_URL}" | jq -Rsa)"
              else
                echo "No test outputs available - pipeline failed early (tasks status: ${TASKS_STATUS})"

                # Send generic failure message
                MESSAGE="$(echo -n "<!subteam^S09N535GS4E>" \
                  " Catalog Nightly Staging pipeline failed before test results were available" \
                  " (tasks status: ${TASKS_STATUS}). ${PLR_URL}" | jq -Rsa)"
              fi

              cat > /tmp/payload.json << EOF
              {"text": $MESSAGE}
              EOF

              echo "Calling Slack API with curl...."
              set +x
              curl -sS --retry 3 --fail-with-body \
                -H "Content-type: application/json" \
                --data-binary "@/tmp/payload.json" \
                "${WEBHOOK_URL}"
              set -x

              echo -n "success" > "$(results.NOTIFICATION_STATUS.path)"
    - name: cleanup-resources
      params:
        - name: STEP_IMAGE
          value: $(tasks.get-snapshot-data.results.CONTAINER_IMAGE)
        - name: GITHUB_TOKEN_SECRET_NAME
          value: $(params.GITHUB_TOKEN_SECRET_NAME)
        - name: VAULT_PASSWORD_SECRET_NAME
          value: $(params.VAULT_PASSWORD_SECRET_NAME)
        - name: TEST_CASES
          value: $(params.TEST_CASES[*])
      taskSpec:
        params:
          - name: STEP_IMAGE
          - name: GITHUB_TOKEN_SECRET_NAME
          - name: VAULT_PASSWORD_SECRET_NAME
          - name: TEST_CASES
            type: array
        steps:
          - name: cleanup-resources
            image: $(params.STEP_IMAGE)
            env:
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.GITHUB_TOKEN_SECRET_NAME)
                    key: token
              - name: uuid
                value: $(context.pipelineRun.uid)
              - name: VAULT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: $(params.VAULT_PASSWORD_SECRET_NAME)
                    key: password
            args:
              - "$(params.TEST_CASES[*])"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Trap to clean up temporary files on exit
              cleanup_on_exit() {
                if [ -n "${VAULT_PASSWORD_FILE:-}" ] && [ -f "${VAULT_PASSWORD_FILE}" ]; then
                  rm -f "${VAULT_PASSWORD_FILE}"
                fi
              }
              trap cleanup_on_exit EXIT

              # shellcheck source=/dev/null
              . "/home/e2e/tests/lib/test-functions.sh"

              # prepare what's needed to delete k8s resources
              VAULT_PASSWORD_FILE="$(mktemp)"
              export VAULT_PASSWORD_FILE
              set +x
              echo "${VAULT_PASSWORD:?}" > "${VAULT_PASSWORD_FILE}"
              set -x

              # Clean up all test cases that were attempted (passed via args)
              # This handles both successful runs and crashed instances
              # Base uuid (shared pipelineRun uid); fbc groups derive a per-group
              # uuid from it below, matching what the run-test step computed.
              base_uuid="${uuid:-}"
              for testcase in "$@"; do
                echo "Cleaning up test case: ${testcase}"
                # Some suites create multiple manual ReleasePlans instead of defining this variable.
                unset release_plan_name
                unset PTSV_FBC_SCENARIO_GROUP
                # fbc-release groups: map "fbc-release-<group>" to the fbc-release
                # suite dir, set the group, and recompute the same per-group uuid as
                # run-test so the right resources are reconstructed for deletion.
                suite_dir="${testcase}"
                uuid="${base_uuid}"
                if [[ "${testcase}" == fbc-release-* ]]; then
                  export PTSV_FBC_SCENARIO_GROUP="${testcase#fbc-release-}"
                  uuid="$(printf '%s-%s' "${base_uuid}" "${PTSV_FBC_SCENARIO_GROUP}" \
                      | sha256sum | cut -c1-8)"
                  suite_dir="fbc-release"
                fi
                export uuid
                # shellcheck disable=SC1090
                if ! . "/home/e2e/tests/${suite_dir}/test.env" 2>/dev/null; then
                  echo "Warning: Could not source test.env for ${testcase}, skipping cleanup"
                  continue
                fi

                # decrypt the secrets since they are part of the resources to be deleted
                decrypt_secrets "/home/e2e/tests/${suite_dir}" \
                  || echo "Warning: Failed to decrypt secrets for ${testcase}"

                # delete every component's GH repo (ignore failure if a repo was
                # never created). Iterate PTSV_COMPONENTS so multi-component suites
                # and fbc groups (happy/optin/multi-staged/...) are fully cleaned
                # up, not just the first component. Deduplicate, since some
                # components share a repo (e.g. multi_*_component_2 reuses _1's).
                _deleted_repos=" "
                for _c in ${PTSV_COMPONENTS:-component}; do
                  _rv="${_c}_repo_name"
                  _repo="${!_rv:-}"
                  if [ -n "${_repo}" ] && [[ "${_deleted_repos}" != *" ${_repo} "* ]]; then
                    echo "Deleting GH repository ${_repo} ..."
                    "/home/e2e/tests/scripts/delete-repository.sh" "${_repo}" \
                      || echo "Warning: Failed to delete repository ${_repo} for ${testcase}"
                    _deleted_repos="${_deleted_repos}${_repo} "
                  fi
                done

                tmpDir="$(mktemp -d)"
                # we need to rebuild the resources (without applying them)
                # so that we can use their names to delete them
                echo "Building tenant resources to prepare for deletion..."
                if kustomize build "/home/e2e/tests/${suite_dir}/resources/tenant" 2>/dev/null \
                    | envsubst > "$tmpDir/tenant-resources.yaml"; then
                  echo "Deleting tenant resources..."
                  kubectl delete -f "$tmpDir/tenant-resources.yaml" --ignore-not-found \
                    || true
                else
                  echo "Warning: Could not build tenant resources for ${testcase}"
                fi

                echo "Building managed resources to prepare for deletion..."
                if kustomize build "/home/e2e/tests/${suite_dir}/resources/managed" 2>/dev/null \
                    | envsubst > "$tmpDir/managed-resources.yaml"; then
                  echo "Deleting managed resources..."
                  kubectl delete -f "$tmpDir/managed-resources.yaml" --ignore-not-found \
                    || true
                else
                  echo "Warning: Could not build managed resources for ${testcase}"
                fi

                cleanup_test_releases \
                  || echo "Warning: cleanup_test_releases failed for ${testcase}"

                # Delete large snapshot created outside kustomize manifests (rh-advisories-large-snapshot)
                if [ -n "${large_snapshot_name:-}" ] && [ -n "${tenant_namespace:-}" ]; then
                  echo "Deleting large snapshot ${large_snapshot_name} in namespace ${tenant_namespace}..."
                  kubectl delete snapshot "${large_snapshot_name}" -n "${tenant_namespace}" \
                    --ignore-not-found || echo "Warning: Failed to delete snapshot ${large_snapshot_name}"
                fi

                # Clean up temporary directory for this test case
                if [ -n "${tmpDir:-}" ] && [ -d "${tmpDir}" ]; then
                  rm -rf "${tmpDir}"
                fi
              done
