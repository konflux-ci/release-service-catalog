---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: rh-advisories-large-snapshot-pipeline
spec:
  params:
    - name: SNAPSHOT
      type: string
    - name: PIPELINE_TEST_SUITE
      type: string
      description: 'The name of the test corresponding to a defined Konflux integration test.'
    - name: SKIP_BUILD
      type: string
      default: 'false'
      description: 'Skip build phase (true = test with existing images, false = build images first)'
    - name: FORCE_REBUILD
      type: string
      default: 'false'
      description: 'Force fresh rebuild of components (true = worst-case stress, false = reuse mode)'
    - name: USE_STATIC_IMAGE_POOL
      type: string
      default: 'false'
      description: 'Use repo-tracked static image pool (:latest) and skip build phase'
    - name: VAULT_PASSWORD_SECRET_NAME
      default: 'e2e-test-vault-password'
      type: string
    - name: GITHUB_TOKEN_SECRET_NAME
      default: 'e2e-test-github-token'
      type: string
    - name: KUBECONFIG_SECRET_NAME
      default: 'e2e-test-service-account-kubeconfig'
      type: string
    - name: QUAY_TOKEN_SECRET_NAME
      default: 'hacbs-release-tests-token'
      type: string
    - name: QUAY_TOKEN_SECRET_KEY
      default: 'token'
      type: string
  tasks:
    - name: get-snapshot-data
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskSpec:
        params:
          - name: SNAPSHOT
        results:
          - name: CONTAINER_IMAGE
          - name: PR_GIT_URL
          - name: PR_GIT_REVISION
        steps:
          - name: get-container-image
            image: quay.io/konflux-ci/release-service-utils@sha256:e852a62497c4537059bb1f4c3ddf5c1a813b2b22bd9f4bb826cffb36af7d5f65  # yamllint disable-line
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
            script: |
              #!/usr/bin/env bash

              containerImage=$(jq -r '.components[0].containerImage // ""' <<< "${SNAPSHOT}")
              gitUrl=$(jq -r '.components[0].source.git.url // ""' <<< "${SNAPSHOT}")
              gitRevision=$(jq -r '.components[0].source.git.revision // ""' <<< "${SNAPSHOT}")
              echo "${SNAPSHOT}"
              echo -n "${containerImage}" | tee "$(results.CONTAINER_IMAGE.path)"
              echo -n "${gitUrl}" | tee "$(results.PR_GIT_URL.path)"
              echo -n "${gitRevision}" | tee "$(results.PR_GIT_REVISION.path)"

    - name: run-test
      timeout: "7h0m0s"
      params:
        - name: PIPELINE_TEST_SUITE
          value: $(params.PIPELINE_TEST_SUITE)
        - name: STEP_IMAGE
          value: $(tasks.get-snapshot-data.results.CONTAINER_IMAGE)
        - name: PR_GIT_URL
          value: $(tasks.get-snapshot-data.results.PR_GIT_URL)
        - name: PR_GIT_REVISION
          value: $(tasks.get-snapshot-data.results.PR_GIT_REVISION)
        - name: VAULT_PASSWORD_SECRET_NAME
          value: $(params.VAULT_PASSWORD_SECRET_NAME)
        - name: GITHUB_TOKEN_SECRET_NAME
          value: $(params.GITHUB_TOKEN_SECRET_NAME)
        - name: KUBECONFIG_SECRET_NAME
          value: $(params.KUBECONFIG_SECRET_NAME)
        - name: QUAY_TOKEN_SECRET_NAME
          value: $(params.QUAY_TOKEN_SECRET_NAME)
        - name: QUAY_TOKEN_SECRET_KEY
          value: $(params.QUAY_TOKEN_SECRET_KEY)
        - name: FORCE_REBUILD
          value: $(params.FORCE_REBUILD)
        - name: USE_STATIC_IMAGE_POOL
          value: $(params.USE_STATIC_IMAGE_POOL)

      taskSpec:
        params:
          - name: PIPELINE_TEST_SUITE
          - name: STEP_IMAGE
          - name: PR_GIT_URL
          - name: PR_GIT_REVISION
          - name: VAULT_PASSWORD_SECRET_NAME
          - name: GITHUB_TOKEN_SECRET_NAME
          - name: KUBECONFIG_SECRET_NAME
          - name: QUAY_TOKEN_SECRET_NAME
          - name: QUAY_TOKEN_SECRET_KEY
          - name: FORCE_REBUILD
          - name: USE_STATIC_IMAGE_POOL
        results:
          - name: TEST_OUTPUT
            description: Test output
        steps:
          - name: run-test
            image: $(params.STEP_IMAGE)
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: SKIP_BUILD
                # "false" = Enable build phase (can rebuild components)
                # "true" = Skip build phase entirely (reuse existing)
                value: $(params.SKIP_BUILD)
              - name: FORCE_REBUILD
                # "true" = Force rebuild ALL components (creates new digests, worst-case signing)
                # "false" = Reuse existing successful builds (fast but may have existing signatures)
                value: $(params.FORCE_REBUILD)
              - name: USE_STATIC_IMAGE_POOL
                value: $(params.USE_STATIC_IMAGE_POOL)
              - name: COMPONENT_COUNT
                # Number of components to build/test (default: 100)
                # Build times scale with component count:
                #   50 = ~18-25 min builds (no batching delays) + 2-3 hours test = 2.5-3.5 hours
                #   100 = ~35-50 min builds (no batching delays) + 4-5 hours test = 4.5-5.5 hours
                #   200 = ~70-100 min builds (no batching delays) + 8-10 hours test = 9-11 hours
                # No batching delays - builds start only after ALL components are ready
                value: "200"
              - name: BASE_REPO
                # GitHub repository with PAC template branch (must be accessible by GITHUB_TOKEN)
                # Default: hacbs-release-tests/e2e-base
                # Alternative: konflux-ci/integration-examples or another accessible repo
                value: "hacbs-release-tests/e2e-base"
              - name: VAULT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: $(params.VAULT_PASSWORD_SECRET_NAME)
                    key: password
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.GITHUB_TOKEN_SECRET_NAME)
                    key: token
              - name: QUAY_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.QUAY_TOKEN_SECRET_NAME)
                    key: $(params.QUAY_TOKEN_SECRET_KEY)
                    optional: true
              - name: KUBECONFIG
                valueFrom:
                  secretKeyRef:
                    name: $(params.KUBECONFIG_SECRET_NAME)
                    key: kubeconfig
              - name: PR_NUMBER
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['pac.test.appstudio.openshift.io/pull-request']
              - name: BRANCH_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pac.test.appstudio.openshift.io/branch']
              - name: uuid
                value: $(context.pipelineRun.uid)
            script: |
              #!/usr/bin/env bash
              
              set -o errexit
              set -o nounset
              set -o pipefail

              # shellcheck disable=SC2317
              exitfunc() {
                local err=$1
                local line=$2
                local command="$3"

                successcount=0
                failurecount=0
                if [ "$err" -eq 0 ] ; then   
                  RESULT="SUCCESS"
                  successcount=1
                else
                  echo "$0: ERROR $command failed at line $line - exited with status $err"
                  RESULT="FAILURE"
                  failurecount=1
                fi
                # shellcheck disable=SC2086
                TEST_OUTPUT=$(jq -rc --arg date "$(date -u --iso-8601=seconds)" --arg RESULT "${RESULT}" \
                  --argjson successcount ${successcount} --argjson failurecount ${failurecount} --null-input \
                  '{result: $RESULT, timestamp: $date, failures: $failurecount, successes: $successcount, warnings: 0}')
                echo -n "${TEST_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"
                exit "$err"
              }
              trap 'exitfunc $? $LINENO "$BASH_COMMAND"' EXIT

              echo "PR_GIT_URL: $(params.PR_GIT_URL)"
              echo "PR_GIT_REVISION: $(params.PR_GIT_REVISION)"
              echo "PR_NUMBER: ${PR_NUMBER}"
              
              # Create debug script to check Release status
              cat > /tmp/debug-release.sh << 'DEBUG_EOF'
              #!/bin/bash
              set +e
              RELEASE_NAME="${1}"
              NAMESPACE="${2}"
              echo "🔍 =========================================="
              echo "🔍 DEBUG: Release Status Check"
              echo "🔍 =========================================="
              echo "🔍 Release: ${RELEASE_NAME}"
              echo "🔍 Namespace: ${NAMESPACE}"
              echo ""
              echo "🔍 Release Spec:"
              kubectl get release "${RELEASE_NAME}" -n "${NAMESPACE}" \
                -o jsonpath='{.spec}' 2>/dev/null | jq '.' || echo "Failed to get spec"
              echo ""
              echo "🔍 Release Status:"
              kubectl get release "${RELEASE_NAME}" -n "${NAMESPACE}" \
                -o jsonpath='{.status}' 2>/dev/null | jq '.' || echo "No status set"
              echo ""
              echo "🔍 Release Labels:"
              kubectl get release "${RELEASE_NAME}" -n "${NAMESPACE}" \
                -o jsonpath='{.metadata.labels}' 2>/dev/null | jq '.' || echo "No labels"
              echo ""
              echo "🔍 ReleasePlan Check:"
              RP_NAME=$(kubectl get release "${RELEASE_NAME}" -n "${NAMESPACE}" \
                -o jsonpath='{.spec.releasePlan}' 2>/dev/null)
              if [ -n "${RP_NAME}" ]; then
                echo "  ReleasePlan: ${RP_NAME}"
                kubectl get releaseplan "${RP_NAME}" -n "${NAMESPACE}" -o yaml 2>/dev/null || echo "  Not found"
              fi
              echo ""
              echo "🔍 ReleasePlanAdmission in managed namespace:"
              kubectl get releaseplanadmission -n managed-release-team-tenant -o json 2>/dev/null \
                | jq -r '.items[] | "\(.metadata.name) - app: \(.spec.applications[])"' \
                || echo "None found"
              echo ""
              echo "🔍 Recent Events:"
              kubectl get events -n "${NAMESPACE}" \
                --field-selector involvedObject.name="${RELEASE_NAME}" \
                --sort-by='.lastTimestamp' 2>/dev/null | tail -20 || echo "No events"
              echo "🔍 =========================================="
              DEBUG_EOF
              chmod +x /tmp/debug-release.sh
              
              VAULT_PASSWORD_FILE=$(mktemp)
              export VAULT_PASSWORD_FILE
              echo "${VAULT_PASSWORD:?}" > "${VAULT_PASSWORD_FILE}"
              
              KUBECONFIG_FILE=$(mktemp)
              echo "${KUBECONFIG:?}" > "${KUBECONFIG_FILE}"
              KUBECONFIG="${KUBECONFIG_FILE}"
              export KUBECONFIG
              
              RELEASE_CATALOG_GIT_URL="$(params.PR_GIT_URL)"
              RELEASE_CATALOG_GIT_REVISION="$(params.PR_GIT_REVISION)"
              export RELEASE_CATALOG_GIT_URL
              export RELEASE_CATALOG_GIT_REVISION

              # For manual trigger via /test-large-snapshot, ALWAYS run the test
              # Skip the affected pipelines check that other tests use
              echo "Manual trigger: Running test unconditionally"
              
              # Pre-test preparation:
              # - USE_STATIC_IMAGE_POOL=true: use repo-tracked image list
              #   (no build, no recovery, no Quay validation here)
              # - SKIP_BUILD=true: legacy recovery path
              #   (uses build-images.sh to reconstruct components from registry)
              # - otherwise: run the test as-is
              #   (image creation is handled by /build-large-snapshot in a separate PipelineRun)
              if [ "${USE_STATIC_IMAGE_POOL}" = "true" ]; then
                export CI=true  # Skip interactive prompts
                FRESH_BUILDS_FILE="/home/e2e/tests/$(params.PIPELINE_TEST_SUITE)/resources/static-image-pool-latest.txt"
                export FRESH_BUILDS_FILE

                # Count non-empty, non-comment entries (the generate script supports comments/blanks).
                COMPONENT_COUNT="$(awk '{
                  line=$0
                  sub(/#.*/, "", line)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                  if (length(line) > 0) c++
                } END { print c+0 }' "${FRESH_BUILDS_FILE}")"
                export COMPONENT_COUNT
                export LARGE_SNAPSHOT_COMPONENT_COUNT="${COMPONENT_COUNT}"  # Tell test to expect this count

                echo ""
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "🧪 TEST-ONLY MODE (static image list)"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "  Using: ${FRESH_BUILDS_FILE}"
                echo "  Entries: ${COMPONENT_COUNT}"
                echo "  Skipping: build-images.sh (no Quay validation/recovery/build)"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo ""
              elif [ "${SKIP_BUILD}" = "true" ]; then
                # Recovery mode: Recreate components from existing Quay images (no building)
                # IMPORTANT: Images persist on Quay even after components are deleted
                # This recovers all components by checking Quay and creating components for found images
                FRESH_BUILDS_FILE="/tmp/recovered-images-pool-$(date +%s).txt"
                export FRESH_BUILDS_FILE
                export CI=true  # Skip interactive prompts
                TARGET_COMPONENTS=200  # Target to recover

                echo ""
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "🔄 Component Recovery (REUSE mode - no building)"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "  NOTE: Recovering components from existing Quay images"
                echo "  Will scan Quay.io and create components for all found images"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo ""

                # Run build-images.sh in recovery mode (SKIP_BUILD=true)
                "/home/e2e/tests/$(params.PIPELINE_TEST_SUITE)/utils/build-images.sh" \
                  "${TARGET_COMPONENTS}" \
                  "dev-release-team-tenant" \
                  "${FRESH_BUILDS_FILE}" \
                  "false" \
                  "true"

                COMPONENT_COUNT=$(wc -l < "${FRESH_BUILDS_FILE}")
                export COMPONENT_COUNT
                export LARGE_SNAPSHOT_COMPONENT_COUNT="${COMPONENT_COUNT}"  # Tell test to expect this count

                # Fail if we didn't recover enough images
                MIN_IMAGES=50
                if [ "${COMPONENT_COUNT}" -lt "${MIN_IMAGES}" ]; then
                  echo ""
                  echo "❌ ERROR: Not enough images recovered!"
                  echo "   Found: ${COMPONENT_COUNT} images"
                  echo "   Required: At least ${MIN_IMAGES} images"
                  echo ""
                  echo "   Run /build-large-snapshot to build more images"
                  exit 1
                fi

                echo ""
                echo "✅ Recovered ${COMPONENT_COUNT} components with images ready for testing"
                echo ""
              else
                echo ""
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "Proceeding Without Pre-Build Step"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "  This PipelineRun is test-only and does not build images."
                echo "  To create/update the image set, run /build-large-snapshot first."
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo ""
                export CI=true  # Skip interactive prompts in test.sh
              fi
              
              # Run test and capture result
              set +e
              "/home/e2e/tests/run-test.sh" "$(params.PIPELINE_TEST_SUITE)"
              TEST_RESULT=$?
              set -e
              
              # Always run debug script to check Release state
              echo ""
              echo "🔍 Running post-test Release diagnostics..."
              # Find the Release created by this test (most recent with our originating-tool label)
              RELEASE_NAME=$(kubectl get release -n dev-release-team-tenant \
                -l originating-tool=rh-advisories-large-snapshot-test \
                --sort-by=.metadata.creationTimestamp \
                -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || echo "")
              
              if [ -n "${RELEASE_NAME}" ]; then
                echo "🔍 Found Release: ${RELEASE_NAME}"
                /tmp/debug-release.sh "${RELEASE_NAME}" "dev-release-team-tenant" || true
              else
                echo "⚠️  Could not find Release to debug"
              fi
              
              # Exit with test result
              exit ${TEST_RESULT}

      runAfter:
        - get-snapshot-data
  finally:
    - name: cleanup-resources
      timeout: "1h0m0s"
      params:
        - name: PIPELINE_TEST_SUITE
          value: $(params.PIPELINE_TEST_SUITE)
        - name: STEP_IMAGE
          value: $(tasks.get-snapshot-data.results.CONTAINER_IMAGE)
        - name: VAULT_PASSWORD_SECRET_NAME
          value: $(params.VAULT_PASSWORD_SECRET_NAME)
        - name: GITHUB_TOKEN_SECRET_NAME
          value: $(params.GITHUB_TOKEN_SECRET_NAME)
        - name: KUBECONFIG_SECRET_NAME
          value: $(params.KUBECONFIG_SECRET_NAME)
      taskSpec:
        params:
          - name: PIPELINE_TEST_SUITE
          - name: STEP_IMAGE
          - name: VAULT_PASSWORD_SECRET_NAME
          - name: GITHUB_TOKEN_SECRET_NAME
          - name: KUBECONFIG_SECRET_NAME
        steps:
          - name: cleanup-resources
            image: $(params.STEP_IMAGE)
            env:
              - name: VAULT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: $(params.VAULT_PASSWORD_SECRET_NAME)
                    key: password
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.GITHUB_TOKEN_SECRET_NAME)
                    key: token
              - name: KUBECONFIG
                valueFrom:
                  secretKeyRef:
                    name: $(params.KUBECONFIG_SECRET_NAME)
                    key: kubeconfig
            script: |
              #!/usr/bin/env bash
              
              set +e
              
              # test.env uses an existing branch (same as in run-test)
              TEST_ENV_FILE="/home/e2e/tests/$(params.PIPELINE_TEST_SUITE)/test.env"
              if grep -q 'component_base_branch=.*-base' "$TEST_ENV_FILE"; then
                sed -i \
                  's/component_base_branch=.*/component_base_branch=push-to-external-registry-base/' \
                  "$TEST_ENV_FILE"
              fi
              
              # RoleBinding files (same as in run-test)
              # Note: SC2016 disabled where needed - we want literal ${var} in files for envsubst
              TENANT_ROLEBINDING="/home/e2e/tests/$(params.PIPELINE_TEST_SUITE)/resources/tenant/sa-rolebinding.yaml"
              MANAGED_ROLEBINDING="/home/e2e/tests/$(params.PIPELINE_TEST_SUITE)/resources/managed/sa-rolebinding.yaml"
              
              if [ -f "$TENANT_ROLEBINDING" ]; then
                sed -i \
                  's/name: release-service-account$/name: release-pipeline-resource-role/' \
                  "$TENANT_ROLEBINDING"
                # shellcheck disable=SC2016
                TENANT_NAME_PATTERN='s/name: release-service-account-\${tenant_sa_name}/'
                # shellcheck disable=SC2016
                TENANT_NAME_REPLACE='name: release-pipeline-resource-role-binding-for-\${component_name}/'
                sed -i "${TENANT_NAME_PATTERN}${TENANT_NAME_REPLACE}" "$TENANT_ROLEBINDING"
                if ! grep -q "namespace:" "$TENANT_ROLEBINDING"; then
                  # shellcheck disable=SC2016
                  sed -i '/^metadata:/a\  namespace: ${tenant_namespace}' \
                    "$TENANT_ROLEBINDING"
                fi
                if ! grep -q "managed_sa_name" "$TENANT_ROLEBINDING"; then
                  # shellcheck disable=SC2016
                  SUBJ_PATTERN='/^subjects:/a\  - kind: ServiceAccount\n'
                  SUBJ_PATTERN="${SUBJ_PATTERN}    name: \${managed_sa_name}\n"
                  SUBJ_PATTERN="${SUBJ_PATTERN}    namespace: \${managed_namespace}"
                  sed -i "${SUBJ_PATTERN}" "$TENANT_ROLEBINDING"
                fi
              fi
              
              if [ -f "$MANAGED_ROLEBINDING" ]; then
                sed -i \
                  's/name: release-service-account-managed$/name: release-pipeline-resource-role/' \
                  "$MANAGED_ROLEBINDING"
                # shellcheck disable=SC2016
                MANAGED_NAME_PATTERN='s/name: release-service-account-\${managed_sa_name}/'
                # shellcheck disable=SC2016
                MANAGED_NAME_REPLACE='name: release-pipeline-resource-role-binding-for-\${managed_sa_name}/'
                sed -i "${MANAGED_NAME_PATTERN}${MANAGED_NAME_REPLACE}" "$MANAGED_ROLEBINDING"
                if ! grep -q "namespace:" "$MANAGED_ROLEBINDING"; then
                  # shellcheck disable=SC2016
                  sed -i '/^    name: \${managed_sa_name}/a\    namespace: ${managed_namespace}' \
                    "$MANAGED_ROLEBINDING"
                fi
              fi
              
              # Source test.env for resource names
              # shellcheck disable=SC1090
              . "/home/e2e/tests/$(params.PIPELINE_TEST_SUITE)/test.env"
              
              # Source lib functions
              # shellcheck disable=SC1091
              . "/home/e2e/tests/lib/test-functions.sh"
              
              # Delete GH repo if exists
              "/home/e2e/tests/scripts/delete-repository.sh" "${component_repo_name:?}" || true
              
              # Setup vault
              VAULT_PASSWORD_FILE=$(mktemp)
              export VAULT_PASSWORD_FILE
              echo "${VAULT_PASSWORD:?}" > "${VAULT_PASSWORD_FILE}"
              
              KUBECONFIG_FILE=$(mktemp)
              echo "${KUBECONFIG:?}" > "${KUBECONFIG_FILE}"
              KUBECONFIG="${KUBECONFIG_FILE}"
              export KUBECONFIG
              
              # Decrypt and delete k8s resources
              decrypt_secrets "/home/e2e/tests/$(params.PIPELINE_TEST_SUITE)" || true
              
              tmpDir=$(mktemp -d)
              
              echo "Cleaning up tenant resources..."
              kustomize build "/home/e2e/tests/$(params.PIPELINE_TEST_SUITE)/resources/tenant" \
                | envsubst > "$tmpDir/tenant-resources.yaml" || true
              # Intentionally avoid deleting Component/Application during cleanup.
              # Only remove supporting tenant resources by label.
              kubectl delete rolebinding,serviceaccount,releaseplan \
                -n "${tenant_namespace:-dev-release-team-tenant}" \
                -l "originating-tool=${originating_tool:-rh-advisories-large-snapshot-test}" \
                --ignore-not-found=true || true
              
              echo "Cleaning up managed resources..."
              kustomize build "/home/e2e/tests/$(params.PIPELINE_TEST_SUITE)/resources/managed" \
                | envsubst > "$tmpDir/managed-resources.yaml" || true
              kubectl delete -f "$tmpDir/managed-resources.yaml" --ignore-not-found=true || true
              
              rm -rf "$tmpDir"
              echo "Cleanup completed"
