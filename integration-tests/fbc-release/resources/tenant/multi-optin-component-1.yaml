---
apiVersion: appstudio.redhat.com/v1alpha1
kind: Component
metadata:
  annotations:
    git-provider: github
    build.appstudio.openshift.io/request: configure-pac
    image.redhat.com/generate: '{"visibility": "public"}'
    build.appstudio.openshift.io/pipeline: '{"name": "fbc-builder", "bundle": "latest"}'
  name: ${optin_component_1_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  application: multi-optin-${application_name}
  componentName: ${optin_component_1_name}
  secret: pipelines-as-code-secret-${optin_component_1_name}
  source:
    git:
      dockerfileUrl: catalog.Dockerfile
      revision: ${optin_component_1_branch}
      # the e2e-operator-fbc repo has the "v" prefixing the version
      context: "v${random_optin_component_ocp_ver_1}"          # distinct OCP from comp 2 (per-OCP split)
      url: "${optin_component_1_git_url}"
