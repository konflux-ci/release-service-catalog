---
apiVersion: appstudio.redhat.com/v1alpha1
kind: Component
metadata:
  annotations:
    git-provider: github
    build.appstudio.openshift.io/request: configure-pac
    image.redhat.com/generate: '{"visibility": "public"}'
    build.appstudio.openshift.io/pipeline: '{"name": "fbc-builder", "bundle": "latest"}'
  name: ${component2_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  application: ${application_name}
  componentName: ${component2_name}
  secret: pipelines-as-code-secret-${component2_name}
  source:
    git:
      dockerfileUrl: catalog.Dockerfile
      revision: ${component2_branch}
      # component2/ dir (example-operator2); a distinct OCP from component1 so
      # the multi snapshot spans two OCP groups (per-OCP split, not batching)
      context: "component2/v${random_component_ocp_ver_2}"
      url: "${component2_git_url}"
