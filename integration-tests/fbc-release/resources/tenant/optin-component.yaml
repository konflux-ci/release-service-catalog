---
apiVersion: appstudio.redhat.com/v1alpha1
kind: Component
metadata:
  annotations:
    git-provider: github
    build.appstudio.openshift.io/request: configure-pac
    image.redhat.com/generate: '{"visibility": "public"}'
    build.appstudio.openshift.io/pipeline: '{"name": "fbc-builder", "bundle": "latest"}'
  name: ${optin_component_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  application: optin-${application_name}
  componentName: ${optin_component_name}
  secret: pipelines-as-code-secret-${component_name}
  source:
    git:
      dockerfileUrl: catalog.Dockerfile
      revision: ${optin_component_branch}
      # the e2e-operator-fbc repo has the "v" prefixing the version
      context: "v${random_optin_component_ocp_ver_1}"          # single opt-in component
      url: "${optin_component_git_url}"
