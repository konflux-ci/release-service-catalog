---
apiVersion: appstudio.redhat.com/v1alpha1
kind: Component
metadata:
  annotations:
    git-provider: github
    build.appstudio.openshift.io/request: configure-pac
    image.redhat.com/generate: '{"visibility": "public"}'
    build.appstudio.openshift.io/pipeline: '{"name": "fbc-builder", "bundle": "latest"}'
  name: ${multi_staged_component_1_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  application: ${multi_staged_application_name}
  componentName: ${multi_staged_component_1_name}
  secret: pipelines-as-code-secret-${multi_staged_component_1_name}
  source:
    git:
      dockerfileUrl: catalog.Dockerfile
      revision: ${multi_staged_component_1_branch}
      # component/ dir (example-operator); distinct OCP from component_2 so the
      # multi snapshot spans two OCP groups (per-OCP split, not batching)
      context: "component/v${random_multi_staged_component_ocp_ver_1}"
      url: "${multi_staged_component_1_git_url}"
