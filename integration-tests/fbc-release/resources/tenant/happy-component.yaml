---
apiVersion: appstudio.redhat.com/v1alpha1
kind: Component
metadata:
  annotations:
    git-provider: github
    build.appstudio.openshift.io/request: configure-pac
    image.redhat.com/generate: '{"visibility": "public"}'
    build.appstudio.openshift.io/pipeline: '{"name": "fbc-builder", "bundle": "latest"}'
  name: ${happy_component_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  application: ${happy_application_name}
  componentName: ${happy_component_name}
  secret: pipelines-as-code-secret-${happy_component_name}
  source:
    git:
      dockerfileUrl: catalog.Dockerfile
      revision: ${happy_component_branch}
      # happy rides on the component/ dir (example-operator) at its own OCP version
      context: "component/v${random_happy_component_ocp_ver}"
      url: "${happy_component_git_url}"
