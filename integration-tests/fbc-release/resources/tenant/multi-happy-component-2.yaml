---
apiVersion: appstudio.redhat.com/v1alpha1
kind: Component
metadata:
  annotations:
    git-provider: github
    build.appstudio.openshift.io/request: configure-pac
    image.redhat.com/generate: '{"visibility": "public"}'
    build.appstudio.openshift.io/pipeline: '{"name": "fbc-builder", "bundle": "latest"}'
  name: ${multi_happy_component_2_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  application: ${multi_happy_application_name}
  componentName: ${multi_happy_component_2_name}
  secret: pipelines-as-code-secret-${multi_happy_component_2_name}
  source:
    git:
      dockerfileUrl: catalog.Dockerfile
      revision: ${multi_happy_component_2_branch}
      # component2/ dir (example-operator2); same OCP as component_1 for batching
      context: "component2/v${random_multi_happy_component_ocp_ver}"
      url: "${multi_happy_component_2_git_url}"
