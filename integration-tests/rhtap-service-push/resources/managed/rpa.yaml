---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: ${release_plan_admission_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  applications:
    - ${application_name}
  data:
    mapping:
      components:
        - name: ${component_name}
          repositories:
            - url: quay.io/hacbs-release-tests/osd-addons/e2e-component-index
              tags:
                - '{{ git_short_sha }}'
          pushSourceContainer: false
    targetGHRepo: 'hacbs-release/infra-deployments'
    githubAppID: 932323
    githubAppInstallationID: 52284535
    infraDeploymentUpdates: |
      replace('components/release/development/kustomization.yaml', r'(config/default\?ref=)\S+', r'\g<1>{{ revision }}')
      replace('components/release/development/kustomization.yaml', r'(newTag: ).*', r'\g<1>{{ revision }}')
    sign:
      configMapName: "hacbs-signing-pipeline-config-staging-e2e-pq"
    pyxis:
      server: stage
      secret: pyxis-${component_name}
    infra:
      prCreatorSecret: infra-pr-creator-${component_name}
  origin: ${tenant_namespace}
  pipeline:
    maxRetries: 0
    pipelineRef:
      params:
        - name: url
          value: "${RELEASE_CATALOG_GIT_URL}"
        - name: revision
          value: "${RELEASE_CATALOG_GIT_REVISION}"
        - name: pathInRepo
          value: pipelines/managed/rhtap-service-push/rhtap-service-push.yaml
      resolver: git
    serviceAccountName: ${managed_sa_name}
    timeouts:
      pipeline: 4h0m0s
      tasks: 4h0m0s
  policy: standard-${component_name}
