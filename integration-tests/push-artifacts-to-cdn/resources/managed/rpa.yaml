---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: ${release_plan_admission_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  applications:
    - ${application_name}
  data:
    cdn:
      env: stage
    intention: staging
    mapping:
      components:
        # Component 1: releases 3 files to BOTH Customer Portal (Pulp) AND CGW.
        # It has both `staged` (Pulp) and `contentGateway` (CGW) sections.
        - name: ${component_name}
          files:
            # Paths inside the container image (built from e2e-base
            # push-artifacts-to-cdn-comp1-base branch, jq 1.7.1 binaries).
            # Input is tar.gz; the pipeline extracts, signs, and re-packages
            # (Windows → .zip output; Linux/macOS → .tar.gz output).
            - source: /releases/e2e-cdn-comp1-windows-amd64.tar.gz
              arch: amd64
              os: windows
            - source: /releases/e2e-cdn-comp1-linux-amd64.tar.gz
              arch: amd64
              os: linux
            - source: /releases/e2e-cdn-comp1-darwin-amd64.tar.gz
              arch: amd64
              os: darwin
          contentGateway:
            # CGW product created for Konflux e2e testing (stage: developers.qa.redhat.com).
            productName: "Konflux Release E2E test product"
            productCode: "KonfluxReleaseE2E"
            productVersionName: "1.0"
            contentType: "binary"
          staged:
            # Pulp repo created for Konflux e2e testing (eng product ID 10681, shadow).
            # Repo exists in stage: rhsm-pulp.corp.stage.redhat.com
            destination: "konflux-release-e2e-1_DOT_0-for-rhel-10-x86_64-files"
            version: "1.0"
            files:
              - source: /releases/e2e-cdn-comp1-windows-amd64.tar.gz
                filename: "e2e-cdn-comp1-1.0-{{ release_timestamp }}-windows-amd64.tar.gz"
                arch: amd64
                os: windows
              - source: /releases/e2e-cdn-comp1-linux-amd64.tar.gz
                filename: "e2e-cdn-comp1-1.0-{{ release_timestamp }}-linux-amd64.tar.gz"
                arch: amd64
                os: linux
              - source: /releases/e2e-cdn-comp1-darwin-amd64.tar.gz
                filename: "e2e-cdn-comp1-1.0-{{ release_timestamp }}-darwin-amd64.tar.gz"
                arch: amd64
                os: darwin
          pushSourceContainer: false
        # Component 2: releases 3 files to CGW ONLY (no staged/Pulp section).
        - name: ${component2_name}
          files:
            # Paths inside the container image (built from e2e-base
            # push-artifacts-to-cdn-comp2-base branch, jq 1.6 binaries).
            # Input is tar.gz; the pipeline extracts, signs, and re-packages.
            - source: /releases/e2e-cdn-comp2-windows-amd64.tar.gz
              arch: amd64
              os: windows
            - source: /releases/e2e-cdn-comp2-linux-amd64.tar.gz
              arch: amd64
              os: linux
            - source: /releases/e2e-cdn-comp2-darwin-amd64.tar.gz
              arch: amd64
              os: darwin
          contentGateway:
            # Same CGW product as comp1 — both components' files land in the
            # same product version on stage CGW.
            productName: "Konflux Release E2E test product"
            productCode: "KonfluxReleaseE2E"
            productVersionName: "1.0"
            contentType: "binary"
          pushSourceContainer: false
        # Component 3: releases a disk image file to BOTH Pulp AND CGW.
        # contentGateway.contentType: disk-image drives the disk-image code path in
        # extract_artifacts.py (pass-through, no compression) and push_unsigned.py.
        # Disk images must always use os: linux — see _validate_disk_image_components.
        - name: ${component3_name}
          files:
            # Path inside the container image (built from e2e-base
            # push-artifacts-to-cdn-comp3-base branch).
            - source: /releases/e2e-cdn-comp3-rhel10-x86_64.qcow2
              arch: amd64
              os: linux
          contentGateway:
            # Same CGW product as the other components.
            productName: "Konflux Release E2E test product"
            productCode: "KonfluxReleaseE2E"
            productVersionName: "1.0"
            contentType: "disk-image"
          staged:
            # Same Pulp repo as comp1 — disk images land alongside binaries in e2e testing.
            destination: "konflux-release-e2e-1_DOT_0-for-rhel-10-x86_64-files"
            version: "1.0"
            files:
              - source: /releases/e2e-cdn-comp3-rhel10-x86_64.qcow2
                filename: "e2e-cdn-comp3-1.0-{{ release_timestamp }}-rhel10-x86_64.qcow2"
                arch: amd64
                os: linux
          pushSourceContainer: false
    releaseNotes:
      product_id:
        - 10681
      product_name: "Konflux Release E2E test product"
      product_version: "1.0"
      product_stream: "KonfluxReleaseE2E-1.0"
      cpe: "cpe:/a:redhat:konflux_release_e2e:1.0::el10"
      type: "RHBA"
      synopsis: "Konflux Release E2E test product 1.0 test release"
      topic: "Integration test release for push-artifacts-to-cdn e2e testing"
      description: "Integration test release for the push-artifacts-to-cdn pipeline"
      solution: "Update to Konflux Release E2E test product 1.0"
    sign:
      configMapName: "hacbs-signing-pipeline-config-staging-e2e"
  origin: ${tenant_namespace}
  pipeline:
    pipelineRef:
      params:
        - name: url
          value: "${RELEASE_CATALOG_GIT_URL}"
        - name: revision
          value: "${RELEASE_CATALOG_GIT_REVISION}"
        - name: pathInRepo
          value: pipelines/managed/push-artifacts-to-cdn/push-artifacts-to-cdn.yaml
      resolver: git
    taskRunSpecs:
      - pipelineTaskName: verify-access-to-resources
        stepSpecs:
          - computeResources:
              limits:
                memory: 100Mi
                cpu: 200m
              requests:
                memory: 100Mi
                cpu: 200m
            name: verify-access-to-resources
    serviceAccountName: ${managed_sa_name}
    timeouts:
      pipeline: 4h0m0s
      tasks: 4h0m0s
  policy: standard-${component_name}
