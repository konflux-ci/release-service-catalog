---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${tenant_namespace}
resources:
  - application.yaml
  - component.yaml
  # component2.yaml is intentionally excluded: it is applied manually in Phase 2
  # (inside verify_release_contents) after component-a's Release has completed
  # and its image is indexed in Pyxis. This is the core of Gap 2.2 — the snapshot
  # grows from 1 to 2 components between releases.
  - sa-rolebinding.yaml
  - rp.yaml
  - secrets/tenant-secrets.yaml
