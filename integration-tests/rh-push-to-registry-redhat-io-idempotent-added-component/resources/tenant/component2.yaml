---
# component2.yaml — NOT referenced in kustomization.yaml.
# Applied manually in Phase 2 (verify_release_contents) after component-a is
# fully released and indexed in Pyxis. This simulates an "added component"
# scenario where the snapshot grows between releases.
apiVersion: appstudio.redhat.com/v1alpha1
kind: Component
metadata:
  annotations:
    git-provider: github
    build.appstudio.openshift.io/request: configure-pac
    image.redhat.com/generate: '{"visibility": "public"}'
    build.appstudio.openshift.io/pipeline: '{"name": "docker-build-oci-ta", "bundle": "latest"}'
  name: ${component2_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  application: ${application_name}
  componentName: ${component2_name}
  secret: pipelines-as-code-secret-${component2_name}
  source:
    git:
      dockerfileUrl: Dockerfile
      revision: ${component2_branch}
      url: "${component2_git_url}"
