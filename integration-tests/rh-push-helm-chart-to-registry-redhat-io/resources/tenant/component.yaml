---
apiVersion: appstudio.redhat.com/v1alpha1
kind: Component
metadata:
  annotations:
    git-provider: github
    build.appstudio.openshift.io/request: configure-pac
    # TEMPORARY: custom Helm OCI build pipeline until the build team publishes
    # an official build-helm-chart-oci-ta pipeline in the cluster build-pipeline-config.
    # To update: tkn bundle push quay.io/swickers/pipeline-build-helm-chart-oci-ta:latest \
    #   -f integration-tests/rh-push-helm-chart-to-registry-redhat-io/resources/build/helm-chart-build-pipeline.yaml
    build.appstudio.openshift.io/pipeline: >-
      {"name": "build-helm-chart-oci-ta",
      "bundle": "quay.io/swickers/pipeline-build-helm-chart-oci-ta:latest"}
  name: ${component_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  application: ${application_name}
  componentName: ${component_name}
  containerImage: ${container_image}
  secret: pipelines-as-code-secret-${component_name}
  source:
    git:
      context: ./
      revision: ${component_branch}
      url: "${component_git_url}"
