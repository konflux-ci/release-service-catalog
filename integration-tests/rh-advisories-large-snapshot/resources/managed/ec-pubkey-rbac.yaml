---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ec-pubkey-reader-${component_name}
  labels:
    originating-tool: "${originating_tool}"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["test-ec-pubkey-${component_name}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ec-pubkey-reader-binding-${component_name}
  labels:
    originating-tool: "${originating_tool}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ec-pubkey-reader-${component_name}
subjects:
  - kind: ServiceAccount
    name: ${managed_sa_name}
    namespace: ${managed_namespace}
