apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: ${release_plan_admission_name}
  labels:
    originating-tool: "${originating_tool}"
  annotations:
    test.appstudio.openshift.io/large-snapshot: "true"
    # Skip idempotency check for large snapshot test releases
    # Expected behavior: Allows repeated releases of the same snapshot for testing
    # Rationale: Test releases should not be blocked by previous test runs
    test.appstudio.openshift.io/skip-idempotency: "true"
spec:
  applications:
    - ${application_name}
  data:
    # Skip idempotency filtering for test releases
    skipFilter: true
    # Atlas configuration: DISABLED - focus on signing and scale stress testing
    # SBOM processing is disabled to maximize stress on signing service and component processing
    # atlas:
    #   server: stage
    #   atlas-sso-secret-name: atlas-staging-sso-secret-${component_name}
    #   atlas-retry-aws-secret-name: atlas-retry-s3-staging-secret-${component_name}
    releaseNotes:
      # Advisory metadata - all fields required by schema
      product_id:
        - 999
      product_name: "rh-advisories-large-test"
      product_version: "1.0"
      product_stream: "rh-advisories-large-test-1.0"
      cpe: "cpe:/a:redhat:rh_advisories_large_test:1.0::el9"
      type: "RHBA"
      synopsis: "rh-advisories-large-test 1.0 release for large snapshot testing"
      topic: "Large snapshot test with 200 components"
      description: "Test release for rh-advisories pipeline with large snapshot (200 components)"
      solution: "Update to rh-advisories-large-test 1.0"
    pyxis:
      server: stage
      secret: pyxis-${component_name}
    sign:
      configMapName: "hacbs-signing-pipeline-config-staging-redhatbeta2"
      cosignSecretName: "konflux-cosign-signing-stage-${component_name}"
    mapping:
      defaults:
        tags:
          - latest
        pushSourceContainer: false
      components:
        # All 200 components use the same repository URL
