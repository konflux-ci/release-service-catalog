---
apiVersion: appstudio.redhat.com/v1alpha1
kind: EnterpriseContractPolicy
metadata:
  name: standard-${component_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  description: >-
    Enterprise Contract policy for maximum stress testing.
    Minimal validation to focus on signing service capacity and scale.
  publicKey: "k8s://openshift-pipelines/public-key"
  sources:
    - name: Release Policies
      data:
        - github.com/release-engineering/rhtap-ec-policy//data
        - oci::quay.io/konflux-ci/tekton-catalog/data-acceptable-bundles:latest
      policy:
        - oci::quay.io/enterprise-contract/ec-release-policy:konflux
      volatileConfig:
        exclude:
          - value: cve.cve_blockers
            effectiveUntil: "2025-02-01T00:00:00Z"
      config:
        # Skip signature checks - focus on signing service stress, not signature verification
        exclude:
          - builtin.attestation.signature_check
          - builtin.image.signature_check
        include: []
