---
apiVersion: appstudio.redhat.com/v1alpha1
kind: EnterpriseContractPolicy
metadata:
  name: standard-${component_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  description: >-
    Enterprise Contract policy for large snapshot testing.
    More lenient than production to allow releasing old static pool images
    whose task bundles and SLSA provenance may no longer satisfy current EC rules.
  publicKey: "${ec_public_key_ref}"
  sources:
    - name: Release Policies
      data:
        - github.com/release-engineering/rhtap-ec-policy//data
        - oci::quay.io/konflux-ci/tekton-catalog/data-acceptable-bundles:latest
      policy:
        - oci::quay.io/enterprise-contract/ec-release-policy:konflux
      volatileConfig:
        exclude:
          # Static pool images are never rebuilt, so CVEs accumulate by design.
          # This test validates pipeline mechanics, not image security posture.
          - value: cve.cve_blockers
          - value: cve.unpatched_cve_warnings
      config:
        # Use @slsa3 for large-scale PAC build test scenario
        # @slsa3 already excludes most SLSA violations; only remaining one explicitly excluded below
        exclude:
          - slsa_source_correlated.expected_source_code_reference
          # Static pool images were not built by this pipeline, so their SLSA provenance
          # build task results (IMAGE_URL/IMAGE_DIGEST) won't match the snapshot references.
          - slsa_build_scripted_build.subject_build_task_matches
          # Static pool images may be months/years old; the task bundles used to build them
          # will eventually be removed from the approved list. Exclude to avoid blocking releases.
          - attestation_task_bundle.disallowed_task_reference
          # Exclude time-based validity checks — old pool images may fail expiry rules.
          - test
          # Exclude rules considered not useful for test scenarios.
          - not_useful
        include:
          - '@slsa3'
