---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: ${release_plan_admission_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  applications:
    - ${application_name}
  data:
    sign:
      configMapName: "hacbs-signing-pipeline-config-staging-e2e-pq"
    mapping:
      cloudMarketplacesSecret: "marketplacesvm-test-secret-${component_name}"
      cloudMarketplacesPrePush: true
      components:
        - name: ${component_name}
          contentType: disk-image
          productInfo:
            filePrefix: "push-disk-images-marketplaces-1.0"
            productCode: "DISKIMGMKTTEST"
            productName: "Disk Images Marketplaces E2E Test"
            productVersionName: "1.0"
          # staged and starmap are merged into the snapshot component by apply-mapping
          staged:
            destination: "push-disk-images-marketplaces-e2e-test"
            version: "1.0"
            files:
              - source: "releases/test-disk-image.raw"
                filename: "test-disk-image-1.0-${disk_image_respin}-x86_64.raw"
          starmap:
            - name: "push-disk-images-marketplaces"
              workflow: "stratosphere"
              cloud: "aws"
              mappings:
                aws-na:
                  destinations:
                    - architecture: "x86_64"
                      destination: "00000000-0000-0000-0000-000000000000"
                      overwrite: true
                      restrict_version: false
                  provider: null
              meta:
                ena_support: true
                marketplace_entity_type: "AmiProduct"
                root_device: "/dev/sda1"
                sriov_net_support: "simple"
                user_name: "cloud-user"
                virtualization: "hvm"
                volume: "gp3"
    releaseNotes:
      product_id:
        - 999
      product_name: "Push Disk Images Marketplaces E2E Test"
      product_version: "1.0"
      product_stream: "push-disk-images-marketplaces-e2e-1.0"
      cpe: "cpe:/a:redhat:push_disk_images_marketplaces_e2e:1.0::el9"
      type: "RHBA"
      synopsis: "Push Disk Images Marketplaces E2E Test 1.0 release"
      topic: "Integration test release for push-disk-images-to-marketplaces e2e testing"
      description: "Integration test release for the push-disk-images-to-marketplaces pipeline"
      solution: "Update to Push Disk Images Marketplaces E2E Test 1.0"
  origin: ${tenant_namespace}
  pipeline:
    maxRetries: 0
    pipelineRef:
      params:
        - name: url
          value: "${RELEASE_CATALOG_GIT_URL}"
        - name: revision
          value: "${RELEASE_CATALOG_GIT_REVISION}"
        - name: pathInRepo
          value: pipelines/managed/push-disk-images-to-marketplaces/push-disk-images-to-marketplaces.yaml
      resolver: git
    taskRunSpecs:
      - pipelineTaskName: verify-access-to-resources
        stepSpecs:
          - computeResources:
              limits:
                memory: 100Mi
                cpu: 200m
              requests:
                memory: 100Mi
                cpu: 200m
            name: verify-access-to-resources
      - pipelineTaskName: marketplacesvm-push-disk-images
        stepSpecs:
          - computeResources:
              limits:
                memory: 4Gi
              requests:
                memory: 2Gi
            name: pull-and-push-images-to-marketplaces
    serviceAccountName: ${managed_sa_name}
    timeouts:
      pipeline: 6h0m0s
      tasks: 6h0m0s
  policy: standard-${component_name}
