---
apiVersion: appstudio.redhat.com/v1alpha1
kind: Component
metadata:
  annotations:
    git-provider: github
    build.appstudio.openshift.io/request: configure-pac
    image.redhat.com/generate: '{"visibility": "public"}'
    # Required so Pipelines-as-Code's component-initialization flow can resolve a
    # build pipeline to generate the .tekton/*.yaml PR for this component. Unlike
    # rh-advisories-large-snapshot (whose component.yaml this file used to be
    # symlinked from), this suite performs a real build every run, so it needs
    # this annotation — without it, component initialization fails with PaC
    # error-id 75 ("No resource for finishing the request"); see
    # sop/build-service/faq.md. Matches rh-advisories-idempotent, which builds
    # the same collectors-base content.
    build.appstudio.openshift.io/pipeline: '{"name": "docker-build-multi-platform-oci-ta", "bundle": "latest"}'
  name: ${component_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  application: ${application_name}
  componentName: ${component_name}
  secret: pipelines-as-code-secret-${component_name}
  source:
    git:
      dockerfileUrl: Dockerfile
      revision: ${component_branch}
      url: "${component_git_url}"
