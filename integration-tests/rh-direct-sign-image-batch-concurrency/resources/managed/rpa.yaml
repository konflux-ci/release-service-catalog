---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: ${release_plan_admission_name}
  labels:
    originating-tool: "${originating_tool}"
  annotations:
    # Skip idempotency check to allow repeated releases of the same snapshot for testing
    # Expected behavior: Allows re-running this test with the same snapshot
    # Rationale: This is a test release, not a production release
    test.appstudio.openshift.io/skip-idempotency: "true"
spec:
  applications:
    - ${application_name}
  data:
    # Skip idempotency filtering for test releases
    skipFilter: true
    atlas:
      server: stage
      atlas-sso-secret-name: atlas-staging-sso-secret-${component_name}
      atlas-retry-aws-secret-name: atlas-retry-s3-staging-secret-${component_name}
    releaseNotes:
      product_id:
        - 999
      product_name: "rh-direct-sign-image-batch-concurrency-test"
      product_version: "1.0"
      product_stream: "rh-direct-sign-image-batch-concurrency-test-1.0"
      # Match the CPE label on the image reused from the large-snapshot static image pool.
      cpe: "cpe:/a:redhat:rhtap_large_snapshot:1::el9"
      type: "RHBA"
      synopsis: "rh-direct-sign-image-batch-concurrency-test 1.0 release for batch concurrency testing"
      topic: "Test release forcing rh-direct-sign-image to submit >=2 concurrent signing batches"
      description: "Test release for rh-advisories pipeline that forces rh-direct-sign-image to split a
        single component's tags into >=2 concurrently-submitted signing batches, to verify concurrent
        InternalRequests from the same task do not get deleted by each other's cleanup logic."
      solution: "Update to rh-direct-sign-image-batch-concurrency-test 1.0"
    pyxis:
      server: stage
      secret: pyxis-${component_name}
    sign:
      configMapName: "hacbs-signing-pipeline-config-staging-e2e-pq"
      # cosignSecretName must be set to a real secret: process-component-sbom consumes
      # the same collect-task-params extracted value unconditionally (not gated by a
      # "when" clause like rh-sign-image-cosign is), and Kubernetes rejects pod creation
      # outright if it resolves to an empty secretKeyRef.name. Omitting this field to
      # try to skip rh-sign-image-cosign breaks process-component-sbom instead.
      cosignSecretName: "konflux-cosign-signing-stage-${component_name}"
    mapping:
      defaults:
        tags: []
        pushSourceContainer: false
      components:
        # tags on each repository below is patched at runtime (see patch_rpa_with_batch_tags()
        # in test.sh), which splits the computed tag list into roughly equal chunks across all
        # 4 repositories. An empty placeholder here avoids accidentally releasing with zero tags
        # if the RPA is ever read/applied before the patch runs.
        #
        # 4 destination repositories (rather than 1) are required because rh-sign-image-cosign
        # signs every tag onto one shared signature manifest per destination repository, and
        # Quay rejects that upload (413 Request Entity Too Large) once too many signatures
        # accumulate on a single repository — confirmed empirically at ~275 tags on one repo.
        # Splitting this suite's ~650 tags across 4 repositories keeps each repository's
        # signature count comfortably under that limit. See README.md for more detail.
        #
        # These repositories are registered in Pyxis stage via releng/pyxis-repo-configs
        # (products/release-service-batch-test/release-service-batch-test.yaml).
        #
        # canonicalName must be set once a component has multiple repositories (check-labels
        # requires it in that case). It's also required for correctness here regardless: the
        # reused static test image's baked-in "name" label is "rhtap/rh-advisories-component"
        # (from rh-advisories-large-snapshot's image pool), which no longer matches any of the
        # 4 destination repository paths above, so check-labels needs to be told explicitly
        # that this image's canonical name is still "rhtap/rh-advisories-component".
        - name: ${component_name}
          canonicalName: rhtap/rh-advisories-component
          repositories:
            - url: quay.io/redhat-pending/releng-test-product----batch-sign-test-1-rhel9
              tags: []
            - url: quay.io/redhat-pending/releng-test-product----batch-sign-test-2-rhel9
              tags: []
            - url: quay.io/redhat-pending/releng-test-product----batch-sign-test-3-rhel9
              tags: []
            - url: quay.io/redhat-pending/releng-test-product----batch-sign-test-4-rhel9
              tags: []
    jira:
      jiraAdvisorySecret: advisory-jira-secret-${component_name}
  origin: ${tenant_namespace}
  pipeline:
    maxRetries: 0
    pipelineRef:
      params:
        - name: url
          value: "${RELEASE_CATALOG_GIT_URL}"
        - name: revision
          value: "${RELEASE_CATALOG_GIT_REVISION}"
        - name: pathInRepo
          value: pipelines/managed/rh-advisories/rh-advisories.yaml
      resolver: git
    serviceAccountName: ${managed_sa_name}
    timeouts:
      pipeline: ${BATCH_TEST_TIMEOUT}
      tasks: ${BATCH_TEST_TIMEOUT}
  policy: standard-${component_name}
