---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: ${release_plan_admission_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  applications:
    - ${application_name}
  data:
    cdn:
      # stage uses exodus-prod-secret + rhsm-pulp-stage-secret + udcache-stage-secret.
      # The push-disk-images-e2e-test Pulp repo (see README) was provisioned under the
      # same konflux-release-e2e product family push-artifacts-to-cdn's e2e test uses,
      # which only exists on stage Pulp (rhsm-pulp.corp.stage.redhat.com), not QA.
      env: stage
    mapping:
      components:
        - name: ${component_name}
          # staged and contentGateway are merged into the snapshot component by apply-mapping
          staged:
            # Pulp destination directory for the pushed disk image files
            destination: "push-disk-images-e2e-test"
            # Required by pulp_push_disk_images.py to publish to the customer portal.
            version: "1.0"
            files:
              # Path inside the container image (built from the
              # hacbs-release-tests/e2e-base push-disk-images-base branch),
              # same "Component 3" convention push-artifacts-to-cdn uses for
              # its disk-image content type.
              - source: "releases/test-disk-image.raw"
                filename: "test-disk-image-${uuid}.raw"
          contentGateway:
            productName: "Disk Images E2E Test"
            productCode: "DISKIMGTEST"
            productVersionName: "1.0.0"
            filePrefix: "push-disk-images-e2e"
  origin: ${tenant_namespace}
  pipeline:
    pipelineRef:
      params:
        - name: url
          value: "${RELEASE_CATALOG_GIT_URL}"
        - name: revision
          value: "${RELEASE_CATALOG_GIT_REVISION}"
        - name: pathInRepo
          value: pipelines/managed/push-disk-images-to-cdn/push-disk-images-to-cdn.yaml
      resolver: git
    taskRunSpecs:
      - pipelineTaskName: verify-access-to-resources
        stepSpecs:
          - computeResources:
              limits:
                memory: 100Mi
                cpu: 200m
              requests:
                memory: 100Mi
                cpu: 200m
            name: verify-access-to-resources
    serviceAccountName: ${managed_sa_name}
    timeouts:
      pipeline: 6h0m0s
      tasks: 6h0m0s
  policy: standard-${component_name}
