---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlan
metadata:
  labels:
    release.appstudio.openshift.io/auto-release: 'true'
    release.appstudio.openshift.io/standing-attribution: 'true'
    release.appstudio.openshift.io/author: 'release-service-e2e'
    release.appstudio.openshift.io/releasePlanAdmission: "${release_plan_admission_name}"
    originating-tool: "${originating_tool}"
  name: ${release_plan_name}
spec:
  releaseGracePeriodDays: 1
  application: ${application_name}
  target: ${managed_namespace}
  data:
    mapping:
      components:
        - name: ${component_name}
          repositories:
            - url: quay.io/hacbs-release-tests/rh-push-to-external-registry-test
              # RPA has rpa-tag for the same component and url, collect-data
              # should merge them into one repository with both tags
              tags:
                - rp-tag
