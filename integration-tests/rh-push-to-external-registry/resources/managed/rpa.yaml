---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: ${release_plan_admission_name}
  labels:
    originating-tool: "${originating_tool}"
spec:
  applications:
    - ${application_name}
  data:
    pyxis:
      server: stage
      secret: pyxis-${component_name}
    mapping:
      defaults:
        # Use git_short_sha + timestamp for test isolation:
        # - git_short_sha: stable within the same snapshot (first & second release match)
        # - timestamp: derived from build-date, unique per build even on the same commit
        # Together they ensure filter-already-released-images won't match tags from
        # prior test runs, while the second release with the same snapshot triggers
        # idempotency (tags already exist from first release).
        tags:
          - '{{ git_short_sha }}'
          - '{{ timestamp }}'
        pushSourceContainer: false
      components:
        - name: ${component_name}
          repositories:
            - url: quay.io/hacbs-release-tests/rh-push-to-external-registry-test
  origin: ${tenant_namespace}
  pipeline:
    maxRetries: 0
    pipelineRef:
      params:
        - name: url
          value: "${RELEASE_CATALOG_GIT_URL}"
        - name: revision
          value: "${RELEASE_CATALOG_GIT_REVISION}"
        - name: pathInRepo
          value: pipelines/managed/rh-push-to-external-registry/rh-push-to-external-registry.yaml
      resolver: git
    serviceAccountName: ${managed_sa_name}
    timeouts:
      pipeline: 4h0m0s
      tasks: 4h0m0s
  policy: standard-${component_name}
