---
kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

namespace: ${managed_namespace}
resources:
  # Create secrets first - required by ServiceAccount
  - secrets/managed-secrets.yaml
  # Create ServiceAccount - references secrets above
  - sa.yaml
  # Create RoleBinding - references ServiceAccount
  - sa-rolebinding.yaml
  - rpa.yaml
  # Create RPA and policy - may reference ServiceAccount
  - ec-policy.yaml
