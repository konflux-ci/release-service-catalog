---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: calunga-push-to-pulp-lightwell
spec:
  description: >-
    Release Components in a Snapshot to a pulp-backed python index. Each image in a Component is
    expected to contain a python wheel and sdist under the /releases directory. This is the Lightwell
    variant without advisory creation or SBOM uploads to Atlas, with optional sdist source mirroring to GitLab.
  params:
    - name: release
      type: string
      description:
        The namespaced name (namespace/name) of the Release custom resource initiating this pipeline execution
    - name: releasePlan
      type: string
      description: The namespaced name (namespace/name) of the releasePlan
    - name: releasePlanAdmission
      type: string
      description: The namespaced name (namespace/name) of the releasePlanAdmission
    - name: releaseServiceConfig
      type: string
      description: The namespaced name (namespace/name) of the releaseServiceConfig
    - name: snapshot
      type: string
      description: The namespaced name (namespace/name) of the snapshot
    - name: enterpriseContractPolicy
      type: string
      description: JSON representation of the EnterpriseContractPolicy
    - name: enterpriseContractExtraRuleData
      type: string
      description: |
        Extra rule data to be merged into the policy specified in params.enterpriseContractPolicy. Use syntax
        "key1=value1,key2=value2..."
      default: "pipeline_intention=release"
    - name: enterpriseContractTimeout
      type: string
      description: Timeout setting for `ec validate`
      default: 40m0s
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks to be used are stored
      default: https://github.com/konflux-ci/release-service-catalog.git
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
      default: production
    - name: signingSecretName
      type: string
      description: The name of the AWS KMS signing secret
      default: konflux-cosign-signing-production
    - name: ociStorage
      description: URL to the OCI artifact storage
      type: string
      default: quay.io/konflux-ci/release-service-trusted-artifacts
    - name: dataDir
      type: string
      description: Path used for working directories
      default: /var/workdir/content
    - name: taisceCuanGitUrl
      type: string
      description: Git repository URL where taisce-cuan tasks are stored
      default: https://github.com/konflux-lightwell/taisce-cuan.git
    - name: taisceCuanGitRevision
      type: string
      description: Git revision for taisce-cuan tasks
      default: main
  tasks:
    - name: collect-data
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-data/collect-data.yaml
      params:
        - name: release
          value: $(params.release)
        - name: releasePlan
          value: $(params.releasePlan)
        - name: releasePlanAdmission
          value: $(params.releasePlanAdmission)
        - name: releaseServiceConfig
          value: $(params.releaseServiceConfig)
        - name: snapshot
          value: $(params.snapshot)
        - name: subdirectory
          value: $(context.pipelineRun.uid)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(params.ociStorage)

    - name: collect-task-params
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-task-params/collect-task-params.yaml
      runAfter:
        - collect-data
      params:
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: sourceDataArtifact
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
        - name: dataPath
          value: $(tasks.collect-data.results.data)
        - name: dataDir
          value: $(params.dataDir)
        - name: keysToExtract
          value: |
            [
              {"resultIndex": 0, "key": ".pulp.baseUrl", "default": "https://packages.redhat.com"},
              {"resultIndex": 1, "key": ".pulp.domain", "default": "public-trusted-libraries"},
              {"resultIndex": 2, "key": ".pulp.apiRoot", "default": "/api/"},
              {"resultIndex": 3, "key": ".pulp.repository", "default": "main"},
              {"resultIndex": 4, "key": ".pulp.secretName", "default": "rhtl-pulp-credentials-secret"},
              {"resultIndex": 5, "key": ".mirrorSource", "default": "false"},
              {"resultIndex": 6, "key": ".allowSourceOverwrite", "default": "false"},
              {"resultIndex": 7, "key": ".gitGroup", "default": "lightwell/lightwell-builds"},
              {"resultIndex": 8, "key": ".gitSecretName", "default": "lightwell-builds-git-auth"},
              {"resultIndex": 9, "key": ".packageName", "default": ""},
              {"resultIndex": 10, "key": ".packageVersion", "default": ""},
              {"resultIndex": 11, "key": ".gitForgeUrl", "default": "https://gitlab.cee.redhat.com"},
              {"resultIndex": 12, "key": ".committerName", "default": "taisce-cuan bot"},
              {"resultIndex": 13, "key": ".committerEmail", "default": "lightwell@redhat.com"}
            ]

    - name: reduce-snapshot
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/reduce-snapshot/reduce-snapshot.yaml
      params:
        - name: SNAPSHOT
          value: $(params.dataDir)/$(tasks.collect-data.results.snapshotSpec)
        - name: SINGLE_COMPONENT
          value: $(tasks.collect-data.results.singleComponentMode)
        - name: SINGLE_COMPONENT_CUSTOM_RESOURCE
          value: snapshot/$(tasks.collect-data.results.snapshotName)
        - name: SINGLE_COMPONENT_CUSTOM_RESOURCE_NS
          value: $(tasks.collect-data.results.snapshotNamespace)
        - name: SNAPSHOT_PATH
          value: $(params.dataDir)/$(tasks.collect-data.results.snapshotSpec)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: sourceDataArtifact
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: dataDir
          value: $(params.dataDir)
      runAfter:
        - collect-data

    - name: verify-enterprise-contract
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/enterprise-contract/ec-cli
          - name: revision
            value: cdfd9188f9352d7269ae1fe8c273a9e67f60ab8a
          - name: pathInRepo
            value: "tasks/verify-conforma-konflux-ta/0.1/verify-conforma-konflux-ta.yaml"
      params:
        - name: SNAPSHOT_FILENAME
          value: "$(tasks.collect-data.results.snapshotSpec)"
        - name: SSL_CERT_DIR
          value: /var/run/secrets/kubernetes.io/serviceaccount
        - name: POLICY_CONFIGURATION
          value: $(params.enterpriseContractPolicy)
        - name: STRICT
          value: "true"
        - name: IGNORE_REKOR
          value: "true"
        - name: EXTRA_RULE_DATA
          value: $(params.enterpriseContractExtraRuleData)
        - name: TIMEOUT
          value: $(params.enterpriseContractTimeout)
        - name: SOURCE_DATA_ARTIFACT
          value: "$(tasks.reduce-snapshot.results.sourceDataArtifact)"
      runAfter:
        - reduce-snapshot

    - name: extract-py-artifacts
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/extract-py-artifacts/extract-py-artifacts.yaml
      params:
        - name: SNAPSHOT_PATH
          value: $(tasks.collect-data.results.snapshotSpec)
        - name: sourceDataArtifact
          value: "$(tasks.reduce-snapshot.results.sourceDataArtifact)"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: dataDir
          value: $(params.dataDir)
        - name: dataPath
          value: $(tasks.collect-data.results.data)
      runAfter:
        - verify-enterprise-contract

    - name: rh-sign-python-wheels
      timeout: "2h00m0s"
      when:
        - input: $(params.signingSecretName)
          operator: notin
          values: [""]
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/rh-sign-python-wheels/rh-sign-python-wheels.yaml
      params:
        - name: secretName
          value: "$(params.signingSecretName)"
        - name: sourceDataArtifact
          value: "$(tasks.extract-py-artifacts.results.sourceDataArtifact)"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
      runAfter:
        - extract-py-artifacts

    - name: push-py-pulp
      when:
        - input: $(params.signingSecretName)
          operator: notin
          values: [""]
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/upload-py-pulp/upload-py-pulp.yaml
      params:
        - name: PULP_BASE_URL
          value: $(tasks.collect-task-params.results.extractedValues[0])
        - name: PULP_DOMAIN
          value: $(tasks.collect-task-params.results.extractedValues[1])
        - name: PULP_API_ROOT
          value: $(tasks.collect-task-params.results.extractedValues[2])
        - name: PULP_REPOSITORY
          value: $(tasks.collect-task-params.results.extractedValues[3])
        - name: SERVICE_ACCOUNT_SECRET_NAME
          value: $(tasks.collect-task-params.results.extractedValues[4])
        - name: sourceDataArtifact
          value: "$(tasks.rh-sign-python-wheels.results.sourceDataArtifact)"
        - name: dataDir
          value: $(params.dataDir)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(params.ociStorage)
      runAfter:
        - rh-sign-python-wheels
        - collect-task-params

    - name: mirror-source-to-lightwell-builds
      when:
        - input: $(tasks.collect-task-params.results.extractedValues[5])
          operator: in
          values: ["true"]
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taisceCuanGitUrl)
          - name: revision
            value: $(params.taisceCuanGitRevision)
          - name: pathInRepo
            value: tekton/tasks/push-source-to-lightwell-builds/0.1/push-source-to-lightwell-builds.yaml
      params:
        - name: sourceDataArtifact
          value: "$(tasks.push-py-pulp.results.sourceDataArtifact)"
        - name: dataDir
          value: /var/workdir/content
        - name: filesDir
          value: files
        - name: packageName
          value: $(tasks.collect-task-params.results.extractedValues[9])
        - name: packageVersion
          value: $(tasks.collect-task-params.results.extractedValues[10])
        - name: gitForgeUrl
          value: $(tasks.collect-task-params.results.extractedValues[11])
        - name: gitGroup
          value: $(tasks.collect-task-params.results.extractedValues[7])
        - name: committerName
          value: $(tasks.collect-task-params.results.extractedValues[12])
        - name: committerEmail
          value: $(tasks.collect-task-params.results.extractedValues[13])
        - name: allowOverwrite
          value: $(tasks.collect-task-params.results.extractedValues[6])
        - name: signingSecretName
          value: $(params.signingSecretName)
        - name: gitSecretName
          value: $(tasks.collect-task-params.results.extractedValues[8])
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(params.ociStorage)
      runAfter:
        - push-py-pulp
        - collect-task-params

  finally:
    - name: cleanup-internal-requests
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/cleanup-internal-requests/cleanup-internal-requests.yaml
      params:
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
