---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: calunga-push-npm-to-pulp
spec:
  description: >-
    Release Components in a Snapshot to a pulp-backed npm registry. Each image
    in a Component is expected to be an OCI artifact containing npm .tgz packages
    (and optional *.tl-compliance.json sidecars) under the artifact root.
    First cut: no Atlas upload and no package signing (signing deferred).
    Compliance on Pulp is labels-only (tl.compliance_level from OCI sidecars);
    PULP_FILE_REPOSITORY is intentionally not passed so adjacent compliance
    JSON file uploads stay disabled until a file repo is provisioned.
    After Pulp upload, upload-npm-closure publishes per-package compliance OCI
    and the npm-closure-index on calunga-npm-registry-main (Quay refs hardcoded
    in the task).
  params:
    - name: release
      type: string
      description:
        The namespaced name (namespace/name) of the Release custom resource initiating this pipeline execution
    - name: releasePlan
      type: string
      description: The namespaced name (namespace/name) of the releasePlan
    - name: releasePlanAdmission
      type: string
      description: The namespaced name (namespace/name) of the releasePlanAdmission
    - name: releaseServiceConfig
      type: string
      description: The namespaced name (namespace/name) of the releaseServiceConfig
    - name: snapshot
      type: string
      description: The namespaced name (namespace/name) of the snapshot
    - name: enterpriseContractPolicy
      type: string
      description: JSON representation of the EnterpriseContractPolicy
    - name: enterpriseContractExtraRuleData
      type: string
      description: |
        Extra rule data to be merged into the policy specified in params.enterpriseContractPolicy. Use syntax
        "key1=value1,key2=value2..."
      default: "pipeline_intention=release"
    - name: enterpriseContractTimeout
      type: string
      description: >
        Deprecated and ignored. The Conforma task no longer accepts a TIMEOUT
        param (ec validate uses --timeout=0 internally)
      default: "40m0s"
    - name: verify_ec_task_bundle
      type: string
      description: >
        Deprecated and ignored. verify-conforma is resolved from a pinned git
        revision of conforma/tekton-catalog (not a task bundle)
      default: ignored
    - name: verify_ec_task_git_revision
      type: string
      description: Previously used for the Conforma task git resolver, now deprecated and ignored
      default: ignored
    - name: taskGitUrl
      type: string
      description: >-
        The url to the git repo where the release-service-catalog tasks to be
        used are stored
      default: https://github.com/konflux-ci/release-service-catalog.git
    - name: taskGitRevision
      type: string
      description: >
        Immutable git revision (commit SHA preferred) in taskGitUrl used to
        resolve nested tasks. Must be supplied by the PipelineRun (typically the
        same revision used to resolve this pipeline); no mutable default
    - name: config
      description: Name of the ConfigMap with config options, e.g. ociStorage
      type: string
      default: release-pipeline-config
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created
      type: string
      default: "1d"
    - name: dataDir
      type: string
      description: Path used for working directories
      default: /var/workdir/content
  tasks:
    - name: config
      taskRef:
        params:
          - name: name
            value: get-config
          - name: bundle
            value: "quay.io/redhat-user-workloads/calunga-tenant/task-get-config@sha256:\
              abe408d7365a23a548268b994dc7d758660fc595ba6af0f455f000a4f3f535d7"
          - name: kind
            value: task
        resolver: bundles
      params:
        - name: configMapName
          value: $(params.config)

    - name: collect-data
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-data/collect-data.yaml
      params:
        - name: release
          value: $(params.release)
        - name: releasePlan
          value: $(params.releasePlan)
        - name: releasePlanAdmission
          value: $(params.releasePlanAdmission)
        - name: releaseServiceConfig
          value: $(params.releaseServiceConfig)
        - name: snapshot
          value: $(params.snapshot)
        - name: subdirectory
          value: $(context.pipelineRun.uid)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)

    - name: collect-task-params
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-task-params/collect-task-params.yaml
      runAfter:
        - collect-data
      params:
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: sourceDataArtifact
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
        - name: dataPath
          value: $(tasks.collect-data.results.data)
        - name: dataDir
          value: $(params.dataDir)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: keysToExtract
          # Intentionally omit .pulp.fileRepository: PoC compliance is Pulp
          # labels only; adjacent *.tl-compliance.json file uploads remain off
          # (upload-npm-pulp PULP_FILE_REPOSITORY default empty).
          value: |
            [
              {"resultIndex": 0, "key": ".pulp.baseUrl"},
              {"resultIndex": 1, "key": ".pulp.domain"},
              {"resultIndex": 2, "key": ".pulp.apiRoot", "default": "/api/"},
              {"resultIndex": 3, "key": ".pulp.repository"},
              {"resultIndex": 4, "key": ".pulp.secretName", "default": "rhtl-pulp-credentials-secret"}
            ]

    - name: collect-signing-params
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-signing-params/collect-signing-params.yaml
      runAfter:
        - collect-data

    - name: reduce-snapshot
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/reduce-snapshot/reduce-snapshot.yaml
      params:
        - name: SNAPSHOT
          value: $(params.dataDir)/$(tasks.collect-data.results.snapshotSpec)
        - name: SINGLE_COMPONENT
          value: $(tasks.collect-data.results.singleComponentMode)
        - name: SINGLE_COMPONENT_CUSTOM_RESOURCE
          value: snapshot/$(tasks.collect-data.results.snapshotName)
        - name: SINGLE_COMPONENT_CUSTOM_RESOURCE_NS
          value: $(tasks.collect-data.results.snapshotNamespace)
        - name: SNAPSHOT_PATH
          value: $(params.dataDir)/$(tasks.collect-data.results.snapshotSpec)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: sourceDataArtifact
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: dataDir
          value: $(params.dataDir)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
      runAfter:
        - collect-data

    - name: verify-conforma
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/conforma/tekton-catalog
          - name: revision
            value: "38002d483c4b405e78806ed2d8c9f4c01e91e429"
          - name: pathInRepo
            value: "tasks/verify-conforma-konflux-ta/0.1/verify-conforma-konflux-ta.yaml"
      params:
        - name: SNAPSHOT_FILENAME
          value: "$(tasks.collect-data.results.snapshotSpec)"
        - name: SSL_CERT_DIR
          value: /var/run/secrets/kubernetes.io/serviceaccount
        - name: POLICY_CONFIGURATION
          value: $(params.enterpriseContractPolicy)
        - name: STRICT
          value: "true"
        - name: IGNORE_REKOR
          value: "true"
        - name: EXTRA_RULE_DATA
          value: $(params.enterpriseContractExtraRuleData)
        - name: SOURCE_DATA_ARTIFACT
          value: "$(tasks.reduce-snapshot.results.sourceDataArtifact)"
        - name: CERTIFICATE_IDENTITY
          value: "$(tasks.collect-signing-params.results.tektonChainsIdentity)"
        - name: CERTIFICATE_OIDC_ISSUER
          value: "$(tasks.collect-signing-params.results.defaultOIDCIssuer)"
        - name: TUF_MIRROR
          value: "$(tasks.collect-signing-params.results.tufUrl)"
        - name: REKOR_HOST
          value: "$(tasks.collect-signing-params.results.rekorUrl)"
        - name: TRUSTED_ARTIFACTS_DEBUG
          value: "$(params.trustedArtifactsDebug)"
      runAfter:
        - reduce-snapshot
        - collect-signing-params

    - name: extract-npm-artifacts
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/extract-npm-artifacts/extract-npm-artifacts.yaml
      params:
        - name: SNAPSHOT_PATH
          value: $(tasks.collect-data.results.snapshotSpec)
        - name: sourceDataArtifact
          value: "$(tasks.reduce-snapshot.results.sourceDataArtifact)"
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: dataDir
          value: $(params.dataDir)
        - name: dataPath
          value: $(tasks.collect-data.results.data)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
      runAfter:
        - verify-conforma

    - name: push-npm-pulp
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/upload-npm-pulp/upload-npm-pulp.yaml
      params:
        - name: PULP_BASE_URL
          value: $(tasks.collect-task-params.results.extractedValues[0])
        - name: PULP_DOMAIN
          value: $(tasks.collect-task-params.results.extractedValues[1])
        - name: PULP_API_ROOT
          value: $(tasks.collect-task-params.results.extractedValues[2])
        - name: PULP_REPOSITORY
          value: $(tasks.collect-task-params.results.extractedValues[3])
        - name: SERVICE_ACCOUNT_SECRET_NAME
          value: $(tasks.collect-task-params.results.extractedValues[4])
        - name: sourceDataArtifact
          value: "$(tasks.extract-npm-artifacts.results.sourceDataArtifact)"
        - name: dataDir
          value: $(params.dataDir)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
      runAfter:
        - extract-npm-artifacts
        - collect-task-params

    - name: push-npm-closure
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/upload-npm-closure/upload-npm-closure.yaml
      params:
        - name: PULP_BASE_URL
          value: $(tasks.collect-task-params.results.extractedValues[0])
        - name: PULP_DOMAIN
          value: $(tasks.collect-task-params.results.extractedValues[1])
        - name: PULP_API_ROOT
          value: $(tasks.collect-task-params.results.extractedValues[2])
        - name: PULP_REPOSITORY
          value: $(tasks.collect-task-params.results.extractedValues[3])
        - name: SERVICE_ACCOUNT_SECRET_NAME
          value: $(tasks.collect-task-params.results.extractedValues[4])
        - name: sourceDataArtifact
          value: "$(tasks.push-npm-pulp.results.sourceDataArtifact)"
        - name: dataDir
          value: $(params.dataDir)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
      runAfter:
        - push-npm-pulp

    - name: create-advisory
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/create-advisory/create-advisory.yaml
      params:
        - name: releasePlanAdmissionPath
          value: "$(tasks.collect-data.results.releasePlanAdmission)"
        - name: snapshotPath
          value: "$(tasks.collect-data.results.snapshotSpec)"
        - name: dataPath
          value: "$(tasks.collect-data.results.data)"
        - name: resultsDirPath
          value: "$(tasks.collect-data.results.resultsDir)"
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: sourceDataArtifact
          value: "$(tasks.push-npm-closure.results.sourceDataArtifact)"
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: dataDir
          value: $(params.dataDir)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
      runAfter:
        - push-npm-closure

  finally:
    - name: cleanup-internal-requests
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/cleanup-internal-requests/cleanup-internal-requests.yaml
      params:
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
