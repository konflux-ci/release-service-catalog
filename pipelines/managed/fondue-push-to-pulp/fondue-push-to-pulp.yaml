---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: fondue-push-to-pulp
spec:
  description: >-
    Release Python wheels from a Snapshot's OCI artifacts to a Pulp-backed Python package index. Each Component
    image in the Snapshot is expected to contain Python wheels under the /releases directory. The pipeline collects
    the release data, verifies the Snapshot against the Enterprise Contract policy using Conforma, extracts the
    wheels from the component images, and uploads them to a Pulp repository. The Pulp connection settings (base URL,
    domain, API root, repository, and credentials secret) are read from the ReleasePlanAdmission data
  params:
    - name: release
      type: string
      description:
        The namespaced name (namespace/name) of the Release custom resource initiating this pipeline execution
    - name: releasePlan
      type: string
      description: The namespaced name (namespace/name) of the releasePlan
    - name: releasePlanAdmission
      type: string
      description: The namespaced name (namespace/name) of the releasePlanAdmission
    - name: releaseServiceConfig
      type: string
      description: The namespaced name (namespace/name) of the releaseServiceConfig
    - name: snapshot
      type: string
      description: The namespaced name (namespace/name) of the snapshot
    - name: enterpriseContractPolicy
      type: string
      description: JSON representation of the EnterpriseContractPolicy
    - name: enterpriseContractExtraRuleData
      type: string
      description: |
        Extra rule data to be merged into the policy specified in params.enterpriseContractPolicy. Use syntax
        "key1=value1,key2=value2..."
      default: "pipeline_intention=release"
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks to be used are stored
      default: https://github.com/konflux-ci/release-service-catalog.git
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
      default: production
    - name: signingSecretName
      type: string
      description: The name of the AWS KMS signing secret used to sign the Python wheels
      default: konflux-cosign-signing-stage
    - name: config
      type: string
      description: Name of the ConfigMap with config options, e.g. ociStorage
      default: release-pipeline-config
    - name: dataDir
      type: string
      description: Path used for working directories
      default: /var/workdir/content
  tasks:
    - name: verify-access-to-resources
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/verify-access-to-resources/verify-access-to-resources.yaml
      params:
        - name: release
          value: $(params.release)
        - name: releasePlan
          value: $(params.releasePlan)
        - name: releasePlanAdmission
          value: $(params.releasePlanAdmission)
        - name: releaseServiceConfig
          value: $(params.releaseServiceConfig)
        - name: snapshot
          value: $(params.snapshot)
        - name: requireInternalServices
          value: "false"

    - name: config
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: get-config
          - name: bundle
            value: quay.io/redhat-user-workloads/calunga-tenant/task-get-config@sha256:abe408d7365a23a548268b994dc7d758660fc595ba6af0f455f000a4f3f535d7
          - name: kind
            value: task
      params:
        - name: configMapName
          value: $(params.config)

    - name: collect-data
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-data/collect-data.yaml
      params:
        - name: release
          value: $(params.release)
        - name: releasePlan
          value: $(params.releasePlan)
        - name: releasePlanAdmission
          value: $(params.releasePlanAdmission)
        - name: releaseServiceConfig
          value: $(params.releaseServiceConfig)
        - name: snapshot
          value: $(params.snapshot)
        - name: subdirectory
          value: $(context.pipelineRun.uid)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: dataDir
          value: $(params.dataDir)

    - name: collect-task-params
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-task-params/collect-task-params.yaml
      runAfter:
        - collect-data
      params:
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: sourceDataArtifact
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
        - name: dataPath
          value: $(tasks.collect-data.results.data)
        - name: dataDir
          value: $(params.dataDir)
        - name: keysToExtract
          value: |
            [
              {"resultIndex": 0, "key": ".pulp.baseUrl"},
              {"resultIndex": 1, "key": ".pulp.domain"},
              {"resultIndex": 2, "key": ".pulp.apiRoot"},
              {"resultIndex": 3, "key": ".pulp.repository"},
              {"resultIndex": 4, "key": ".pulp.secretName"}
            ]

    - name: collect-signing-params
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-signing-params/collect-signing-params.yaml
      runAfter:
        - collect-data

    - name: collect-atlas-params
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-tpa-params/collect-tpa-params.yaml
      runAfter:
        - collect-data
      params:
        - name: dataPath
          value: $(tasks.collect-data.results.data)
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: sourceDataArtifact
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
        - name: dataDir
          value: $(params.dataDir)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)

    - name: reduce-snapshot
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/reduce-snapshot/reduce-snapshot.yaml
      params:
        - name: SNAPSHOT
          value: $(params.dataDir)/$(tasks.collect-data.results.snapshotSpec)
        - name: SINGLE_COMPONENT
          value: $(tasks.collect-data.results.singleComponentMode)
        - name: SINGLE_COMPONENT_CUSTOM_RESOURCE
          value: snapshot/$(tasks.collect-data.results.snapshotName)
        - name: SINGLE_COMPONENT_CUSTOM_RESOURCE_NS
          value: $(tasks.collect-data.results.snapshotNamespace)
        - name: SNAPSHOT_PATH
          value: $(params.dataDir)/$(tasks.collect-data.results.snapshotSpec)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: sourceDataArtifact
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: dataDir
          value: $(params.dataDir)
      runAfter:
        - collect-data

    - name: verify-conforma
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/conforma/tekton-catalog
          - name: revision
            value: "38002d483c4b405e78806ed2d8c9f4c01e91e429"
          - name: pathInRepo
            value: "tasks/verify-conforma-konflux-ta/0.1/verify-conforma-konflux-ta.yaml"
      params:
        - name: SNAPSHOT_FILENAME
          value: "$(tasks.collect-data.results.snapshotSpec)"
        - name: SSL_CERT_DIR
          value: /var/run/secrets/kubernetes.io/serviceaccount
        - name: POLICY_CONFIGURATION
          value: $(params.enterpriseContractPolicy)
        - name: STRICT
          value: "true"
        - name: IGNORE_REKOR
          value: "true"
        - name: EXTRA_RULE_DATA
          value: $(params.enterpriseContractExtraRuleData)
        - name: SOURCE_DATA_ARTIFACT
          value: "$(tasks.reduce-snapshot.results.sourceDataArtifact)"
        - name: CERTIFICATE_IDENTITY
          value: "$(tasks.collect-signing-params.results.tektonChainsIdentity)"
        - name: CERTIFICATE_OIDC_ISSUER
          value: "$(tasks.collect-signing-params.results.defaultOIDCIssuer)"
        - name: TUF_MIRROR
          value: "$(tasks.collect-signing-params.results.tufUrl)"
        - name: REKOR_HOST
          value: "$(tasks.collect-signing-params.results.rekorUrl)"
      runAfter:
        - reduce-snapshot
        - collect-signing-params

    - name: extract-py-artifacts
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/extract-py-artifacts/extract-py-artifacts.yaml
      params:
        - name: SNAPSHOT_PATH
          value: $(tasks.collect-data.results.snapshotSpec)
        - name: sourceDataArtifact
          value: "$(tasks.reduce-snapshot.results.sourceDataArtifact)"
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: dataDir
          value: $(params.dataDir)
        - name: dataPath
          value: $(tasks.collect-data.results.data)
      runAfter:
        - verify-conforma

    - name: rh-sign-python-wheels
      timeout: "2h00m0s"
      when:
        - input: $(params.signingSecretName)
          operator: notin
          values: [""]
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/rh-sign-python-wheels/rh-sign-python-wheels.yaml
      params:
        - name: secretName
          value: "$(params.signingSecretName)"
        - name: sourceDataArtifact
          value: "$(tasks.extract-py-artifacts.results.sourceDataArtifact)"
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: dataDir
          value: $(params.dataDir)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
      runAfter:
        - extract-py-artifacts

    - name: upload-sboms-to-atlas
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/extract-and-upload-python-wheel-sboms-to-atlas/extract-and-upload-python-wheel-sboms-to-atlas.yaml
      params:
        - name: atlasApiUrl
          value: "$(tasks.collect-atlas-params.results.atlasApiUrl)"
        - name: ssoTokenUrl
          value: "$(tasks.collect-atlas-params.results.ssoTokenUrl)"
        - name: atlasSecretName
          value: "$(tasks.collect-atlas-params.results.secretName)"
        - name: sourceDataArtifact
          value: "$(tasks.extract-py-artifacts.results.sourceDataArtifact)"
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: dataDir
          value: $(params.dataDir)
      runAfter:
        - extract-py-artifacts
        - collect-atlas-params

    - name: push-to-pulp
      when:
        - input: $(params.signingSecretName)
          operator: notin
          values: [""]
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/upload-py-pulp/upload-py-pulp.yaml
      params:
        - name: PULP_BASE_URL
          value: $(tasks.collect-task-params.results.extractedValues[0])
        - name: PULP_DOMAIN
          value: $(tasks.collect-task-params.results.extractedValues[1])
        - name: PULP_API_ROOT
          value: $(tasks.collect-task-params.results.extractedValues[2])
        - name: PULP_REPOSITORY
          value: $(tasks.collect-task-params.results.extractedValues[3])
        - name: SERVICE_ACCOUNT_SECRET_NAME
          value: $(tasks.collect-task-params.results.extractedValues[4])
        - name: sourceDataArtifact
          value: "$(tasks.rh-sign-python-wheels.results.sourceDataArtifact)"
        - name: dataDir
          value: $(params.dataDir)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
        - name: ociStorage
          value: $(tasks.config.results.ociStorage)
      runAfter:
        - rh-sign-python-wheels
        - collect-task-params

  finally:
    - name: cleanup-internal-requests
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/cleanup-internal-requests/cleanup-internal-requests.yaml
      params:
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
