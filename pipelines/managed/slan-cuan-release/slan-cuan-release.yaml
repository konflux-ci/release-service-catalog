---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: slan-cuan-release
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/displayName: "slan-cuan: Release Pipeline"
    tekton.dev/pipelines.minVersion: "0.50.0"
    tekton.dev/platforms: "linux/amd64"
    tekton.dev/tags: "release,maven,lightwell"
spec:
  description: |
    Release pipeline for Lightwell Java artifacts (slan-cuan).

    This pipeline orchestrates the complete release workflow for Java artifacts built by
    PNC (Project Newcastle). All per-release configuration (image reference, signing key,
    Trustify URLs, Pulp target) is derived from the Snapshot and ReleasePlanAdmission data
    via collect-data, and the signing requester identity is extracted from Release attribution
    via extract-requester-from-release, so no pipeline parameters need to be supplied at invocation time.
  params:
    # Release service standard params (passed by release-service controller)
    - name: release
      type: string
      description: The namespaced name (namespace/name) of the Release
    - name: releasePlan
      type: string
      description: The namespaced name (namespace/name) of the ReleasePlan
    - name: releasePlanAdmission
      type: string
      description: The namespaced name (namespace/name) of the ReleasePlanAdmission
    - name: releaseServiceConfig
      type: string
      description: The namespaced name (namespace/name) of the ReleaseServiceConfig
    - name: snapshot
      type: string
      description: The namespaced name (namespace/name) of the Snapshot
    - name: ociStorage
      type: string
      description: The OCI repository where Trusted Artifacts are stored
      default: "empty"
    - name: ociArtifactExpiresAfter
      type: string
      description: Expiration date for trusted artifacts created in the OCI repository
      default: "1d"
    - name: trustedArtifactsDebug
      type: string
      description: Flag to enable debug logging in trusted artifacts
      default: ""
    - name: orasOptions
      type: string
      description: oras options to pass to Trusted Artifacts calls
      default: ""
    - name: dataDir
      type: string
      description: The location where data will be stored
      default: "/var/workdir/release"
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: "trusted-ca"
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: "ca-bundle.crt"

    # Catalog git params — for release-service-catalog tasks (collect-data, collect-task-params)
    - name: catalogGitUrl
      type: string
      description: The url to the git repo where release-service-catalog tasks are stored
      default: https://github.com/konflux-lightwell/release-service-catalog.git
    - name: catalogGitRevision
      type: string
      description: The revision in the catalogGitUrl repo to be used
      default: development

    # Pipeline infrastructure — for slan-cuan domain-specific tasks
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the slan-cuan tasks are stored
      default: https://github.com/konflux-lightwell/slan-cuan.git

    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
      default: main

    # Extract parameters
    - name: registry-auth-secret
      description: |
        Kubernetes Secret name for registry authentication (.dockerconfigjson format).
        Points to a Docker/Podman auth config for accessing private registries
      type: string
      default: "registry-auth"
    - name: force-extract
      description: |
        Overwrite existing output directory if it exists.
        Without this flag, the extract task refuses to overwrite existing directories
      type: string
      default: "false"
    - name: discover-attachments
      description: Unique artifact-types to discover attachments from the oras artifact.
      type: string
      default: "application/vnd.redhat.gav-index-build+json"

    # Sign parameters
    - name: radas-umb-host
      description: |
        RADAS UMB host
      type: string
      default: "umb.api.redhat.com"
    - name: zip-root-path
      description: |
        Root of the Maven repository tree inside the ZIP archive submitted to RADAS.
        The ZIP file structure is <ZIP_ROOT_PATH>/<maven-layout>
      type: string
      default: "repository"
    - name: product-key
      description: |
        Product key for metadata tagging.
        Identifies the product in RADAS records and signing logs
      type: string
      default: "slan-cuan"
    - name: ignore-patterns
      description: |
        Comma-separated regex patterns to exclude files from signing.
        Example: ".*-sources\\.jar$,.*-javadoc\\.jar$" excludes source and javadoc JARs.
        The default excludes checksum and signature files (.md5/.sha1/.sha256/.asc/.sigstore.json),
        which do not need signing; excluded files are still published, only skipped during signing.
      type: string
      default: ".*\\.md5$,.*\\.sha1$,.*\\.sha256$,.*\\.asc$,.*\\.sigstore\\.json$"

    # Publish parameters
    - name: publish-insecure
      description: |
        Disable TLS verification for Pulp API calls.
        Set to "true" to skip certificate validation (not recommended for production)
      type: string
      default: "false"
    - name: publish-ca-cert-secret
      description: |
        Kubernetes Secret name for custom CA certificate (optional).
        The secret must have a `ca.crt` key containing the PEM-encoded CA certificate.
        Leave empty to use system CA bundle
      type: string
      default: ""

    # Conforma parameters
    - name: enterpriseContractPolicy
      type: string
      description: JSON representation of the EnterpriseContractPolicy
    - name: enterpriseContractExtraRuleData
      type: string
      description: |
        Extra rule data to be merged into the policy specified in params.enterpriseContractPolicy. Use syntax
        "key1=value1,key2=value2..."
      default: "pipeline_intention=release"
    - name: enterpriseContractTimeout
      type: string
      description: Timeout setting for `ec validate`
      default: 40m0s

  # TODO: Re-enable these?
  # results:
    # - name: manifest-digest
    #   description: OCI manifest digest of the extracted image.
    #   value: $(tasks.extract.results.MANIFEST_DIGEST)
    # - name: deliverable-dir
    #   description: Name of the deliverable directory inside the artifact.
    #   value: $(tasks.extract.results.DELIVERABLE_DIR)
    # - name: artifacts-uploaded
    #   description: Number of artifacts uploaded to Pulp.
    #   value: $(tasks.publish.results.ARTIFACTS_UPLOADED)
    # - name: artifacts-skipped
    #   description: Number of artifacts skipped during upload.
    #   value: $(tasks.publish.results.ARTIFACTS_SKIPPED)
    # - name: published-artifact-outputs
    #   description: JSON object for Tekton Chains SLSA provenance.
    #   type: object
    #   value: $(tasks.publish.results.PUBLISHED_ARTIFACT_OUTPUTS)

  tasks:
    - name: collect-data
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-data/collect-data.yaml
      params:
        - name: release
          value: $(params.release)
        - name: releasePlan
          value: $(params.releasePlan)
        - name: releasePlanAdmission
          value: $(params.releasePlanAdmission)
        - name: releaseServiceConfig
          value: $(params.releaseServiceConfig)
        - name: snapshot
          value: $(params.snapshot)
        - name: subdirectory
          value: $(context.pipelineRun.uid)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: dataDir
          value: $(params.dataDir)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)

    - name: collect-task-params
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-task-params/collect-task-params.yaml
      runAfter:
        - collect-data
      params:
        - name: dataPath
          value: $(tasks.collect-data.results.data)
        - name: dataDir
          value: $(params.dataDir)
        - name: keysToExtract
          value: |
            [
              {"resultIndex": 0, "key": ".pulp.domain"},
              {"resultIndex": 1, "key": ".pulp.repository"},
              {"resultIndex": 2, "key": ".radas.signingKey"},
              {"resultIndex": 3, "key": ".trustify.apiUrl"},
              {"resultIndex": 4, "key": ".trustify.ssoTokenUrl"},
              {"resultIndex": 5, "key": ".pulp.pulpDomain"},
              {"resultIndex": 6, "key": ".pulp.secretName"},
              {"resultIndex": 7, "key": ".pulp.osvRepository"},
              {"resultIndex": 8, "key": ".osidb.apiUrl"},
              {"resultIndex": 9, "key": ".osidb.kerberosPrincipal"},
              {"resultIndex": 10, "key": ".osidb.kerberosKeytabPath"},
              {"resultIndex": 11, "key": ".pulp.customHeaders", "default": ""}
            ]
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: $(tasks.collect-data.results.sourceDataArtifact)
        - name: taskGitUrl
          value: $(params.catalogGitUrl)
        - name: taskGitRevision
          value: $(params.catalogGitRevision)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)

    - name: collect-snapshot-params
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-task-params/collect-task-params.yaml
      runAfter:
        - collect-data
      params:
        - name: dataPath
          value: $(tasks.collect-data.results.snapshotSpec)
        - name: dataDir
          value: $(params.dataDir)
        - name: keysToExtract
          value: |
            [
              {"resultIndex": 0, "key": ".components[0].containerImage"}
            ]
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: $(tasks.collect-data.results.sourceDataArtifact)
        - name: taskGitUrl
          value: $(params.catalogGitUrl)
        - name: taskGitRevision
          value: $(params.catalogGitRevision)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)

    - name: extract-requester-from-release
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.catalogGitUrl)
          - name: revision
            value: $(params.catalogGitRevision)
          - name: pathInRepo
            value: hub/kubernetes-actions/kubernetes-actions.yaml
      params:
        - name: image
          value: "quay.io/hacbs-release/cloud-builders-kubectl@sha256:8ab94be8b2b4f3d117f02d868b39540fddd225447abf4014f7ba4765cb39f753"
        - name: script
          value: |
            set -x

            NAMESPACE=$(echo $(params.release) | cut -d '/' -f 1)
            NAME=$(echo $(params.release) | cut -d '/' -f 2)

            AUTHOR=$(kubectl get release ${NAME} -n ${NAMESPACE} \
            -o=jsonpath='{.status.attribution.author}' | tee $(results.output-result.path))

            if [[ ${AUTHOR} == "" ]] ; then exit 1 ; fi
      runAfter:
        - collect-data

    - name: extract
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/konflux-lightwell/slan-cuan.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tekton/tasks/slan-cuan-extract.yaml
      runAfter:
        - collect-snapshot-params
      params:
        - name: IMAGE
          value: $(tasks.collect-snapshot-params.results.extractedValues[0])
        - name: REGISTRY_AUTH_SECRET
          value: $(params.registry-auth-secret)
        - name: FORCE
          value: $(params.force-extract)
        - name: DISCOVER_ATTACHMENTS
          value: $(params.discover-attachments)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: catalogGitUrl
          value: $(params.catalogGitUrl)
        - name: catalogGitRevision
          value: $(params.catalogGitRevision)

    - name: verify-conforma
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/enterprise-contract/ec-cli
          - name: revision
            value: cdfd9188f9352d7269ae1fe8c273a9e67f60ab8a
          - name: pathInRepo
            value: "tasks/verify-conforma-konflux-ta/0.1/verify-conforma-konflux-ta.yaml"
      params:
        - name: SNAPSHOT_FILENAME
          value: "$(tasks.collect-data.results.snapshotSpec)"
        - name: SSL_CERT_DIR
          value: /var/run/secrets/kubernetes.io/serviceaccount
        - name: POLICY_CONFIGURATION
          value: $(params.enterpriseContractPolicy)
        - name: STRICT
          value: "true"
        - name: IGNORE_REKOR
          value: "true"
        - name: EXTRA_RULE_DATA
          value: $(params.enterpriseContractExtraRuleData)
        - name: TIMEOUT
          value: $(params.enterpriseContractTimeout)
        - name: SOURCE_DATA_ARTIFACT
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
      runAfter:
        - collect-data

    - name: sign
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/konflux-lightwell/slan-cuan.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tekton/tasks/slan-cuan-sign.yaml
      runAfter:
        - extract
        - collect-task-params
        - verify-conforma
        - extract-requester-from-release
      params:
        - name: REGISTRY_AUTH_SECRET
          value: $(params.registry-auth-secret)
        - name: SIGN_REPO_URL
          value: $(tasks.collect-snapshot-params.results.extractedValues[0])
        - name: SIGNING_KEY
          value: $(tasks.collect-task-params.results.extractedValues[2])
        - name: DIRECT_SIGN
          value: "true"
        - name: DIRECT_SIGN_VERBOSE
          value: "true"
        - name: RADAS_UMB_HOST
          value: $(params.radas-umb-host)
        - name: REQUESTER_ID
          value: $(tasks.extract-requester-from-release.results.output-result)
        - name: ZIP_ROOT_PATH
          value: $(params.zip-root-path)
        - name: PRODUCT_KEY
          value: $(params.product-key)
        - name: IGNORE_PATTERNS
          value: $(params.ignore-patterns)
        - name: sourceDataArtifact
          value: $(tasks.extract.results.sourceDataArtifact)
        - name: signingDataArtifact
          value: $(tasks.extract.results.signingDataArtifact)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: catalogGitUrl
          value: $(params.catalogGitUrl)
        - name: catalogGitRevision
          value: $(params.catalogGitRevision)

    - name: generate-security-metadata
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/konflux-lightwell/slan-cuan.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tekton/tasks/slan-cuan-generate-security-metadata.yaml
      runAfter:
        - extract
      params:
        - name: INDEX_BASEDIR
          value: "$(tasks.extract.results.ATTACHMENT_DIR)"
        - name: OSIDB_API_URL
          value: $(tasks.collect-task-params.results.extractedValues[8])
        - name: OSIDB_KERBEROS_PRINCIPAL
          value: $(tasks.collect-task-params.results.extractedValues[9])
        - name: OSIDB_KERBEROS_KEYTAB_PATH
          value: $(tasks.collect-task-params.results.extractedValues[10])
        - name: sourceDataArtifact
          value: $(tasks.extract.results.sourceDataArtifact)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: catalogGitUrl
          value: $(params.catalogGitUrl)
        - name: catalogGitRevision
          value: $(params.catalogGitRevision)
    - name: publish
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: https://github.com/konflux-lightwell/slan-cuan.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tekton/tasks/slan-cuan-publish.yaml
      runAfter:
        - sign
        - collect-task-params
        - generate-security-metadata
      params:
        - name: PULP_URL
          value: $(tasks.collect-task-params.results.extractedValues[0])
        - name: PULP_REPOSITORY
          value: $(tasks.collect-task-params.results.extractedValues[1])
        - name: PULP_DOMAIN
          value: $(tasks.collect-task-params.results.extractedValues[5])
        - name: PULP_CERT_SECRET
          value: $(tasks.collect-task-params.results.extractedValues[6])
        - name: PULP_USERNAME
          value: $(tasks.collect-task-params.results.extractedValues[6])
        - name: PULP_PASSWORD
          value: $(tasks.collect-task-params.results.extractedValues[6])
        - name: INSECURE
          value: $(params.publish-insecure)
        - name: CA_CERT_SECRET
          value: $(params.publish-ca-cert-secret)
        - name: PULP_FILE_REPOSITORY
          value: $(tasks.collect-task-params.results.extractedValues[7])
        - name: PULP_CUSTOM_HEADERS
          value: $(tasks.collect-task-params.results.extractedValues[11])
        - name: sourceDataArtifact
          value: $(tasks.sign.results.sourceDataArtifact)
        - name: securityMetadataArtifact
          value: $(tasks.generate-security-metadata.results.securityMetadataArtifact)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: catalogGitUrl
          value: $(params.catalogGitUrl)
        - name: catalogGitRevision
          value: $(params.catalogGitRevision)
