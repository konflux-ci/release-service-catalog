---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sign-and-push-to-internal-oci
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Internal pipeline wrapper for the sign-and-push-to-internal-oci task.
    Dispatched via InternalRequest from the managed pipeline.
  params:
    - name: snapshot_json
      type: string
      description: String containing a JSON representation of the snapshot spec
    - name: concurrentLimit
      type: string
      description: The maximum number of images to be pulled at once
      default: "3"
    - name: quayURL
      type: string
      description: Quay URL of the repo where unsigned content is shared between tasks
      default: "quay.io/konflux-artifacts"
    - name: destQuayURL
      type: string
      description: Destination Quay URL where signed artifacts will be pushed
      default: ""
    - name: quaySecret
      type: string
      description: Secret to interact with the source Quay repository
      default: "quay-credentials"
    - name: destQuaySecret
      type: string
      description: Secret to interact with the destination Quay repository
      default: "quay-credentials"
    - name: origin
      type: string
      description: Origin tenant namespace that triggered the release
    - name: macSigningScript
      type: string
      description: Path to the macOS signing script on the remote host
      default: ""
    - name: windowsSigningScript
      type: string
      description: Path to the Windows signing script on the remote host
      default: ""
    - name: taskGitUrl
      description: The url to the git repo where the release-service-catalog tasks to be used are stored
      default: "https://github.com/konflux-ci/release-service-catalog.git"
      type: string
    - name: taskGitRevision
      description: The revision in the taskGitUrl repo to be used
      type: string
  results:
    - name: result
      value: "$(tasks.sign-and-push-to-internal-oci-task.results.result)"
  tasks:
    - name: sign-and-push-to-internal-oci-task
      retries: 3
      timeout: "2h0m0s"
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/sign-and-push-to-internal-oci-task/sign-and-push-to-internal-oci-task.yaml
      params:
        - name: snapshot_json
          value: $(params.snapshot_json)
        - name: concurrentLimit
          value: $(params.concurrentLimit)
        - name: quayURL
          value: $(params.quayURL)
        - name: destQuayURL
          value: $(params.destQuayURL)
        - name: quaySecret
          value: $(params.quaySecret)
        - name: destQuaySecret
          value: $(params.destQuaySecret)
        - name: origin
          value: $(params.origin)
        - name: macSigningScript
          value: $(params.macSigningScript)
        - name: windowsSigningScript
          value: $(params.windowsSigningScript)
