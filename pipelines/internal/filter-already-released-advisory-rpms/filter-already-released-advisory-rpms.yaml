---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: filter-already-released-advisory-rpms
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    This pipeline filters out RPMs from a snapshot that have already been published in advisories.
    It returns lists of unreleased RPMs and RPMs found in advisories for digest validation.
  params:
    - name: transformedSnapshot
      type: string
      description: Base64 string of gzipped JSON array of RPM entries with purls
    - name: origin
      type: string
      description: The origin workspace where the release CR comes from
    - name: advisory_secret_name
      type: string
      description: The name of the secret that contains the advisory GitLab metadata
    - name: internalRequestPipelineRunName
      type: string
      description: Name of the PipelineRun that requested this pipeline
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks to be used are stored
      default: https://github.com/konflux-ci/release-service-catalog.git
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
  tasks:
    - name: filter-already-released-advisory-rpms-task
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/filter-already-released-advisory-rpms-task/filter-already-released-advisory-rpms-task.yaml
      params:
        - name: transformedSnapshot
          value: $(params.transformedSnapshot)
        - name: origin
          value: $(params.origin)
        - name: advisory_secret_name
          value: $(params.advisory_secret_name)
        - name: internalRequestPipelineRunName
          value: $(params.internalRequestPipelineRunName)
  results:
    - name: result
      value: $(tasks.filter-already-released-advisory-rpms-task.results.result)
    - name: unreleased_rpms
      value: $(tasks.filter-already-released-advisory-rpms-task.results.unreleased_rpms)
    - name: in_advisory_rpms
      value: $(tasks.filter-already-released-advisory-rpms-task.results.in_advisory_rpms)
    - name: advisory_url
      value: $(tasks.filter-already-released-advisory-rpms-task.results.advisory_url)
    - name: advisory_internal_url
      value: $(tasks.filter-already-released-advisory-rpms-task.results.advisory_internal_url)
    - name: internalRequestPipelineRunName
      value: $(tasks.filter-already-released-advisory-rpms-task.results.internalRequestPipelineRunName)
    - name: internalRequestTaskRunName
      value: $(tasks.filter-already-released-advisory-rpms-task.results.internalRequestTaskRunName)
