apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: update-package-collection-pipeline
  labels:
    app.kubernetes.io/component: release
    app.kubernetes.io/version: "2.0.0"
spec:
  description: |
    Pipeline to update package collections using the update-package-collection-task.
    Supports updating a single package per execution for a given product and environment.

  params:
    - name: repo
      type: string
      description: Git repository URL for package-collection-utils
      default: "https://gitlab.cee.redhat.com/package-collection/package-collection-utils.git"

    - name: branch
      type: string
      description: Git branch to checkout
      default: "main"

    - name: action
      type: string
      description: Action to perform: add-builds or delete-builds
      default: "add-builds"

    - name: env
      type: string
      description: Target environment (dev, stage, prod)
      default: "prod"

    - name: product
      type: string
      description: Product name
      default: "example-product"

    - name: collection-name
      type: string
      description: Name of the package collection to update
      default: "example-collection"

    - name: package_name
      type: string
      description: Name of the package to add or remove
      default: "libfoo"

    - name: nvr
      type: string
      description: NVR (Name-Version-Release) of the package
      default: "libfoo-1.0.0-1.el9"

    - name: download_url
      type: string
      description: URL where the package can be downloaded
      default: "https://example.com/libfoo.rpm"

    - name: internalRequestPipelineRunName
      type: string
      description: Internal pipeline run name for traceability
      default: "update-pkg-col-run-001"

  tasks:
    - name: update-package-collection
      taskRef:
        name: update-package-collection-task
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/update-package-collection/update-package-collection-task.yaml
      params:
        - name: repo
          value: $(params.repo)
        - name: branch
          value: $(params.branch)
        - name: action
          value: $(params.action)
        - name: env
          value: $(params.env)
        - name: product
          value: $(params.product)
        - name: collection-name
          value: $(params["collection-name"])
        - name: package_name
          value: $(params.package_name)
        - name: nvr
          value: $(params.nvr)
        - name: download_url
          value: $(params.download_url)
        - name: internalRequestPipelineRunName
          value: $(context.pipelineRun.name)

  results:
    - name: result
      value: $(tasks.update-package-collection.results.result)
    - name: internalRequestPipelineRunName
      value: $(tasks.update-package-collection.results.internalRequestPipelineRunName)
    - name: internalRequestTaskRunName
      value: $(tasks.update-package-collection.results.internalRequestTaskRunName)
