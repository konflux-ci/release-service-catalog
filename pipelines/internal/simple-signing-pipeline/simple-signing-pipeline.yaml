---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: simple-signing-pipeline
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton pipeline for simple signing. It is meant to be used by the rh-sign-image task, not as a standalone managed
    pipeline.
    Signing config (Pyxis URL, UMB settings, secrets, signer type, UMB topics) is read from the signing ConfigMap by
    the managed task and passed as pipeline parameters.
  params:
    - name: manifest_digests
      description: Space separated manifest digest for the signed content, usually in the format sha256:xxx
      type: string
    - name: references
      description: >-
        Space separated docker reference for the signed content,
        e.g. registry.redhat.io/redhat/community-operator-index:v4.9
      type: string
    - name: requester
      description: Name of the user that requested the signing, for auditing purposes
      type: string
    - name: taskGitUrl
      description: The url to the git repo where the release-service-catalog tasks to be used are stored
      default: https://github.com/konflux-ci/release-service-catalog.git
      type: string
    - name: taskGitRevision
      description: The revision in the taskGitUrl repo to be used
      type: string
    - name: signing_key_names
      description: Space separated list of signing key names to use
      type: string
    - name: umb_listen_topic
      description: UMB topic to listen to for signing responses (chosen by caller based on SIGNER_TYPE)
      type: string
    - name: umb_publish_topic
      description: UMB topic to publish to for signing requests (chosen by caller based on SIGNER_TYPE)
      type: string
    - name: umb_url
      description: UMB host from signing configMap
      type: string
    - name: umb_client_name
      description: UMB client name from signing configMap
      type: string
    - name: umb_ssl_cert_secret_name
      description: Kubernetes secret name for UMB SSL (keys cert and key)
      type: string
    - name: pyxis_url
      description: Pyxis instance URL from signing configMap
      type: string
    - name: pyxis_ssl_cert_secret_name
      description: Kubernetes secret name for Pyxis SSL (keys cert and key)
      type: string
    - name: signer_type
      description: single or batch from signing configMap SIGNER_TYPE
      type: string
  tasks:
    - name: request-and-upload-signature
      retries: 2
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/request-and-upload-signature/request-and-upload-signature.yaml
      params:
        - name: manifest_digests
          value: $(params.manifest_digests)
        - name: references
          value: $(params.references)
        - name: requester
          value: $(params.requester)
        - name: sig_key_names
          value: $(params.signing_key_names)
        - name: umb_ssl_cert_secret_name
          value: $(params.umb_ssl_cert_secret_name)
        - name: umb_client_name
          value: $(params.umb_client_name)
        - name: umb_listen_topic
          value: $(params.umb_listen_topic)
        - name: umb_publish_topic
          value: $(params.umb_publish_topic)
        - name: umb_url
          value: $(params.umb_url)
        - name: pyxis_ssl_cert_secret_name
          value: $(params.pyxis_ssl_cert_secret_name)
        - name: pyxis_url
          value: $(params.pyxis_url)
        - name: signer_type
          value: $(params.signer_type)
