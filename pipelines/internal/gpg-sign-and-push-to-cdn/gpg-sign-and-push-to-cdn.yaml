---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gpg-sign-and-push-to-cdn
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton Pipeline to publish GPG-signed artifacts to CDN and Content Gateway
  params:
    - name: snapshot_json
      type: string
      description: String containing a JSON representation of the snapshot spec
    - name: signed_artifacts_json
      type: string
      description: >-
        JSON mapping of component name to list of signed Trusted Artifact URIs
    - name: exodusGwSecret
      type: string
      description: Env specific secret containing the Exodus Gateway configs
    - name: exodusGwEnv
      type: string
      description: Environment to use in the Exodus Gateway. Options are [live, pre]
    - name: cgwHostname
      type: string
      description: The hostname of the content-gateway to publish the metadata to
      default: https://developers.redhat.com/content-gateway/rest/admin
    - name: cgwSecret
      type: string
      description: Env specific secret containing the content gateway credentials
    - name: taskGitUrl
      description: The url to the git repo where the release-service-catalog tasks to be used are stored
      default: https://github.com/konflux-ci/release-service-catalog.git
      type: string
    - name: taskGitRevision
      description: The revision in the taskGitUrl repo to be used
      type: string
    - name: trustedArtifactsDockerConfigSecret
      type: string
      description: The name of the secret that contains dockerconfig json for trusted artifact operations
      default: quay-token-konflux-release-trusted-artifacts-secret
  tasks:
    - name: gpg-sign-and-push-to-cdn-task
      timeout: "2h00m0s"
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/gpg-sign-and-push-to-cdn-task/gpg-sign-and-push-to-cdn-task.yaml
      params:
        - name: snapshot_json
          value: $(params.snapshot_json)
        - name: signed_artifacts_json
          value: $(params.signed_artifacts_json)
        - name: exodusGwSecret
          value: $(params.exodusGwSecret)
        - name: exodusGwEnv
          value: $(params.exodusGwEnv)
        - name: cgwHostname
          value: $(params.cgwHostname)
        - name: cgwSecret
          value: $(params.cgwSecret)
        - name: trustedArtifactsDockerConfigSecret
          value: $(params.trustedArtifactsDockerConfigSecret)
  results:
    - name: result
      value: $(tasks.gpg-sign-and-push-to-cdn-task.results.result)
