---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: get-iib-builds-load
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Internal pipeline to get the number of in-progress IIB builds for each given from_index.
    Used by the fbc-release e2e test to pick the least-loaded OCP versions.
  params:
    - name: fromIndexes
      description: JSON array of from_index pullspecs to get the in-progress build count for
      type: string
    - name: user
      description: IIB user whose in-progress builds are counted
      type: string
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
  results:
    - name: result
      value: $(tasks.get-iib-builds-load.results.result)
    - name: loads
      value: $(tasks.get-iib-builds-load.results.loads)
  tasks:
    - name: get-iib-builds-load
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/get-iib-builds-load/get-iib-builds-load.yaml
      params:
        - name: fromIndexes
          value: $(params.fromIndexes)
        - name: user
          value: $(params.user)
