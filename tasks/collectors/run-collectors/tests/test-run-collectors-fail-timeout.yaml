---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-run-collectors-fail-timeout
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Run the collectors task with a collector in only the ReleasePlan that takes longer than its timeout.
    The task should fail
  workspaces:
    - name: tests-workspace
  tasks:
    - name: setup
      taskSpec:
        steps:
          - name: create-crs
            image: quay.io/konflux-ci/release-service-utils@sha256:be4fe4e3c84e156a3d14c4d59b641b87928d795f767cf46f73ab1f338440b177
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir "$(workspaces.data.path)"/results

              cat > "$(workspaces.data.path)"/test_release_plan.json << EOF
              {
                "apiVersion": "appstudio.redhat.com/v1alpha1",
                "kind": "ReleasePlan",
                "metadata": {
                  "name": "test-rp",
                  "namespace": "default"
                },
                "spec": {
                  "application": "app",
                  "collectors": {
                    "items": [
                      {
                        "name": "test-collector",
                        "type": "timeout-collector",
                        "timeout": 1,
                        "params": [
                          {
                            "name": "test-arg",
                            "value": "test-value"
                          }
                        ]
                      }
                    ],
                    "target": "managed"
                  }
                }
              }
              EOF

              cat > "$(workspaces.data.path)"/previous_release.json << EOF
              {}
              EOF
      workspaces:
        - name: data
          workspace: tests-workspace
    - name: run-task
      taskRef:
        name: run-collectors
      params:
        - name: collectorsPath
          value: test_release_plan.json
        - name: collectorsRepository
          value: test_repo
        - name: collectorsResourceType
          value: releaseplan
        - name: resultsDir
          value: results
        - name: releasePath
          value: release.json
        - name: previousReleasePath
          value: previous_release.json
      runAfter:
        - setup
      workspaces:
        - name: data
          workspace: tests-workspace
