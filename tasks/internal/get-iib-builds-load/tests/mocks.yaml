---
# Declarative mocks for Tekton tests of this task (Python entrypoint). Rendered
# by .github/scripts/render_python_task_mocks_from_yaml.py when
# test_tekton_tasks.sh runs.
#
# Routes match the query string too, so they also check the user is passed.
version: 1
services:
  - type: http_json
    bind: 127.0.0.1
    routes:
      - path_contains: >-
          /builds?user=iib-bot%40REDHAT.COM&from_index=registry-proxy.engineering.redhat.com%2Frh-osbs%2Fiib-preview-rhtap%3Av4.18&state=in_progress
        body: '{"items": [], "meta": {"total": 3}}'
      - path_contains: >-
          /builds?user=iib-bot%40REDHAT.COM&from_index=registry-proxy.engineering.redhat.com%2Frh-osbs%2Fiib-preview-rhtap%3Av4.19&state=in_progress
        body: '{"items": [], "meta": {"total": 0}}'
    rewrite_secret_mount:
      source: /mnt/iib-services-config
      env_var: IIB_SERVICES_CONFIG_MOUNT
      url_file: url
