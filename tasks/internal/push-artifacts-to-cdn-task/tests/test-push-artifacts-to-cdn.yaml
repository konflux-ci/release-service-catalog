---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-push-artifacts-to-cdn
spec:
  description: |
    Happy-path test for the push-artifacts-to-cdn-task Python entrypoint.
    Logic correctness is covered by unit tests in release-service-utils;
    this test verifies that the task wires up and succeeds end-to-end.
  tasks:
    - name: run-task
      taskRef:
        name: push-artifacts-to-cdn-task
      params:
        - name: snapshot_json
          value: >-
            {
              "application": "test-app",
              "components": [
                {
                  "containerImage": "quay.io/test/image@sha256:abc123",
                  "name": "testproduct",
                  "files": [
                    {
                      "source": "/releases/testproduct-linux-amd64.tar.gz",
                      "os": "linux",
                      "arch": "amd64"
                    }
                  ]
                }
              ]
            }
        - name: exodusGwSecret
          value: "pulp-task-exodus-secret"
        - name: exodusGwEnv
          value: "pre"
        - name: pulpSecret
          value: "pulp-task-pulp-secret"
        - name: udcacheSecret
          value: "pulp-task-udc-secret"
        - name: cgwHostname
          value: "https://content-gateway.com"
        - name: cgwSecret
          value: "pulp-task-cgw-secret"
        - name: author
          value: testuser
        - name: signingKeyName
          value: testkey
    - name: check-result
      runAfter:
        - run-task
      params:
        - name: result
          value: $(tasks.run-task.results.result)
      taskSpec:
        params:
          - name: result
            type: string
        steps:
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:6979552f11f042b8730abcb1be4ec6cfb0553a069cc352643f88d8996041abf8
            script: |
              #!/usr/bin/env bash
              set -ex

              if [[ "$(params.result)" != "Success" ]]; then
                echo "Error: result expected 'Success' but got: $(params.result)"
                exit 1
              fi
