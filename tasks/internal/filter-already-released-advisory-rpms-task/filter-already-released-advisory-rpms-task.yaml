---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: filter-already-released-advisory-rpms-task
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |
    Filters out RPMs from a snapshot if they are already published in an advisory
    stored in the GitLab advisory repo. Returns lists of unreleased RPMs and
    RPMs found in advisories (for digest validation by the calling task).
  params:
    - name: transformedSnapshot
      type: string
      description: Base64 string of gzipped JSON array of RPM entries with purls
    - name: origin
      description: The origin workspace for the release CR
      type: string
    - name: advisory_secret_name
      description: Name of the secret containing advisory GitLab metadata
      type: string
    - name: internalRequestPipelineRunName
      description: Name of the PipelineRun that requested this task
      type: string
    - name: ociStorage
      description: The OCI repository to store results artifact
      type: string
    - name: trusted_artifacts_dockerconfig_json_secret_name
      type: string
      description: The name of the secret that contains the dockerconfig json for trusted artifact operations
      default: quay-token-konflux-release-trusted-artifacts-secret
    - name: orasOptions
      type: string
      description: oras options to pass to oras calls
      default: ""
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: result
      description: Success or error message
    - name: internalRequestPipelineRunName
      description: The name of the InternalRequest PipelineRun
    - name: internalRequestTaskRunName
      description: The name of the InternalRequest TaskRun
    - name: filter_results_artifact
      description: OCI artifact reference containing filter results (unreleased_rpms, in_advisory_rpms JSON files)
    - name: advisory_url
      description: URL of the latest matching advisory when all components are already released
    - name: advisory_internal_url
      description: Internal URL of the latest matching advisory when all components are already released
  volumes:
    - name: advisory-secret
      secret:
        secretName: $(params.advisory_secret_name)
        defaultMode: 0444
    - name: trusted-artifacts-dockerconfig-secret
      secret:
        optional: true
        secretName: $(params.trusted_artifacts_dockerconfig_json_secret_name)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    securityContext:
      runAsUser: 1001
  steps:
    - name: filter-rpms
      image: quay.io/lgallovi-test/release-service-utils@sha256:8de8a4cd4113d32619301352ed0ee4835a293fd47f2b9f6d973178b89ed2a65c
      computeResources:
        limits:
          memory: 768Mi
          cpu: '1'
        requests:
          memory: 768Mi
          cpu: '1'
      volumeMounts:
        - name: advisory-secret
          mountPath: /mnt/advisory_secret
        - name: trusted-artifacts-dockerconfig-secret
          mountPath: /mnt/trusted_artifacts_dockerconfig
      env:
        - name: TRANSFORMED_SNAPSHOT
          value: "$(params.transformedSnapshot)"
        - name: ORIGIN
          value: "$(params.origin)"
        - name: OCI_STORAGE
          value: "$(params.ociStorage)"
        - name: INTERNAL_REQUEST_PIPELINE_RUN_NAME
          value: "$(params.internalRequestPipelineRunName)"
        - name: TASK_RUN_NAME
          value: "$(context.taskRun.name)"
        - name: ORAS_OPTIONS
          value: "$(params.orasOptions)"
        - name: RESULT_RESULT
          value: $(results.result.path)
        - name: RESULT_INTERNAL_REQUEST_PIPELINE_RUN_NAME
          value: $(results.internalRequestPipelineRunName.path)
        - name: RESULT_INTERNAL_REQUEST_TASK_RUN_NAME
          value: $(results.internalRequestTaskRunName.path)
        - name: RESULT_FILTER_RESULTS_ARTIFACT
          value: $(results.filter_results_artifact.path)
        - name: RESULT_ADVISORY_URL
          value: $(results.advisory_url.path)
        - name: RESULT_ADVISORY_INTERNAL_URL
          value: $(results.advisory_internal_url.path)
      command:
        - python3
        - -m
        - release_service_utils.tasks.internal.filter_already_released_advisory_rpms
