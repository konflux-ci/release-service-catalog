---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-filter-partial-release
spec:
  description: |
    Test the filter-already-released-advisory-rpms-task with partial release.
    One RPM is in an advisory (released-rpm), one is not (new-rpm).
  tasks:
    - name: run-filter-task
      taskRef:
        name: filter-already-released-advisory-rpms-task
      params:
        - name: transformedSnapshot
          # [{"name":"released-comp","purl":"pkg:rpm/redhat/released-rpm@1.0-1.fc44?arch=x86_64",...},
          #  {"name":"new-comp","purl":"pkg:rpm/redhat/new-rpm@2.0-1.fc44?arch=x86_64",...}]
          value: 'H4sIAAAAAAAAA6WPzQ6CMBCE7z5Gz/xWRCQx+h7GkFoWSwTatKig8d3dKiHRRD1425nd2cm3uZKG1UBSoqECZiB3uawVcYg66gptddinWtW+hlyw1h+v0FuHXuCGXsGjaMU0F8suibM4wqwRjM5iTLMdD+k0hyJC6RAMvbehhQtQkgu0A5xPoE0pG1T434aepw9tu9CybajHPo15U7ZS99nwf1jdnJGvgfN3NHtgqehPqq6/zJPFC88Q/ohC/0fZTu6Jas1grQEAAA=='
        - name: origin
          value: "test-origin"
        - name: advisory_secret_name
          value: "filter-advisory-rpms-secret"
        - name: internalRequestPipelineRunName
          value: "$(context.pipelineRun.name)"
    - name: validate-result
      runAfter:
        - run-filter-task
      params:
        - name: result
          value: "$(tasks.run-filter-task.results.result)"
        - name: unreleased_rpms
          value: "$(tasks.run-filter-task.results.unreleased_rpms)"
        - name: in_advisory_rpms
          value: "$(tasks.run-filter-task.results.in_advisory_rpms)"
      taskSpec:
        params:
          - name: result
            type: string
          - name: unreleased_rpms
            type: string
          - name: in_advisory_rpms
            type: string
        steps:
          - name: validate
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -eux

              echo "Validating filter task result..."

              if [[ "$(params.result)" != "Success" ]]; then
                echo "Task result was not Success: $(params.result)"
                exit 1
              fi

              UNRELEASED=$(base64 -d <<< "$(params.unreleased_rpms)" | gunzip)
              IN_ADVISORY=$(base64 -d <<< "$(params.in_advisory_rpms)" | gunzip)

              echo "Unreleased RPMs: $UNRELEASED"
              echo "In-advisory RPMs: $IN_ADVISORY"

              UNRELEASED_COUNT=$(jq 'length' <<< "$UNRELEASED")
              IN_ADVISORY_COUNT=$(jq 'length' <<< "$IN_ADVISORY")

              if [[ "$UNRELEASED_COUNT" -ne 1 ]]; then
                echo "Expected 1 unreleased RPM, but found $UNRELEASED_COUNT"
                exit 1
              fi

              if [[ "$IN_ADVISORY_COUNT" -ne 1 ]]; then
                echo "Expected 1 in-advisory RPM, but found $IN_ADVISORY_COUNT"
                exit 1
              fi

              # Verify the unreleased one is new-comp
              UNRELEASED_NAME=$(jq -r '.[0].name' <<< "$UNRELEASED")
              if [[ "$UNRELEASED_NAME" != "new-comp" ]]; then
                echo "Expected unreleased to be 'new-comp' but got '$UNRELEASED_NAME'"
                exit 1
              fi

              # Verify the in-advisory one is released-comp
              IN_ADV_NAME=$(jq -r '.[0].name' <<< "$IN_ADVISORY")
              if [[ "$IN_ADV_NAME" != "released-comp" ]]; then
                echo "Expected in-advisory to be 'released-comp' but got '$IN_ADV_NAME'"
                exit 1
              fi

              echo "Validation successful!"
