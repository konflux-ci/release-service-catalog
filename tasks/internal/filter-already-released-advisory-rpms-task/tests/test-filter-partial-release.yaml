---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-filter-partial-release
spec:
  description: |
    Test the filter-already-released-advisory-rpms-task with partial release.
    One RPM is in an advisory (released-rpm), one is not (new-rpm).
  params:
    - name: ociStorage
      description: The OCI repository where artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      type: string
      default: "1d"
    - name: orasOptions
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      type: string
      default: ""
    - name: dataDir
      type: string
  tasks:
    - name: run-filter-task
      taskRef:
        name: filter-already-released-advisory-rpms-task
      params:
        - name: transformedSnapshot
          # [{"name":"released-comp","purl":"pkg:rpm/redhat/released-rpm@1.0-1.fc44?arch=x86_64",...},
          #  {"name":"new-comp","purl":"pkg:rpm/redhat/new-rpm@2.0-1.fc44?arch=x86_64",...}]
          value: 'H4sIAAAAAAAAA6WPzQ6CMBCE7z5Gz/xWRCQx+h7GkFoWSwTatKig8d3dKiHRRD1425nd2cm3uZKG1UBSoqECZiB3uawVcYg66gptddinWtW+hlyw1h+v0FuHXuCGXsGjaMU0F8suibM4wqwRjM5iTLMdD+k0hyJC6RAMvbehhQtQkgu0A5xPoE0pG1T434aepw9tu9CybajHPo15U7ZS99nwf1jdnJGvgfN3NHtgqehPqq6/zJPFC88Q/ohC/0fZTu6Jas1grQEAAA=='
        - name: origin
          value: "test-origin"
        - name: advisory_secret_name
          value: "filter-advisory-rpms-secret"
        - name: internalRequestPipelineRunName
          value: "$(context.pipelineRun.name)"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
    - name: validate-result
      runAfter:
        - run-filter-task
      params:
        - name: result
          value: "$(tasks.run-filter-task.results.result)"
        - name: filter_results_artifact
          value: "$(tasks.run-filter-task.results.filter_results_artifact)"
      taskSpec:
        params:
          - name: result
            type: string
          - name: filter_results_artifact
            type: string
        steps:
          - name: validate
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -eux

              echo "Validating filter task result..."

              if [[ "$(params.result)" != "Success" ]]; then
                echo "Task result was not Success: $(params.result)"
                exit 1
              fi

              ARTIFACT="$(params.filter_results_artifact)"
              if [[ -z "$ARTIFACT" ]]; then
                echo "Expected filter_results_artifact to be set"
                exit 1
              fi
              echo "Filter results artifact: $ARTIFACT"

              echo "Validation successful!"
