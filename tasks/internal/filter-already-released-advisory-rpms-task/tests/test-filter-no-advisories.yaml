---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-filter-no-advisories
spec:
  description: |
    Test the filter-already-released-advisory-rpms-task when no advisories exist.
    All RPMs should be returned as unreleased.
  params:
    - name: ociStorage
      description: The OCI repository where artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      type: string
      default: "1d"
    - name: orasOptions
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      type: string
      default: ""
    - name: dataDir
      type: string
  tasks:
    - name: run-filter-task
      taskRef:
        name: filter-already-released-advisory-rpms-task
      params:
        - name: transformedSnapshot
          # [{"name":"new-rpm","purl":"pkg:rpm/redhat/new-rpm@1.0-1.fc44?arch=x86_64",...}]
          value: 'H4sIAAAAAAAAA2WNzQrCMBCE7z5Gzv03FikUfQ+REtOtKbZN2NQ/xHd3KsGLt52ZnfkOLzGpkUQlJrrH7EYRCXflAYa7nCsYKVNr1JyGfJ8nWZwnnZZyp1ib+rEtm1Ki5o0qNiWK6qTzYt1SJyEjgdIfgpzVBk6G+0bseztBYXr5p4GUp69eMLAWEPQPxej7frb8bMJ0iN7H1QfyQbb30gAAAA=='
        - name: origin
          value: "no-advisories-origin"
        - name: advisory_secret_name
          value: "filter-advisory-rpms-secret"
        - name: internalRequestPipelineRunName
          value: "$(context.pipelineRun.name)"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
    - name: validate-result
      runAfter:
        - run-filter-task
      params:
        - name: result
          value: "$(tasks.run-filter-task.results.result)"
        - name: filter_results_artifact
          value: "$(tasks.run-filter-task.results.filter_results_artifact)"
      taskSpec:
        params:
          - name: result
            type: string
          - name: filter_results_artifact
            type: string
        steps:
          - name: validate
            image: quay.io/konflux-ci/release-service-utils@sha256:6979552f11f042b8730abcb1be4ec6cfb0553a069cc352643f88d8996041abf8
            script: |
              #!/usr/bin/env bash
              set -eux

              echo "Validating filter task result..."

              if [[ "$(params.result)" != "Success" ]]; then
                echo "Task result was not Success: $(params.result)"
                exit 1
              fi

              ARTIFACT="$(params.filter_results_artifact)"
              if [[ -z "$ARTIFACT" ]]; then
                echo "Expected filter_results_artifact to be set"
                exit 1
              fi
              echo "Filter results artifact: $ARTIFACT"

              echo "Validation successful!"
