---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-filter-all-released
spec:
  description: |
    Test the filter-already-released-advisory-rpms-task when all RPMs are in advisories.
    Should return empty unreleased list and populated in_advisory list.
  tasks:
    - name: run-filter-task
      taskRef:
        name: filter-already-released-advisory-rpms-task
      params:
        - name: transformedSnapshot
          # [{"name":"comp-a","purl":"pkg:rpm/redhat/all-released-a@1.0-1.fc44?arch=x86_64",...},
          #  {"name":"comp-b","purl":"pkg:rpm/redhat/all-released-b@2.0-1.fc44?arch=x86_64",...}]
          value: 'H4sIAAAAAAAAA62PzQrCMBCE7z5Gzk1/YixSEPseImWTpqaYNiGpoojv7laL0IMg6G1nZ2c/ZncjPXSKFETazlEgEXEnb1C746Hwrku8qjUMCRhDvTIKgqoplFmc0ixuJOdb8FJvLuu8yjmmgwa2yjEPQmZsWauGo4wIvppA809oKWelRiPF+ax8aG2PCglj7HX41CMNVyMP9ZvoMR/awfprNREm6x7Ny4nvyomS/amc+FiO/V5uv3gAIv3MUrwBAAA='
        - name: origin
          value: "test-origin"
        - name: advisory_secret_name
          value: "filter-advisory-rpms-secret"
        - name: internalRequestPipelineRunName
          value: "$(context.pipelineRun.name)"
    - name: validate-result
      runAfter:
        - run-filter-task
      params:
        - name: result
          value: "$(tasks.run-filter-task.results.result)"
        - name: unreleased_rpms
          value: "$(tasks.run-filter-task.results.unreleased_rpms)"
        - name: in_advisory_rpms
          value: "$(tasks.run-filter-task.results.in_advisory_rpms)"
        - name: advisory_url
          value: "$(tasks.run-filter-task.results.advisory_url)"
      taskSpec:
        params:
          - name: result
            type: string
          - name: unreleased_rpms
            type: string
          - name: in_advisory_rpms
            type: string
          - name: advisory_url
            type: string
        steps:
          - name: validate
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -eux

              echo "Validating filter task result..."

              if [[ "$(params.result)" != "Success" ]]; then
                echo "Task result was not Success: $(params.result)"
                exit 1
              fi

              UNRELEASED=$(base64 -d <<< "$(params.unreleased_rpms)" | gunzip)
              IN_ADVISORY=$(base64 -d <<< "$(params.in_advisory_rpms)" | gunzip)

              echo "Unreleased RPMs: $UNRELEASED"
              echo "In-advisory RPMs: $IN_ADVISORY"

              UNRELEASED_COUNT=$(jq 'length' <<< "$UNRELEASED")
              IN_ADVISORY_COUNT=$(jq 'length' <<< "$IN_ADVISORY")

              if [[ "$UNRELEASED_COUNT" -ne 0 ]]; then
                echo "Expected 0 unreleased RPMs, but found $UNRELEASED_COUNT"
                exit 1
              fi

              if [[ "$IN_ADVISORY_COUNT" -ne 2 ]]; then
                echo "Expected 2 in-advisory RPMs, but found $IN_ADVISORY_COUNT"
                exit 1
              fi

              ADVISORY_URL="$(params.advisory_url)"
              if [[ -z "$ADVISORY_URL" ]]; then
                echo "Expected advisory_url to be set when all RPMs are in advisories"
                exit 1
              fi
              echo "Advisory URL: $ADVISORY_URL"

              echo "Validation successful!"
