---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-advisory-oci-artifact-task
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |
      Creates an oci artifact of an advisory given a Gitlab URL.
      The task will always exit 0 even if something fails. This is because the task result will not be
      set if the task fails, and the task result should always be set and propagated back to the cluster
      that creates the internal request. The success/failure is handled in the task creating the internal
      request.
  params:
    - name: advisory_url
      type: string
      description: the url of the advisory
    - name: internalRequestPipelineRunName
      type: string
      description: Name of the PipelineRun that called this task
    - name: trusted_artifacts_dockerconfig_json_secret_name
      type: string
      description: The name of the secret that contains to dockerconfig json to use for trusted artifact operations
      default: quay-token-konflux-release-trusted-artifacts-secret
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: result
      description: Success if the task succeeds, the error otherwise
    - name: advisory_oci_artifact
      description: The advisory oci artifact location if the task succeeds, empty string otherwise
    - name: internalRequestPipelineRunName
      description: Name of the PipelineRun that called this task
    - name: internalRequestTaskRunName
      description: Name of this Task Run to be made available to caller
  volumes:
    - name: trusted-artifacts-dockerconfig-secret
      secret:
        optional: true
        secretName: $(params.trusted_artifacts_dockerconfig_json_secret_name)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    securityContext:
      runAsUser: 1001
  steps:
    - name: create-advisory-oci-artifact
      image: quay.io/lgallovi-test/release-service-utils@sha256:65d4aa5bdba579063dbe50d9ba0a1752042c6913022864c9bedc6a0b3f0bfdfa
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: 250m
      volumeMounts:
        - name: trusted-artifacts-dockerconfig-secret
          mountPath: /mnt/trusted_artifacts_dockerconfig
      env:
        - name: RESULT_RESULT
          value: $(results.result.path)
        - name: RESULT_ADVISORY_OCI_ARTIFACT
          value: $(results.advisory_oci_artifact.path)
        - name: RESULT_INTERNAL_REQUEST_PIPELINE_RUN_NAME
          value: $(results.internalRequestPipelineRunName.path)
        - name: RESULT_INTERNAL_REQUEST_TASK_RUN_NAME
          value: $(results.internalRequestTaskRunName.path)
        - name: CA_CERT_PATH
          value: /mnt/trusted-ca/ca-bundle.crt
        - name: REQUESTS_CA_BUNDLE
          value: /etc/pki/tls/certs/ca-bundle.crt
        - name: PARAM_ADVISORY_URL
          value: $(params.advisory_url)
        - name: INTERNAL_REQUEST_PIPELINE_RUN_NAME
          value: $(params.internalRequestPipelineRunName)
        - name: INTERNAL_REQUEST_TASK_RUN_NAME
          value: $(context.taskRun.name)
      command: ["python3", "-m", "release_service_utils.tasks.internal.create_advisory_oci_artifact"]
