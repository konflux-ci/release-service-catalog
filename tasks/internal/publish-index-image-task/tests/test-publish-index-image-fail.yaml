---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-publish-index-image-fail
spec:
  description: |
    Run the publish-index-image task with a failing sourceIndex. The task should succeed but set
    requestMessage to an error string, since the internal task always propagates results.
  tasks:
    - name: run-task
      taskRef:
        name: publish-index-image-task
      params:
        - name: sourceIndex
          value: "registry-proxy.engineering.redhat.com/fail@sha256:0987654321fedcba"
        - name: targetIndex
          value: "quay.io/target"
        - name: targetOcpVersion
          value: "v4.12"
        - name: publishingCredentials
          value: "publish-index-image-secret"
    - name: check-result
      runAfter:
        - run-task
      params:
        - name: requestMessage
          value: $(tasks.run-task.results.requestMessage)
      taskSpec:
        params:
          - name: requestMessage
            type: string
        steps:
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:4a3b869f51267e7996e42c919f1eef2a9faad7f7e7e77fb35901e4fca35e7cb2
            script: |
              #!/usr/bin/env bash
              set -ex

              if [[ "$(params.requestMessage)" != "Error: Failed publishing Index Image" ]]; then
                echo Error: requestMessage should indicate failure
                exit 1
              fi
