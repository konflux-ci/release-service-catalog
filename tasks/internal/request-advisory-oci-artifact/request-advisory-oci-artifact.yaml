---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: request-advisory-oci-artifact
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: >
    Tekton task to request the advisory content from gitlab as an oci artifact.
  params:
    - name: advisory_url
      type: string
      description: The advisory url
    - name: requestTimeout
      type: string
      default: "2700"
      description: InternalRequest timeout
    - name: pipelineRunUid
      type: string
      description: The uid of the current pipelineRun. Used as a label value when creating internal requests
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - description: Produced advisory oci artifact pullspec
      name: advisory-oci-artifact
      type: string
    - description: The result of the task
      name: result
      type: string
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: "HOME"
        value: "/tekton/home"
    securityContext:
      runAsUser: 1001
  steps:
    - name: request-advisory-oci-artifact
      image: quay.io/konflux-ci/release-service-utils@sha256:4755f5b71a4d7ba7d7d9c9f36dec12b73c49179a927e92547843db5be983bbad
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: 100m
      env:
        - name: PARAM_ADVISORY_URL
          value: $(params.advisory_url)
        - name: PARAM_REQUEST_TIMEOUT
          value: $(params.requestTimeout)
        - name: PARAM_PIPELINE_RUN_UID
          value: $(params.pipelineRunUid)
        - name: PARAM_TASK_GIT_URL
          value: $(params.taskGitUrl)
        - name: PARAM_TASK_GIT_REVISION
          value: $(params.taskGitRevision)
        - name: RESULT_ADVISORY_OCI_ARTIFACT
          value: $(results.advisory-oci-artifact.path)
        - name: RESULT_RESULT
          value: $(results.result.path)
      command: ["python3"]
      args:
        - -u
        - -m
        - release_service_utils.tasks.internal.request_advisory_oci_artifact
