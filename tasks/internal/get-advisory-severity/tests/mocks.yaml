---
# Declarative mocks for Tekton tests of this task (Python entrypoint). Rendered
# by .github/scripts/render_python_task_mocks_from_yaml.py when
# test_tekton_tasks.sh runs.
version: 1
services:
  - type: http_json
    bind: 127.0.0.1
    routes:
      - path_suffix: /auth/token
        body: '{"access": "dummy-token"}'
      - path_contains: cve_id=CVE-critical
        body: >-
          {"results":[{"impact":"CRITICAL","affects":[{"purl":"pkg:oci/kubernetes?repository_url=component&a=b","impact":""}]}]}
      - path_contains: cve_id=CVE-moderate
        body: >-
          {"results":[{"impact":"MODERATE","affects":[{"purl":"pkg:oci/kubernetes?repository_url=foo&a=b","impact":"LOW"},{"purl":"pkg:oci/kubernetes?repository_url=component&a=b","impact":"IMPORTANT"},{"purl":"","impact":"LOW"}]}]}
    rewrite_secret_mount:
      source: /mnt/osidb-service-account
      env_var: OSIDB_SERVICE_ACCOUNT_MOUNT
      url_file: osidb_url
