---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: filter-already-released-advisory-images-task
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |
    Filters out images from a snapshot if they are already published in an advisory
    stored in the GitLab advisory repo. Returns a list of component names
    that still need to be released (i.e., not found in any advisory).
  params:
    - name: transformedSnapshot
      type: string
      description: Base64 string of gzipped JSON representation of architecture-specific images from snapshot
    - name: origin
      description: The origin workspace for the release CR
      type: string
    - name: advisory_secret_name
      description: Name of the secret containing advisory metadata
      type: string
    - name: internalRequestPipelineRunName
      description: Name of the PipelineRun that requested this task
      type: string
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: result
      description: Success or error message
    - name: internalRequestPipelineRunName
      description: The name of the InternalRequest PipelineRun
    - name: internalRequestTaskRunName
      description: The name of the InternalRequest TaskRun
    - name: unreleased_components
      description: List of components that still need to be released encoded as a gzipped base64 string
    - name: advisory_url
      description: URL of the latest matching advisory when all components are already released
    - name: advisory_internal_url
      description: Internal URL of the latest matching advisory when all components are already released
  volumes:
    - name: advisory-secret
      secret:
        secretName: $(params.advisory_secret_name)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    securityContext:
      runAsUser: 1001
  steps:
    - name: filter-images
      image: quay.io/konflux-ci/release-service-utils@sha256:48323c256efcb3c318762cb66b3a9cabd827a0bef2485cb91e8c7aed7d1fb1f0
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: '1'
      volumeMounts:
        - name: advisory-secret
          mountPath: /mnt/advisory_secret
      env:
        - name: RESULT_RESULT
          value: $(results.result.path)
        - name: RESULT_INTERNAL_REQUEST_PIPELINE_RUN_NAME
          value: $(results.internalRequestPipelineRunName.path)
        - name: RESULT_INTERNAL_REQUEST_TASK_RUN_NAME
          value: $(results.internalRequestTaskRunName.path)
        - name: RESULT_UNRELEASED_COMPONENTS
          value: $(results.unreleased_components.path)
        - name: RESULT_ADVISORY_URL
          value: $(results.advisory_url.path)
        - name: RESULT_ADVISORY_INTERNAL_URL
          value: $(results.advisory_internal_url.path)
      command:
        - python3
      args:
        - /home/scripts/python/tasks/internal/filter_already_released_advisory_images.py
        - --transformed-snapshot
        - $(params.transformedSnapshot)
        - --origin
        - $(params.origin)
        - --internal-request-pipeline-run-name
        - $(params.internalRequestPipelineRunName)
        - --internal-request-task-run-name
        - $(context.taskRun.name)
