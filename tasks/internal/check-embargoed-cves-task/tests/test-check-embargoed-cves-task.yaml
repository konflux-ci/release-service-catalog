---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-check-embargoed-cves-task
spec:
  description: |
    Run check-embargoed-cves-task with a mock OSIDB that reports all listed CVEs
    as public. Expects result Success and an empty embargoed_cves result.
  tasks:
    - name: run-task
      taskRef:
        name: check-embargoed-cves-task
      params:
        - name: cves
          value: "CVE-123 CVE-456"
    - name: check-result
      runAfter:
        - run-task
      params:
        - name: result
          value: $(tasks.run-task.results.result)
        - name: embargoed_cves
          value: $(tasks.run-task.results.embargoed_cves)
      taskSpec:
        params:
          - name: result
            type: string
          - name: embargoed_cves
            type: string
        steps:
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:067f6f54dfa13e1c01b4a5b44aa82dbe027a003b8e0ffa21d77004bcac6b8370
            script: |
              #!/usr/bin/env bash
              set -eux

              if [ "$(params.result)" != Success ]; then
                echo Error: result task result is not correct
                exit 1
              fi

              if [ "$(params.embargoed_cves)" != "" ]; then
                echo Error: embargoed_cves task result is not correct
                exit 1
              fi
