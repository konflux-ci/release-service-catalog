---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-sign-and-push-to-internal-oci-task
spec:
  description: |
    Happy-path smoke test for the sign-and-push-to-internal-oci Python task.
    The components have one Linux file and one Windows file, while the test
    avoids external artifact and signing services while verifying the task
    invokes the Python entrypoint and reports success.
  tasks:
    - name: run-task
      taskRef:
        name: sign-and-push-to-internal-oci-task
      params:
        - name: snapshot_json
          value: >-
            {
              "application": "test-app",
              "components": [
                {
                  "containerImage": "quay.io/test/image@sha256:abc123",
                  "name": "test-linux-component",
                  "staged": {
                    "files": [
                      {
                        "source": "test-artifact.tar.gz",
                        "os": "linux",
                        "arch": "amd64"
                      }
                    ]
                  }
                },
                {
                  "containerImage": "quay.io/test/windows-image@sha256:def456",
                  "name": "test-windows-component",
                  "staged": {
                    "files": [
                      {
                        "source": "test-windows-artifact.tar.gz",
                        "os": "windows",
                        "arch": "amd64"
                      }
                    ]
                  }
                }
              ]
            }
        - name: origin
          value: test-origin
        - name: quayURL
          value: quay.io/test
        - name: destQuayURL
          value: quay.io/test-destination
    - name: check-result
      runAfter:
        - run-task
      params:
        - name: result
          value: $(tasks.run-task.results.result)
      taskSpec:
        params:
          - name: result
            type: string
        steps:
          - name: check-result
            image: quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils:on-pr-b004121ef1974a4ed3a15c9d3f66477b291b8bcb
            script: |
              #!/usr/bin/env bash
              set -eux

              if [[ "$(params.result)" != "Success" ]]; then
                echo "Expected the task result to be Success, got: $(params.result)"
                exit 1
              fi
