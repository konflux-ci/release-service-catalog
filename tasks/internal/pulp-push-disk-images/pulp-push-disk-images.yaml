---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pulp-push-disk-images
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to push disk images with Pulp
  params:
    - name: snapshot_json
      type: string
      description: String containing a JSON representation of the snapshot spec
    - name: concurrentLimit
      type: string
      description: The maximum number of images to be pulled at once
      default: 3
    - name: exodusGwSecret
      type: string
      description: Env specific secret containing the Exodus Gateway configs
    - name: exodusGwEnv
      type: string
      description: Environment to use in the Exodus Gateway. Options are [live, pre]
    - name: pulpSecret
      type: string
      description: Env specific secret containing the rhsm-pulp credentials
    - name: udcacheSecret
      type: string
      description: Env specific secret containing the udcache credentials
    - name: cgwHostname
      type: string
      description: Env specific hostname for content gateway
    - name: cgwSecret
      type: string
      description: Env specific secret containing the content gateway credentials
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
    - name: certExpirationWarnDays
      type: string
      description: Number of days before expiration to warn about certificate expiration
      default: "7"
    - name: pulpTaskTimeout
      type: string
      description: >-
        Maximum time in seconds to wait for a Pulp task to reach a terminal
        state during pre-push cleanup (default 7200 = 2 hours)
      default: "7200"
  results:
    - name: result
      description: Success if the task succeeds, the error otherwise
  volumes:
    - name: exodus-gw-secret
      secret:
        secretName: $(params.exodusGwSecret)
        defaultMode: 0444
    - name: pulp-secret
      secret:
        secretName: $(params.pulpSecret)
        defaultMode: 0444
    - name: udcache-secret
      secret:
        secretName: $(params.udcacheSecret)
        defaultMode: 0444
    - name: redhat-workloads-token
      secret:
        secretName: redhat-workloads-token
        defaultMode: 0444
    - name: cgw-secret
      secret:
        secretName: $(params.cgwSecret)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true

  steps:
    - name: pull-and-push-images
      # TEMP: pinned to the release-service-utils#982 PR-build image (has the oras-pull
      # stderr capture + single/double-quote dockerconfigjson fix, dual-mode disk-image
      # extraction, Pulp 404-tolerance, PULP_TASK_TIMEOUT wiring for parity with the
      # pulpTaskTimeout param below, live-streamed pulp/CGW/oras subprocess output so
      # progress is visible in the step log instead of buffered until exit, and a
      # Dockerfile fix that reinstalls the python3-qpid-proton RPM after the pip
      # install/uninstall dance so pubtools-pulp-push's msgsigner import doesn't hit
      # ModuleNotFoundError: No module named 'proton.handlers') to validate the e2e
      # test end-to-end before that PR merges. Revert to the released utils image once
      # konflux-ci/release-service-utils#982 merges and promotes.
      image: quay.io/redhat-user-workloads/rhtap-release-2-tenant/release-service-utils-standalone@sha256:f5613b9c0924e58e0fd674c8a44773c1ce171c68de325407470ad54d1cbd054a
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: 450m
      volumeMounts:
        - name: exodus-gw-secret
          mountPath: /mnt/exodusGwSecret
        - name: pulp-secret
          mountPath: /mnt/pulpSecret
        - name: udcache-secret
          mountPath: /mnt/udcacheSecret
        - name: redhat-workloads-token
          mountPath: /mnt/redhat-workloads-token
        - name: cgw-secret
          mountPath: /mnt/cgwSecret
      securityContext:
        runAsUser: 1001
      env:
        - name: SNAPSHOT_JSON
          value: $(params.snapshot_json)
        - name: CERT_EXPIRATION_WARN_DAYS
          value: $(params.certExpirationWarnDays)
        - name: CONCURRENT_LIMIT
          value: $(params.concurrentLimit)
        - name: EXODUS_GW_ENV
          value: $(params.exodusGwEnv)
        - name: CGW_HOSTNAME
          value: $(params.cgwHostname)
        - name: PULP_TASK_TIMEOUT
          value: $(params.pulpTaskTimeout)
        - name: RESULT_RESULT
          value: $(results.result.path)
      command:
        - python3
      args:
        - -u
        - /home/scripts/python/tasks/internal/pulp_push_disk_images.py
