---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: collect-blob-signing-params
  annotations:
    tekton.dev/tags: release
spec:
  description: |-
    Task to collect parameters for the simple signing pipeline
  params:
    - name: config_map_name
      description: Name of a configmap with pipeline configuration
      type: string
  results:
    - name: pyxis_url
      description: Container API URL based for selected environment
    - name: sig_key_id
      description: The signing key id that index image claims are signed with
    - name: sig_key_name
      description: The signing key name that index image claims are signed with
    - name: umb_url
      description: umb host to connect to for messaging, e.g. for signing
    - name: umb_listen_topic
      description: umb topic which is used for listening
    - name: umb_publish_topic
      description: umb topic which is used for publishing
    - name: umb_client_name
      description: Client name to connect to umb, usually a service account name
    - name: pyxis_ssl_cert_secret_name
      description: Pyxis SSL secret name
    - name: umb_ssl_cert_secret_name
      description: UMB SSL secret name
  stepTemplate:
    securityContext:
      runAsUser: 1001
  steps:
    - name: collect-blob-signing-params
      image: quay.io/konflux-ci/release-service-utils@sha256:a12045a37ee106c3137f2cd2daedff3ace99017cd44ee8a7e9dfb30806a00412
      computeResources:
        limits:
          memory: 192Mi
        requests:
          memory: 192Mi
          cpu: 50m
      env:
        - name: PARAM_CONFIG_MAP_NAME
          value: "$(params.config_map_name)"
        - name: RESULT_PYXIS_URL
          value: "$(results.pyxis_url.path)"
        - name: RESULT_SIG_KEY_ID
          value: "$(results.sig_key_id.path)"
        - name: RESULT_SIG_KEY_NAME
          value: "$(results.sig_key_name.path)"
        - name: RESULT_UMB_URL
          value: "$(results.umb_url.path)"
        - name: RESULT_UMB_LISTEN_TOPIC
          value: "$(results.umb_listen_topic.path)"
        - name: RESULT_UMB_PUBLISH_TOPIC
          value: "$(results.umb_publish_topic.path)"
        - name: RESULT_UMB_CLIENT_NAME
          value: "$(results.umb_client_name.path)"
        - name: RESULT_PYXIS_SSL_CERT_SECRET_NAME
          value: "$(results.pyxis_ssl_cert_secret_name.path)"
        - name: RESULT_UMB_SSL_CERT_SECRET_NAME
          value: "$(results.umb_ssl_cert_secret_name.path)"
      command: ["python3", "-m", "release_service_utils.tasks.internal.collect_blob_signing_params"]
