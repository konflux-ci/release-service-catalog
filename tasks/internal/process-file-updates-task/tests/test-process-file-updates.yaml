---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-process-file-updates
spec:
  description: |
    Run process-file-updates-task with a seed file and regex replacement.
    Expects result Success and a merge request URL in fileUpdatesInfo.
  workspaces:
    - name: tests-workspace
  tasks:
    - name: run-task
      taskRef:
        name: process-file-updates-task
      params:
        - name: upstream_repo
          value: "https://some.gitlab/test/one-update.git"
        - name: repo
          value: "https://some.gitlab/test/one-update.git"
        - name: ref
          value: "main"
        - name: paths
          value: >-
            [{"path":"addons/my-addon2.yaml","seed":"indexImage:\u000a\u000a",
            "replacements":[{"key":".indexImage","replacement":"|indexImage:.*|indexImage: Tom|"}]}]
        - name: componentGroup
          value: "scott"
        - name: file_updates_secret
          value: "file-updates-secret"
        - name: tempDir
          value: "$(workspaces.pipeline.path)/$(context.pipelineRun.uid)/file-updates"
        - name: internalRequestPipelineRunName
          value: $(context.pipelineRun.name)
      workspaces:
        - name: pipeline
          workspace: tests-workspace
    - name: check-result
      runAfter:
        - run-task
      params:
        - name: fileUpdatesInfo
          value: $(tasks.run-task.results.fileUpdatesInfo)
        - name: fileUpdatesState
          value: $(tasks.run-task.results.fileUpdatesState)
        - name: internalRequestTaskRunName
          value: $(tasks.run-task.results.internalRequestTaskRunName)
        - name: internalRequestPipelineRunName
          value: $(tasks.run-task.results.internalRequestPipelineRunName)
        - name: tempDir
          value: "$(workspaces.pipeline.path)/$(context.pipelineRun.uid)/file-updates"
      taskSpec:
        params:
          - name: fileUpdatesInfo
            type: string
          - name: fileUpdatesState
            type: string
          - name: internalRequestTaskRunName
            type: string
          - name: internalRequestPipelineRunName
            type: string
          - name: tempDir
            type: string
        steps:
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:78f41d6b4245a1536efbfe561038888dbf7c2b81f76d10f1eff1ce80002666c4
            computeResources:
              limits:
                memory: 512Mi
              requests:
                memory: 512Mi
                cpu: 250m
            securityContext:
              runAsUser: 1001
            script: |
              #!/usr/bin/env bash
              set -euxo pipefail

              EXPECTED_STATE="Success"

              echo Test that task succeeded
              test "$(params.fileUpdatesState)" == "${EXPECTED_STATE}"

              echo Test that merge_request can be parsed
              test "$(jq -r .merge_request <<< '$(params.fileUpdatesInfo)')" == \
                  "https://some.gitlab/test/one-update.git/-/merge_request/1"

              cd "$(params.tempDir)/one-update"
              commits=$(git log --oneline | wc -l)
              echo "Test that only 1 commit is present"
              test "${commits}" == "1"

              commitId=$(git log --oneline | awk '{print $1}' | tail -1)
              changedFiles=$(git show -r "${commitId}" --name-only --oneline | tail -1)
              echo "Test that files changed in commit correspond to updates"
              test "${changedFiles}" == "addons/my-addon2.yaml"

              cat > "/tmp/my-addon2.yaml" << EOF
              indexImage: Tom

              EOF

              echo "Testing that file present in working directory is what we expect"
              diff "$(params.tempDir)/one-update/addons/my-addon2.yaml" "/tmp/my-addon2.yaml"

              echo Test that internalRequestTaskRunName is not empty
              test -n "$(params.internalRequestTaskRunName)"

              echo Test that internalRequestPipelineRunName is not empty
              test -n "$(params.internalRequestPipelineRunName)"

      workspaces:
        - name: pipeline
          workspace: tests-workspace
  finally:
    - name: cleanup
      params:
        - name: tempDir
          value: "$(workspaces.pipeline.path)/$(context.pipelineRun.uid)/file-updates"
      taskSpec:
        params:
          - name: tempDir
            type: string
        steps:
          - name: delete-crs
            image: quay.io/konflux-ci/release-service-utils@sha256:78f41d6b4245a1536efbfe561038888dbf7c2b81f76d10f1eff1ce80002666c4
            computeResources:
              limits:
                memory: 512Mi
              requests:
                memory: 512Mi
                cpu: 250m
            securityContext:
              runAsUser: 1001
            script: |
              #!/usr/bin/env bash
              set -euxo pipefail

              rm -rf "$(params.tempDir)"
      workspaces:
        - name: pipeline
          workspace: tests-workspace
