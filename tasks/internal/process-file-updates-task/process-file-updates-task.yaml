---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: process-file-updates-task
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton Task to update files in Git repositories. It is possible to seed a file with initial content and/or apply
    replacements to a yaml file that already exists. It will attempt to create a Merge Request in Gitlab.
  params:
    - name: upstream_repo
      type: string
      description: Upstream Git repository
    - name: repo
      type: string
      description: Git repository
    - name: ref
      type: string
      description: Git branch
    - name: paths
      type: string
      description: |
          String containing a JSON array of file paths and its replacements or updates
          E.g. '[{"path":"file1.yaml","replacements":[{"key":".yamlkey1,","replacement":"|regex|replace|"}]}]'
    - name: componentGroup
      type: string
      description: ComponentGroup being released
    - name: file_updates_secret
      type: string
      default: "file-updates-secret"
      description: The credentials used to update the git repo
    - name: tempDir
      type: string
      default: "$(workspaces.pipeline.path)/$(context.taskRun.uid)/file-updates"
      description: Workspace-backed temp dir for cloning, path handoff, and updates
    - name: internalRequestPipelineRunName
      type: string
      description: name of the PipelineRun that called this task
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: fileUpdatesInfo
      description: fileUpdates detailed information
    - name: fileUpdatesState
      description: fileUpdates state
    - name: internalRequestPipelineRunName
      description: name of the PipelineRun that called this task
    - name: internalRequestTaskRunName
      description: name of this Task Run to be made available to caller
  volumes:
    - name: file-updates-secret-vol
      secret:
        secretName: $(params.file_updates_secret)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  workspaces:
    - name: pipeline
      description: workspace to read and save files
  stepTemplate:
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    securityContext:
      runAsUser: 1001
  steps:
    - name: run-file-updates
      image: quay.io/konflux-ci/release-service-utils@sha256:78f41d6b4245a1536efbfe561038888dbf7c2b81f76d10f1eff1ce80002666c4
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: 250m
      volumeMounts:
        - name: file-updates-secret-vol
          mountPath: "/mnt/file-updates-secret"
      env:
        - name: RESULT_FILE_UPDATES_INFO
          value: $(results.fileUpdatesInfo.path)
        - name: RESULT_FILE_UPDATES_STATE
          value: $(results.fileUpdatesState.path)
        - name: RESULT_INTERNAL_REQUEST_PIPELINE_RUN_NAME
          value: $(results.internalRequestPipelineRunName.path)
        - name: RESULT_INTERNAL_REQUEST_TASK_RUN_NAME
          value: $(results.internalRequestTaskRunName.path)
        - name: CA_CERT_PATH
          value: /mnt/trusted-ca/ca-bundle.crt
        - name: REQUESTS_CA_BUNDLE
          value: /etc/pki/tls/certs/ca-bundle.crt
      command: ["python3", "-m", "process_file_updates"]
      args:
        - --upstream-repo
        - $(params.upstream_repo)
        - --repo
        - $(params.repo)
        - --ref
        - $(params.ref)
        - --paths
        - $(params.paths)
        - --component-group
        - $(params.componentGroup)
        - --internal-request-pipeline-run-name
        - $(params.internalRequestPipelineRunName)
        - --internal-request-task-run-name
        - $(context.taskRun.name)
        - --temp-dir
        - $(params.tempDir)
