---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-upload-sbom-to-atlas-idempotent
spec:
  description: |
    Tests that SBOMs that already exist in Atlas are not re-uploaded, 
    verifying the idempotent behavior of the upload-sbom-to-atlas task.
  workspaces:
    - name: tests-workspace
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      workspaces:
        - name: data
          workspace: tests-workspace
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        workspaces:
          - name: data
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils:3eb493f6b7923e04fbb01b44b24e5491a2bbd1ec
            script: |
              #!/usr/bin/env bash
              set -eux

              # creating directory for generated SBOM-s
              sbomsDir="$(params.dataDir)/$(context.pipelineRun.uid)/sboms"
              mkdir -p "${sbomsDir}"
              # creating working directory
              workdir="$(params.dataDir)/$(context.pipelineRun.uid)/workdir"
              mkdir -p "${workdir}"
              sbomId="sha256:existing"

              cat > "$sbomsDir/$sbomId" << EOF
              {
                "spdxVersion": "SPDX-2.3",
                "dataLicense": "CC0-1.0",
                "SPDXID": "SPDXRef-DOCUMENT",
                "name": "Existing SPDX SBOM for testing idempotency",
                "documentNamespace": "http://spdx.org/spdxdocs/existing-sbom",
                "documentDescribes": []
              }
              EOF
          - name: skip-trusted-artifact-operations
            ref:
              name: skip-trusted-artifact-operations
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
          - name: patch-source-data-artifact-result
            ref:
              name: patch-source-data-artifact-result
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: upload-sbom-to-atlas
      params:
        - name: atlasSecretName
          value: atlas-test-sso-secret
        - name: sbomDir
          value: "$(context.pipelineRun.uid)/sboms"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: subdirectory
          value: $(context.pipelineRun.uid)
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
        - name: retryAWSSecretName
          value: "retry-aws-secret"
        - name: retryS3Bucket
          value: "dummybucket"
      workspaces:
        - name: data
          workspace: tests-workspace
      runAfter:
        - setup

    - name: check-result
      workspaces:
        - name: data
          workspace: tests-workspace
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
      runAfter:
        - run-task
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        workspaces:
          - name: data
        steps:
          - name: skip-trusted-artifact-operations
            ref:
              name: skip-trusted-artifact-operations
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils:3eb493f6b7923e04fbb01b44b24e5491a2bbd1ec
            script: |
              #!/usr/bin/env bash
              set -eux

              workdir="$(params.dataDir)/$(context.pipelineRun.uid)/workdir"
              sbomsDir="$(params.dataDir)/$(context.pipelineRun.uid)/sboms"
              mkdir -p "${workdir}"
              mkdir -p "${sbomsDir}"

              # Check count of curl calls is 2:
              # token fetch, SBOM existence check (GET) - no POST or S3 upload
              if [ "$(wc -l < "$workdir/mock_curl.txt")" -ne 2 ]; then
                echo "TEST FAILED: curl was expected to be called 2 times for idempotent case. Actual calls:"
                cat "$workdir/mock_curl.txt"
                exit 1
              else
                echo "TEST PASSED: Curl has been called 2 times (idempotent behavior verified)"
              fi

              failedSbomDir="$(params.dataDir)/$(context.pipelineRun.uid)/failed-sboms"

              # In idempotent case, no SBOMs should be in failed directory
              if [[ -f "$failedSbomDir/sha256:existing" ]]; then
                echo "TEST FAILED: SBOM should not be in failed directory in idempotent case."
                exit 1
              else
                echo "TEST PASSED: No SBOMs in failed directory (idempotent behavior verified)."
              fi 