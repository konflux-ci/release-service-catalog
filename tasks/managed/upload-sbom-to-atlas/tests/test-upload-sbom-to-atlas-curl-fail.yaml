---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-upload-sbom-to-atlas-curl-fail
spec:
  description: |
    Tests that failure in uploading SPDX SBOMs to Atlas should not fail the
    upload-sbom-to-atlas task and the failed sbom is copied to the correct
    directory for retrying.
  workspaces:
    - name: tests-workspace
  tasks:
    - name: setup
      workspaces:
        - name: data
          workspace: tests-workspace
      taskSpec:
        workspaces:
          - name: data
        params:
          - name: sbomDir
            default: "sboms"
            description: Directory containing generated SBOM files.
            type: string
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils:3eb493f6b7923e04fbb01b44b24e5491a2bbd1ec
            script: |
              #!/usr/bin/env bash
              set -eux

              # creating directory for generated SBOM-s
              mkdir "$(workspaces.data.path)/$(params.sbomDir)"
              # creating working directory
              mkdir "$(workspaces.data.path)/workdir"

              sbomsDir="$(workspaces.data.path)/$(params.sbomDir)"
              workdir="$(workspaces.data.path)/workdir"

              # minimal SPDX SBOM 2.3 - no need for conversion
              cat > "$sbomsDir/spdx_minimal_curl_fail_2_3.json" << EOF
              {
                "spdxVersion": "SPDX-2.3",
                "dataLicense": "CC0-1.0",
                "SPDXID": "SPDXRef-DOCUMENT",
                "name": "Minimal SPDX SBOM for testing curl failure",
                "documentNamespace": "http://spdx.org/spdxdocs/minimal-spdx-sbom",
                "documentDescribes": []
              }
              EOF
              sbom_id_2_3="spdx_minimal_curl_fail_2_3"
              echo "$sbom_id_2_3" > "$workdir/spdx_minimal_curl_fail_2_3"

    - name: run-task
      taskRef:
        name: upload-sbom-to-atlas
      params:
        - name: atlasSecretName
          value: atlas-test-sso-secret
        - name: sbomDir
          value: "sboms"
      workspaces:
        - name: data
          workspace: tests-workspace
      runAfter:
        - setup

    - name: check-result
      workspaces:
        - name: data
          workspace: tests-workspace
      runAfter:
        - run-task
      params:
        - name: failedSbomDir
          value: $(tasks.run-task.results.failedSbomDir)
      taskSpec:
        params:
          - name: sbomDir
            default: "sboms"
            description: Directory containing generated SBOM files.
            type: string
          - name: failedSbomDir
        workspaces:
          - name: data
        steps:
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils:3eb493f6b7923e04fbb01b44b24e5491a2bbd1ec
            env:
              - name: "FAILED_SBOM_DIR"
                value: "$(params.failedSbomDir)"
            script: |
              #!/usr/bin/env bash
              set -eux

              workdir="$(workspaces.data.path)/workdir"

              # Check count of curl calls
              if [ "$(wc -l < "$workdir/mock_curl.txt")" -ne 2 ]; then
                echo "TEST FAILED: curl was expected to be called 2 times. Actual calls:"
                cat "$workdir/mock_curl.txt"
                exit 1
              else
                echo "TEST PASSED: Curl has been called 2 times"
              fi

              failedSbomDir="$(workspaces.data.path)/$FAILED_SBOM_DIR"

              if [[ -f "$failedSbomDir/spdx_minimal_curl_fail_2_3.json.supported_version" ]]; then
                echo "TEST PASSED: Failed SBOM was copied to retry directory."
              else
                echo "TEST FAILED: Failed SBOM not copied to retry directory."
                ls -l "$failedSbomDir"
                exit 1
              fi
