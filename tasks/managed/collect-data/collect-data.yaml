---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: collect-data
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to collect the information added to the data field of the release resources.

    The purpose of this task is to collect all the data and supply it to the other task in the pipeline by creating
    a json file called `data.json` in the workspace.

    This task also stores the passed resources as json files in a workspace.

    The parameters to this task are lowercase instead of camelCase because they are passed from the operator, and the
    operator passes them as lowercase.

    A task result is returned for each resource with the relative path to the stored JSON for it in the workspace.

    Finally, the task checks that the keys from the correct resource (a key that should come from the
    ReleasePlanAdmission should not be present in the Release data section).
  params:
    - name: release
      type: string
      description: The namespaced name of the Release
    - name: releasePlan
      type: string
      description: The namespaced name of the ReleasePlan
    - name: releasePlanAdmission
      type: string
      description: The namespaced name of the ReleasePlanAdmission
    - name: releaseServiceConfig
      type: string
      description: The namespaced name of the ReleaseServiceConfig
    - name: snapshot
      type: string
      description: The namespaced name of the Snapshot
    - name: subdirectory
      description: Subdirectory inside the workspace to be used
      type: string
      default: ""
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
    - name: caCertPath
      type: string
      description: Path to CA certificate bundle for TLS verification with self-signed certificates
      default: /mnt/trusted-ca/ca-bundle.crt
  results:
    - name: release
      type: string
      description: The relative path in the workspace to the stored release json
    - name: releasePlan
      type: string
      description: The relative path in the workspace to the stored releasePlan json
    - name: releasePlanAdmission
      type: string
      description: The relative path in the workspace to the stored releasePlanAdmission json
    - name: releaseServiceConfig
      type: string
      description: The relative path in the workspace to the stored releaseServiceConfig json
    - name: snapshotSpec
      type: string
      description: The relative path in the workspace to the stored snapshotSpec json
    - name: data
      type: string
      description: The relative path in the workspace to the stored data json
    - name: resultsDir
      type: string
      description: The relative path in the workspace to the results directory
    - name: singleComponentMode
      type: string
      description: single component mode
    - name: snapshotName
      type: string
      description: name of Snapshot resource
    - name: snapshotNamespace
      type: string
      description: namespace where Snapshot is located
    - name: snapshotBuildId
      type: string
      description: Build Id where Snapshot originated
    - name: releasePipelineMetadata
      type: string
      description: json object containing git resolver metadata about the running release pipeline
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
    - name: subdirectory
      type: string
      description: Subdirectory inside the workspace to be used
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: collect-data
      image: quay.io/konflux-ci/release-service-utils@sha256:f88c25bacfd8575198419a8465804980ba6531dfb2b4717a7ebc4415df43910d
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 100m
      env:
        - name: "RELEASE"
          value: '$(params.release)'
        - name: "RELEASE_PLAN"
          value: '$(params.releasePlan)'
        - name: "RELEASE_PLAN_ADMISSION"
          value: '$(params.releasePlanAdmission)'
        - name: "RELEASE_SERVICE_CONFIG"
          value: '$(params.releaseServiceConfig)'
        - name: "SNAPSHOT"
          value: '$(params.snapshot)'
        - name: "PARAM_SUBDIRECTORY"
          value: '$(params.subdirectory)'
        - name: "PARAM_DATA_DIR"
          value: '$(params.dataDir)'
        - name: "RESULT_RELEASE"
          value: '$(results.release.path)'
        - name: "RESULT_RELEASE_PLAN"
          value: '$(results.releasePlan.path)'
        - name: "RESULT_RELEASE_PLAN_ADMISSION"
          value: '$(results.releasePlanAdmission.path)'
        - name: "RESULT_RELEASE_SERVICE_CONFIG"
          value: '$(results.releaseServiceConfig.path)'
        - name: "RESULT_SNAPSHOT_SPEC"
          value: '$(results.snapshotSpec.path)'
        - name: "RESULT_DATA"
          value: '$(results.data.path)'
        - name: "RESULT_RESULTS_DIR"
          value: '$(results.resultsDir.path)'
        - name: "RESULT_SINGLE_COMPONENT_MODE"
          value: '$(results.singleComponentMode.path)'
        - name: "RESULT_SNAPSHOT_NAME"
          value: '$(results.snapshotName.path)'
        - name: "RESULT_SNAPSHOT_NAMESPACE"
          value: '$(results.snapshotNamespace.path)'
        - name: "RESULT_SNAPSHOT_BUILD_ID"
          value: '$(results.snapshotBuildId.path)'
        - name: "RESULT_RELEASE_PIPELINE_METADATA"
          value: '$(results.releasePipelineMetadata.path)'
        - name: "RESULT_SUBDIRECTORY"
          value: '$(results.subdirectory.path)'
        - name: "CA_CERT_PATH"
          value: '$(params.caCertPath)'
      command: ["python3", "-m", "collect_data"]
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
        - name: caCertPath
          value: $(params.caCertPath)
