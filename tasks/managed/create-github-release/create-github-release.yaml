---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-github-release
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task that creates a release in GitHub.com via the API.

    It extracts binary files from the container image and uploads them along with
    SHA256SUMS and signature files (from the TA chain) to the GitHub release.
  params:
    - name: repository
      type: string
      description: "The github repository where the release should be created"
    - name: release_version
      type: string
      description: "The version string of the new release"
    - name: githubSecret
      type: string
      description: "The kube secret to use to authenticate to GitHub, containing one key: token"
    - name: content_directory
      type: string
      description: "The directory inside the workspace to find SHA256SUMS and signature files"
    - name: snapshotPath
      type: string
      description: Path to the JSON string of the mapped Snapshot spec in the data workspace
    - name: imageBinariesPath
      type: string
      description: Path inside the image where the binaries to extract are stored
      default: "releases"
    - name: resultsDirPath
      type: string
      description: Path to the results directory in the data workspace
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: url
      type: string
      description: URL to inspect the created release
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
  volumes:
    - name: workdir
      emptyDir: {}
    - name: gh-token-secret-vol
      secret:
        secretName: $(params.githubSecret)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true

  stepTemplate:
    securityContext:
      runAsUser: 1001
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: create-release-from-binaries
      image: quay.io/konflux-ci/release-service-utils@sha256:6979552f11f042b8730abcb1be4ec6cfb0553a069cc352643f88d8996041abf8
      computeResources:
        limits:
          memory: 512Mi
          cpu: 250m
        requests:
          memory: 512Mi
          cpu: 250m
      volumeMounts:
        - name: gh-token-secret-vol
          mountPath: "/etc/secrets"
      script: |
        #!/usr/bin/env bash
        set -e

        GH_TOKEN="$(cat /etc/secrets/token)"
        # export variables required by the script "git-functions" in release-service-utils
        export GH_TOKEN

        set -x

        RESULTS_FILE="$(params.dataDir)/$(params.resultsDirPath)/create-github-release-results.json"
        CONTENT_DIR="$(params.dataDir)/$CONTENT_DIRECTORY"

        OWNER_REPO=${REPOSITORY#https://github.com/}
        RELEASE="$(gh api "repos/${OWNER_REPO}/releases" --jq ".[] | select(.tag_name == \"v${RELEASE_VERSION}\")")"
        if [ -n "$RELEASE" ]; then
          echo "Release v${RELEASE_VERSION} exists"
          echo "$REPOSITORY/releases/tag/v${RELEASE_VERSION}" > "$(results.url.path)"
        else
          # Extract binary files from the container image to a temp directory.
          # SHA256SUMS and .sig files are already in CONTENT_DIR via the TA chain.
          # The pipeline enforces a single component via validate-single-component.
          SNAPSHOT_SPEC_FILE="$(params.dataDir)/$(params.snapshotPath)"
          BINARIES_TMP=$(mktemp -d)
          IMAGE_URL="$(jq -r '.components[0].containerImage // ""' "$SNAPSHOT_SPEC_FILE")"
          if [ -z "${IMAGE_URL}" ] ; then
              echo "Error: Unable to get image url from snapshot."
              exit 1
          fi

          TMP_DIR=$(mktemp -d)
          skopeo copy --retry-times 3 docker://"$IMAGE_URL" dir:"$TMP_DIR"
          cd "$TMP_DIR"

          for DIGEST in $(jq -r ".layers[].digest" manifest.json); do
            FILE=${DIGEST#sha256:}
            if tar -tf "$FILE" | grep -q "^$IMAGE_PATH/"; then
              tar -xzvf "$FILE" "$IMAGE_PATH"
            fi
          done

          # Copy only binary files. SHA256SUMS and .sig come via the TA chain
          # and must not be overwritten by files from the image.
          if [ -d "$IMAGE_PATH" ]; then
            shopt -s nullglob
            for f in "$IMAGE_PATH"/*; do
              BASENAME="$(basename "$f")"
              if [[ "$BASENAME" != *SHA256SUMS ]] && [[ "$BASENAME" != *.sig ]]; then
                cp "$f" "$BINARIES_TMP/"
              fi
            done
            shopt -u nullglob
          fi

          cd "$CONTENT_DIR"
          set -o pipefail
          shopt -s failglob

          gh release create "v${RELEASE_VERSION}" \
            "$BINARIES_TMP"/*.zip "$BINARIES_TMP"/*.json \
            ./*SHA256SUMS ./*.sig \
            --repo "$REPOSITORY" --title "Release $RELEASE_VERSION" | tee "$(results.url.path)"

          rm -rf "$BINARIES_TMP"
        fi

        jq -n --arg release "$(cat "$(results.url.path)")" '{"github-release": {"url": $release}}' | tee "$RESULTS_FILE"
      env:
        - name: REPOSITORY
          value: $(params.repository)
        - name: RELEASE_VERSION
          value: $(params.release_version)
        - name: CONTENT_DIRECTORY
          value: $(params.content_directory)
        - name: IMAGE_PATH
          value: $(params.imageBinariesPath)
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
