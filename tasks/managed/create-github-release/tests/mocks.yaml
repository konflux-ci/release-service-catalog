---
# Mock GitHub API on localhost; test_tekton_tasks.sh applies hostAliases on the PipelineRun
# when hostname is set below. pre-apply-task-hook.sh adds NET_BIND_SERVICE for port 443.
version: 1
services:
  - type: http_json
    bind: 127.0.0.1
    port: 443
    tls: true
    hostname: api.github.com
    rewrite_ca_cert_env:
      env_var: REQUESTS_CA_BUNDLE
    routes:
      # For test-create-github-release: no existing release
      - path_contains: /repos/foo/bar/releases
        method: GET
        body: '[]'
      # For test-create-github-release: create release returns URL
      - path_contains: /repos/foo/bar/releases
        method: POST
        body: '{"html_url": "https://github.com/foo/bar/releases/tag/v1.2.3"}'
      # For test-create-github-exist-release: release already exists
      - path_contains: /repos/foo/repo_with_release/releases
        method: GET
        body: '[{"tag_name": "v1.2.3", "html_url": "https://github.com/foo/repo_with_release/releases/tag/v1.2.3"}]'
      # Upload asset endpoint (for binaries, SHA256SUMS, .sig files)
      - path_contains: /releases/
        method: POST
        body: '{"id": 1, "name": "uploaded"}'
