---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-create-github-exist-release
spec:
  description: |
    Run the create-github-release task to create an existing release.
    It will not be recreated.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:436b54bee56d4cee1a1c635784f6b0fcb676399f974fecfbb1506d25bace4b40
            script: |
              #!/usr/bin/env sh
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)/results"

              # Snapshot for binary extraction
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot.json" << EOF
              {
                "application": "myapp",
                "components": [
                  {
                    "name": "comp",
                    "containerImage": "registry.io/image:tag"
                  }
                ]
              }
              EOF

              # Only SHA256SUMS and .sig in content dir (these come via the TA chain)
              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)/release/"
              touch "$(params.dataDir)/$(context.pipelineRun.uid)/release/foo_SHA256SUMS"
              touch "$(params.dataDir)/$(context.pipelineRun.uid)/release/foo_SHA256SUMS.sig"

              # Image data for skopeo mock (binaries extracted at runtime)
              mkdir -p "$(params.dataDir)/image_data"
              cd "$(params.dataDir)/image_data"

              cat > manifest.json <<EOF
              {
                "layers": [
                  {"digest": "sha256:1111"}
                ]
              }
              EOF

              TAR_IN=$(mktemp -d)
              mkdir -p "$TAR_IN"/releases
              cat > "$TAR_IN"/releases/foo.json << EOF
              { "example github release file": "just mock data" }
              EOF
              touch "$TAR_IN"/releases/foo.zip
              touch "$TAR_IN"/releases/foo_SHA256SUMS
              touch "$TAR_IN"/releases/foo_SHA256SUMS.sig
              tar czf 1111 -C "$TAR_IN" releases
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: create-github-release
      params:
        - name: githubSecret
          value: test-create-github-release-token
        - name: repository
          value: https://github.com/foo/repo_with_release
        - name: release_version
          value: 1.2.3
        - name: content_directory
          value: $(context.pipelineRun.uid)/release/
        - name: snapshotPath
          value: $(context.pipelineRun.uid)/snapshot.json
        - name: resultsDirPath
          value: $(context.pipelineRun.uid)/results
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:436b54bee56d4cee1a1c635784f6b0fcb676399f974fecfbb1506d25bace4b40
            script: |
              #!/usr/bin/env bash
              set -eux

              RESULTS_FILE="$(params.dataDir)/$(context.pipelineRun.uid)/results/create-github-release-results.json"
              EXPECTED_URL="https://github.com/foo/repo_with_release/releases/tag/v1.2.3"

              if [ ! -f "${RESULTS_FILE}" ]; then
                echo "Error: Results file not found: ${RESULTS_FILE}"
                exit 1
              fi

              ACTUAL_URL=$(jq -r '.["github-release"].url' "${RESULTS_FILE}")
              if [ "${ACTUAL_URL}" != "${EXPECTED_URL}" ]; then
                echo "Error: Expected URL '${EXPECTED_URL}', got '${ACTUAL_URL}'"
                cat "${RESULTS_FILE}"
                exit 1
              fi

              # Verify skopeo was NOT called (existing release should skip extraction)
              if [ -f "$(params.dataDir)/mock_skopeo.txt" ]; then
                echo "Error: skopeo should not be called for existing release"
                cat "$(params.dataDir)/mock_skopeo.txt"
                exit 1
              fi

              echo "Existing release test passed:"
              echo "  - Correct URL returned: ${ACTUAL_URL}"
              echo "  - No image extraction (skopeo not called)"
              echo "  - No new release created (existing release reused)"
              cat "${RESULTS_FILE}"
      runAfter:
        - run-task
