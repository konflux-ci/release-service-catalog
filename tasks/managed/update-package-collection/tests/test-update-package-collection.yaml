---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-update-package-collection
spec:
  description: |
    Test the update-package-collection task.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
          # Use the same security context as the main task to avoid permission issues
          securityContext:
            runAsUser: 1001
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils:e633d51cd41d73e4b3310face21bb980af7a662f
            script: |
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "releaseNotes": {
                  "product_name": "Test Product",
                  "product_version": "1.0"
                },
                "mapping": {
                  "components": [
                    {
                      "name": "test",
                      "repository": "quay.io/test/test"
                    }
                  ]
                }
              }
              EOF
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot_spec.json" << EOF
              {
                "application": "test-app",
                "artifacts": {},
                "components": [
                  {
                    "containerImage": "quay.io/test/test@sha256:12345",
                    "name": "test",
                    "source": {}
                  }
                ]
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: update-package-collection
      params:
        - name: snapshotPath
          value: "$(context.pipelineRun.uid)/snapshot_spec.json"
        - name: dataPath
          value: "$(context.pipelineRun.uid)/data.json"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
        - name: synchronously
          value: "false"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
      runAfter:
        - run-task
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
          # Use the same security context as the main task to avoid permission issues
          securityContext:
            runAsUser: 1001
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils:e633d51cd41d73e4b3310face21bb980af7a662f
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              exit_code=0

              function assert_cmd_called_with() {
                  calls_file="$(params.dataDir)/${1}_calls.txt"
                  if ! grep -q "^$*$" "$calls_file"; then
                      echo "Command call not found:"
                      echo "  $*"
                      echo "Actual calls:"
                      sed 's/^/  /' "$calls_file"
                      return 1
                  fi
              }

              function test_internal_request() {
                  if assert_cmd_called_with internal-request --pipeline update-package-collection -p action=add-builds -p env=prod -p product=Test Product -p collection-name=test-target-draft -p package_name=test-package -p nvr=test-package-1.0-1 -p download_url=quay.io/test/test@sha256:12345 -p taskGitUrl=http://localhost -p taskGitRevision=main -s false --pipeline-timeout 01h05m00s --task-timeout 01h00m00s -l=; then
                      echo "TEST PASSED: InternalRequest was created correctly."
                  else
                      echo "TEST FAILED: InternalRequest was not created correctly."
                      exit_code=1
                  fi
              }

              function test_oras_pull() {
                  if assert_cmd_called_with oras pull --registry-config /tmp/mock-authfile quay.io/test/test@sha256:12345; then
                      echo "TEST PASSED: oras pull was called correctly."
                  else
                      echo "TEST FAILED: oras pull was not called correctly."
                      exit_code=1
                  fi
              }

              function test_oras_manifest_fetch() {
                  if assert_cmd_called_with oras manifest fetch quay.io/test/test@sha256:12345 --registry-config /tmp/mock-authfile; then
                      echo "TEST PASSED: oras manifest fetch was called correctly."
                  else
                      echo "TEST FAILED: oras manifest fetch was not called correctly."
                      exit_code=1
                  fi
              }

              test_internal_request
              test_oras_pull
              test_oras_manifest_fetch

              exit $exit_code
