---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-filter-by-pyxis-incomplete-no-rpm-manifest
spec:
  description: |
    When Pyxis returns an image with no rpm_manifest at all (push-rpm-data-to-pyxis
    never ran), the component must be kept. skip_release must be false.
  params:
    - name: ociStorage
      type: string
    - name: orasOptions
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      type: string
      default: ""
    - name: dataDir
      type: string
  tasks:
    - name: setup
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: ociStorage
            type: string
          - name: orasOptions
            type: string
          - name: dataDir
            type: string
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: ORAS_OPTIONS
              value: $(params.orasOptions)
        steps:
          - name: create-test-data
            image: quay.io/konflux-ci/release-service-utils:cee1fd0191e750b0736d8197701d91ce2f308e03
            script: |
              #!/usr/bin/env bash
              set -eu
              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot.json" << 'EOF'
              {
                "componentGroup": "test-app",
                "components": [
                  {
                    "name": "comp1",
                    "containerImage": "quay.io/test/comp1@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc",
                    "repositories": [{ "url": "quay.io/redhat-pending/comp1", "tags": ["latest"] }]
                  }
                ]
              }
              EOF
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << 'EOF'
              { "pyxis": { "secret": "pyxis", "server": "production" } }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-filter
      runAfter:
        - setup
      taskRef:
        name: filter-already-released-by-pyxis-and-file-updates
      params:
        - name: snapshotPath
          value: "$(context.pipelineRun.uid)/snapshot.json"
        - name: dataPath
          value: "$(context.pipelineRun.uid)/data.json"
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: pyxisSecret
          value: "pyxis"
        - name: pyxisServer
          value: "production"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "https://github.com/konflux-ci/release-service-catalog.git"
        - name: taskGitRevision
          value: "development"
    - name: verify-results
      runAfter:
        - run-filter
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-filter.results.sourceDataArtifact)=$(params.dataDir)"
        - name: orasOptions
          value: $(params.orasOptions)
        - name: dataDir
          value: $(params.dataDir)
        - name: snapshotPath
          value: "$(context.pipelineRun.uid)/snapshot.json"
        - name: skipRelease
          value: "$(tasks.run-filter.results.skip_release)"
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: orasOptions
            type: string
          - name: dataDir
            type: string
          - name: snapshotPath
            type: string
          - name: skipRelease
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: ORAS_OPTIONS
              value: $(params.orasOptions)
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-component-kept
            image: quay.io/konflux-ci/release-service-utils:cee1fd0191e750b0736d8197701d91ce2f308e03
            script: |
              #!/usr/bin/env bash
              set -eu
              FILTERED_SNAPSHOT="$(params.dataDir)/$(params.snapshotPath)"
              COUNT=$(jq '.components | length' "${FILTERED_SNAPSHOT}")
              if [ "${COUNT}" -ne 1 ]; then
                echo "ERROR: Expected component to be kept (no rpm_manifest), found ${COUNT} components"
                exit 1
              fi
              if [ "$(params.skipRelease)" = "true" ]; then
                echo "ERROR: Expected skip_release=false when Pyxis record has no rpm_manifest"
                exit 1
              fi
