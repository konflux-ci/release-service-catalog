---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-filter-empty-snapshot
spec:
  description: |
    Snapshot with an empty components array. The task must set skip_release=true and exit
    before the Pyxis loop — this is distinct from "all components filtered" because it
    takes a dedicated early-exit path (before fileUpdates or Pyxis checks run).
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: >-
        Expiration date for the trusted artifacts created in the OCI repository.
        An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: >-
        Flag to enable debug logging in trusted artifacts.
        Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: ociStorage
            type: string
          - name: orasOptions
            type: string
          - name: dataDir
            type: string
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: ORAS_OPTIONS
              value: $(params.orasOptions)
        steps:
          - name: create-test-data
            image: quay.io/konflux-ci/release-service-utils:cee1fd0191e750b0736d8197701d91ce2f308e03
            script: |
              #!/usr/bin/env bash
              set -eu

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot.json" << 'EOF'
              {
                "componentGroup": "test-app",
                "components": []
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << 'EOF'
              {}
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-filter
      runAfter:
        - setup
      taskRef:
        name: filter-already-released-by-pyxis-and-file-updates
      params:
        - name: snapshotPath
          value: "$(context.pipelineRun.uid)/snapshot.json"
        - name: dataPath
          value: "$(context.pipelineRun.uid)/data.json"
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: pyxisSecret
          value: "pyxis"
        - name: pyxisServer
          value: "production"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "https://github.com/konflux-ci/release-service-catalog.git"
        - name: taskGitRevision
          value: "development"
    - name: verify-results
      runAfter:
        - run-filter
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-filter.results.sourceDataArtifact)=$(params.dataDir)"
        - name: orasOptions
          value: $(params.orasOptions)
        - name: dataDir
          value: $(params.dataDir)
        - name: snapshotPath
          value: "$(context.pipelineRun.uid)/snapshot.json"
        - name: skipRelease
          value: "$(tasks.run-filter.results.skip_release)"
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: orasOptions
            type: string
          - name: dataDir
            type: string
          - name: snapshotPath
            type: string
          - name: skipRelease
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: ORAS_OPTIONS
              value: $(params.orasOptions)
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-filtered-snapshot
            image: quay.io/konflux-ci/release-service-utils:cee1fd0191e750b0736d8197701d91ce2f308e03
            script: |
              #!/usr/bin/env bash
              set -eu

              FILTERED_SNAPSHOT="$(params.dataDir)/$(params.snapshotPath)"
              COUNT=$(jq '.components | length' "${FILTERED_SNAPSHOT}")

              if [ "${COUNT}" -ne 0 ]; then
                echo "ERROR: Expected empty components array to be preserved, got ${COUNT}"
                exit 1
              fi

              if [ "$(params.skipRelease)" != "true" ]; then
                echo "ERROR: Expected skip_release=true for empty snapshot"
                exit 1
              fi
