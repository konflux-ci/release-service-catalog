---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: promote-koji-draft-build
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: promote-koji
spec:
  description: |-
    Tekton task to promote draft build in koji instance.
  params:
    - name: snapshotPath
      type: string
      description: |
        Path to the JSON file of the mapped Snapshot spec in the data workspace
    - name: dataPath
      type: string
      description: |
        Path to the JSON file of the merged data to use in the data workspace
    - name: pushSecret
      type: string
      description: |
        The secret that is used for login koji instance
    - name: pipelineImage
      type: string
      description: |
        Image that provides koji client configuration (/etc/koji.conf and
        /etc/koji.conf.d). Profiles are copied from this image; the promote step
        runs in the release-service-utils image
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
  volumes:
    - name: secret-volume
      secret:
        secretName: $(params.pushSecret)
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: copy-koji-config
      image: $(params.pipelineImage)
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        dest="/var/workdir/koji-client-config"
        rm -rf "${dest}"
        mkdir -p "${dest}/config.d"
        if [[ -f /etc/koji.conf ]]; then
          cp -aL /etc/koji.conf "${dest}/config"
        fi
        if [[ -d /etc/koji.conf.d ]]; then
          find -L /etc/koji.conf.d -maxdepth 1 -type f -exec cp -aL {} "${dest}/config.d/" \;
        fi
    - name: promote-koji-draft-build
      image: quay.io/lgallovi-test/release-service-utils@sha256:62a01e58b9b536cc876756e3edd20fefd32626475e690cf74378d5808bcc04c8
      computeResources:
        limits:
          memory: 384Mi
        requests:
          memory: 384Mi
          cpu: 300m
      env:
        - name: SNAPSHOT_SPEC_FILE
          value: $(params.dataDir)/$(params.snapshotPath)
        - name: DATA_FILE
          value: $(params.dataDir)/$(params.dataPath)
        - name: DATA_DIR
          value: $(params.dataDir)
        - name: SECRET_MOUNT
          value: /etc/secret
        - name: KINIT_RETRIES
          value: "10"
        - name: KOJI_CONFIG_SOURCE
          value: /var/workdir/koji-client-config
      command: ["python3", "-m", "release_service_utils.tasks.managed.promote_koji_draft_build"]
      volumeMounts:
        - mountPath: /etc/secret
          name: secret-volume
          readOnly: true
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
