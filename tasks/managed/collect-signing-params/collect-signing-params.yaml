---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: collect-signing-params
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to collect Konflux configuration parameters related to
    keyless signing using cosign. The task attempts to read the "cluster-config"
    ConfigMap in the "konflux-info" namespace to extract signing parameters.

    In case the ConfigMap is not found, the task will output empty strings for all parameters,
    allowing the pipeline to continue without signing parameters.
  params:
    - name: configMapName
      type: string
      description: The name of the ConfigMap to read signing parameters from
      default: cluster-config
    - name: configMapNamespace
      type: string
      description: The namespace where the ConfigMap is located
      default: konflux-info
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: enableKeylessSigning
      type: string
      description: |
        A flag indicating whether keyless signing should be enabled, based on the presence of signing parameters.
    - name: defaultOIDCIssuer
      type: string
      description: |
        A default OIDC issuer URL to be used for signing.
    - name: rekorExternalUrl
      type: string
      description: |
        The external URL of the Rekor transparency log.
    - name: rekorUrl
      type: string
      description: |
        The internal URL of the Rekor transparency log.
    - name: fulcioExternalUrl
      type: string
      description: |
        The external URL of the Fulcio certificate authority.
    - name: fulcioUrl
      type: string
      description: |
        The internal URL of the Fulcio certificate authority.
    - name: tufExternalUrl
      type: string
      description: |
        The external URL of the TUF repository.
    - name: tufUrl
      type: string
      description: |
        The internal URL of the TUF repository.
    - name: buildIdentityRegexp
      type: string
      description: |
        A regular expression to extract build identity from the OIDC token claims, if applicable.
    - name: tektonChainsIdentity
      type: string
      description: |
        The identity used in the certificate, generated by fulcio.

  volumes:
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    securityContext:
      runAsUser: 1001
  steps:
    - name: collect-signing-params
      image:
        quay.io/lgallovi-test/release-service-utils:shq-test
      computeResources:
        limits:
          memory: 128Mi
          cpu: 50m
        requests:
          memory: 128Mi
          cpu: 50m
      script: |
        #!/usr/bin/env bash
        echo "Getting $(params.configMapName) ConfigMap"
        KFLX_CONFIG_PATH='/tmp/konflux_config.json'

        # Attempt to fetch the ConfigMap with retries, capture exit code
        if retry 3 kubectl get configmap "$(params.configMapName)" -n "$(params.configMapNamespace)" -o json > \
        "$KFLX_CONFIG_PATH" 2>/dev/null; then
            echo "ConfigMap found, extracting signing parameters"

            # Extract signing parameters from ConfigMap data, defaulting to empty string if not found
            enableKeylessSigning=$(jq -r '.data.enableKeylessSigning // ""' "$KFLX_CONFIG_PATH")
            defaultOIDCIssuer=$(jq -r '.data.defaultOIDCIssuer // ""' "$KFLX_CONFIG_PATH")
            rekorExternalUrl=$(jq -r '.data.rekorExternalUrl // ""' "$KFLX_CONFIG_PATH")
            rekorInternalUrl=$(jq -r '.data.rekorInternalUrl // ""' "$KFLX_CONFIG_PATH")
            fulcioExternalUrl=$(jq -r '.data.fulcioExternalUrl // ""' "$KFLX_CONFIG_PATH")
            fulcioInternalUrl=$(jq -r '.data.fulcioInternalUrl // ""' "$KFLX_CONFIG_PATH")
            tufExternalUrl=$(jq -r '.data.tufExternalUrl // ""' "$KFLX_CONFIG_PATH")
            tufInternalUrl=$(jq -r '.data.tufInternalUrl // ""' "$KFLX_CONFIG_PATH")
            buildIdentityRegexp=$(jq -r '.data.buildIdentityRegexp // ""' "$KFLX_CONFIG_PATH")
            tektonChainsIdentity=$(jq -r '.data.tektonChainsIdentity // ""' "$KFLX_CONFIG_PATH")
        else
            echo "ConfigMap not found, using default empty values"

            # Set all parameters to empty strings when ConfigMap doesn't exist
            enableKeylessSigning="false"
            defaultOIDCIssuer=""
            rekorExternalUrl=""
            rekorInternalUrl=""
            fulcioExternalUrl=""
            fulcioInternalUrl=""
            tufExternalUrl=""
            tufInternalUrl=""
            buildIdentityRegexp=""
            tektonChainsIdentity=""
        fi

        # Write the values to the respective result paths and print them
        echo -n "$enableKeylessSigning" | tee "$(results.enableKeylessSigning.path)"
        echo -n "$defaultOIDCIssuer" | tee "$(results.defaultOIDCIssuer.path)"
        echo -n "$rekorExternalUrl" | tee "$(results.rekorExternalUrl.path)"
        prefer_internal_or_external() {
          local internal="$1"
          local external="$2"
          local result_path="$3"

          if [ -n "$internal" ]; then
            echo -n "$internal" | tee "$result_path"
          else
            echo -n "$external" | tee "$result_path"
          fi
        }

        prefer_internal_or_external "$rekorInternalUrl" "$rekorExternalUrl" "$(results.rekorUrl.path)"
        echo -n "$fulcioExternalUrl" | tee "$(results.fulcioExternalUrl.path)"
        prefer_internal_or_external "$fulcioInternalUrl" "$fulcioExternalUrl" "$(results.fulcioUrl.path)"
        echo -n "$tufExternalUrl" | tee "$(results.tufExternalUrl.path)"
        prefer_internal_or_external "$tufInternalUrl" "$tufExternalUrl" "$(results.tufUrl.path)"
        echo -n "$buildIdentityRegexp" | tee "$(results.buildIdentityRegexp.path)"
        echo -n "$tektonChainsIdentity" | tee "$(results.tektonChainsIdentity.path)"
