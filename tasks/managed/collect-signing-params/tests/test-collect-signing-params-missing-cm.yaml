---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-collect-signing-params-missing-cm
spec:
  description: |
    Run the collect-signing-params task with a missing ConfigMap.
  tasks:
    - name: run-task
      taskRef:
        name: collect-signing-params
    - name: check-result
      params:
        - name: enableKeylessSigning
          value: $(tasks.run-task.results.enableKeylessSigning)
        - name: defaultOIDCIssuer
          value: $(tasks.run-task.results.defaultOIDCIssuer)
        - name: rekorExternalUrl
          value: $(tasks.run-task.results.rekorExternalUrl)
        - name: rekorUrl
          value: $(tasks.run-task.results.rekorUrl)
        - name: fulcioExternalUrl
          value: $(tasks.run-task.results.fulcioExternalUrl)
        - name: fulcioUrl
          value: $(tasks.run-task.results.fulcioUrl)
        - name: tufExternalUrl
          value: $(tasks.run-task.results.tufExternalUrl)
        - name: tufUrl
          value: $(tasks.run-task.results.tufUrl)
        - name: buildIdentityRegexp
          value: $(tasks.run-task.results.buildIdentityRegexp)
        - name: tektonChainsIdentity
          value: $(tasks.run-task.results.tektonChainsIdentity)
      taskSpec:
        params:
          - name: enableKeylessSigning
            type: string
          - name: defaultOIDCIssuer
            type: string
          - name: rekorExternalUrl
            type: string
          - name: rekorUrl
            type: string
          - name: fulcioExternalUrl
            type: string
          - name: fulcioUrl
            type: string
          - name: tufExternalUrl
            type: string
          - name: tufUrl
            type: string
          - name: buildIdentityRegexp
            type: string
          - name: tektonChainsIdentity
            type: string
        steps:
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
            env:
              - name: "ENABLE_KEYLESS_SIGNING"
                value: '$(params.enableKeylessSigning)'
              - name: "DEFAULT_OIDC_ISSUER"
                value: '$(params.defaultOIDCIssuer)'
              - name: "REKOR_EXTERNAL_URL"
                value: '$(params.rekorExternalUrl)'
              - name: "REKOR_URL"
                value: '$(params.rekorUrl)'
              - name: "FULCIO_EXTERNAL_URL"
                value: '$(params.fulcioExternalUrl)'
              - name: "FULCIO_URL"
                value: '$(params.fulcioUrl)'
              - name: "TUF_EXTERNAL_URL"
                value: '$(params.tufExternalUrl)'
              - name: "TUF_URL"
                value: '$(params.tufUrl)'
              - name: "BUILD_IDENTITY_REGEXP"
                value: '$(params.buildIdentityRegexp)'
              - name: "CERTIFICATE_IDENTITY"
                value: '$(params.tektonChainsIdentity)'
            script: |
              #!/usr/bin/env bash
              set -eux

              test "$ENABLE_KEYLESS_SIGNING" = "false"
              test "$DEFAULT_OIDC_ISSUER" = ""
              test "$REKOR_EXTERNAL_URL" = ""
              test "$REKOR_URL" = ""
              test "$FULCIO_EXTERNAL_URL" = ""
              test "$FULCIO_URL" = ""
              test "$TUF_EXTERNAL_URL" = ""
              test "$TUF_URL" = ""
              test "$BUILD_IDENTITY_REGEXP" = ""
              test "$CERTIFICATE_IDENTITY" = ""
