---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-collect-signing-params
spec:
  description: |
    Run the collect-signing-params task with an available ConfigMap.
  tasks:
    - name: setup
      taskSpec:
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -eux

              kubectl create configmap cluster-config --namespace "$(context.pipelineRun.namespace)" \
                --from-literal=enableKeylessSigning=true \
                --from-literal=defaultOIDCIssuer=oidcIssuerValue \
                --from-literal=rekorExternalUrl=rekorUrlValue \
                --from-literal=rekorInternalUrl=rekorInternalUrlValue \
                --from-literal=fulcioExternalUrl=fulcioUrlValue \
                --from-literal=fulcioInternalUrl=fulcioInternalUrlValue \
                --from-literal=tufExternalUrl=tufUrlValue \
                --from-literal=tufInternalUrl=tufInternalUrlValue \
                --from-literal=buildIdentityRegexp=buildIdentityRegexpValue
    - name: run-task
      taskRef:
        name: collect-signing-params
      params:
        - name: configMapNamespace
          value: "$(context.pipelineRun.namespace)"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: enableKeylessSigning
          value: $(tasks.run-task.results.enableKeylessSigning)
        - name: defaultOIDCIssuer
          value: $(tasks.run-task.results.defaultOIDCIssuer)
        - name: rekorExternalUrl
          value: $(tasks.run-task.results.rekorExternalUrl)
        - name: rekorInternalUrl
          value: $(tasks.run-task.results.rekorInternalUrl)
        - name: fulcioExternalUrl
          value: $(tasks.run-task.results.fulcioExternalUrl)
        - name: fulcioInternalUrl
          value: $(tasks.run-task.results.fulcioInternalUrl)
        - name: tufExternalUrl
          value: $(tasks.run-task.results.tufExternalUrl)
        - name: tufInternalUrl
          value: $(tasks.run-task.results.tufInternalUrl)
        - name: buildIdentityRegexp
          value: $(tasks.run-task.results.buildIdentityRegexp)
      taskSpec:
        params:
          - name: enableKeylessSigning
            type: string
          - name: defaultOIDCIssuer
            type: string
          - name: rekorExternalUrl
            type: string
          - name: rekorInternalUrl
            type: string
          - name: fulcioExternalUrl
            type: string
          - name: fulcioInternalUrl
            type: string
          - name: tufExternalUrl
            type: string
          - name: tufInternalUrl
            type: string
          - name: buildIdentityRegexp
            type: string
        steps:
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            env:
              - name: "ENABLE_KEYLESS_SIGNING"
                value: '$(params.enableKeylessSigning)'
              - name: "DEFAULT_OIDC_ISSUER"
                value: '$(params.defaultOIDCIssuer)'
              - name: "REKOR_EXTERNAL_URL"
                value: '$(params.rekorExternalUrl)'
              - name: "REKOR_INTERNAL_URL"
                value: '$(params.rekorInternalUrl)'
              - name: "FULCIO_EXTERNAL_URL"
                value: '$(params.fulcioExternalUrl)'
              - name: "FULCIO_INTERNAL_URL"
                value: '$(params.fulcioInternalUrl)'
              - name: "TUF_EXTERNAL_URL"
                value: '$(params.tufExternalUrl)'
              - name: "TUF_INTERNAL_URL"
                value: '$(params.tufInternalUrl)'
              - name: "BUILD_IDENTITY_REGEXP"
                value: '$(params.buildIdentityRegexp)'
            script: |
              #!/usr/bin/env bash
              set -eux

              test "$ENABLE_KEYLESS_SIGNING" = "true"
              test "$DEFAULT_OIDC_ISSUER" = "oidcIssuerValue"
              test "$REKOR_EXTERNAL_URL" = "rekorUrlValue"
              test "$REKOR_INTERNAL_URL" = "rekorInternalUrlValue"
              test "$FULCIO_EXTERNAL_URL" = "fulcioUrlValue"
              test "$FULCIO_INTERNAL_URL" = "fulcioInternalUrlValue"
              test "$TUF_EXTERNAL_URL" = "tufUrlValue"
              test "$TUF_INTERNAL_URL" = "tufInternalUrlValue"
              test "$BUILD_IDENTITY_REGEXP" = "buildIdentityRegexpValue"
  finally:
    - name: cleanup
      taskSpec:
        steps:
          - name: delete-configmap
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env sh
              set -eux

              kubectl delete configmap cluster-config --namespace "$(context.pipelineRun.namespace)" --ignore-not-found
