---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-extract-index-image
spec:
  description: |
    Run extract-index-image and verify the task completes successfully for a single component.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
            script: |
              #!/usr/bin/env sh
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)/results"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/results/internal-request-results.json" << EOF
              {
                "components": [
                  {
                    "ocp_version": "v4.12",
                    "index_image": "redhat.com/rh-stage/iib:01",
                    "index_image_resolved": "redhat.com/rh-stage/iib@sha256:abcdefghijk"
                  }
                ]
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: extract-index-image
      params:
        - name: resultsDirPath
          value: $(context.pipelineRun.uid)/results
        - name: internalRequestResultsFile
          value: "$(context.pipelineRun.uid)/results/internal-request-results.json"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
            script: |
              #!/usr/bin/env bash
              set -eux

              results_file="$(params.dataDir)/$(context.pipelineRun.uid)/results/extract-index-image-results.json"

              actual_image="$(jq -r '.index_image."v4.12".index_image' "${results_file}")"
              if [ "${actual_image}" != "redhat.com/rh-stage/iib:01" ]; then
                echo "ERROR: unexpected index_image: ${actual_image}"
                exit 1
              fi

              actual_resolved="$(jq -r '.index_image."v4.12".index_image_resolved' "${results_file}")"
              if [ "${actual_resolved}" != "redhat.com/rh-stage/iib@sha256:abcdefghijk" ]; then
                echo "ERROR: unexpected index_image_resolved: ${actual_resolved}"
                exit 1
              fi

              version_count="$(jq '.index_image | keys | length' "${results_file}")"
              if [ "${version_count}" != "1" ]; then
                echo "ERROR: expected exactly one OCP version, got ${version_count}"
                exit 1
              fi
      runAfter:
        - run-task
