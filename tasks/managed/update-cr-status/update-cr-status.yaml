---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: update-cr-status
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    A tekton task that updates the passed CR status with the contents stored in the files in the resultsDir.
  params:
    - name: resourceType
      description: The type of resource that is being patched
      type: string
      default: release
    - name: statusKey
      description: The top level key to overwrite in the resource status
      type: string
      default: artifacts
    - name: resource
      description: The namespaced name of the resource to be patched
      type: string
    - name: resultsDirPath
      description: |
        Path to the directory containing the result files in the data workspace which will be added to the
        resource's status
      type: string
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: resultArtifacts
      type: array
      description: Array of artifacts to use to obtain results
      default: []
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: $(workspaces.data.path)
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
  workspaces:
    - name: data
      description: Workspace where the results directory is stored
  volumes:
    - name: workdir
      emptyDir: {}
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
  steps:
    - name: skip-trusted-artifact-operations
      computeResources:
        limits:
          memory: 32Mi
        requests:
          memory: 32Mi
          cpu: 20m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/skip-trusted-artifact-operations/skip-trusted-artifact-operations.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
    - name: use-trusted-artifact-array
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 20m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact-array/use-trusted-artifact-array.yaml
      params:
        - name: sourceDataArtifacts
          value: $(params.resultArtifacts)
    - name: update-cr-status
      image: quay.io/konflux-ci/release-service-utils:e633d51cd41d73e4b3310face21bb980af7a662f
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 50m
      script: |
        #!/usr/bin/env bash
        set -ex

        # Use temporary files to avoid command line argument length limits
        RESULTS_JSON_FILE=$(mktemp)
        RESULTS_DIR="$(params.dataDir)/$(params.resultsDirPath)"
        FIRST_FILE=true
        
        for resultsFile in $([ -d "$RESULTS_DIR" ] && find "$RESULTS_DIR" -type f); do
            if ! jq . >/dev/null 2>&1 "${resultsFile}" ; then
                echo "Passed results JSON file ${resultsFile} in results directory was not proper JSON."
                exit 1
            fi
            
            if [ "$FIRST_FILE" = true ]; then
                # For the first file, just copy it directly
                jq -c '.' "${resultsFile}" > "$RESULTS_JSON_FILE"
                FIRST_FILE=false
            else
                # For subsequent files, merge with existing content
                TMP_RESULT=$(mktemp)
                # Get the types of both files
                EXISTING_TYPE=$(jq -r 'type' "$RESULTS_JSON_FILE")
                NEW_TYPE=$(jq -r 'type' "${resultsFile}")
                
                echo "Merging files: existing type=$EXISTING_TYPE, new type=$NEW_TYPE"
                
                # Always merge as objects to ensure compatibility with Kubernetes CR
                if [ "$EXISTING_TYPE" = "object" ] && [ "$NEW_TYPE" = "object" ]; then
                    echo "Both are objects, merging with conflict resolution..."
                    # Use a more robust merge that handles nested conflicts
                    jq -c '
                    def safe_merge(a; b):
                        if a == null then b
                        elif b == null then a
                        elif (a | type) == "object" and (b | type) == "object" then
                            a + b
                        elif (a | type) == "array" and (b | type) == "array" then
                            a + b
                        elif (a | type) == "array" or (b | type) == "array" then
                            # If either is an array, convert both to arrays and concatenate
                            (if (a | type) == "array" then a else [a] end) + (if (b | type) == "array" then b else [b] end)
                        else
                            # For other types, prefer the new value
                            b
                        end;
                    with_entries(
                        .key as $k
                        | .value = safe_merge(.[$k]; $newData[0][$k])
                    )
                    ' --slurpfile newData <(jq -c '.' "${resultsFile}") "$RESULTS_JSON_FILE" > "$TMP_RESULT"
                elif [ "$EXISTING_TYPE" = "array" ] && [ "$NEW_TYPE" = "array" ]; then
                    echo "Both are arrays, converting to object and merging..."
                    # Convert both arrays to objects with descriptive keys
                    jq -c '{"array_results": .}' "$RESULTS_JSON_FILE" > "$TMP_RESULT"
                    mv "$TMP_RESULT" "$RESULTS_JSON_FILE"
                    jq -c '. * {"additional_results": $newData}' --slurpfile newData <(jq -c '.' "${resultsFile}") "$RESULTS_JSON_FILE" > "$TMP_RESULT"
                else
                    # Mixed types - convert everything to objects
                    echo "Mixed types, converting to objects and merging..."
                    # Convert existing to object if needed
                    if [ "$EXISTING_TYPE" = "array" ]; then
                        echo "Converting existing array to object..."
                        jq -c '{"array_results": .}' "$RESULTS_JSON_FILE" > "$TMP_RESULT"
                        mv "$TMP_RESULT" "$RESULTS_JSON_FILE"
                    fi
                    # Convert new data to object if needed and merge
                    if [ "$NEW_TYPE" = "array" ]; then
                        echo "Converting new array to object and merging..."
                        jq -c '. * {"additional_results": $newData}' --slurpfile newData <(jq -c '.' "${resultsFile}") "$RESULTS_JSON_FILE" > "$TMP_RESULT"
                    else
                        echo "Merging new object with existing..."
                        jq -c '. * $newData' --slurpfile newData <(jq -c '.' "${resultsFile}") "$RESULTS_JSON_FILE" > "$TMP_RESULT"
                    fi
                fi
                mv "$TMP_RESULT" "$RESULTS_JSON_FILE"
            fi
        done
        
        # Create patch file to avoid command line argument length limits
        PATCH_FILE=$(mktemp)
        jq -n --arg statusKey "$(params.statusKey)" --slurpfile resultsData "$RESULTS_JSON_FILE" \
          '{"status": {($statusKey): $resultsData[0]}}' > "$PATCH_FILE"
        
        # Clean up results file
        rm -f "$RESULTS_JSON_FILE"

        IFS='/' read -r namespace name <<< "$(params.resource)"

        kubectl --warnings-as-errors=true patch "$(params.resourceType)" -n "$namespace" "$name" \
          --type=merge --subresource status --patch-file "$PATCH_FILE"
        
        # Clean up patch file
        rm -f "$PATCH_FILE"
