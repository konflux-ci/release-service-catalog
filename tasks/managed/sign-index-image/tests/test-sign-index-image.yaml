---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-sign-index-image
spec:
  description: >-
    Happy-path smoke test for sign-index-image.
    Other scenarios are covered by pytest in release-service-utils.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/lgallovi-test/release-service-utils@sha256:4cc5176e207653d7792714a2766c3fc4fff5efd60a6b095f4bbdc8f2772072ef
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "intention": "staging",
                "sign": {
                  "configMapName": "signing-config-map"
                }
              }
              EOF
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/release_plan_admission.json" << EOF
              {
                "spec": {
                  "pipeline": {
                    "serviceAccountName": "release-service-account"
                  }
                }
              }
              EOF
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/fbcResults.json" << EOF
              {
                  "components": [
                      {
                          "target_index": "quay.io/testrepo/testimage:tag",
                          "rh-registry-repo": "registry.redhat.io/testrepo",
                          "image_digests": [
                              "sha256:6f9a420f660e73a",
                              "sha256:6f9a420f660e73b"
                          ]
                      }
                  ]
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: sign-index-image
      params:
        - name: requester
          value: testuser
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: dataPath
          value: $(context.pipelineRun.uid)/data.json
        - name: releasePlanAdmissionPath
          value: $(context.pipelineRun.uid)/release_plan_admission.json
        - name: fbcResultsPath
          value: $(context.pipelineRun.uid)/fbcResults.json
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
        - name: pyxisSecret
          value: test-create-pyxis-image-cert
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/lgallovi-test/release-service-utils@sha256:4cc5176e207653d7792714a2766c3fc4fff5efd60a6b095f4bbdc8f2772072ef
            script: |
              #!/usr/bin/env bash
              set -euxo pipefail

              mock_file="$(params.dataDir)/mock_internal_request.txt"
              if [ ! -f "${mock_file}" ]; then
                echo "internal-request was not called"
                exit 1
              fi

              args=$(cat "${mock_file}")

              if ! echo "${args}" | grep -q "requester=testuser"; then
                echo "Expected requester=testuser in args: ${args}"
                exit 1
              fi

              if ! echo "${args}" | grep -q "signer_type=batch"; then
                echo "Expected signer_type=batch in args: ${args}"
                exit 1
              fi

              if ! echo "${args}" | grep -q "pyxis_url=https://pyxis.stage.engineering.redhat.com"; then
                echo "Expected pyxis_url in args: ${args}"
                exit 1
              fi

              if ! echo "${args}" | grep -q -- "--pipeline simple-signing-pipeline"; then
                echo "Expected --pipeline simple-signing-pipeline in args: ${args}"
                exit 1
              fi

              echo "All checks passed"
      runAfter:
        - run-task
