---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-sign-index-image-idempotence
spec:
  description: |
    Verify that sign-index-image is idempotent by checking if it queries Pyxis for existing signatures
    and skips signing when a signature already exists for the same tag.
  workspaces:
    - name: tests-workspace
  tasks:
    - name: setup
      workspaces:
        - name: tests-workspace
          workspace: tests-workspace
      taskSpec:
        workspaces:
          - name: tests-workspace
        steps:
          - name: setup-test-data
            image: quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils:on-pr-b004121ef1974a4ed3a15c9d3f66477b291b8bcb
            script: |
              #!/usr/bin/env bash
              set -ex

              WORKSPACE_DIR="$(workspaces.tests-workspace.path)"

              # Create mock FBC results file with components
              cat > "$WORKSPACE_DIR/fbc-results.json" <<EOF
              {
                "components": [
                  {
                    "target_index": "registry.redhat.io/test/catalog:v4.14",
                    "rh-registry-repo": "registry.redhat.io/test",
                    "image_digests": ["sha256:abc123def456"]
                  },
                  {
                    "target_index": "registry.redhat.io/test/catalog:v4.15",
                    "rh-registry-repo": "registry.redhat.io/test",
                    "image_digests": ["sha256:abc123def456"]
                  }
                ]
              }
              EOF

              # Create mock data file
              cat > "$WORKSPACE_DIR/data.json" <<EOF
              {
                "sign": {
                  "request": "simple-signing-pipeline",
                  "pipelineImage": "quay.io/test/pipeline:latest",
                  "configMapName": "signing-config"
                }
              }
              EOF

              echo "Test data created successfully"

    - name: verify-idempotence-logic
      runAfter: [setup]
      workspaces:
        - name: tests-workspace
          workspace: tests-workspace
      taskSpec:
        workspaces:
          - name: tests-workspace
        steps:
          - name: verify-signature-check
            image: quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils:on-pr-b004121ef1974a4ed3a15c9d3f66477b291b8bcb
            script: |
              #!/usr/bin/env bash
              set -eux

              reference_v414="registry.redhat.io/test/catalog:v4.14"
              reference_v415="registry.redhat.io/test/catalog:v4.15"
              manifest_digest="sha256:abc123def456"
              # Same path pattern as sign-index-image (per manifest digest and repository)
              signing_key="test-signing-key"
              repository_path="test"
              repo_suffix="$(echo "${repository_path}" | tr '/:' '__')"
              sigfile="/tmp/${manifest_digest//:/_}__${repo_suffix}"

              # Mock find_signatures output: one line per "reference signing_key" the task greps for
              rm -f "${sigfile}"
              {
                echo "${reference_v414} ${signing_key}"
              } > "${sigfile}"

              # Verify v4.14 already signed for this key (task would skip that row)
              if ! grep -q "^${reference_v414} ${signing_key}\$" "${sigfile}"; then
                echo "ERROR: v4.14 not marked signed for key ${signing_key}"
                exit 1
              fi

              # Verify v4.15 not signed yet (new tag for same digest — should still sign)
              if grep -q "^${reference_v415} ${signing_key}\$" "${sigfile}"; then
                echo "ERROR: v4.15 should not be treated as signed yet"
                exit 1
              fi
