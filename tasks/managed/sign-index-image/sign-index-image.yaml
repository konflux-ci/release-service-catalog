---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sign-index-image
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Creates an InternalRequest to sign an index image

    ## Signing data parameters

     The signing configuration should be set as `data.sign` in the _releasePlanAdmission_. Previously it used to be
     set also in the `data.fbc`. The data should be set in the _ReleasePlanAdmission_ as follows:

    ```
    data:
        sign:
            request: <signing pipeline name>
            pipelineImage: <image pullspec>
            configMapName: <configmap name>
    ```
  params:
    - name: dataPath
      description: Path to the JSON string of the merged data to use in the data workspace
      type: string
    - name: releasePlanAdmissionPath
      description: Path to the JSON string of the releasePlanAdmission in the data workspace
      type: string
    - name: requester
      type: string
      description: Name of the user that requested the signing, for auditing purposes
    - name: requestTimeout
      type: string
      default: "1800"
      description: InternalRequest timeout
    - name: pipelineRunUid
      type: string
      description: The uid of the current pipelineRun. Used as a label value when creating internal requests
    - name: fbcResultsPath
      type: string
      description: Path to the JSON file in the data workspace containing fbc results
    - name: concurrentLimit
      type: string
      description: The maximum number of concurrent signing requests
      default: 16
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: pyxisServer
      type: string
      description: The server type to use. Options are 'production','production-internal,'stage-internal' and 'stage'
      default: production
    - name: pyxisSecret
      type: string
      description: |
        The kubernetes secret to use to authenticate to Pyxis. It needs to contain two keys: key and cert
    - name: batchLimit
      type: string
      description: |
        size of batch attributes to send to internal-request. As internal request arguments are need to be
        strings, size here represent maximal string length of `references` and `manifest_digests` sent to
        internal request
      default: 4096
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
    - name: failOnSignatureLookupError
      type: string
      default: "true"
      description: |
        Fail the task when any Pyxis find_signatures lookup fails; when set to "false", log a warning
        and submit every planned image row for signing without skipping already-signed references
    - name: signatureLookupMaxAttempts
      type: string
      default: "3"
      description: |
        Maximum number of attempts per Pyxis find_signatures lookup including the first; waits
        (attempt-1)*2 seconds before each retry after the first; use "1" to disable retries
  results:
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
  volumes:
    - name: workdir
      emptyDir: {}
    - name: pyxis-secret-vol
      secret:
        secretName: $(params.pyxisSecret)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true

  stepTemplate:
    securityContext:
      runAsUser: 1001
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: sign-index-image
      image: quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
      computeResources:
        limits:
          memory: 1Gi
        requests:
          memory: 1Gi
          cpu: 250m
      volumeMounts:
        - name: pyxis-secret-vol
          mountPath: "/etc/secrets"
      env:
        - name: BATCH_LIMIT
          value: $(params.batchLimit)
      script: |
        #!/usr/bin/env bash
        set -e

        pyxisCert="$(cat /etc/secrets/cert)"
        pyxisKey="$(cat /etc/secrets/key)"

        set -x

        # Initialize memory throttling
        # This file is located at utils/memory-throttle.sh in the release-service-utils image
        # shellcheck source=/dev/null
        source memory-throttle.sh
        # This function is stored in the utils/memory-throttle.sh file
        log_memory_throttle_status 80

        RUNNING_JOBS="\j" # Bash parameter for number of jobs currently running
        CONCURRENT_LIMIT=$(params.concurrentLimit)
        BURST_SIZE=5
        STABILIZATION_DELAY=2
        REQUEST_COUNT=0
        jobs_spawned=0
        jobs_collected=0

        TASK_LABEL="internal-services.appstudio.openshift.io/group-id"
        TASK_ID=$(context.taskRun.uid)
        PIPELINERUN_LABEL="internal-services.appstudio.openshift.io/pipelinerun-uid"
        INTENTION_LABEL="internal-services.appstudio.openshift.io/intention"

        DATA_FILE="$(params.dataDir)/$(params.dataPath)"
        if [ ! -f "${DATA_FILE}" ] ; then
            echo "No valid data file was provided."
            exit 1
        fi

        INTENTION=$(jq -r '.intention // "unknown"' "${DATA_FILE}")

        RESULTS_FILE="$(params.dataDir)/$(params.fbcResultsPath)"
        if [ ! -f "${RESULTS_FILE}" ] ; then
            echo "No valid results file was provided."
            exit 1
        fi

        set +x
        echo "${pyxisCert:?}" > /tmp/crt
        echo "${pyxisKey:?}" > /tmp/key
        set -x

        export PYXIS_CERT_PATH=/tmp/crt
        export PYXIS_KEY_PATH=/tmp/key

        if [[ "$(params.pyxisServer)" == "production" ]]
        then
          PYXIS_GRAPHQL_URL="https://graphql-pyxis.api.redhat.com/graphql/"
        elif [[ "$(params.pyxisServer)" == "stage" ]]
        then
          PYXIS_GRAPHQL_URL="https://graphql-pyxis.preprod.api.redhat.com/graphql/"
        elif [[ "$(params.pyxisServer)" == "production-internal" ]]
        then
          PYXIS_GRAPHQL_URL="https://graphql.pyxis.engineering.redhat.com/graphql/"
        elif [[ "$(params.pyxisServer)" == "stage-internal" ]]
        then
          PYXIS_GRAPHQL_URL="https://graphql.pyxis.stage.engineering.redhat.com/graphql/"
        else
          echo "Invalid pyxisServer parameter. Only 'production','production-internal,'stage-internal' \
              and 'stage' allowed."
          exit 1
        fi

        jqquery='.data|if has ("SIG_KEY_NAMES")
        then (.SIG_KEY_NAMES|split(",")|.[]|gsub("^\\s+|\\s+$";"")) else .SIG_KEY_NAME end'
        config_map_name=$(jq -r '.sign.configMapName // "signing-config-map"' "${DATA_FILE}")
        configMapJson=$(kubectl get "cm/${config_map_name:?}" -ojson)
        SIG_KEY_NAMES=$(jq -er "$jqquery" <<< "${configMapJson}")

        # Resolve UMB topics from configMap: use batch topics if SIGNER_TYPE=batch, else single
        SIGNER_TYPE=$(jq -r '.data.SIGNER_TYPE // "single"' <<< "${configMapJson}")
        if [ "${SIGNER_TYPE}" = "batch" ]; then
          umb_listen_topic=$(jq -er '.data.UMB_BATCH_LISTEN_TOPIC // .data.UMB_LISTEN_TOPIC' <<< "${configMapJson}")
          umb_publish_topic=$(jq -er '.data.UMB_BATCH_PUBLISH_TOPIC // .data.UMB_PUBLISH_TOPIC' <<< "${configMapJson}")
        else
          umb_listen_topic=$(jq -er '.data.UMB_LISTEN_TOPIC' <<< "${configMapJson}")
          umb_publish_topic=$(jq -er '.data.UMB_PUBLISH_TOPIC' <<< "${configMapJson}")
        fi

        signing_pyxis_url=$(jq -er '.data.PYXIS_URL' <<< "${configMapJson}")
        signing_pyxis_ssl_secret=$(jq -er '.data.PYXIS_SSL_CERT_SECRET_NAME' <<< "${configMapJson}")
        signing_umb_client=$(jq -er '.data.UMB_CLIENT_NAME' <<< "${configMapJson}")
        signing_umb_url=$(jq -er '.data.UMB_URL' <<< "${configMapJson}")
        signing_umb_ssl_secret=$(jq -er '.data.UMB_SSL_CERT_SECRET_NAME' <<< "${configMapJson}")

        requestType=$(jq -r '.requestType // "internal-request"' "${DATA_FILE}")
        if [ "${requestType}" == "internal-pipelinerun" ] ; then
          RPA_FILE="$(params.dataDir)/$(params.releasePlanAdmissionPath)"
          if [ ! -f "${RPA_FILE}" ] ; then
              echo "No valid rpa file was provided."
              exit 1
          fi
          service_account_name=$(jq -r '.spec.pipeline.serviceAccountName // "release-service-account"' "${RPA_FILE}")
          EXTRA_ARGS=(
          --service-account "${service_account_name}"
          )
        else
          requestType=internal-request
          EXTRA_ARGS=()
        fi
        request=$(jq -r '.sign.request // "simple-signing-pipeline"' "${DATA_FILE}")

        config_map_name=$(jq -r '.sign.configMapName // .fbc.configMapName // "signing-config-map"' "${DATA_FILE}")

        declare -a to_sign_references=()
        declare -a to_sign_digests=()
        declare -a to_sign_repos=()

        component_count=$(jq '.components | length' "$RESULTS_FILE")
        for ((i = 0; i < component_count; i++)); do
          reference_image=$(jq -r ".components[$i].target_index" "$RESULTS_FILE")

          # Translate direct quay.io reference to public facing registry reference
          # quay.io/redhat/product----repo -> registry.redhat.io/product/repo
          reference_image=$(translate-delivery-repo "$reference_image" \
            | jq -r '.[] | select(.repo=="redhat.io") | .url')

          rh_registry_repo=$(jq -r ".components[$i].\"rh-registry-repo\" // empty" "$RESULTS_FILE")
          repository="${rh_registry_repo#*/}"

          digest_count=$(jq ".components[$i].image_digests | length" "$RESULTS_FILE")
          for ((j = 0; j < digest_count; j++)); do
            manifest_digest=$(jq -r ".components[$i].image_digests[$j]" "$RESULTS_FILE")

            to_sign_references+=("${reference_image}")
            to_sign_digests+=("${manifest_digest}")
            to_sign_repos+=("${repository}")

          done
        done

        # Query Pyxis for existing signatures before creating signing requests.
        # Output path is per (digest, repository) so concurrent jobs never clobber the same file.
        declare -a find_signatures_files=()
        declare -a find_signatures_jobs=()
        FIND_SIGNATURES_SUCCESS=true
        FIND_SIGNATURES_JOB_COUNT=0
        fs_jobs_spawned=0
        fs_jobs_collected=0
        declare -A seen_digest_repo=()

        for i in "${!to_sign_digests[@]}"; do
          pair="${to_sign_digests[$i]}|${to_sign_repos[$i]}"
          if [[ -n "${seen_digest_repo[$pair]+x}" ]]; then
            continue
          fi
          seen_digest_repo[$pair]=1

          manifest_digest="${to_sign_digests[$i]}"
          repository="${to_sign_repos[$i]}"
          repo_suffix="$(echo "${repository}" | tr '/:' '__')"
          sig_out="/tmp/${manifest_digest//:/_}__${repo_suffix}"

          wait_for_memory 80
          while (( ${RUNNING_JOBS@P} >= "$CONCURRENT_LIMIT" )); do
            wait -n || FIND_SIGNATURES_SUCCESS=false
            fs_jobs_collected=$((fs_jobs_collected + 1))
          done

          digest_filename="${manifest_digest//:/_}__${repo_suffix}"
          ((++FIND_SIGNATURES_JOB_COUNT))
          find_signatures_files+=("${digest_filename}")
          echo "Starting find_signatures job for manifest digest: ${manifest_digest} repository: ${repository}"
          (
            set +e
            max_attempts=$(params.signatureLookupMaxAttempts)
            if ! [[ "${max_attempts}" =~ ^[0-9]+$ ]] || [ "${max_attempts}" -lt 1 ]; then
              max_attempts=3
            fi
            attempt=1
            last_exit=1
            while [ "${attempt}" -le "${max_attempts}" ]; do
              if [ "${attempt}" -gt 1 ]; then
                echo "find_signatures retry $((attempt - 1))/$((max_attempts - 1)) for" \
                  "manifest_digest=${manifest_digest} repository=${repository}"
                sleep $(( (attempt - 1) * 2 ))
              fi
              rm -f "${sig_out}"
              find_signatures --pyxis-graphql-api "${PYXIS_GRAPHQL_URL}" \
                --manifest_digest "${manifest_digest}" \
                --repository "${repository}" \
                --output_file "${sig_out}"
              last_exit=$?
              if [ "${last_exit}" -eq 0 ]; then
                exit 0
              fi
              attempt=$((attempt + 1))
            done
            exit "${last_exit}"
          ) > "/tmp/find_sig_${digest_filename}.out" 2> "/tmp/find_sig_${digest_filename}.err" &
          find_signatures_jobs+=($!)
          fs_jobs_spawned=$((fs_jobs_spawned + 1))

          if (( fs_jobs_spawned % BURST_SIZE == 0 )); then
            sleep $STABILIZATION_DELAY
          fi
        done

        echo "Waiting for ${FIND_SIGNATURES_JOB_COUNT} find_signatures jobs to complete..."
        while (( fs_jobs_collected < fs_jobs_spawned )); do
          wait -n || FIND_SIGNATURES_SUCCESS=false
          fs_jobs_collected=$((fs_jobs_collected + 1))
        done
        echo "All find_signatures jobs completed (spawned: $fs_jobs_spawned, collected: $fs_jobs_collected)"

        for digest_filename in "${find_signatures_files[@]}"; do
            if [ -f "/tmp/find_sig_${digest_filename}.out" ]; then
                echo "=== find_signatures Output (${digest_filename}) ==="
                cat "/tmp/find_sig_${digest_filename}.out"
                echo
            fi
            if [ -f "/tmp/find_sig_${digest_filename}.err" ] && \
               [ -s "/tmp/find_sig_${digest_filename}.err" ]; then
                echo "=== find_signatures Errors (${digest_filename}) ==="
                cat "/tmp/find_sig_${digest_filename}.err"
                echo
            fi
        done
        if [ "$FIND_SIGNATURES_SUCCESS" != true ]; then
          if [ "$(params.failOnSignatureLookupError)" = "true" ]; then
            echo "One or more find_signatures jobs failed. Please check the logs above for details."
            exit 1
          fi
          echo "WARNING: find_signatures had one or more failures; failOnSignatureLookupError is false."
          echo "WARNING: Continuing without signature filtering (all rows will be submitted for signing)."
        fi

        if [ "$FIND_SIGNATURES_SUCCESS" = true ]; then
          declare -a filtered_references=()
          declare -a filtered_digests=()
          declare -a filtered_repos=()

          for i in "${!to_sign_references[@]}"; do
            ref="${to_sign_references[$i]}"
            dig="${to_sign_digests[$i]}"
            repo="${to_sign_repos[$i]}"
            repo_suffix="$(echo "${repo}" | tr '/:' '__')"
            sigfile="/tmp/${dig//:/_}__${repo_suffix}"
            skip_signing=true
            for sig_key in ${SIG_KEY_NAMES}; do
              if ! grep -q "^${ref} ${sig_key}$" "${sigfile}" 2>/dev/null; then
                skip_signing=false
                break
              fi
            done
            if [ "$skip_signing" = true ]; then
              echo "Signature already exists for:"
              echo "- reference=${ref}"
              echo "- manifest_digest=${dig}"
            else
              filtered_references+=("${ref}")
              filtered_digests+=("${dig}")
              filtered_repos+=("${to_sign_repos[$i]}")
            fi
          done

          to_sign_references=("${filtered_references[@]}")
          to_sign_digests=("${filtered_digests[@]}")
          to_sign_repos=("${filtered_repos[@]}")
        fi

        references_batch=""
        digests_batch=""
        repos_batch=""

        # Process to sign arrays in batches
        for i in "${!to_sign_references[@]}"; do
          new_references_batch="${references_batch}${to_sign_references[$i]} "
          new_digests_batch="${digests_batch}${to_sign_digests[$i]} "
          new_repos_batch="${repos_batch}${to_sign_repos[$i]} "

          # if batches are too big, send the request
          if [[ ${#new_references_batch} -gt $BATCH_LIMIT || ${#new_digests_batch} -gt $BATCH_LIMIT ]]; then

            # This function is stored in the utils/memory-throttle.sh file
            # Wait for memory and concurrent limit
            wait_for_memory 80
            while (( ${RUNNING_JOBS@P} >= "$CONCURRENT_LIMIT" )); do
              wait -n
              jobs_collected=$((jobs_collected + 1))
            done

            ${requestType} --pipeline "${request}" \
              -p references="${references_batch}" \
              -p manifest_digests="${digests_batch}" \
              -p repositories="${repos_batch}" \
              -p config_map_name="${config_map_name}" \
              -p requester="$(params.requester)" \
              -p umb_listen_topic="${umb_listen_topic}" \
              -p umb_publish_topic="${umb_publish_topic}" \
              -p pyxis_url="${signing_pyxis_url}" \
              -p umb_url="${signing_umb_url}" \
              -p umb_client_name="${signing_umb_client}" \
              -p pyxis_ssl_cert_secret_name="${signing_pyxis_ssl_secret}" \
              -p umb_ssl_cert_secret_name="${signing_umb_ssl_secret}" \
              -p signer_type="${SIGNER_TYPE}" \
              -p signing_key_names="${SIG_KEY_NAMES}" \
              -p taskGitUrl="$(params.taskGitUrl)" \
              -p taskGitRevision="$(params.taskGitRevision)" \
              -l ${TASK_LABEL}="${TASK_ID}" \
              -l ${PIPELINERUN_LABEL}="$(params.pipelineRunUid)" \
              -l ${INTENTION_LABEL}="${INTENTION}" \
              -t "$(params.requestTimeout)" --pipeline-timeout "0h30m0s" --task-timeout "0h25m0s" \
              "${EXTRA_ARGS[@]}" -s true &
              ((++REQUEST_COUNT))
              echo "Request Count: $REQUEST_COUNT"
              jobs_spawned=$((jobs_spawned + 1))

            # Allow memory usage to stabilize every BURST_SIZE spawns.
            if (( jobs_spawned % BURST_SIZE == 0 )); then
              sleep $STABILIZATION_DELAY
            fi

            # next batches consist of values which didn't fit in the previous batches
            references_batch="${to_sign_references[$i]} "
            digests_batch="${to_sign_digests[$i]} "
            repos_batch="${to_sign_repos[$i]} "
          else
            # if batches are still small enough, add the values to the batches
            references_batch="${new_references_batch}"
            digests_batch="${new_digests_batch}"
            repos_batch="${new_repos_batch}"
          fi
        done

        # Process the last batch
        if [[ ${#references_batch} -gt 0 ]]; then
          # This function is stored in the utils/memory-throttle.sh file
          # Wait for memory and concurrent limit
          wait_for_memory 80
          while (( ${RUNNING_JOBS@P} >= "$CONCURRENT_LIMIT" )); do
            wait -n
            jobs_collected=$((jobs_collected + 1))
          done

          ${requestType} \
            --pipeline "${request}" \
            -p references="${references_batch[*]}" \
            -p manifest_digests="${digests_batch[*]}" \
            -p repositories="${repos_batch[*]}" \
            -p config_map_name="${config_map_name}" \
            -p umb_listen_topic="${umb_listen_topic}" \
            -p umb_publish_topic="${umb_publish_topic}" \
            -p pyxis_url="${signing_pyxis_url}" \
            -p umb_url="${signing_umb_url}" \
            -p umb_client_name="${signing_umb_client}" \
            -p pyxis_ssl_cert_secret_name="${signing_pyxis_ssl_secret}" \
            -p umb_ssl_cert_secret_name="${signing_umb_ssl_secret}" \
            -p signer_type="${SIGNER_TYPE}" \
            -p requester="$(params.requester)" \
            -p signing_key_names="${SIG_KEY_NAMES}" \
            -p taskGitUrl="$(params.taskGitUrl)" \
            -p taskGitRevision="$(params.taskGitRevision)" \
            -l ${TASK_LABEL}="${TASK_ID}" \
            -l ${PIPELINERUN_LABEL}="$(params.pipelineRunUid)" \
            -l ${INTENTION_LABEL}="${INTENTION}" \
            -t "$(params.requestTimeout)" --pipeline-timeout "0h30m0s" --task-timeout "0h25m0s" \
            "${EXTRA_ARGS[@]}" -s true &
          ((++REQUEST_COUNT))
          echo "Request Count: $REQUEST_COUNT"
          jobs_spawned=$((jobs_spawned + 1))

          # Allow memory usage to stabilize every BURST_SIZE spawns
          if (( jobs_spawned % BURST_SIZE == 0 )); then
            sleep $STABILIZATION_DELAY
          fi
        fi

        echo "Waiting for remaining processes to finish..."
        # Use counter to collect all exit codes in case processes finished during a burst sleep
        while (( jobs_collected < jobs_spawned )); do
          wait -n
          jobs_collected=$((jobs_collected + 1))
        done

        echo "done"
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
