---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-marketplacesvm-push-disk-images-fail-invalid-credentials
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Run the marketplacesvm-push-disk-images task with a secret containing invalid
    credential files (missing required "auth" key). Ensure the task fails during
    credential validation.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: >-
        Flag to enable debug logging in trusted artifacts.
        Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
          securityContext:
            runAsUser: 1001
        steps:
          - name: setup
            image: >-
              quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/results"
              RNOTES="Launch the product via 1-Click or the "
              RNOTES+="marketplace listing.\n2. Access your "
              RNOTES+="instance using ssh\n    * Open an SSH client\n"
              cat > "$(params.dataDir)/snapshot_spec.json" << EOF
              {
                "application": "amd-bootc-1-3-raw-disk-image",
                "artifacts": {},
                "components": [
                  {
                    "containerImage": "quay.io/workload/tenant/test-product/amd-bootc-1-3-raw-disk-image@sha256:123456",
                    "name": "amd-bootc-1-3-raw-disk-image",
                    "source": {
                      "git": {
                        "context": ".",
                        "dockerfileUrl": "bib-cuda-aws.yaml",
                        "revision": "1abbfcdbc1c5e8b7aba07673297237ed192b50e2",
                        "url": "https://gitlab.com/konflux/test-product/disk-images/amd-bootc"
                      }
                    },
                    "contentType": "disk-image",
                    "productInfo": {
                      "filePrefix": "test-product-amd-1.3",
                      "productCode": "TESTPRDOCUT",
                      "productName": "Test Product",
                      "productVersionName": "1.3"
                    },
                    "pushSourceContainer": false,
                    "staged": {
                      "destination": "test-product-1_DOT_3-x86_64-isos",
                      "files": [
                        {
                          "filename": "test-product-amd-1.3-1732045201-x86_64.raw.gz",
                          "source": "disk.raw.gz"
                        }
                      ],
                      "version": "1.3"
                    },
                    "starmap": [
                      {
                        "cloud": "aws",
                        "mappings": {
                          "aws-emea": {
                            "destinations": [
                              {
                                "architecture": "x86_64",
                                "destination": "00000000-0000-0000-0000-000000000000",
                                "overwrite": false,
                                "restrict_version": true
                              }
                            ],
                            "provider": null
                          },
                          "aws-na": {
                            "destinations": [
                              {
                                "architecture": "x86_64",
                                "destination": "ffffffff-ffff-ffff-ffff-ffffffffffff",
                                "overwrite": false,
                                "restrict_version": true
                              }
                            ],
                            "provider": null
                          }
                        },
                        "meta": {
                          "ena_support": true,
                          "marketplace_entity_type": "AmiProduct",
                          "recommended_instance_type": "p5.48xlarge",
                          "release_notes": "${RNOTES}",
                          "root_device": "/dev/sda1",
                          "scanning_port": 22,
                          "security_groups": [
                            {
                              "from_port": 22,
                              "ip_protocol": "tcp",
                              "ip_ranges": [
                                "0.0.0.0/0"
                              ],
                              "to_port": 22
                            }
                          ],
                          "sharing_accounts": [
                            "111111111111"
                          ],
                          "sriov_net_support": "simple",
                          "usage_instructions": "https://access.redhat.com/articles/xyz",
                          "user_name": "cloud-user",
                          "virtualization": "hvm",
                          "volume": "gp3"
                        },
                        "name": "test-product-amd",
                        "workflow": "stratosphere"
                      }
                    ]
                  }
                ]
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: marketplacesvm-push-disk-images
      params:
        - name: snapshotPath
          value: "snapshot_spec.json"
        - name: cloudMarketplacesSecret
          value: marketplacesvm-invalid-test-secret
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
