---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-marketplacesvm-push-disk-images-multi-component
spec:
  description: |
    Run the marketplacesvm-push-disk-images task with two snapshot components and
    concurrentLimit 1 so prepare_component runs in two batches. Both images must
    be staged and the wrapper must run once.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: >-
        Flag to enable debug logging in trusted artifacts.
        Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          computeResources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
          securityContext:
            runAsUser: 1001
        steps:
          - name: setup
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -euxo pipefail

              mkdir -p "$(params.dataDir)/results"
              RNOTES="Launch the product via 1-Click or the "
              RNOTES+="marketplace listing.\n2. Access your "
              RNOTES+="instance using ssh\n    * Open an SSH client\n"
              SNAPSHOT="$(params.dataDir)/snapshot_spec.json"
              cat > "${SNAPSHOT}" << 'EOF'
              {
                "application": "amd-bootc-raw-disk-images",
                "artifacts": {},
                "components": [
                  {
                    "containerImage": "quay.io/workload/tenant/test-product/amd-bootc-1-3-raw-disk-image@sha256:123456",
                    "name": "amd-bootc-1-3-raw-disk-image",
                    "source": {
                      "git": {
                        "context": ".",
                        "dockerfileUrl": "Dockerfile",
                        "revision": "1abbfcdbc1c5e8b7aba07673297237ed192b50e2",
                        "url": "https://gitlab.com/konflux/test-product/disk-images/amd-bootc"
                      }
                    },
                    "contentType": "disk-image",
                    "productInfo": {
                      "filePrefix": "test-product-amd-1.3",
                      "productCode": "TESTPRDOCUT",
                      "productName": "Test Product",
                      "productVersionName": "1.3"
                    },
                    "pushSourceContainer": false,
                    "staged": {
                      "destination": "test-product-1_DOT_3-x86_64-isos",
                      "files": [
                        {
                          "filename": "test-product-amd-1.3-1732045201-x86_64.raw.gz",
                          "source": "disk.raw.gz"
                        }
                      ],
                      "version": "1.3"
                    },
                    "starmap": [
                      {
                        "cloud": "aws",
                        "mappings": {
                          "aws-na": {
                            "destinations": [
                              {
                                "architecture": "x86_64",
                                "destination": "ffffffff-ffff-ffff-ffff-ffffffffffff",
                                "overwrite": false,
                                "restrict_version": true
                              }
                            ],
                            "provider": null
                          }
                        },
                        "meta": {
                          "ena_support": true,
                          "marketplace_entity_type": "AmiProduct",
                          "root_device": "/dev/sda1",
                          "user_name": "cloud-user",
                          "virtualization": "hvm",
                          "volume": "gp3"
                        },
                        "name": "test-product-amd",
                        "workflow": "stratosphere"
                      }
                    ]
                  }
                ]
              }
              EOF
              jq --arg rnotes "${RNOTES}" \
                  '.components[0].starmap[0].meta.release_notes = $rnotes
                   | .components += [
                       .components[0]
                       | .name = "amd-bootc-1-4-raw-disk-image"
                       | .containerImage =
                           "quay.io/workload/tenant/test-product/amd-bootc-1-4-raw-disk-image@sha256:123456"
                       | .productInfo.filePrefix = "test-product-amd-1.4"
                       | .productInfo.productVersionName = "1.4"
                       | .staged.version = "1.4"
                       | .staged.files[0].filename =
                           "test-product-amd-1.4-1732045201-x86_64.raw.gz"
                       | .starmap[0].name = "test-product-amd-second"
                     ]' \
                  "${SNAPSHOT}" > "${SNAPSHOT}.tmp"
              mv "${SNAPSHOT}.tmp" "${SNAPSHOT}"
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: marketplacesvm-push-disk-images
      params:
        - name: snapshotPath
          value: "snapshot_spec.json"
        - name: cloudMarketplacesSecret
          value: marketplacesvm-test-secret
        - name: concurrentLimit
          value: "1"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
      runAfter:
        - run-task
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          computeResources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            workingDir: $(params.dataDir)
            script: |
              #!/usr/bin/env bash
              set -euxo pipefail

              expected_pullspecs=(
                  "quay.io/workload/tenant/test-product/amd-bootc-1-3-raw-disk-image@sha256:123456"
                  "quay.io/workload/tenant/test-product/amd-bootc-1-4-raw-disk-image@sha256:123456"
              )
              if [[ "$(wc -l < "$(params.dataDir)/mock_select-oci-auth.txt")" != 2 ]]; then
                  echo "Error: select-oci-auth was expected to be called 2 times. Actual calls:"
                  cat "$(params.dataDir)/mock_select-oci-auth.txt"
                  exit 1
              fi
              if [[ "$(wc -l < "$(params.dataDir)/mock_oras.txt")" != 2 ]]; then
                  echo "Error: oras was expected to be called 2 times. Actual calls:"
                  cat "$(params.dataDir)/mock_oras.txt"
                  exit 1
              fi
              for pullspec in "${expected_pullspecs[@]}"; do
                  if ! grep -Fq "${pullspec}" "$(params.dataDir)/mock_select-oci-auth.txt"; then
                      echo "Error: select-oci-auth was not called with ${pullspec}"
                      cat "$(params.dataDir)/mock_select-oci-auth.txt"
                      exit 1
                  fi
                  if ! grep -Fq "${pullspec}" "$(params.dataDir)/mock_oras.txt"; then
                      echo "Error: oras was not called with ${pullspec}"
                      cat "$(params.dataDir)/mock_oras.txt"
                      exit 1
                  fi
              done
              while IFS= read -r workdir; do
                  if [[ "${workdir}" != /var/workdir/tmp.* ]]; then
                      echo "Error: DOWNLOAD_DIR should be under /var/workdir/tmp.*"
                      echo "Actual: ${workdir}"
                      exit 1
                  fi
              done < "$(params.dataDir)/mock_oras_workdir.txt"

              if [[ "$(wc -l < "$(params.dataDir)/mock_wrapper.txt")" != 1 ]]; then
                  echo "Error: wrapper was expected to be called 1 time"
                  cat "$(params.dataDir)/mock_wrapper.txt"
                  exit 1
              fi

              STAGED_DIR_OUTPUT="$(params.dataDir)/mock_staged_dir.txt"
              PUSHSOURCE_OUTPUT="$(params.dataDir)/mock_pushsource_ls.txt"
              EXPECTED_RESOURCES_COUNT="$(grep -c "resources.yaml" "${STAGED_DIR_OUTPUT}")"
              if [[ "${EXPECTED_RESOURCES_COUNT}" != 2 ]]; then
                  echo "Error: resources.yaml should appear twice. Found: ${EXPECTED_RESOURCES_COUNT}"
                  cat "${STAGED_DIR_OUTPUT}"
                  cat "${PUSHSOURCE_OUTPUT}"
                  exit 1
              fi

              EXPECTED_ITEMS="$(jq '[.components[].staged.files | length] | add' \
                  "$(params.dataDir)/snapshot_spec.json")"
              if ! grep -q "# ${EXPECTED_ITEMS} item(s) found in source" "${PUSHSOURCE_OUTPUT}"; then
                  echo "Error: pushsource-ls should find ${EXPECTED_ITEMS} item(s). Actual output:"
                  cat "${PUSHSOURCE_OUTPUT}"
                  exit 1
              fi
              AMI_PI_COUNT="$(grep -c "AmiPushItem" "${PUSHSOURCE_OUTPUT}")"
              if [[ "${AMI_PI_COUNT}" != "${EXPECTED_ITEMS}" ]]; then
                  echo "Error: AmiPushItem should appear ${EXPECTED_ITEMS} time(s). Found: ${AMI_PI_COUNT}"
                  cat "${PUSHSOURCE_OUTPUT}"
                  exit 1
              fi
              for filename in \
                  "test-product-amd-1.3-1732045201-x86_64.raw" \
                  "test-product-amd-1.4-1732045201-x86_64.raw"; do
                  if ! grep -Fq "${filename}" "${PUSHSOURCE_OUTPUT}"; then
                      echo "Error: staged filename missing from pushsource-ls: ${filename}"
                      cat "${PUSHSOURCE_OUTPUT}"
                      exit 1
                  fi
              done
              ARTIFACTS_DIR="$(params.dataDir)/artifacts"
              if [[ ! -d "${ARTIFACTS_DIR}" ]]; then
                  echo "Error: artifacts directory not found at ${ARTIFACTS_DIR}"
                  ls -laR "$(params.dataDir)"
                  exit 1
              fi
