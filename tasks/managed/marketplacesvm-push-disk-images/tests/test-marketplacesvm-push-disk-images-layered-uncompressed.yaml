---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-marketplacesvm-push-disk-images-layered-uncompressed
spec:
  description: |
    Run the marketplacesvm-push-disk-images fallback against an uncompressed layer
    that stores the file as ./releases/... and lists a missing first blob. The
    task must skip the missing blob, extract without gzip, and stage the image.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: >-
        Flag to enable debug logging in trusted artifacts.
        Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
          securityContext:
            runAsUser: 1001
        steps:
          - name: setup
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/results"
              RNOTES="Launch the product via 1-Click or the "
              RNOTES+="marketplace listing.\n2. Access your "
              RNOTES+="instance using ssh\n    * Open an SSH client\n"
              cat > "$(params.dataDir)/snapshot_spec.json" << EOF
              {
                "application": "amd-bootc-1-3-raw-disk-image",
                "artifacts": {},
                "components": [
                  {
                    "containerImage": "quay.io/workload/tenant/test-product/layered-uncompressed@sha256:123456",
                    "name": "amd-bootc-1-3-raw-disk-image",
                    "source": {
                      "git": {
                        "context": ".",
                        "dockerfileUrl": "Dockerfile",
                        "revision": "1abbfcdbc1c5e8b7aba07673297237ed192b50e2",
                        "url": "https://gitlab.com/konflux/test-product/disk-images/amd-bootc"
                      }
                    },
                    "contentType": "disk-image",
                    "productInfo": {
                      "filePrefix": "test-product-amd-1.3",
                      "productCode": "TESTPRDOCUT",
                      "productName": "Test Product",
                      "productVersionName": "1.3"
                    },
                    "pushSourceContainer": false,
                    "staged": {
                      "destination": "test-product-1_DOT_3-x86_64-isos",
                      "files": [
                        {
                          "filename": "test-product-amd-1.3-1732045201-x86_64.raw",
                          "source": "releases/test-disk-image.raw"
                        }
                      ],
                      "version": "1.3"
                    },
                    "starmap": [
                      {
                        "cloud": "aws",
                        "mappings": {
                          "aws-na": {
                            "destinations": [
                              {
                                "architecture": "x86_64",
                                "destination": "ffffffff-ffff-ffff-ffff-ffffffffffff",
                                "overwrite": false,
                                "restrict_version": true
                              }
                            ],
                            "provider": null
                          }
                        },
                        "meta": {
                          "ena_support": true,
                          "marketplace_entity_type": "AmiProduct",
                          "release_notes": "${RNOTES}",
                          "root_device": "/dev/sda1",
                          "user_name": "cloud-user",
                          "virtualization": "hvm",
                          "volume": "gp3"
                        },
                        "name": "test-product-amd",
                        "workflow": "stratosphere"
                      }
                    ]
                  }
                ]
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: marketplacesvm-push-disk-images
      params:
        - name: snapshotPath
          value: "snapshot_spec.json"
        - name: cloudMarketplacesSecret
          value: marketplacesvm-test-secret
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
      runAfter:
        - run-task
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            workingDir: $(params.dataDir)
            script: |
              #!/usr/bin/env bash
              set -eux

              expected_pullspec="quay.io/workload/tenant/test-product/layered-uncompressed@sha256:123456"
              if [[ $(<"$(params.dataDir)/mock_oras.txt") != *"$expected_pullspec" ]]; then
                  echo "Error: oras pull was not called with ${expected_pullspec}"
                  cat "$(params.dataDir)/mock_oras.txt"
                  exit 1
              fi
              if [[ ! -f "$(params.dataDir)/mock_skopeo.txt" ]]; then
                  echo "Error: skopeo fallback was not called"
                  exit 1
              fi
              SKOPEO_ARGS=$(<"$(params.dataDir)/mock_skopeo.txt")
              if [[ "$SKOPEO_ARGS" != *"copy"* ]] || \
                  [[ "$SKOPEO_ARGS" != *"--retry-times 3"* ]] || \
                  [[ "$SKOPEO_ARGS" != *"docker://${expected_pullspec}"* ]] || \
                  [[ "$SKOPEO_ARGS" != *"dir:"* ]]; then
                  echo "Error: skopeo copy was expected with ${expected_pullspec}"
                  cat "$(params.dataDir)/mock_skopeo.txt"
                  exit 1
              fi
              if [[ $(wc -l < "$(params.dataDir)/mock_wrapper.txt") != 1 ]]; then
                  echo "Error: wrapper was expected to be called 1 time"
                  cat "$(params.dataDir)/mock_wrapper.txt"
                  exit 1
              fi

              PUSHSOURCE_OUTPUT="$(params.dataDir)/mock_pushsource_ls.txt"
              if ! grep -q "AmiPushItem" "$PUSHSOURCE_OUTPUT"; then
                  echo "Error: fallback did not stage an AmiPushItem"
                  cat "$PUSHSOURCE_OUTPUT"
                  exit 1
              fi
              if ! grep -q "test-product-amd-1.3-1732045201-x86_64.raw" "$PUSHSOURCE_OUTPUT"; then
                  echo "Error: staged filename missing from pushsource-ls"
                  cat "$PUSHSOURCE_OUTPUT"
                  exit 1
              fi
