---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: marketplacesvm-push-disk-images
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton Task to publish VM disk images into various cloud marketplaces using `pubtools-marketplacesvm`.

    It currently supports images in `raw` and `vhd` formats for `AWS` and `Azure` respectively.
  params:
    - name: snapshotPath
      type: string
      description: |
        Path to the JSON string of the mapped snapshot spec in the data workspace.
        It must be processed by the "apply-mapping" task first
    - name: cloudMarketplacesSecret
      type: string
      description: >
        The name of the Kubernetes Secret containing the marketplaces credentials.
        Each key in the secret must be a .json file with the required fields
        "marketplace_account" and "auth". See credentials format documentation:
        https://release-engineering.github.io/pubtools-marketplacesvm/common/credentials.html#auth-format
    - name: prePush
      type: string
      description: Whether perform a pre-push (true) or not (false). When true it will not publish PROD
      default: false
    - name: concurrentLimit
      type: string
      description: The maximum number of images to be pulled at once
      default: 3
    - name: uploadContainerName
      type: string
      description: The name of the container to upload the images to
      default: "konfluxupload"
    - name: ociStorage
      type: string
      description: The OCI repository where the Trusted Artifacts are stored
    - name: ociArtifactExpiresAfter
      type: string
      description: >
        Expiration date for the trusted artifacts created in the OCI repository.
        An empty string means the artifacts do not expire.
        The format is YYYY-MM-DD
      default: ""
    - name: orasOptions
      type: string
      description: oras options to pass to Trusted Artifacts calls
      default: ""
    - name: sourceDataArtifact
      type: string
      description: >
        The Trusted Artifact URI pointing to the artifact with the application snapshot spec and the release data
    - name: dataDir
      type: string
      description: The location where data will be stored
    - name: trustedArtifactsDebug
      type: string
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      default: ""
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: sourceDataArtifact
      type: string
      description: >
        The Trusted Artifact URI pointing to the artifact with the application snapshot spec and the release data
  volumes:
    - name: workdir
      emptyDir: {}
    - name: cloud-marketplaces-secret-vol
      secret:
        secretName: $(params.cloudMarketplacesSecret)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true

  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: pull-and-push-images-to-marketplaces
      image: quay.io/konflux-ci/release-service-utils@sha256:3cb03b14ac9d90ff27070036ce2b50712e65aa285daeb28852254a745bb25dfc
      computeResources:
        limits:
          memory: 1Gi
        requests:
          memory: 1Gi
          cpu: 450m
      volumeMounts:
        - name: cloud-marketplaces-secret-vol
          mountPath: "/etc/secrets"
      env:
        - name: UPLOAD_CONTAINER_NAME  # pulled by the pubtools-marketplacesvm script.
          value: $(params.uploadContainerName)
      script: |
        #!/usr/bin/env bash
        set -eux

        echo "DEBUG: Sanity validation of credentials"
        JSON_FILES=(/etc/secrets/*.json)
        if [[ ! -f "${JSON_FILES[0]}" ]]; then
            echo "ERROR: No credential files found in /etc/secrets/" >&2
            exit 1
        fi
        for file in "${JSON_FILES[@]}"; do
            if ! jq -e 'has("marketplace_account") and has("auth")' "$file" > /dev/null 2>&1; then
                echo "ERROR: Validation failed for credential file: '$file'"  >&2
                echo "The file is missing required keys ('marketplace_account' or 'auth')."  >&2
                exit 1
            fi
        done

        # export variables required by the script "marketplacesvm_push_wrapper" in release-service-utils
        CLOUD_CREDENTIALS=$(IFS=,; echo "${JSON_FILES[*]}")
        export CLOUD_CREDENTIALS

        # Setup required variables
        SNAPSHOT_JSON=$(jq -c '.' "$(params.dataDir)/$(params.snapshotPath)")
        STARMAP_MAPPING=$(jq -c '[.components[].starmap[]]' <<< "$SNAPSHOT_JSON")
        STARMAP_MAPPING_FILE="$(params.dataDir)/$(dirname "$(params.snapshotPath)")/starmap.yaml"
        yq -p json -o yaml <<< "$STARMAP_MAPPING" > "$STARMAP_MAPPING_FILE"

        BASE_DIR="$(mktemp -d -p /var/workdir)"
        DISK_IMGS_DIR="${BASE_DIR}/starmap/CLOUD_IMAGES"
        mkdir -p "${DISK_IMGS_DIR}"

        # Initialize memory throttling
        # This file is located at utils/memory-throttle.sh in the release-service-utils image
        # shellcheck source=/dev/null
        source memory-throttle.sh
        # This function is stored in the utils/memory-throttle.sh file
        log_memory_throttle_status 80

        RUNNING_JOBS="\j" # Bash parameter for number of jobs currently running
        NUM_COMPONENTS=$(jq '.components | length' <<< "$SNAPSHOT_JSON")

        prepare_component() { # Expected argument is [component json]
            COMPONENT=$1
            PRODUCT_INFO=$(jq -c '.productInfo' <<< "${COMPONENT}")
            PULLSPEC=$(jq -er '.containerImage' <<< "${COMPONENT}")
            IMG_NAME=$(jq -er '.name' <<< "${COMPONENT}")
            trap 'echo "ERROR: prepare_component failed for component: $IMG_NAME" >&2' ERR
            BUILD_NAME=$(jq -er '.filePrefix' <<< "${PRODUCT_INFO}")
            BUILD_NAME=${BUILD_NAME%-*}   # remove version
            BUILD_VERSION=$(jq -er '.productVersionName' <<< "${PRODUCT_INFO}")
            BUILD_RESPIN=$(jq -er '.staged.files[0].filename' <<< "${COMPONENT}")
            # shellcheck disable=SC2001
            BUILD_RESPIN=$(echo "$BUILD_RESPIN" | sed -e 's/\.[.a-zA-Z0-9]*$//' )   # Rstrip all extensions
            BUILD_RESPIN=${BUILD_RESPIN%-*}   # Remove architecture
            BUILD_RESPIN=${BUILD_RESPIN##*-}   # Lstrip on - to get the respin
            RESOURCES_JSON='
            {
                "api": "v1",
                "resource": "CloudImage",
                "description": "",
                "build": {},
                "images": []
            }'
            RESOURCES_JSON=$(jq -c \
                            --arg build_name "$BUILD_NAME" \
                            --arg build_respin "$BUILD_RESPIN" \
                            --arg build_date "$(date -d "@$BUILD_RESPIN" +%Y%m%d)" \
                            --arg build_version "$BUILD_VERSION" \
                            '.build.name=$build_name |
                            .build.respin=$build_respin |
                            .release.date=$build_date |
                            .build.version=$build_version' <<< "$RESOURCES_JSON"
            )
            DESTINATION="${DISK_IMGS_DIR}/${IMG_NAME}"
            mkdir -p "${DESTINATION}"
            DOWNLOAD_DIR=$(mktemp -d -p /var/workdir)
            cd "$DOWNLOAD_DIR"
            # oras has very limited support for selecting the right auth entry,
            # so create a custom auth file with just one entry
            AUTH_FILE=$(mktemp)
            select-oci-auth "${PULLSPEC}" > "$AUTH_FILE"
            oras pull --registry-config "$AUTH_FILE" "$PULLSPEC"
            NUM_MAPPED_FILES=$(jq '.staged.files | length' <<< "${COMPONENT}")
            for ((i = 0; i < NUM_MAPPED_FILES; i++)); do
                FILE=$(jq -c --arg i "$i" '.staged.files[$i|tonumber]' <<< "$COMPONENT")
                SOURCE=$(jq -er '.source' <<< "$FILE")
                FILENAME=$(jq -er '.filename' <<< "$FILE")

                # Fail early if the source file pulled by ORAS does not exist
                if [ ! -f "${SOURCE}" ]; then
                    echo "ERROR: Source file '${SOURCE}' for component '${FILENAME}' was not found after oras pull." >&2
                    exit 1
                fi

                # Decompress if the source file is gzipped
                if [[ "${SOURCE}" == *.gz ]]; then
                    gzip -d "${SOURCE}"
                    SOURCE="${SOURCE%.gz}"
                    FILENAME="${FILENAME%.gz}"
                fi
                if [ -f "${DESTINATION}/${FILENAME}" ]; then
                    echo -n "Multiple files use the same destination value: $DESTINATION" >&2
                    echo " and filename value: $FILENAME. Failing..." >&2
                    exit 1
                fi

                BUILD_ARCH=${FILENAME%.*}   # Rstrip extension
                BUILD_ARCH=${BUILD_ARCH##*-}  # Lstrip on - to get the arch

                case "${FILENAME}" in
                    *.vhd) image_type="VHD" ;;
                    *.raw) image_type="AMI" ;;
                    *)     echo "Skipping unsupported file: $FILENAME"; continue ;;
                esac

                mv "$SOURCE" "${DESTINATION}/${FILENAME}"
                RESOURCES_JSON=$(jq --arg filename "$FILENAME" --arg arch "$BUILD_ARCH" \
                    '.images[.images | length] = {"path": $filename, "architecture": $arch}' <<< "$RESOURCES_JSON")
                RESOURCES_JSON=$(jq --arg image_type "$image_type" \
                    '.type = $image_type' <<< "$RESOURCES_JSON")
            done
            echo "$RESOURCES_JSON" | yq -P -I 4 > "$DESTINATION/resources.yaml"
        }

        # Process each component in parallel with memory-aware job management
        STABILIZATION_DELAY=2
        success=true
        jobs_spawned=0
        jobs_collected=0
        for (( i = 0; i < NUM_COMPONENTS; i++ )); do
            # This function is stored in the utils/memory-throttle.sh file
            # Wait for memory and concurrent limit before spawning
            wait_for_memory 80
            while (( ${RUNNING_JOBS@P} >= $(params.concurrentLimit) )); do
                wait -n || success=false
                jobs_collected=$((jobs_collected + 1))
            done

            COMPONENT=$(jq -c --arg i "$i" '.components[$i|tonumber]' <<< "$SNAPSHOT_JSON")
            prepare_component "$COMPONENT" &
            jobs_spawned=$((jobs_spawned + 1))

            # Allow memory usage to stabilize before next spawn.
            sleep $STABILIZATION_DELAY
        done

        # Wait for all remaining jobs - use counter to collect all exit codes
        # in case processes finished during a stabilization sleep
        while (( jobs_collected < jobs_spawned )); do
            wait -n || success=false
            jobs_collected=$((jobs_collected + 1))
        done

        # This is redundant since we have set -e, but makes things a bit more clear
        if [ $success != "true" ]; then
            echo "ERROR: prepare_component failed for at least one component"
            exit 1
        fi

        # Change to the base directory
        cd "${BASE_DIR}"

        # Validate the staged structure using pushsource-ls
        pushsource-ls "staged:${BASE_DIR}"

        # Process the push
        EXTRA_ARGS=()
        if [[ "$(params.prePush)" == "true" ]]; then
            EXTRA_ARGS+=("--nochannel")
        fi
        marketplacesvm_push_wrapper --debug "${EXTRA_ARGS[@]}" \
            --source "${BASE_DIR}" --starmap-file "$STARMAP_MAPPING_FILE"

        # Collect artifacts generated by the wrapper
        if [ -d "${BASE_DIR}/artifacts" ]; then
            cp -r "${BASE_DIR}/artifacts" "$(params.dataDir)/artifacts"
        fi
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
