---
# Mock Jira on localhost for CVE validation.
# test_tekton_tasks.sh applies hostAliases on the PipelineRun
# when hostname is set below. pre-apply-task-hook.sh adds NET_BIND_SERVICE.
version: 1
services:
  - type: http_json
    bind: 127.0.0.1
    port: 443
    tls: true
    hostname: redhat.atlassian.net
    routes:
      - path_contains: /issue/VULN-123
        method: GET
        body: '{"fields":{"issuetype":{"name":"Vulnerability"},"customfield_10667":"CVE-123"}}'
      - path_contains: /issue/FEATURE-456
        method: GET
        body: '{"fields":{"issuetype":{"name":"Feature"}}}'
