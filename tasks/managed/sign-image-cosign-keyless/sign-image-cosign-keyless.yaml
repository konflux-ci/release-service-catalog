---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sign-image-cosign-keyless
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to sign container images in snapshot by cosign in keyless mode
  params:
    - name: snapshotPath
      description: Path to the JSON string of the mapped Snapshot spec in the data workspace
      type: string
    - name: retries
      description: Retry cosign N times
      type: string
      default: "3"
    - name: concurrentLimit
      type: string
      default: 90
      description: The maximum number of concurrent cosign signing jobs
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
    - name: caCertPath
      type: string
      description: Path to CA certificate bundle for TLS verification with self-hosted certificates
      default: /mnt/trusted-ca/ca-bundle.crt
    - name: keylessOIDCIssuer
      type: string
      description: OIDC issuer for keyless signing
    - name: keylessFulcioURL
      type: string
      description: Fulcio URL for keyless signing
    - name: keylessRekorURL
      type: string
      description: rekor URL for keyless signing
    - name: keylessTufURL
      type: string
      description: TUF URL for keyless signing
  results:
    - description: Produced trusted data artifact
      name: sourceDataArtifact
      type: string
  volumes:
    - name: workdir
      emptyDir: {}
    - name: oidc-token
      projected:
        sources:
          - serviceAccountToken:
              path: oidc-token
              expirationSeconds: 3600
              audience: sigstore
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
          cpu: 30m
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: caCertPath
          value: $(params.caCertPath)
    - name: sign-image
      image: quay.io/konflux-ci/release-service-utils@sha256:d2ee80f77ebea30d6bc4e09af11278c60da95e0da33a0d5448f826aaf1ecf0e0
      computeResources:
        limits:
          memory: 2.5Gi
          cpu: "2"
        requests:
          memory: 2.5Gi
          cpu: "2"
      volumeMounts:
        - name: oidc-token
          mountPath: "/var/run/secrets/tokens"
          readOnly: true
      command: ["python3", "-m", "release_service_utils.tasks.managed.sign_image_cosign_keyless"]
      args:
        - "--snapshot"
        - "$(params.dataDir)/$(params.snapshotPath)"
        - "--retries"
        - "$(params.retries)"
        - "--concurrent-limit"
        - "$(params.concurrentLimit)"
        - "--oidc-issuer"
        - "$(params.keylessOIDCIssuer)"
        - "--fulcio-url"
        - "$(params.keylessFulcioURL)"
        - "--rekor-url"
        - "$(params.keylessRekorURL)"
        - "--tuf-url"
        - "$(params.keylessTufURL)"
        - "--ca-cert-path"
        - "$(params.caCertPath)"
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
          cpu: 250m
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
