---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: publish-to-nrrc
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task that publishes the npm archives to NRRC(npm.registry.redhat.com)
    service. NRRC is used to host npm artifacts of Red Hat products.
    This task will work with [collect-charon-task](../collect-charon-params/README.md)
    together to do the NRRC publishment work.
    It accepts the `charon.env` file from the
    [collect-charon-task](../collect-charon-params/README.md)
    and use the variables in it as parameters for the NRRC publishing task.
  params:
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
    - name: charonParamFilePath
      description: path of the env file for nrrc parameters to use
      type: string
    - name: charonConfigFilePath
      description: path of the charon config file for charon to consume
      type: string
    - name: charonAWSSecret
      description: the secret name for charon aws credential file
      type: string
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
  results:
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
  volumes:
    - name: "charon-aws-vol"
      secret:
        secretName: "$(params.charonAWSSecret)"
    - name: nrrc-workdir
      emptyDir: {}
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    # This is a workaround for a problem observed on Konflux clusters where the
    # a step runs with root user causing a file or folder to not be readable
    # in later steps. There might be solution coming related to the
    # security context constraints on the cluster, but setting this explicitly here
    # should probably be harmless either way.
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
          cpu: 30m
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: prepare-repo
      image: quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
      computeResources:
        limits:
          memory: 256Mi
          cpu: 150m
        requests:
          memory: 256Mi
          cpu: 150m
      command: ["python3"]
      args:
        - -m
        - release_service_utils.tasks.managed.publish_to_nrrc
      env:
        - name: DATA_DIR
          value: $(params.dataDir)
        - name: CHARON_PARAM_FILE_PATH
          value: $(params.charonParamFilePath)
      volumeMounts:
        - name: nrrc-workdir
          mountPath: "/var/workdir/nrrc"
    - name: upload-npm-archive
      image: quay.io/konflux-ci/charon@sha256:2b11516e682a2c985612fc64a3b833e05d9f3efb35793db6c29f4a81545c74bc
      computeResources:
        limits:
          memory: 512Mi
          cpu: 250m
        requests:
          memory: 512Mi
          cpu: 250m
      script: |
        #!/usr/bin/env bash
        set -eux

        CHARON_CFG_FILE="$(params.dataDir)/$(params.charonConfigFilePath)"
        mkdir -p "/home/charon/.charon"
        cp "$CHARON_CFG_FILE" /home/charon/.charon/charon.yaml

        CHARON_FILE="$(params.dataDir)/$(params.charonParamFilePath)"
        # shellcheck source=/dev/null
        . "$CHARON_FILE"

        target="$CHARON_TARGET"
        productName="$CHARON_PRODUCT_NAME"
        productVersion="$CHARON_PRODUCT_VERSION"

        shared_repo="/var/workdir/nrrc/shared"

        shopt -s nullglob
        found_files=false
        for archive in "$shared_repo"/*
        do
          if [[ -f "$archive" ]]
          then
            found_files=true
            echo "Release $archive with $productName-$productVersion into $target"
            charon upload -p "$productName" -v "$productVersion" -t "$target" "$archive"
          fi
        done

        if [[ "$found_files" == "false" ]]
        then
          echo "No npm archive file found, will not publish."
          exit 1
        fi
      volumeMounts:
        - name: "charon-aws-vol"
          mountPath: "/home/charon/.aws"
        - name: nrrc-workdir
          mountPath: "/var/workdir/nrrc"
        - name: trusted-ca
          mountPath: /etc/ssl/certs/ca-custom-bundle.crt
          subPath: ca-bundle.crt
          readOnly: true
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
          cpu: 250m
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
