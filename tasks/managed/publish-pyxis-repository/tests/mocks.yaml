---
# Declarative mocks for Tekton tests of this task (Python entrypoint). Rendered
# by .github/scripts/render_python_task_mocks_from_yaml.py when
# test_tekton_tasks.sh runs.
version: 1
services:
  - type: http_json
    bind: 127.0.0.1
    mock_server_for_env_var: PYXIS_URL
    routes:
      - path_contains: repository/my-product/my-image1
        body: >-
          {"_id": "1", "publish_on_push": true, "requires_terms": true}
      - path_contains: repository/my-product/my-image2
        body: >-
          {"_id": "3", "publish_on_push": true, "requires_terms": true}
      - path_contains: repository/my-product/my-image3
        body: >-
          {"_id": "5", "publish_on_push": true, "requires_terms": true}
      - path_contains: /repositories/id/
        body: '{"ok": true}'
