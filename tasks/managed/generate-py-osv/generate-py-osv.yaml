---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: generate-py-osv
spec:
  description: |
    Generate OSV security metadata for remediated Python artifacts. Runs
    `slan-cuan generate-security-metadata-from-snapshot`, which discovers and
    pulls the build-index.json OCI referrer from each component image in the
    snapshot and generates OSV records (fath-cuan process_osv) with OSIDB
    enrichment. OSV output is threaded onward on the trusted artifact.
  params:
    - name: SNAPSHOT_PATH
      type: string
      description: Path to the reduced snapshot spec (relative to dataDir).
    - name: OSIDB_API_URL
      type: string
      description: The base URL of the OSIDB API
      default: ""
    - name: OSIDB_KERBEROS_PRINCIPAL
      type: string
      description: Kerberos principal used to authenticate to OSIDB
      default: ""
    - name: OSIDB_KERBEROS_KEYTAB_PATH
      type: string
      description: Path (inside the container) to the mounted OSIDB Kerberos keytab
      default: /var/run/secrets/osidb-keytab/keytab
    - name: OSIDB_KEYTAB_SECRET_NAME
      type: string
      description: Secret holding the OSIDB Kerberos keytab.
      default: osidb-keytab-secret
    - name: BUILD_INDEX_MEDIA_TYPE
      type: string
      description: OCI artifact type used to discover the build-index referrer
      default: application/vnd.lightwell.build-index.v1+json
    - name: sourceDataArtifact
      type: string
      description: Trusted Artifact containing the reduced snapshot spec and files
    - name: dataDir
      type: string
      description: The location where data will be stored
      default: /var/workdir
    - name: ociArtifactExpiresAfter
      type: string
      description: Expiration date for the trusted artifacts created
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: ociStorage
      type: string
      description: The OCI repository where the Trusted Artifacts are stored
  results:
    - name: sourceDataArtifact
      description: Produced trusted data artifact
      type: string
  volumes:
    - name: workdir
      emptyDir: {}
    - name: osidb-keytab
      secret:
        secretName: $(params.OSIDB_KEYTAB_SECRET_NAME)
        optional: true
  stepTemplate:
    securityContext:
      runAsUser: 1001
    env:
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
      - name: osidb-keytab
        mountPath: /var/run/secrets/osidb-keytab
        readOnly: true
  steps:
    - name: prepare-workdir
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits:
          memory: 32Mi
          cpu: 10m
        requests:
          memory: 32Mi
          cpu: 10m
      command:
        - mkdir
        - -p
        - $(params.dataDir)
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
          cpu: 10m
        requests:
          memory: 64Mi
          cpu: 10m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: generate
      image: quay.io/light-castle/slan-cuan:latest
      computeResources:
        limits:
          memory: 512Mi
          cpu: 500m
        requests:
          memory: 512Mi
          cpu: 250m
      command:
        - slan-cuan
      args:
        - --verbose
        - generate-security-metadata-from-snapshot
        - --snapshot-path
        - $(params.dataDir)/$(params.SNAPSHOT_PATH)
        - --workdir
        - $(params.dataDir)
        - --output-dir
        - $(params.dataDir)/security_metadata
        - --build-index-media-type
        - $(params.BUILD_INDEX_MEDIA_TYPE)
        - --index-basedir
        - build-index
        - --index-filename
        - build-index.json
        - --osidb-api-url
        - $(params.OSIDB_API_URL)
        - --osidb-kerberos-principal
        - $(params.OSIDB_KERBEROS_PRINCIPAL)
        - --osidb-keytab
        - $(params.OSIDB_KERBEROS_KEYTAB_PATH)
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
