---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-generate-py-osv
spec:
  description: Test generating Python OSV from a build-index referrer
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:2f9e6863e82bbc9ddce5a290f3fd0e87657c475e3de8a832b2ef7f8d0671e7d3
            script: |
              #!/usr/bin/env bash
              set -eux
              mkdir -p "$(params.dataDir)/files"
              # Reduced-snapshot with TWO component image refs, so the per-component loop
              # and the shared IDX_DIR overwrite (component 2 overwriting component 1's
              # build-index.json) are both exercised.
              cat > "$(params.dataDir)/snapshot_spec.json" <<'EOF'
              {"components":[
                {"name":"ntplib","containerImage":"registry.local/ntplib@sha256:aaa"},
                {"name":"requests","containerImage":"registry.local/requests@sha256:bbb"}
              ]}
              EOF
              echo "mock wheel" > "$(params.dataDir)/files/ntplib-0.4.0-py3-none-any.whl"
              echo "mock wheel" > "$(params.dataDir)/files/requests-0.4.0-py3-none-any.whl"
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: generate-py-osv
      params:
        - name: SNAPSHOT_PATH
          value: snapshot_spec.json
        - name: OSIDB_API_URL
          value: https://osidb.test.local
        - name: OSIDB_KERBEROS_PRINCIPAL
          value: svc-test@REDHAT.COM
        - name: OSIDB_KERBEROS_KEYTAB_PATH
          value: /var/run/secrets/osidb-keytab/keytab
        - name: OSIDB_KEYTAB_SECRET_NAME
          value: osidb-keytab-secret
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
        - name: ociStorage
          value: $(params.ociStorage)
      runAfter:
        - setup
    - name: check-result
      params:
        - name: dataDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
      taskSpec:
        params:
          - name: dataDir
            type: string
          - name: sourceDataArtifact
            type: string
          - name: ociStorage
            type: string
          - name: orasOptions
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
        steps:
          - name: restore
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check
            image: quay.io/konflux-ci/release-service-utils@sha256:2f9e6863e82bbc9ddce5a290f3fd0e87657c475e3de8a832b2ef7f8d0671e7d3
            script: |
              #!/usr/bin/env bash
              set -eux
              # Both components' OSV files must exist and be distinct, proving component 2's
              # build-index.json overwrite of the shared IDX_DIR did not clobber component 1's
              # already-generated OSV output.
              test -f "$(params.dataDir)/security_metadata/x_RHLW-CVE-2024-0001-ntplib.json"
              test -f "$(params.dataDir)/security_metadata/x_RHLW-CVE-2024-0001-requests.json"
              echo "All checks passed!"
      runAfter:
        - run-task
