---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-upload-npm-closure
spec:
  description: |
    Sunny-day path for upload-npm-closure: two sidecars invoke update-npm-closure twice
  params:
    - name: ociStorage
      type: string
    - name: ociArtifactExpiresAfter
      type: string
      default: "1d"
    - name: orasOptions
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      type: string
      default: ""
    - name: dataDir
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:2f9e6863e82bbc9ddce5a290f3fd0e87657c475e3de8a832b2ef7f8d0671e7d3
            script: |
              #!/usr/bin/env bash
              set -euxo pipefail

              FILES="$(params.dataDir)/files/sha256_abc123"
              mkdir -p "${FILES}"
              jq -nc '{schema_version:3,name:"lodash",version:"4.17.21",compliance_level:"L3"}' \
                > "${FILES}/lodash-4.17.21.tl-compliance.json"
              jq -nc '{schema_version:3,name:"ms",version:"2.1.3",compliance_level:"L3"}' \
                > "${FILES}/ms-2.1.3.tl-compliance.json"
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: upload-npm-closure
      params:
        - name: SERVICE_ACCOUNT_SECRET_NAME
          value: upload-npm-closure-test-credentials
        - name: PULP_BASE_URL
          value: https://test.packages.redhat.com
        - name: PULP_API_ROOT
          value: /api
        - name: PULP_DOMAIN
          value: test-domain
        - name: PULP_REPOSITORY
          value: npm-registry
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)"
        - name: dataDir
          value: $(params.dataDir)
        - name: filesDir
          value: files
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
        - name: ociStorage
          value: $(params.ociStorage)
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)"
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:2f9e6863e82bbc9ddce5a290f3fd0e87657c475e3de8a832b2ef7f8d0671e7d3
            script: |
              #!/usr/bin/env bash
              set -euxo pipefail

              LOG="$(params.dataDir)/files/.closure-call-log"
              if [[ ! -f "${LOG}" ]]; then
                echo "ERROR: missing closure call log at ${LOG}" >&2
                exit 1
              fi
              COUNT="$(grep -c 'Mock update-npm-closure' "${LOG}" || true)"
              if [[ "${COUNT}" -ne 2 ]]; then
                echo "ERROR: expected 2 update-npm-closure calls, got ${COUNT}" >&2
                cat "${LOG}" >&2
                exit 1
              fi
              echo "Closure update loop checks passed"
      runAfter:
        - run-task
