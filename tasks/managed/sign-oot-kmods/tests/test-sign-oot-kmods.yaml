---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-sign-oot-kmods
spec:
  description: |
    Happy-path smoke test for sign-oot-kmods. Signs one architecture and checks
    signed-kmods.tar.gz, signed module content, and mock ssh/scp calls.
    Other scenarios are covered by pytest in release-service-utils.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: "/var/workdir/release"
    - name: taskGitUrl
      type: string
      description: The git repository URL for task and StepAction resolution
      default: https://github.com/konflux-ci/release-service-catalog.git
    - name: taskGitRevision
      type: string
      description: The git revision for task and StepAction resolution
      default: main
  tasks:
    - name: run-task
      taskRef:
        name: sign-oot-kmods
      params:
        - name: dataPath
          value: data.json
        - name: signedKmodsPath
          value: signed-kmods
        - name: signingAuthor
          value: The dummy signer
        - name: kerberosRealm
          value: IPA.REDHAT.COM
        - name: signing-secret
          value: my-mocked-secret
        - name: checksumFingerprint
          value: checksum-fingerprint
        - name: checksumKeytab
          value: build-and-sign-keytab
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: sourceDataArtifact
          value: ""
        - name: dataDir
          value: $(params.dataDir)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
    - name: check-result
      taskSpec:
        params:
          - name: dataDir
            type: string
          - name: sourceDataArtifact
            type: string
            default: ""
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: "ORAS_OPTIONS"
              value: "--insecure"
            - name: "DEBUG"
              value: ""
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/lgallovi-test/release-service-utils@sha256:1e92136d6ec405d71f6172089de4ec82e7609c3eb22fd2aa6ce3973c73d2dac6
            script: |
              #!/usr/bin/env bash
              set -eux

              cd "$(params.dataDir)"
              test -f signed-kmods.tar.gz
              tar -xzf signed-kmods.tar.gz
              test -f signed-kmods/x86_64/mod1.ko
              grep -q SIGNED_MODULE1 signed-kmods/x86_64/mod1.ko
              grep -q "kmods_x86_64.tar.gz" mock_scp.txt
              grep -q "signed_x86_64.tar.gz" mock_scp.txt
              test -f mock_ssh.txt
      params:
        - name: dataDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(tasks.run-task.results.sourceDataArtifact)
      runAfter:
        - run-task
