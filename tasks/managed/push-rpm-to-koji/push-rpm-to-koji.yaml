---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-rpm-to-koji
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: push-koji
spec:
  description: |-
    Tekton task to push Konflux build RPMs to a Koji instance.

    The push step runs in release-service-utils, which provides the Python
    module, the koji CLI (1.34 or newer), and kinit. Koji profiles stay in
    pipelineImage (pushOptions.pushPipelineImage), as they did when this task
    ran in that image. A step copies /etc/koji.conf and /etc/koji.conf.d from
    it, and the script installs those files where koji --profile looks.
  params:
    - name: snapshotPath
      type: string
      description: |
        Path to the JSON file of the mapped Snapshot spec in the data workspace
    - name: dataPath
      type: string
      description: |
        Path to the JSON file of the merged data to use in the data workspace
    - name: pushSecret
      type: string
      description: |
        The secret that is used for login koji instance
    - name: pipelineImage
      type: string
      description: |
        Image that contains the Koji client profiles for pushOptions.koji_profile,
        under /etc/koji.conf and /etc/koji.conf.d. This is pushOptions.pushPipelineImage.
        The push step runs in release-service-utils, which provides the Python module,
        the koji CLI (1.34 or newer), and kinit
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
  volumes:
    - name: secret-volume
      secret:
        secretName: $(params.pushSecret)
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: copy-koji-config
      image: $(params.pipelineImage)
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        dest="$(params.dataDir)/koji-client-config"
        rm -rf "${dest}"
        mkdir -p "${dest}/config.d"
        if [[ -f /etc/koji.conf ]]; then
          cp -a /etc/koji.conf "${dest}/config"
        fi
        if [[ -d /etc/koji.conf.d ]]; then
          find /etc/koji.conf.d -maxdepth 1 -type f -exec cp -a {} "${dest}/config.d/" \;
        fi
    - name: push-rpm-to-koji
      image: quay.io/konflux-ci/release-service-utils@sha256:6d4dee971855fe55724c16b049e21a396287b53766ffd3fa984ee91895e9f099
      computeResources:
        limits:
          memory: 3Gi
        requests:
          memory: 3Gi
          cpu: 325m
      env:
        - name: SNAPSHOT_SPEC_FILE
          value: $(params.dataDir)/$(params.snapshotPath)
        - name: DATA_FILE
          value: $(params.dataDir)/$(params.dataPath)
        - name: DATA_DIR
          value: $(params.dataDir)
        - name: SECRET_MOUNT
          value: /etc/secret
        - name: RPM_DOWNLOAD_DIR
          value: /var/workdir/rpm-extract
        - name: KINIT_RETRIES
          value: "10"
        - name: KOJI_CONFIG_SOURCE
          value: $(params.dataDir)/koji-client-config
      command:
        - python3
        - -m
        - release_service_utils.tasks.managed.push_rpm_to_koji
      volumeMounts:
        - mountPath: /etc/secret
          name: secret-volume
          readOnly: true
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
