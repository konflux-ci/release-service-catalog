---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-rpm-to-koji
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: push-koji
spec:
  description: |-
    Tekton task to push Konflux build RPMs to a Koji instance.

    The push step runs in pipelineImage (pushOptions.pushPipelineImage).
    That image provides python3 (3.12 or newer), the koji CLI (1.34 or newer),
    kinit, oras, select-oci-auth, and the Koji profiles, including serverca
    files such as /etc/pki/brew/Current-IT-Root-CAs.pem. A step copies the
    release-service-utils package onto the shared volume, and the
    push step runs that package with PYTHONPATH set.
  params:
    - name: snapshotPath
      type: string
      description: |
        Path to the JSON file of the mapped Snapshot spec in the data workspace
    - name: dataPath
      type: string
      description: |
        Path to the JSON file of the merged data to use in the data workspace
    - name: pushSecret
      type: string
      description: |
        The secret that is used for login koji instance
    - name: pipelineImage
      type: string
      description: |
        Image that runs the push. This is pushOptions.pushPipelineImage.
        It must provide python3 (3.12 or newer), the koji CLI (1.34 or newer),
        kinit, oras, select-oci-auth, and the Koji client profiles for
        pushOptions.koji_profile, including any serverca file those profiles name
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
  volumes:
    - name: secret-volume
      secret:
        secretName: $(params.pushSecret)
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: copy-python-module
      image: quay.io/konflux-ci/release-service-utils@sha256:ed0063f570ee7cc563b81e768303204b94446960159b1907e6128cb62d4f262f
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      env:
        - name: DATA_DIR
          value: $(params.dataDir)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        dest="/var/workdir/python-packages"
        # DATA_DIR is injected by the step env from params.dataDir.
        # shellcheck disable=SC2153
        data_dir="$(realpath -m "${DATA_DIR}")"
        stage="$(realpath -m "${dest}")"
        data_dir="${data_dir%/}"
        stage="${stage%/}"
        # dataDir is caller-selected. Delete the staging dir only when it is
        # outside the restored release data.
        if [[ "${data_dir}" == "${stage}" || \
              "${data_dir}" == "${stage}/"* || \
              "${stage}" == "${data_dir}/"* ]]; then
          # Count before refusing so the log shows the restored files are still there.
          preserved="$(find "${data_dir}" -type f 2>/dev/null | wc -l | tr -d '[:space:]')"
          echo "Python module staging directory ${stage} overlaps dataDir ${data_dir};" \
            "${preserved} restored files remain" >&2
          exit 1
        fi
        rm -rf "${dest}"
        mkdir -p "${dest}"
        module="$(python3 -c 'import release_service_utils as m; print(m.__file__)')"
        src="$(dirname "${module}")"
        # The package is installed as root. cp -R keeps the layout and does
        # not try to preserve that ownership, which UID 1001 cannot do.
        cp -R "${src}" "${dest}/release_service_utils"
        find "${dest}" -depth -type d -name '__pycache__' -exec rm -rf {} +
        test -f "${dest}/release_service_utils/tasks/managed/push_rpm_to_koji/__main__.py"
        # -S hides site-packages, so this fails when the copy still needs a
        # third-party module that exists only in the utils image.
        PYTHONPATH="${dest}" python3 -S -c \
          'import release_service_utils.tasks.managed.push_rpm_to_koji'
    - name: push-rpm-to-koji
      # Only this step uses pipelineImage. koji and kinit must run in the Brew
      # image: its profile points serverca at /etc/pki/brew/Current-IT-Root-CAs.pem,
      # which release-service-utils does not contain. The step above copies the
      # Python module out of the utils image.
      image: $(params.pipelineImage)
      computeResources:
        limits:
          memory: 3Gi
        requests:
          memory: 3Gi
          cpu: 325m
      env:
        - name: SNAPSHOT_SPEC_FILE
          value: $(params.dataDir)/$(params.snapshotPath)
        - name: DATA_FILE
          value: $(params.dataDir)/$(params.dataPath)
        - name: DATA_DIR
          value: $(params.dataDir)
        - name: SECRET_MOUNT
          value: /etc/secret
        - name: RPM_DOWNLOAD_DIR
          value: /var/workdir/rpm-extract
        - name: KINIT_RETRIES
          value: "10"
        - name: PYTHONPATH
          value: /var/workdir/python-packages
      command:
        - python3
        - -m
        - release_service_utils.tasks.managed.push_rpm_to_koji
      volumeMounts:
        - mountPath: /etc/secret
          name: secret-volume
          readOnly: true
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
