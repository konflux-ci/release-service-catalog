---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-rh-direct-sign-image
spec:
  description: Test the happy path for rh-direct-sign-image
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:19b51294e8faf4db356d1c5ba45dd575fece40fcde081152fe4842d3e1bbb232
            script: |
              #!/usr/bin/env bash
              set -euxo pipefail

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot_spec.json" << EOF
              {
                "components": [
                  {
                    "name": "my-component",
                    "containerImage": "registry.redhat.io/myproduct/myimage@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1",
                    "repositories": [
                      {
                        "rh-registry-repo": "registry.redhat.io/myproduct/myimage",
                        "tags": ["v1.0"]
                      }
                    ]
                  }
                ]
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "sign": {
                  "configMapName": "signing-config-map"
                },
                "mapping": {
                  "defaults": {
                    "pushSourceContainer": false
                  }
                }
              }
              EOF

              touch "$(params.dataDir)/$(context.pipelineRun.uid)/signRegistryAccess.txt"
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: rh-direct-sign-image
      params:
        - name: requester
          value: testuser
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: snapshotPath
          value: $(context.pipelineRun.uid)/snapshot_spec.json
        - name: dataPath
          value: $(context.pipelineRun.uid)/data.json
        - name: pyxisSecret
          value: test-pyxis-image-cert
        - name: pyxisServer
          value: production
        - name: signRegistryAccessPath
          value: $(context.pipelineRun.uid)/signRegistryAccess.txt
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:19b51294e8faf4db356d1c5ba45dd575fece40fcde081152fe4842d3e1bbb232
            script: |
              #!/usr/bin/env bash
              set -euxo pipefail

              mock_file="$(params.dataDir)/mock_internal_request.txt"
              if [ ! -f "${mock_file}" ]; then
                echo "Error: internal-request was not called"
                exit 1
              fi

              args=$(cat "${mock_file}")

              if ! echo "${args}" | grep -q -- "--pipeline container-signing"; then
                echo "Expected --pipeline container-signing in args: ${args}"
                exit 1
              fi

              if ! echo "${args}" | grep -q "signing_requests="; then
                echo "Expected signing_requests= in args: ${args}"
                exit 1
              fi

              if ! echo "${args}" | grep -q "requester=testuser"; then
                echo "Expected requester=testuser in args: ${args}"
                exit 1
              fi

              echo "All checks passed"
      runAfter:
        - run-task
