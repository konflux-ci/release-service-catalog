---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-extract-kmods-from-image
spec:
  description: >-
    Run the extract kernel modules task from an image in a specific directory.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        params:
          - name: dataDir
            type: string
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)"

              cat > "$(params.dataDir)/snapshot.json" << 'EOF'
              {
                "components": [
                  {
                    "containerImage": "quay.io/mock/image@sha256:dummy",
                    "source": {
                      "git": {
                        "url": "https://github.com/mock/repo",
                        "revision": "abc123"
                      }
                    }
                  }
                ]
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
      params:
        - name: dataDir
          value: $(params.dataDir)

    - name: run-task
      taskRef:
        name: extract-kmods-from-image
      params:
        - name: kmodsPath
          value: /kmods
        - name: signedKmodsPath
          value: signed-kmods
        - name: snapshotPath
          value: snapshot.json
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup

    - name: check-result
      taskSpec:
        params:
          - name: dataDir
            type: string
          - name: sourceDataArtifact
            type: string
            default: ""
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: "ORAS_OPTIONS"
              value: "--insecure"
            - name: "DEBUG"
              value: ""
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-values
            image: quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
            script: |
              #!/usr/bin/env bash
              set -eux

              if [ ! -d "$(params.dataDir)/signed-kmods" ]; then
                echo "ERROR: Signed kmods directory not found"
                exit 1
              fi

              arch_found=false
              for arch_dir in "$(params.dataDir)/signed-kmods"/*/; do
                if [ -d "$arch_dir" ]; then
                  arch_name=$(basename "$arch_dir")
                  echo "Found architecture directory: $arch_name"
                  arch_found=true

                  ko_count=$(find "$arch_dir" -name "*.ko" -type f | wc -l)
                  if [ "$ko_count" -eq 0 ]; then
                    echo "ERROR: No .ko files found in $arch_name"
                    exit 1
                  fi
                  echo "SUCCESS: Found $ko_count kernel module files in $arch_name"

                  if [ -f "$arch_dir/envfile" ]; then
                    echo "SUCCESS: envfile found for $arch_name"
                  fi
                fi
              done

              if [ "$arch_found" = false ]; then
                echo "ERROR: No architecture directories found in signed-kmods"
                exit 1
              fi
      params:
        - name: dataDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
      runAfter:
        - run-task
