---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: filter-already-released-advisory-rpms
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Filters RPMs already published in advisories and reduces the snapshot to only
    components that still have RPMs to publish.

    This is a **managed Tekton task** that:
    - Pulls RPM files from each component's OCI artifact
    - Transforms RPM metadata into purls for advisory matching
    - Triggers an internal task via InternalRequest to check advisories
    - Validates Pulp digests for RPMs in advisories (rebuild detection)
    - Writes the RPMs that still need publishing under `.components[].rpmsToPublish`
    - Removes components with an empty `.rpmsToPublish` list
    - Overwrites the snapshot file in-place
  params:
    - name: snapshotPath
      type: string
      description: Path to the JSON Snapshot spec in the data workspace
    - name: dataPath
      type: string
      description: Path to the JSON data file in the data workspace
    - name: releasePlanAdmissionPath
      type: string
      description: Path to the JSON string of the ReleasePlanAdmission in the data workspace
    - name: PULP_DOMAIN
      type: string
      description: The domain to use for Pulp operations
    - name: signedPulpDomain
      type: string
      description: >-
        When set, stop if an RPM missing from advisories is already published in this signed Pulp domain.
        This prevents a new release attempt from signing and replacing RPMs after advisory creation fails
      default: ""
    - name: PULP_SECRET_NAME
      type: string
      description: >-
        The name of the secret containing the Pulp cli.toml file
    - name: DEFAULT_EXCLUDES
      type: string
      description: comma-delimited list of file patterns to exclude from consideration
      default: "-debuginfo-, -debugsource-"
    - name: DEFAULT_ARCHITECTURES
      type: string
      description: >-
        Comma-delimited list of arch repos. Noarch RPMs are always checked and published
        to every repo in this list
      default: "x86_64,aarch64,s390x,ppc64le"
    - name: pipelineRunUid
      type: string
      description: UID of the current pipelineRun
    - name: synchronously
      type: string
      description: Whether to wait for the InternalRequest completion
      default: "true"
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the OCI repository
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks to be used
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: skip_release
      type: string
      description: "true when all components had no RPMs to publish; otherwise false"
    - description: Produced trusted data artifact
      name: sourceDataArtifact
      type: string
    - name: environment
      type: string
      description: The environment for the advisory. Options are stage and production
    - name: latest_advisory_url
      type: string
      description: URL of the latest matching advisory when all components are already released
    - name: latest_advisory_internal_url
      type: string
      description: Internal URL of the latest matching advisory when all released
  volumes:
    - name: workdir
      emptyDir: {}
    - name: pulp-secret-name-vol
      secret:
        secretName: $(params.PULP_SECRET_NAME)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: HOME
        value: /tmp
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: ORAS_OPTIONS
        value: "$(params.orasOptions)"
      - name: DEBUG
        value: "$(params.trustedArtifactsDebug)"
      - name: PULP_DOMAIN
        value: "$(params.PULP_DOMAIN)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: filter
      image: quay.io/konflux-ci/release-service-utils@sha256:e30436d3473f792353ba75724328c9b2f3b7c482e234ab6e7b8a46a5e3ef52ff
      computeResources:
        limits:
          memory: 768Mi
        requests:
          memory: 768Mi
          cpu: 450m
      volumeMounts:
        - name: pulp-secret-name-vol
          mountPath: "/etc/secrets"
      env:
        - name: SNAPSHOT_FILE
          value: "$(params.dataDir)/$(params.snapshotPath)"
        - name: DATA_FILE
          value: "$(params.dataDir)/$(params.dataPath)"
        - name: RPA_FILE
          value: "$(params.dataDir)/$(params.releasePlanAdmissionPath)"
        - name: PULP_CONFIG_FILE
          value: "/etc/secrets/cli.toml"
        - name: PULP_DOMAIN
          value: "$(params.PULP_DOMAIN)"
        - name: DEFAULT_EXCLUDES
          value: "$(params.DEFAULT_EXCLUDES)"
        - name: DEFAULT_ARCHITECTURES
          value: "$(params.DEFAULT_ARCHITECTURES)"
        - name: PIPELINE_RUN_UID
          value: "$(params.pipelineRunUid)"
        - name: OCI_STORAGE
          value: "$(params.ociStorage)"
        - name: ORAS_OPTIONS
          value: "$(params.orasOptions)"
        - name: TASK_GIT_URL
          value: "$(params.taskGitUrl)"
        - name: TASK_GIT_REVISION
          value: "$(params.taskGitRevision)"
        - name: SYNCHRONOUSLY
          value: "$(params.synchronously)"
        - name: RESULT_SKIP_RELEASE
          value: "$(results.skip_release.path)"
        - name: RESULT_ENVIRONMENT
          value: "$(results.environment.path)"
        - name: RESULT_LATEST_ADVISORY_URL
          value: "$(results.latest_advisory_url.path)"
        - name: RESULT_LATEST_ADVISORY_INTERNAL_URL
          value: "$(results.latest_advisory_internal_url.path)"
      command: ["python3", "-m", "filter_already_released_advisory_rpms"]
    - name: guard-signed-rpms
      image: >-
        quay.io/konflux-ci/release-service-utils@sha256:da48275d90ecd65e2aec9c71f74b86314ce6ceb81dc3045d5c7546c9548273e8
      computeResources:
        limits:
          memory: 256Mi
        requests:
          memory: 256Mi
          cpu: 100m
      volumeMounts:
        - name: pulp-secret-name-vol
          mountPath: /etc/secrets
      env:
        - name: SNAPSHOT_FILE
          value: "$(params.dataDir)/$(params.snapshotPath)"
        - name: PULP_CONFIG_FILE
          value: /etc/secrets/cli.toml
        - name: SIGNED_PULP_DOMAIN
          value: $(params.signedPulpDomain)
        - name: RESULT_SKIP_RELEASE
          value: $(results.skip_release.path)
      script: |
        #!/usr/bin/env python3
        import json
        import os
        from pathlib import Path

        from release_service_utils.helpers import http_client
        from release_service_utils.helpers.pulp_client import (
            PulpAuth,
            PulpClient,
            PulpDigestStatus,
            parse_pulp_config,
        )

        domain = os.environ["SIGNED_PULP_DOMAIN"]
        if domain and Path(os.environ["RESULT_SKIP_RELEASE"]).read_text().strip() == "false":
            snapshot = json.loads(Path(os.environ["SNAPSHOT_FILE"]).read_text())
            config = parse_pulp_config(Path(os.environ["PULP_CONFIG_FILE"]))
            session = http_client.get_retry_session(
                total=3, connect=3, read=3, status=2, allowed_methods=frozenset({"GET"})
            )
            session.auth = PulpAuth(config)
            pulp = PulpClient(session, config["base_url"], domain)

            for component in snapshot["components"]:
                for rpm in component.get("rpmsToPublish", []):
                    for repo in rpm["targetRepos"]:
                        repo_name = repo["repository_name"]
                        # Signed RPMs have a different SHA from the unsigned snapshot RPMs.
                        # Both MATCH and MISMATCH therefore mean the release was already published.
                        status = pulp.check_digest(
                            repo_name, rpm["rpmname"], str(rpm["epoch"]),
                            rpm["version"], rpm["release"], rpm["arch"], rpm["sha256"],
                        )
                        if status != PulpDigestStatus.NOT_FOUND:
                            raise RuntimeError(
                                f"{rpm['rpm']} is already in signed Pulp domain {domain}/{repo_name} "
                                "but has no completed advisory. Stop before re-signing; "
                                "resume advisory creation from the original publication."
                            )
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
