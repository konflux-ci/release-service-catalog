---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: filter-already-released-advisory-rpms
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Filters RPMs already published in advisories and reduces the snapshot to only
    components that still have RPMs to publish.

    This is a **managed Tekton task** that:
    - Pulls RPM files from each component's OCI artifact
    - Transforms RPM metadata into purls for advisory matching
    - Triggers an internal task via InternalRequest to check advisories
    - Validates Pulp digests for RPMs in advisories (rebuild detection)
    - Writes the RPMs that still need publishing under `.components[].rpmsToPublish`
    - Removes components with an empty `.rpmsToPublish` list
    - Overwrites the snapshot file in-place
  params:
    - name: snapshotPath
      type: string
      description: Path to the JSON Snapshot spec in the data workspace
    - name: dataPath
      type: string
      description: Path to the JSON data file in the data workspace
    - name: releasePlanAdmissionPath
      type: string
      description: Path to the JSON string of the ReleasePlanAdmission in the data workspace
    - name: PULP_DOMAIN
      type: string
      description: The domain to use for Pulp operations
    - name: PULP_SECRET_NAME
      type: string
      description: >-
        The name of the secret containing the Pulp cli.toml file
    - name: DEFAULT_EXCLUDES
      type: string
      description: comma-delimited list of file patterns to exclude from consideration
      default: "-debuginfo-, -debugsource-"
    - name: DEFAULT_ARCHITECTURES
      type: string
      description: >-
        Comma-delimited list of arch repos. Noarch RPMs are always checked and published
        to every repo in this list
      default: "x86_64,aarch64,s390x,ppc64le"
    - name: pipelineRunUid
      type: string
      description: UID of the current pipelineRun
    - name: synchronously
      type: string
      description: Whether to wait for the InternalRequest completion
      default: "true"
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the OCI repository
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks to be used
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: skip_release
      type: string
      description: "true when all components had no RPMs to publish; otherwise false"
    - description: Produced trusted data artifact
      name: sourceDataArtifact
      type: string
    - name: environment
      type: string
      description: The environment for the advisory. Options are stage and production
    - name: latest_advisory_url
      type: string
      description: URL of the latest matching advisory when all components are already released
    - name: latest_advisory_internal_url
      type: string
      description: Internal URL of the latest matching advisory when all released
  volumes:
    - name: workdir
      emptyDir: {}
    - name: pulp-secret-name-vol
      secret:
        secretName: $(params.PULP_SECRET_NAME)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: HOME
        value: /tmp
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: ORAS_OPTIONS
        value: "$(params.orasOptions)"
      - name: DEBUG
        value: "$(params.trustedArtifactsDebug)"
      - name: PULP_DOMAIN
        value: "$(params.PULP_DOMAIN)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: filter
      image: quay.io/konflux-ci/release-service-utils@sha256:2f9e6863e82bbc9ddce5a290f3fd0e87657c475e3de8a832b2ef7f8d0671e7d3
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: 350m
      volumeMounts:
        - name: pulp-secret-name-vol
          mountPath: "/etc/secrets"
      script: |
        #!/bin/bash
        set -euo pipefail
        set +x

        SNAPSHOT_FILE="$(params.dataDir)/$(params.snapshotPath)"
        if [[ ! -f "${SNAPSHOT_FILE}" ]]; then
          echo "Error: No valid snapshot file was provided at ${SNAPSHOT_FILE}" >&2
          exit 1
        fi

        DATA_FILE="$(params.dataDir)/$(params.dataPath)"
        if [[ ! -f "${DATA_FILE}" ]]; then
          echo "Error: No valid data file was provided at ${DATA_FILE}" >&2
          exit 1
        fi

        RPA_FILE="$(params.dataDir)/$(params.releasePlanAdmissionPath)"
        if [[ ! -f "${RPA_FILE}" ]]; then
          echo "Error: No valid ReleasePlanAdmission file at ${RPA_FILE}" >&2
          exit 1
        fi

        origin=$(jq -r '.spec.origin' "$RPA_FILE")
        if [[ -z "$origin" ]]; then
          echo "Error: Failed to read origin from ReleasePlanAdmission" >&2
          exit 1
        fi

        # === Pulp credential setup for digest validation ===
        CONFIG_FILE_CONTENT="$(cat /etc/secrets/cli.toml || true)"
        if [[ -z "${CONFIG_FILE_CONTENT}" ]]; then
          echo "Error: Missing cli.toml in secret $(params.PULP_SECRET_NAME)" >&2
          exit 1
        fi
        echo "${CONFIG_FILE_CONTENT}" > "/tmp/cli.toml"
        export PULP_CONFIG_FILE="/tmp/cli.toml"

        toml_get_optional() {
          local key="$1"
          local line current_table="" value=""
          while IFS= read -r line || [[ -n "${line}" ]]; do
            if [[ "${line}" =~ ^[[:space:]]*\\[([^]]+)\\][[:space:]]*$ ]]; then
              current_table="${BASH_REMATCH[1]}"
              continue
            fi
            if [[ "${line}" =~ ^[[:space:]]*# ]] || [[ "${line}" =~ ^[[:space:]]*$ ]]; then
              continue
            fi
            if [[ -n "${current_table}" && "${current_table}" != "cli" ]]; then
              continue
            fi
            if [[ "${line}" =~ ^[[:space:]]*${key}[[:space:]]*= ]]; then
              if [[ "${line}" =~ \"([^\"]*)\" ]]; then
                value="${BASH_REMATCH[1]}"
                break
              fi
              if [[ "${line}" =~ \'([^\']*)\' ]]; then
                value="${BASH_REMATCH[1]}"
                break
              fi
            fi
          done < "${PULP_CONFIG_FILE}"
          echo "${value}"
        }

        toml_get_required() {
          local key="$1"
          local value
          value="$(toml_get_optional "${key}")"
          if [[ -z "${value}" ]]; then
            echo "Error: Missing required '${key}' in cli.toml" >&2
            return 1
          fi
          echo "${value}"
        }

        PULP_BASE_URL="$(toml_get_required "base_url" | sed 's:/*$::')" || exit 1
        CLIENT_ID="$(toml_get_optional "client_id")"
        CLIENT_SECRET="$(toml_get_optional "client_secret")"
        PULP_USERNAME="$(toml_get_optional "username")"
        PULP_PASSWORD="$(toml_get_optional "password")"
        TOKEN_URL="https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token"

        get_access_token() {
          if [[ -z "${CLIENT_ID}" || -z "${CLIENT_SECRET}" ]]; then
            return 1
          fi
          curl --retry 3 -s -X POST "$TOKEN_URL" \
            -u "${CLIENT_ID}:${CLIENT_SECRET}" \
            -d "grant_type=client_credentials" \
            -d "scope=api.console" | jq -r '.access_token'
        }

        get_auth_header() {
          if [[ -n "${PULP_USERNAME}" && -n "${PULP_PASSWORD}" ]]; then
            local basic
            basic="$(printf '%s' "${PULP_USERNAME}:${PULP_PASSWORD}" | base64 -w0)"
            echo "Authorization: Basic ${basic}"
            return 0
          fi
          if [[ -n "${CLIENT_ID}" && -n "${CLIENT_SECRET}" ]]; then
            local access_token
            access_token="$(get_access_token)" || return 1
            echo "Authorization: Bearer ${access_token}"
            return 0
          fi
          return 1
        }

        # Wrapper to run curl with auth header without exposing credentials in logs
        curl_auth() {
          local auth_header
          { set +x; } 2>/dev/null
          auth_header="$(get_auth_header)" || { set -x; return 1; }
          curl --retry 3 -H "${auth_header}" "$@"
          local rc=$?
          set -x
          return $rc
        }

        # Get the published repository version for a repo (what users can actually access)
        # Returns empty string if nothing is published
        get_repo_published_version_href() {
          local repo_name="$1"
          local dist_response publication_href publication_json
          local repo_version_href repo_href repo_json

          # Get distribution for this repo
          dist_response=$(curl_auth -s \
            "${PULP_BASE_URL}/api/pulp/${PULP_DOMAIN}/api/v3/distributions/rpm/rpm/?name=${repo_name}")

          # Check if distribution has a repository_version (direct link)
          repo_version_href=$(jq -r \
            '.results[0].repository_version // empty' <<< "${dist_response}")
          if [[ -n "${repo_version_href}" && "${repo_version_href}" != "null" ]]; then
            echo "${repo_version_href}"
            return 0
          fi

          # Otherwise check if it has a publication
          publication_href=$(jq -r \
            '.results[0].publication // empty' <<< "${dist_response}")
          if [[ -n "${publication_href}" && "${publication_href}" != "null" ]]; then
            publication_json=$(curl_auth -s "${PULP_BASE_URL}${publication_href}")
            repo_version_href=$(jq -r \
              '.repository_version // empty' <<< "${publication_json}")
            echo "${repo_version_href}"
            return 0
          fi

          # Fallback: check repository's latest version directly
          repo_href=$(jq -r \
            '.results[0].repository // empty' <<< "${dist_response}")
          if [[ -n "${repo_href}" && "${repo_href}" != "null" ]]; then
            repo_json=$(curl_auth -s \
              "${PULP_BASE_URL}${repo_href}")
            repo_version_href=$(jq -r \
              '.latest_version_href // empty' <<< "${repo_json}")
            if [[ -n "${repo_version_href}" && "${repo_version_href}" != "null" ]]; then
              echo "${repo_version_href}"
              return 0
            fi
          fi

          echo ""
        }

        # Check Pulp for RPM digest in PUBLISHED content only.
        # Returns: 0=matches, 1=error, 2=not found/unpublished, 3=mismatch
        check_pulp_digest() {
          local repo_name="$1" rpmname="$2" epoch="$3" version="$4"
          local release="$5" arch="$6" expected_sha="$7"

          local endpoint="packages"
          local repo_version_href

          # Check PUBLISHED version, not latest version
          repo_version_href="$(get_repo_published_version_href "${repo_name}")" || return 1

          # If no published version, treat as "not found" (allows overwrite)
          if [[ -z "${repo_version_href}" || "${repo_version_href}" == "null" ]]; then
            echo "  -> No published version for ${repo_name}. RPM not accessible to users." >&2
            return 2
          fi

          local query_url
          query_url="${PULP_BASE_URL}/api/pulp/${PULP_DOMAIN}/api/v3/content/rpm/${endpoint}/"
          query_url+="?repository_version=$(jq -rn --arg x "${repo_version_href}" '$x|@uri')"
          query_url+="&name=$(jq -rn --arg x "${rpmname}" '$x|@uri')"
          query_url+="&epoch=$(jq -rn --arg x "${epoch}" '$x|@uri')"
          query_url+="&version=$(jq -rn --arg x "${version}" '$x|@uri')"
          query_url+="&release=$(jq -rn --arg x "${release}" '$x|@uri')"
          query_url+="&arch=$(jq -rn --arg x "${arch}" '$x|@uri')"

          local response count
          response="$(curl_auth -sS --fail "${query_url}")" || return 1

          count="$(jq -er '.count // 0' <<< "${response}" 2>/dev/null)" || return 1
          if [[ "${count}" -eq 0 ]]; then
            return 2
          fi

          local content_hrefs server_sha
          mapfile -t content_hrefs < <(jq -r '.results[].pulp_href' <<< "${response}")
          for chref in "${content_hrefs[@]}"; do
            [[ -z "$chref" || "$chref" == "null" ]] && continue
            local content_json artifact_href artifact_json
            content_json="$(curl_auth -s "${PULP_BASE_URL}${chref}")"
            artifact_href="$(jq -r '.artifact // .artifacts[0] // empty' <<< "${content_json}")"
            [[ -z "${artifact_href}" || "${artifact_href}" == "null" ]] && continue
            artifact_json="$(curl_auth -s "${PULP_BASE_URL}${artifact_href}")"
            server_sha="$(jq -r '.sha256 // empty' <<< "${artifact_json}")"
            if [[ -n "${server_sha}" && "${server_sha}" == "${expected_sha}" ]]; then
              return 0
            fi
          done
          return 3
        }

        set -x

        RPM_REPOS_JSON="$(jq -c '.mapping["rpm-repositories"] // []' "${DATA_FILE}")"

        declare -A ARCH_REPO_INFO_CACHE
        while IFS= read -r _repo_line; do
          _arch="$(jq -r '.arch' <<< "$_repo_line")"
          [[ -z "${ARCH_REPO_INFO_CACHE[$_arch]+x}" ]] && \
            ARCH_REPO_INFO_CACHE["$_arch"]="$(jq -c '{repository_id, repository_name, distro}' <<< "$_repo_line")"
        done < <(jq -c '.[]' <<< "$RPM_REPOS_JSON")

        get_repo_info_for_arch() {
          echo "${ARCH_REPO_INFO_CACHE[$1]:-}"
        }

        should_exclude_file() {
          local filename="$1" patterns_csv="$2"
          IFS=',' read -ra EXCLUDE_PATTERNS <<< "${patterns_csv}"
          for pattern in "${EXCLUDE_PATTERNS[@]}"; do
            pattern="$(echo "${pattern}" | xargs)"
            [[ -z "${pattern}" ]] && continue
            [[ "${filename}" == *"${pattern}"* ]] && return 0
          done
          return 1
        }

        extract_arches_from_files() {
          local -n files_ref=$1
          local arches=() arch_pattern='\.([^.]+)\.rpm$'
          for file in "${files_ref[@]}"; do
            [[ "${file}" == *.src.rpm || "${file}" == *.noarch.rpm ]] && continue
            if [[ "${file}" =~ ${arch_pattern} ]]; then
              local arch="${BASH_REMATCH[1]}"
              [[ " ${arches[*]} " != *" ${arch} "* ]] && arches+=("${arch}")
            fi
          done
          [[ ${#arches[@]} -gt 0 ]] && printf '%s\n' "${arches[@]}"
        }

        # Determine advisory secret based on intention or advisory.repo
        INTENTION=$(jq -r '.intention // ""' "${DATA_FILE}")
        advisory_repo=$(jq -r '.advisory.repo // ""' "${DATA_FILE}")

        if [[ "${INTENTION}" == "staging" ]]; then
          advisorySecretName="create-advisory-stage-secret"
          printf "stage" | tee "$(results.environment.path)"
        elif [[ "${INTENTION}" == "production" ]]; then
          advisorySecretName="create-advisory-prod-secret"
          printf "production" | tee "$(results.environment.path)"
        elif [[ "${advisory_repo}" == *"rhtap-release"* || "${advisory_repo}" == *"stage"* ]]; then
          advisorySecretName="create-advisory-stage-secret"
          printf "stage" | tee "$(results.environment.path)"
        else
          advisorySecretName="create-advisory-prod-secret"
          printf "production" | tee "$(results.environment.path)"
        fi

        # === Phase 1: Extract RPMs and build purl-enriched snapshot ===
        echo "Extracting RPMs and building purl data..."
        snapshot_json="$(jq '.' "${SNAPSHOT_FILE}")"
        TRANSFORMED_ENTRIES_FILE="$(mktemp)"
        : > "$TRANSFORMED_ENTRIES_FILE"
        COMPONENT_RPMS_MAP_DIR="$(mktemp -d)"

        DEFAULT_ARCH_LIST=()
        IFS=',' read -ra _raw_default <<< "$(params.DEFAULT_ARCHITECTURES)"
        for x in "${_raw_default[@]}"; do
          x=$(echo "$x" | xargs)
          [[ -n "$x" ]] && DEFAULT_ARCH_LIST+=("$x")
        done

        NOARCH_TARGET_REPOS=()
        for default_arch in "${DEFAULT_ARCH_LIST[@]}"; do
          repo_info="$(get_repo_info_for_arch "${default_arch}")"
          [[ -n "${repo_info}" ]] && NOARCH_TARGET_REPOS+=("${repo_info}")
        done

        json_escape() {
          local s="$1"
          s="${s//\\/\\\\}"
          s="${s//\"/\\\"}"
          echo -n "$s"
        }

        while IFS= read -r component; do
          IFS='|' read -r image name <<< "$(jq -r '[.containerImage, .name] | join("|")' <<< "$component")"
          echo "Processing component '${name}' (${image})" >&2

          workdir="$(mktemp -d)"
          mkdir -p "${workdir}/files"
          AUTHFILE="${workdir}/auth.json"
          export AUTHFILE
          select-oci-auth "${image}" > "${AUTHFILE}"
          oras pull --registry-config "${AUTHFILE}" "${image}" -o "${workdir}/files" 1>&2

          mapfile -t files < <(
            shopt -s nullglob
            cd "${workdir}/files"
            for f in *; do
              [[ -f "${f}" && "${f}" == *.rpm ]] || continue
              should_exclude_file "${f}" "$(params.DEFAULT_EXCLUDES)" && continue
              printf '%s\n' "${f}"
            done
          )

          if [[ ${#files[@]} -eq 0 ]]; then
            rm -rf "${workdir}"
            continue
          fi

          mapfile -t ARCHES < <(extract_arches_from_files files)
          [[ ${#ARCHES[@]} -eq 0 ]] && ARCHES=("${DEFAULT_ARCH_LIST[@]}")

          COMPONENT_RPMS_FILE="$(mktemp)"
          : > "$COMPONENT_RPMS_FILE"

          for f in "${files[@]}"; do
            file_abs="${workdir}/files/${f}"
            local_sha="$(sha256sum "${file_abs}" | awk '{print $1}')"
            q="$(rpm -qp --qf '%{NAME}|%{EPOCH}|%{VERSION}|%{RELEASE}|%{ARCH}\n' \
              "${file_abs}" 2>/dev/null)" || continue
            IFS='|' read -r rpmname epoch version release arch <<< "${q}"
            [[ -z "${epoch}" || "${epoch}" == "(none)" ]] && epoch="0"

            target_repos=()
            if [[ "${f}" == *.src.rpm ]]; then
              arch="src"
              repo_info="$(get_repo_info_for_arch "src")"
              if [[ -n "${repo_info}" ]]; then
                target_repos=("${repo_info}")
              else
                echo "Warning: No repository mapping for source arch, skipping ${f}" >&2
                continue
              fi
            elif [[ "${f}" == *.noarch.rpm ]]; then
              [[ ${#NOARCH_TARGET_REPOS[@]} -eq 0 ]] && continue
              target_repos=("${NOARCH_TARGET_REPOS[@]}")
            else
              repo_info="$(get_repo_info_for_arch "${arch}")"
              [[ -z "${repo_info}" ]] && continue
              target_repos=("${repo_info}")
            fi

            for repo_obj in "${target_repos[@]}"; do
              IFS='|' read -r repo_name repo_id distro <<< \
                "$(jq -r '[.repository_name, .repository_id, .distro] | join("|")' <<< "${repo_obj}")"
              purl="pkg:rpm/redhat/${rpmname}@${version}-${release}?arch=${arch}"
              [[ -n "${distro}" && "${distro}" != "null" ]] && purl="${purl}&distro=${distro}"
              [[ -n "${repo_id}" && "${repo_id}" != "null" ]] && purl="${purl}&repository_id=${repo_id}"

              _fmt='{"name":"%s","purl":"%s","sha256":"%s",'
              _fmt+='"rpmname":"%s","epoch":"%s","version":"%s",'
              _fmt+='"release":"%s","arch":"%s",'
              _fmt+='"repository_name":"%s","rpm":"%s",'
              _fmt+='"targetRepo":%s}\n'
              # shellcheck disable=SC2059
              printf "$_fmt" \
                "$(json_escape "$name")" \
                "$(json_escape "$purl")" "$local_sha" \
                "$(json_escape "$rpmname")" "$epoch" \
                "$(json_escape "$version")" \
                "$(json_escape "$release")" "$arch" \
                "$(json_escape "$repo_name")" \
                "$(json_escape "$f")" "$repo_obj" \
                >> "$TRANSFORMED_ENTRIES_FILE"

              _rfmt='{"rpm":"%s","sha256":"%s",'
              _rfmt+='"rpmname":"%s","epoch":"%s",'
              _rfmt+='"version":"%s","release":"%s",'
              _rfmt+='"arch":"%s","targetRepos":[%s]}\n'
              # shellcheck disable=SC2059
              printf "$_rfmt" \
                "$(json_escape "$f")" "$local_sha" \
                "$(json_escape "$rpmname")" "$epoch" \
                "$(json_escape "$version")" \
                "$(json_escape "$release")" \
                "$arch" "$repo_obj" \
                >> "$COMPONENT_RPMS_FILE"
            done
          done

          if [[ -s "$COMPONENT_RPMS_FILE" ]]; then
            jq -s '.' "$COMPONENT_RPMS_FILE" > "${COMPONENT_RPMS_MAP_DIR}/${name}.json"
          fi
          rm -f "$COMPONENT_RPMS_FILE"
          rm -rf "${workdir}"
        done < <(jq -c '.components[]' <<< "${snapshot_json}")

        TOTAL_ENTRIES=$(wc -l < "$TRANSFORMED_ENTRIES_FILE")
        echo "Total transformed entries: $TOTAL_ENTRIES"

        if [[ "$TOTAL_ENTRIES" -eq 0 ]]; then
          echo "No RPMs found in any component, skipping release"
          echo -n "true" > "$(results.skip_release.path)"
          echo -n "" > "$(results.latest_advisory_url.path)"
          echo -n "" > "$(results.latest_advisory_internal_url.path)"
          jq '.components = []' "${SNAPSHOT_FILE}" > "${SNAPSHOT_FILE}.tmp"
          mv "${SNAPSHOT_FILE}.tmp" "${SNAPSHOT_FILE}"
          exit 0
        fi

        transformedSnapshot=$(jq -s '.' "$TRANSFORMED_ENTRIES_FILE" | gzip -c | base64 -w 0)

        # === Phase 2: Create InternalRequest (no Pulp params) ===
        pipelinerun_label="internal-services.appstudio.openshift.io/pipelinerun-uid"
        IR_FILE="$(params.dataDir)/$(context.task.name)/ir-result.txt"
        mkdir -p "$(dirname "$IR_FILE")"

        echo "Creating internal request for advisory-based RPM filtering..."
        internal-request --pipeline "filter-already-released-advisory-rpms" \
                         -p transformedSnapshot="$transformedSnapshot" \
                         -p origin="$origin" \
                         -p advisory_secret_name="$advisorySecretName" \
                         -p internalRequestPipelineRunName="$(params.pipelineRunUid)" \
                         -p ociStorage="$(params.ociStorage)" \
                         -p orasOptions="$(params.orasOptions)" \
                         -p taskGitUrl="$(params.taskGitUrl)" \
                         -p taskGitRevision="$(params.taskGitRevision)" \
                         -s "$(params.synchronously)" \
                         -l ${pipelinerun_label}="$(params.pipelineRunUid)" \
                         | tee "$IR_FILE"

        internalRequest=$(awk -F"'" '/created/ { print $2 }' "$IR_FILE")
        echo "Internal request created: ${internalRequest}"

        kubectl get internalrequest "${internalRequest}" -o json | jq .

        results=$(kubectl get internalrequest "$internalRequest" -o=jsonpath='{.status.results}')
        if [[ -z "$results" ]]; then
          echo "No results found in internal request"
          kubectl get internalrequest "${internalRequest}" -o yaml
          exit 1
        fi

        if [[ "$(jq -r '.result' <<< "$results")" != "Success" ]]; then
          echo "Filtering failed: $results"
          exit 1
        fi

        latestAdvisoryUrl="$(jq -jr '.advisory_url // ""' <<< "${results}")"
        latestAdvisoryInternalUrl="$(jq -jr '.advisory_internal_url // ""' <<< "${results}")"

        # === Phase 3: Pull filter results from OCI artifact ===
        FILTER_RESULTS_ARTIFACT=$(jq -r '.filter_results_artifact // ""' <<< "$results")
        if [[ -z "$FILTER_RESULTS_ARTIFACT" ]]; then
          echo "No filter_results_artifact found in results"
          exit 1
        fi

        echo "Pulling filter results from: ${FILTER_RESULTS_ARTIFACT}"
        FILTER_RESULTS_DIR=$(mktemp -d)
        oci_ref="${FILTER_RESULTS_ARTIFACT#oci:}"
        oci_storage="${oci_ref%%@*}"
        AUTHFILE=$(mktemp)
        select-oci-auth "${oci_storage}" > "${AUTHFILE}"
        oras pull --registry-config "${AUTHFILE}" "${oci_ref}" -o "$FILTER_RESULTS_DIR"
        rm -f "${AUTHFILE}"

        # Extract the tarball
        tar -xzf "$FILTER_RESULTS_DIR/filter-results.tar.gz" -C "$FILTER_RESULTS_DIR"

        IN_ADVISORY_FILE="$FILTER_RESULTS_DIR/in_advisory_rpms.json"
        UNRELEASED_FILE="$FILTER_RESULTS_DIR/unreleased_rpms.json"

        # === Phase 4: Validate Pulp digests for in-advisory RPMs ===
        # Advisory is authoritative - if RPM is in advisory, it was released (regardless of Pulp state)
        # This check validates that any published RPMs match expected digests (prevents rebuilds)
        if [[ -f "$IN_ADVISORY_FILE" ]]; then
          IN_ADVISORY_COUNT=$(jq 'length' "$IN_ADVISORY_FILE")
          echo "Validating Pulp digests for $IN_ADVISORY_COUNT in-advisory RPMs..."

          while IFS='|' read -r rpmname epoch version release arch sha256 repo_name; do
            echo "Checking Pulp digest for ${rpmname}-${version}-${release}.${arch}..."

            set +e
            check_pulp_digest "$repo_name" "$rpmname" "$epoch" "$version" \
              "$release" "$arch" "$sha256"
            pulp_status=$?
            set -e

            case $pulp_status in
              0)
                echo "  -> Published in Pulp with matching digest"
                ;;
              2)
                echo "  -> Not published in Pulp yet (advisory is authoritative)"
                ;;
              3)
                echo "Error: Cannot rebuild RPM with same NEVR but different digest"
                echo "RPM: ${rpmname}-${version}-${release}.${arch}"
                echo "Snapshot sha256: ${sha256}"
                echo "Action required: Bump version or release number"
                rm -rf "$FILTER_RESULTS_DIR"
                exit 1
                ;;
              *)
                echo "Error: Failed to check Pulp digest (status=$pulp_status)"
                rm -rf "$FILTER_RESULTS_DIR"
                exit 1
                ;;
            esac
          done < <(jq -r \
            '.[] | [.rpmname, .epoch, .version, .release,
                    .arch, .sha256, .repository_name]
                   | join("|")' "$IN_ADVISORY_FILE")
        fi

        # === Phase 5: Process unreleased RPMs and filter snapshot ===
        if [[ ! -f "$UNRELEASED_FILE" ]]; then
          echo "No unreleased_rpms.json found in filter results"
          exit 1
        fi

        UNRELEASED_COUNT=$(jq 'length' "$UNRELEASED_FILE")
        echo "Unreleased RPMs: $UNRELEASED_COUNT"

        # Get unique component names from unreleased RPMs
        UNRELEASED_COMPONENTS=$(jq -c '[.[].name] | unique' "$UNRELEASED_FILE")

        if [[ "$UNRELEASED_COUNT" -eq 0 ]]; then
          echo "All RPMs in the snapshot have already been released in advisories."
          echo -n "true" > "$(results.skip_release.path)"
          echo -n "$latestAdvisoryUrl" > "$(results.latest_advisory_url.path)"
          echo -n "$latestAdvisoryInternalUrl" > "$(results.latest_advisory_internal_url.path)"
          jq '.components = []' "${SNAPSHOT_FILE}" > "${SNAPSHOT_FILE}.tmp"
          mv "${SNAPSHOT_FILE}.tmp" "${SNAPSHOT_FILE}"
          rm -rf "$FILTER_RESULTS_DIR"
          exit 0
        fi

        # Build filtered snapshot with rpmsToPublish for unreleased components
        FILTERED_COMPS_FILE="$(mktemp)"
        : > "$FILTERED_COMPS_FILE"
        while IFS= read -r comp_name; do
          [[ -z "$comp_name" ]] && continue

          original_component=$(jq --arg name "$comp_name" \
            '.components[] | select(.name == $name)' <<< "$snapshot_json")
          [[ -z "$original_component" ]] && continue

          comp_rpms_file="${COMPONENT_RPMS_MAP_DIR}/${comp_name}.json"
          [[ ! -s "$comp_rpms_file" ]] && continue

          echo "$original_component" | \
            jq --slurpfile rpms "$comp_rpms_file" '. + {rpmsToPublish: $rpms[0]}' \
            >> "$FILTERED_COMPS_FILE"
        done < <(jq -r '.[]' <<< "$UNRELEASED_COMPONENTS")

        jq --slurpfile comps "$FILTERED_COMPS_FILE" \
          '.components = $comps' "${SNAPSHOT_FILE}" > "${SNAPSHOT_FILE}.tmp"
        mv "${SNAPSHOT_FILE}.tmp" "${SNAPSHOT_FILE}"

        echo "Filtered snapshot components: $(jq '.components | length' "${SNAPSHOT_FILE}")"
        echo -n "false" > "$(results.skip_release.path)"
        echo -n "" > "$(results.latest_advisory_url.path)"
        echo -n "" > "$(results.latest_advisory_internal_url.path)"

        rm -rf "$FILTERED_COMPS_FILE" "$COMPONENT_RPMS_MAP_DIR" "$TRANSFORMED_ENTRIES_FILE" "$FILTER_RESULTS_DIR"
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
