---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: filter-already-released-advisory-images
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    This task filters out images from a snapshot that have already been published
    in advisories. It is a **managed Tekton task** that triggers an **internal task**
    using an InternalRequest, and overwrites the mapped snapshot file with a
    filtered version containing only **unpublished images**.

    The task also outputs a `skip_release` result, which is set to `true`
    if all components are already released (and the pipeline can be skipped),
    or `false` otherwise.

    The task overwrites the original mapped snapshot file in place with a
    filtered version containing only unpublished images.
    Downstream tasks continue to use the same snapshot path.
  params:
    - name: snapshotPath
      type: string
      description: Path to the JSON string of the Snapshot spec in the data workspace
    - name: releasePlanAdmissionPath
      type: string
      description: Path to the JSON string of the ReleasePlanAdmission in the data workspace
    - name: resultsDirPath
      type: string
      description: Path to the results directory in the data workspace
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: Git revision to use for internal task
    - name: pipelineRunUid
      type: string
      description: UID of the current pipelineRun
    - name: synchronously
      type: string
      description: Whether to wait for the InternalRequest completion
      default: "true"
    - name: dataPath
      description: Path to the JSON string of the merged data to use in the data workspace
      type: string
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: result
      description: Success or failure result
    - name: skip_release
      description: Whether to skip release tasks (true if all components are already released)
    - description: Produced trusted data artifact
      name: sourceDataArtifact
      type: string
    - name: environment
      type: string
      description: The environment for the advisory to be published. Options are stage and production
    - name: latest_advisory_url
      type: string
      description: URL of the latest matching advisory when all components are already released
    - name: latest_advisory_internal_url
      type: string
      description: Internal URL of the latest matching advisory when all components are already released
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: run-script
      # TEMP: pinned to the release-service-utils#1002 PR-build image (fixes a bug
      # where #923 added filter_already_released_advisory_images_managed.py under
      # the pre-restructuring scripts/python/ path, making it unreachable in the
      # built image) to validate the Tekton task tests before that PR merges.
      # Revert to the released utils image once konflux-ci/release-service-utils#1002
      # merges and promotes.
      image: quay.io/redhat-user-workloads/rhtap-release-2-tenant/release-service-utils-standalone@sha256:ca7f734f03d1a5c53c0058b20580bbf9bd9ab195f5bf1691186ff0738af49b5e
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: 650m
      env:
        - name: SNAPSHOT_FILE
          value: "$(params.dataDir)/$(params.snapshotPath)"
        - name: RPA_FILE
          value: "$(params.dataDir)/$(params.releasePlanAdmissionPath)"
        - name: DATA_FILE
          value: "$(params.dataDir)/$(params.dataPath)"
        - name: RESULTS_FILE
          value: "$(params.dataDir)/$(params.resultsDirPath)/filter-already-released-advisory-images-results.json"
        - name: PIPELINE_RUN_UID
          value: "$(params.pipelineRunUid)"
        - name: TASK_GIT_URL
          value: "$(params.taskGitUrl)"
        - name: TASK_GIT_REVISION
          value: "$(params.taskGitRevision)"
        - name: SYNCHRONOUSLY
          value: "$(params.synchronously)"
        - name: RESULT_RESULT
          value: "$(results.result.path)"
        - name: RESULT_SKIP_RELEASE
          value: "$(results.skip_release.path)"
        - name: RESULT_ENVIRONMENT
          value: "$(results.environment.path)"
        - name: RESULT_LATEST_ADVISORY_URL
          value: "$(results.latest_advisory_url.path)"
        - name: RESULT_LATEST_ADVISORY_INTERNAL_URL
          value: "$(results.latest_advisory_internal_url.path)"
      command: ["python3"]
      args:
        - "-u"
        - "/home/scripts/python/tasks/managed/filter_already_released_advisory_images_managed.py"
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
