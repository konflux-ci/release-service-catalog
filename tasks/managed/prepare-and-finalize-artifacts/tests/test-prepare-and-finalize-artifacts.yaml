---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-prepare-and-finalize-artifacts
spec:
  description: |
    Happy-path smoke test for prepare-and-finalize-artifacts. Verifies the task
    prefers rpmDataArtifact when both artifacts are provided. Other scenarios
    are covered by pytest in release-service-utils.
  params:
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: "/var/workdir/release"
    - name: taskGitUrl
      type: string
      default: "https://github.com/konflux-ci/release-service-catalog.git"
    - name: taskGitRevision
      type: string
      default: "main"
  tasks:
    - name: run-task
      taskRef:
        name: prepare-and-finalize-artifacts
      params:
        - name: dataDir
          value: $(params.dataDir)
        - name: ociStorage
          value: "mock.registry/test-repo/my-artifact"
        - name: ociArtifactExpiresAfter
          value: "1d"
        - name: orasOptions
          value: "--insecure"
        - name: baseDataArtifact
          value: "oci:mock.registry/test-repo/base-artifact@sha256:1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"
        - name: rpmDataArtifact
          value: "oci:mock.registry/test-repo/rpm-artifact@sha256:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
        - name: trustedArtifactsDebug
          value: ""
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
    - name: check-result
      runAfter:
        - run-task
      params:
        - name: selectedArtifact
          value: $(tasks.run-task.results.selectedArtifact)
      taskSpec:
        params:
          - name: selectedArtifact
            type: string
        steps:
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:a8113f36ab26495871df120c819c79d093308a85e2a3d3ada53f5e2c19bf1e55
            env:
              - name: SELECTED_ARTIFACT
                value: $(params.selectedArtifact)
            script: |
              #!/usr/bin/env bash
              set -ex

              test "${SELECTED_ARTIFACT}" = \
                "oci:mock.registry/test-repo/rpm-artifact@sha256:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
