---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: collect-slack-notification-params
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task that collects slack configuration options from Release CRs and the data file. A formatted message is
    emitted as a task result for downstream tasks to use.
  params:
    - name: releasePath
      type: string
      description:
        Path to the JSON string of the Release CR
    - name: snapshotPath
      description: Path to the JSON string of the mapped Snapshot spec in the data workspace
      type: string
    - name: dataPath
      type: string
      description: Path to the JSON string of the merged data containing the configuration options to use
    - name: hacUrl
      type: string
      description: Root URL of HAC UI (hybrid access console)
      default: "https://console.redhat.com/preview/application-pipeline/workspaces"
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: sourceDataArtifact
      description: The source data artifact from the previous task
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: ociArtifactExpiresAfter
      description: >-
        Expiration date for the trusted artifacts created in the OCI repository.
        An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: message
      type: string
      description: the formatted message to use in downstream tasks
    - name: slack-notification-secret
      type: string
      description: Name of secret which contains keyname=webhookURLs
    - name: slack-notification-secret-keyname
      type: string
      description: Name of key within secret which contains webhook URL
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 32Mi
        requests:
          memory: 32Mi
          cpu: 20m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: create-message
      image: quay.io/konflux-ci/release-service-utils@sha256:7080de2cf6b6e26faf962698dedbc3afed98636d75ff07dacb524b64c8c42f95
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 50m
      env:
        - name: DATA_DIR
          value: $(params.dataDir)
        - name: DATA_PATH
          value: $(params.dataPath)
        - name: SNAPSHOT_PATH
          value: $(params.snapshotPath)
        - name: RELEASE_PATH
          value: $(params.releasePath)
        - name: HAC_URL
          value: $(params.hacUrl)
        - name: RESULT_MESSAGE
          value: $(results.message.path)
        - name: RESULT_SLACK_NOTIFICATION_SECRET
          value: $(results.slack-notification-secret.path)
        - name: RESULT_SLACK_NOTIFICATION_SECRET_KEYNAME
          value: $(results.slack-notification-secret-keyname.path)
      command: ["python3"]
      args:
        - "-u"
        - "/home/scripts/python/tasks/managed/collect_slack_notification_params.py"
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
