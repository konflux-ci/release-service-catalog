---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-sbom-to-s3
  labels:
    app.kubernetes.io/version: "0.1.0"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |
    Push unuploaded SBOMs to S3 to retry the Atlas push.
  params:
    - name: retryAWSSecretName
      description: Name of the Secret containing AWS credentials for retry mechanism.
    - name: retryS3Bucket
      description: Name of the S3 bucket for the retry mechanism.
    - name: sbomDir
      description: |
        Path to the directory in the data workspaces containing the SBOMs.
  workspaces:
    - name: data
  steps:
    - name: push-to-s3
      image: quay.io/konflux-ci/release-service-utils:e85ceb962ee6f4d0672b4aa4e9946621ab302f20
      # onError: continue
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: $(params.retryAWSSecretName)
              key: atlas-aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.retryAWSSecretName)
              key: atlas-aws-secret-access-key
      script: |
        #!/usr/bin/env bash
        set -o pipefail -o nounset

        sbomDir="$(workspaces.data.path)/$(params.sbomDir)"

        echo "$(find "$sbomDir" -type f | wc -l) SBOMs to upload to S3."

        shopt -s nullglob
        for sbom in "$sbomDir"/*; do
          # strip supported version suffix
          to_upload="${sbom%.supported_version}"
          cp "${sbom}" "${to_upload}"

          region="us-east-1"
          bucket="$(params.retryS3Bucket)"

          echo "Pushing $to_upload to S3."
          if ! curl -X PUT \
              --silent --show-error --fail-with-body --retry 5 \
              --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
              --aws-sigv4 "aws:amz:${region}:s3" \
              --upload-file "${to_upload}" \
              "https://${bucket}.s3.${region}.amazonaws.com"; then
            >&2 echo "ERROR: Failed to push SBOM to S3 bucket."
            exit 1
          fi
        done
