---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-workspace
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to delete a given directory in a passed workspace and cleanup InternalRequests related to the current
    PipelineRun.
  params:
    - name: subdirectory
      type: string
      description: The directory to remove within the workspace
    - name: delay
      type: string
      default: 60
      description: Time in seconds to delay the cleanup action
    - name: pipelineRunUid
      type: string
      default: ""
      description: The uid of the current pipelineRun. It is only available at the pipeline level
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  workspaces:
    - name: input
      description: Workspace where the directory to cleanup exists
  volumes:
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
  steps:
    - name: cleanup
      image: quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 100m
      command: ["python3"]
      args:
        - -m
        - release_service_utils.tasks.managed.cleanup_workspace 
        - "--subdirectory"
        - "$(params.subdirectory)"
        - "--delay"
        - "$(params.delay)"
        - "--pipeline-run-uid"
        - "$(params.pipelineRunUid)"
        - "--workspace-path"
        - "$(workspaces.input.path)"
