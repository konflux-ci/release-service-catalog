---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-push-rpms-to-pulp-only-noarch-rpms
spec:
  description: |
    Run the push-rpms-to-pulp task with required parameters - but only noarch rpms are expected.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: HOME
              value: /var/workdir
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot_spec.json" << EOF
              {
                "application": "rpms",
                "artifacts": {},
                "components": [
                  {
                    "containerImage": "quay.io/test/onlynoarch@sha256:12345",
                    "name": "test",
                    "source": {
                      "git": {
                        "revision": "32c8f78c26e5831a87aa865ea80452fadbb3a95e",
                        "url": "https://gitlab.example.com/rpms/test"
                      }
                    }
                  }
                ]
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: push-rpms-to-pulp
      params:
        - name: SNAPSHOT_PATH
          value: "$(context.pipelineRun.uid)/snapshot_spec.json"
        - name: PULP_DOMAIN
          value: "mydomain"
        - name: PULP_SECRET_NAME
          value: "pulp-task-pulp-secret"
        - name: resultsDirPath
          value: "$(context.pipelineRun.uid)/results"
        - name: artifactsJsonDirPath
          value: "$(context.pipelineRun.uid)/artifacts"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
            script: |
              #!/usr/bin/env bash
              set -eux

              ls -lR "$(params.dataDir)"

              results=$(cat "$(params.dataDir)/$(context.pipelineRun.uid)/results/push-rpms-to-pulp-results.json")
              echo "$results"

              if [ "$(wc -l < "$(params.dataDir)/mock_oras.txt")" != 1 ]; then
                echo Error: oras was expected to be called 1 time. Actual calls:
                cat "$(params.dataDir)/mock_oras.txt"
                exit 1
              fi

              # Expect domain show + rpm repo list + 4 uploads = 6
              if [ "$(wc -l < "$(params.dataDir)/mock_pulp.txt")" != 6 ]; then
                echo Error: pulp was expected to be called 6 times. Actual calls:
                cat "$(params.dataDir)/mock_pulp.txt"
                exit 1
              fi

              # count how many rpmfiles are in the results
              if [ "$(echo "$results" | jq '.rpmfiles | length')" != 4 ]; then
                echo Error: there should be 4 rpmfiles in the results. Actual results:
                echo "$results"
                exit 1
              fi
              # count how noarch rpmfiles are in the results
              if [ "$(echo "$results" | jq '.rpmfiles | map(select(.arch == "noarch")) | length')" != 4 ]; then
                echo Error: there should be 4 noarch rpmfiles in the results. Actual results:
                echo "$results"
                exit 1
              fi
              # count how non-noarch rpmfiles are in the results
              if [ "$(echo "$results" | jq '.rpmfiles | map(select(.arch != "noarch")) | length')" != 0 ]; then
                echo Error: there should be 0 non-noarch rpmfiles in the results. Actual results:
                echo "$results"
                exit 1
              fi
              # count how source rpmfiles are in the results
              if [ "$(echo "$results" | jq '.rpmfiles | map(select(.arch == "src")) | length')" != 0 ]; then
                echo Error: there should be 0 source rpmfiles in the results. Actual results:
                echo "$results"
                exit 1
              fi

              # Verify artifacts.json (pulp-tool format) was created in dedicated directory
              artifacts=$(cat "$(params.dataDir)/$(context.pipelineRun.uid)/artifacts/artifacts.json")
              echo "Artifacts JSON:"
              echo "$artifacts"

              # Check artifacts.json has the expected structure
              if ! echo "$artifacts" | jq -e '.artifacts' > /dev/null; then
                echo Error: artifacts.json is missing the artifacts field
                exit 1
              fi

              if ! echo "$artifacts" | jq -e '.distributions' > /dev/null; then
                echo Error: artifacts.json is missing the distributions field
                exit 1
              fi

              # Count total artifacts (1 noarch RPM deduplicated, even though pushed to 4 repos)
              # Note: rpmfiles has 4 because noarch is recorded per-arch repo, but
              # artifacts.json deduplicates noarch to a single entry
              artifact_count=$(echo "$artifacts" | jq '.artifacts | keys | length')
              if [ "$artifact_count" != 1 ]; then
                echo "Error: artifacts.json should have 1 artifact, got $artifact_count"
                exit 1
              fi

              # Verify the artifact has arch=noarch in labels
              jq_noarch='[.artifacts | to_entries[] | select(.value.labels.arch == "noarch")] | length'
              noarch_artifacts=$(echo "$artifacts" | jq "$jq_noarch")
              if [ "$noarch_artifacts" != 1 ]; then
                echo "Error: artifact should have arch=noarch, got $noarch_artifacts with noarch"
                exit 1
              fi
      runAfter:
        - run-task
