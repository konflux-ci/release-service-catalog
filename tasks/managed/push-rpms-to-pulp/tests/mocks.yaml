---
# Declarative mocks for Tekton tests of this task (Python entrypoint). Rendered
# by .github/scripts/render_python_task_mocks_from_yaml.py when
# test_tekton_tasks.sh runs.
version: 1
services:
  - type: http_json
    port: 8080
    bind: 127.0.0.1
    routes:
      - path_contains: /domains/
        body: '{"results": [{"name": "mydomain"}]}'
      - path_contains: /modify/
        body: '{"task": "/api/pulp/mydomain/api/v3/tasks/mock-task-id/"}'
      - path_contains: /tasks/
        body: '{"state": "completed"}'
      - path_contains: /distributions/
        body: '{"results": []}'
      - path_contains: /content/rpm/packages/
        body: '{"count": 0, "results": []}'
      - path_contains: /repositories/rpm/rpm/?name=
        body: '{"results": [{"pulp_href": "/api/pulp/mydomain/api/v3/repositories/rpm/rpm/uuid/"}]}'
      - path_contains: /repositories/rpm/rpm/
        body: >-
          {"results": [{"name": "x86_64"}, {"name": "ppc64le"}, {"name": "s390x"},
          {"name": "aarch64"}, {"name": "source"}]}
      - path_contains: /artifacts/
        body: '{"sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}'
