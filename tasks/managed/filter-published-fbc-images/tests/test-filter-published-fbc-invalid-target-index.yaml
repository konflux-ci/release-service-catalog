---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-filter-published-fbc-invalid-target-index
spec:
  description: |
    Verify that filter-published-fbc-images gracefully handles missing targetIndex
    by skipping filtering, keeping all components, and attaching ocpVersion to all components.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: >-
        Expiration date for the trusted artifacts created in the OCI repository.
        An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: >-
        Flag to enable debug logging in trusted artifacts.
        Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: ociStorage
            type: string
          - name: orasOptions
            type: string
          - name: dataDir
            type: string
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: ORAS_OPTIONS
              value: $(params.orasOptions)
        steps:
          - name: create-test-data
            image: quay.io/lgallovi-test/release-service-utils:ubi10-test2
            script: |
              #!/usr/bin/env bash
              set -eux
              
              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              
              # Create test snapshot
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot.json" << 'EOF'
              {
                "application": "test-app",
                "components": [
                  {
                    "name": "comp1-test",
                    "containerImage": "quay.io/test/comp1@sha256:test111"
                  }
                ]
              }
              EOF
              
              # Create data file WITHOUT targetIndex (invalid configuration)
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << 'EOF'
              {
                "pyxis": {
                  "secret": "pyxis",
                  "server": "production"
                },
                "fbc": {
                  "publishingCredentials": "test-publishing-creds"
                }
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)

    - name: run-task
      runAfter:
        - setup
      params:
        - name: snapshotPath
          value: $(context.pipelineRun.uid)/snapshot.json
        - name: dataPath
          value: $(context.pipelineRun.uid)/data.json
        - name: pyxisSecret
          value: pyxis
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: $(tasks.setup.results.sourceDataArtifact)
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      taskRef:
        name: filter-published-fbc-images
    - name: verify-results
      runAfter:
        - run-task
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: orasOptions
          value: $(params.orasOptions)
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: orasOptions
            type: string
          - name: dataDir
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: ORAS_OPTIONS
              value: $(params.orasOptions)
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: verify-ocp-version-attached
            image: quay.io/lgallovi-test/release-service-utils:ubi10-test2
            script: |
              #!/usr/bin/env bash
              set -eux

              FILTERED_SNAPSHOT="$(params.dataDir)/filtered-snapshot.json"

              if [ ! -f "${FILTERED_SNAPSHOT}" ]; then
                echo "ERROR: Filtered snapshot not found at ${FILTERED_SNAPSHOT}"
                exit 1
              fi

              echo "Filtered snapshot contents:"
              jq . "${FILTERED_SNAPSHOT}"

              COUNT=$(jq '.components | length' "${FILTERED_SNAPSHOT}")
              echo "Component count: ${COUNT}"

              # Expected: 1 component (no filtering when targetIndex is missing)
              if [ "${COUNT}" -ne 1 ]; then
                echo "ERROR: Expected 1 component (no filtering), got ${COUNT}"
                exit 1
              fi

              # Verify comp1-test is in filtered snapshot
              if ! jq -e '.components[] | select(.name == "comp1-test")' \
                  "${FILTERED_SNAPSHOT}" > /dev/null; then
                echo "ERROR: comp1-test should be in filtered snapshot"
                exit 1
              fi

              # Verify ocpVersion is attached
              expected_ocp_version="v4.15"

              comp1_ocp_version=$(jq -r '.components[] | select(.name == "comp1-test") | .ocpVersion //empty' \
                  "${FILTERED_SNAPSHOT}")

              if [ -z "${comp1_ocp_version}" ]; then
                echo "ERROR: ocpVersion not attached to comp1-test"
                exit 1
              fi

              if [ "${comp1_ocp_version}" != "${expected_ocp_version}" ]; then
                echo "ERROR: ocpVersion mismatch for comp1-test"
                echo "  Expected: ${expected_ocp_version}"
                echo "  Got: ${comp1_ocp_version}"
                exit 1
              fi

              echo "✓ ocpVersion attached to comp1-test: ${comp1_ocp_version}"
              echo "✓ Test passed: Task gracefully handled missing targetIndex with ocpVersion attached"
