---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sign-checksum-blob
  annotations:
    tekton.dev/pipelines.minVersion: "0.62.0"
    tekton.dev/tags: release
spec:
  description: |-
    Submits a direct signing request for the release SHA256SUMS checksum file
    via the signing service's `generic-signing` pipeline.

    The checksum file is isolated into its own Trusted Artifact (the
    `generic-signing` pipeline signs every file in the input artifact) and an
    InternalRequest is submitted with `signMethod=detachsign`. The TA with the
    result is then downloaded and finalized into the output format

    ## Existing signatures

    If a parseable signature file (`.sig`) exists in the restored workspace,
    the task skips signing. Otherwise, it removes the signature and submits a
    fresh request. TaskRun retries restore a fresh workspace and do not reuse
    signing results from earlier attempts.

    ## Signing data parameters

    The signing configuration should be set as `data.sign` in the _releasePlanAdmission_.
    The data should be set in the _ReleasePlanAdmission_ as follows:

    ```
    data:
        sign:
            configMapName: <configmap name>
    ```

    The named ConfigMap (default `signing-config-map`) must expose
    `SIG_KEY_NAME`, `KERBEROS_KEYTAB_SECRET`, `KERBEROS_KEYTAB`, and
    `KERBEROS_PRINCIPAL`.
  params:
    - name: dataPath
      description: Path to the JSON string of the merged data to use in the data workspace
      type: string
    - name: requester
      type: string
      description: Name of the user that requested the signing, for auditing purposes
    - name: requestTimeout
      type: string
      default: "1800"
      description: InternalRequest timeout
    - name: binariesPath
      type: string
      description: The directory inside the workspace where the binaries are stored
      default: binaries
    - name: pipelineRunUid
      type: string
      description: The uid of the current pipelineRun. Used as a label value when creating internal requests
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: trustedArtifactsDockerconfigSecret
      description: Secret containing the OCI dockerconfig for trusted artifacts in the signing pipeline
      type: string
      default: ""
    - name: verbose
      description: Enable verbose diagnostics in the generic-signing pipeline
      type: string
      default: "false"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: signingRepo
      type: string
      description: Git repository URL containing the generic-signing pipeline
      default: "https://gitlab.cee.redhat.com/signing/signing.git"
    - name: signingRevision
      type: string
      description: Git revision (branch, tag, or commit) in the signing repository
      default: "9b0756bc38bc547dbf575a5db1b8c001cda62c67"
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    securityContext:
      runAsUser: 1001
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
          cpu: 100m
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
    - name: prepare-checksum-input
      image:
        quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils@sha256:b13e35a8a62c1a81ca887f7e159ec016a53815a257d5846eda066a4f59e75f18
      computeResources:
        limits:
          memory: 128Mi
          cpu: 100m
        requests:
          memory: 128Mi
          cpu: 100m
      command:
        - sign_checksum_blob.py
      args:
        - prepare
      env:
        - name: HOME
          value: /tmp
        - name: DATA_DIR
          value: $(params.dataDir)
        - name: BINARIES_PATH
          value: $(params.binariesPath)
        - name: ISOLATED_INPUT_DIR
          value: checksum-signing-input
        - name: SIGNATURE_VALID_RESULT
          value: $(step.results.signature-valid.path)
        - name: CHECKSUM_FILE_RESULT
          value: $(step.results.checksum-file.path)
      results:
        - name: signature-valid
          type: string
        - name: checksum-file
          type: string
    - name: create-checksum-input-artifact
      when:
        - input: $(steps.prepare-checksum-input.results.signature-valid)
          operator: in
          values: ["false"]
      computeResources:
        limits:
          memory: 128Mi
          cpu: 500m
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: workDir
          value: $(params.dataDir)/checksum-signing-input
        - name: sourceDataArtifact
          value: $(params.dataDir)/checksum-input-artifact.txt
    - name: sign-checksum-blob
      when:
        - input: $(steps.prepare-checksum-input.results.signature-valid)
          operator: in
          values: ["false"]
      image:
        quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils@sha256:b13e35a8a62c1a81ca887f7e159ec016a53815a257d5846eda066a4f59e75f18
      computeResources:
        limits:
          memory: 512Mi
          cpu: 100m
        requests:
          memory: 512Mi
          cpu: 100m
      command:
        - sign_checksum_blob.py
      args:
        - sign
      env:
        - name: HOME
          value: /tmp
        - name: SIGN_PIPELINE_SERVICE_ACCOUNT
          value: signing-pipeline-sa
        - name: INPUT_ARTIFACT_FILE
          value: $(params.dataDir)/checksum-input-artifact.txt
        - name: OUTPUT_ARTIFACT_FILE
          value: $(step.results.signed-ta-ref.path)
        - name: DATA_DIR
          value: $(params.dataDir)
        - name: OCI_ARTIFACT_EXPIRES_AFTER
          value: $(params.ociArtifactExpiresAfter)
        - name: TRUSTED_ARTIFACTS_DEBUG
          value: $(params.trustedArtifactsDebug)
        - name: CA_TRUST_CONFIG_MAP_NAME
          value: $(params.caTrustConfigMapName)
        - name: CA_TRUST_CONFIG_MAP_KEY
          value: $(params.caTrustConfigMapKey)
        - name: TRUSTED_ARTIFACTS_DOCKERCONFIG_SECRET
          value: $(params.trustedArtifactsDockerconfigSecret)
        - name: VERBOSE
          value: $(params.verbose)
        - name: REQUEST_TIMEOUT
          value: $(params.requestTimeout)
        - name: DATA_PATH
          value: $(params.dataPath)
        - name: BINARIES_PATH
          value: $(params.binariesPath)
        - name: REQUESTER
          value: $(params.requester)
        - name: PIPELINERUN_UID
          value: $(params.pipelineRunUid)
        - name: TASK_ID
          value: $(context.taskRun.uid)
        - name: SIGNING_REPO
          value: $(params.signingRepo)
        - name: SIGNING_REVISION
          value: $(params.signingRevision)
        - name: TASK_GIT_URL
          value: $(params.taskGitUrl)
        - name: TASK_GIT_REVISION
          value: $(params.taskGitRevision)
        - name: OCI_STORAGE
          value: $(params.ociStorage)
      results:
        - name: signed-ta-ref
          type: string
    - name: get-signed-result
      when:
        - input: $(steps.prepare-checksum-input.results.signature-valid)
          operator: in
          values: ["false"]
      computeResources:
        limits:
          memory: 64Mi
          cpu: 100m
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: "$(steps.sign-checksum-blob.results.signed-ta-ref)"
        - name: orasOptions
          value: $(params.orasOptions)
    - name: finalize-result
      when:
        - input: $(steps.prepare-checksum-input.results.signature-valid)
          operator: in
          values: ["false"]
      image:
        quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils@sha256:b13e35a8a62c1a81ca887f7e159ec016a53815a257d5846eda066a4f59e75f18
      computeResources:
        limits:
          memory: 512Mi
          cpu: 100m
        requests:
          memory: 512Mi
          cpu: 100m
      command:
        - sign_checksum_blob.py
      args:
        - finalize
      env:
        - name: DATA_DIR
          value: $(params.dataDir)
        - name: BINARIES_PATH
          value: $(params.binariesPath)
        - name: SIGNED_OUTPUT_DIR
          value: $(params.dataDir)
        - name: CHECKSUM_FILE
          value: $(steps.prepare-checksum-input.results.checksum-file)
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
          cpu: 500m
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
