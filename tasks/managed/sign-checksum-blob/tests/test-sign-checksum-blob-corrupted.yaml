---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-sign-checksum-blob-corrupted
spec:
  description: |
    Test that sign-checksum-blob removes a corrupted signature and re-signs.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils@sha256:6aead72f6537e494186a32434162517aa3f7031adf984c6394ec712b183e71ea
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "sign": {
                  "configMapName": "signing-config-map"
                }
              }
              EOF

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)/binaries"
              echo "dummy-checksum" > "$(params.dataDir)/$(context.pipelineRun.uid)/binaries/foo_SHA256SUMS"
              # Pre-existing corrupted signature (the gpg mock fails --list-packets on "corrupted")
              echo -n "corrupted" \
                > "$(params.dataDir)/$(context.pipelineRun.uid)/binaries/foo_SHA256SUMS.sig"
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: sign-checksum-blob
      params:
        - name: requester
          value: testuser
        - name: binariesPath
          value: $(context.pipelineRun.uid)/binaries
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: dataPath
          value: $(context.pipelineRun.uid)/data.json
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: binariesPath
          value: $(context.pipelineRun.uid)/binaries
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
          - name: binariesPath
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils@sha256:6aead72f6537e494186a32434162517aa3f7031adf984c6394ec712b183e71ea
            script: |
              #!/usr/bin/env bash
              set -eux

              binaries_path="$(params.dataDir)/$(params.binariesPath)"

              sig_file="${binaries_path}/foo_SHA256SUMS.sig"
              if [ "$(cat "${sig_file}")" != "dummy-signature" ]; then
                echo "Corrupted signature should have been replaced with a fresh one"
                exit 1
              fi

              # A fresh InternalRequest must have been submitted
              if [ ! -f "$(params.dataDir)/mock_kubectl_create.json" ]; then
                echo "No InternalRequest was submitted for the corrupted signature"
                exit 1
              fi
      runAfter:
        - run-task
  finally:
    - name: cleanup
      taskSpec:
        steps:
          - name: delete-crs
            image: quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils@sha256:6aead72f6537e494186a32434162517aa3f7031adf984c6394ec712b183e71ea
            script: |
              #!/usr/bin/env bash
              set -eux

              kubectl delete internalrequests --all
