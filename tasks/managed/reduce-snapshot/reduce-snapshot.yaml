---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: reduce-snapshot
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to reduce a snapshot to a single component based on the component that the snapshot was built for.
  params:
    - name: SNAPSHOT
      type: string
      description: String representation of Snapshot spec
    - name: SINGLE_COMPONENT
      type: string
      description: Single mode component enabled
    - name: SINGLE_COMPONENT_CUSTOM_RESOURCE
      type: string
      description: Custom Resource to query for built component in Snapshot
    - name: SINGLE_COMPONENT_CUSTOM_RESOURCE_NS
      type: string
      default: ""
      description: Namespace where Custom Resource is found
    - name: SNAPSHOT_PATH
      type: string
      description: The location to place the reduced Snapshot
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
  results:
    - description: Produced trusted data artifact
      name: sourceDataArtifact
      type: string
  volumes:
    - name: workdir
      emptyDir: {}
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
      # This is a workaround for a problem observed on a particular cluster where the
      # use-trusted-artifacts step runs with root user causing a docker credential file
      # to not be readable in later steps. There might be solution coming related to the
      # security context constraints on the cluster, but setting this explicitly here
      # should probably be harmless either way.
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: reduce
      env:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: SINGLE_COMPONENT
          value: $(params.SINGLE_COMPONENT)
        - name: CUSTOM_RESOURCE
          value: $(params.SINGLE_COMPONENT_CUSTOM_RESOURCE)
        - name: CUSTOM_RESOURCE_NAMESPACE
          value: $(params.SINGLE_COMPONENT_CUSTOM_RESOURCE_NS)
        - name: SNAPSHOT_PATH
          value: $(params.SNAPSHOT_PATH)
      image: quay.io/conforma/cli@sha256:908feedf8972a15b39616365dff77673030e844a8960a7be056abeb9e57185ad
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 10m
      script: |
        #!/usr/bin/env bash
        set -eux
        
        # CONFORMA CLI BUG WORKAROUND:
        # The Conforma CLI has a bug where it reports success (exit code 0) and prints
        # "COMPONENT_COUNT: 1" to stdout, but actually produces an empty output file
        # instead of writing the reduced snapshot.
        #
        # Bug details:
        # - CLI reports: "COMPONENT_COUNT: 1" and exits with code 0
        # - Expected: Reduced snapshot written to SNAPSHOT_PATH
        # - Actual: SNAPSHOT_PATH is empty (0 bytes) - the file is corrupted!
        # - Impact: Downstream steps fail because they can't parse the empty file
        # - Note: SNAPSHOT and SNAPSHOT_PATH usually point to the same file (in-place modification)
        #
        # Related issue: https://github.com/conforma/cli/issues/3009
        
        SNAPSHOT_BACKUP=$(mktemp)
        if [ -f "$SNAPSHOT" ]; then
          cp "$SNAPSHOT" "$SNAPSHOT_BACKUP"
        fi
        
        /usr/local/bin/reduce-snapshot.sh || exit_code=$?
        
        if [ -f "$SNAPSHOT_PATH" ]; then
          FILE_SIZE=$(wc -c < "$SNAPSHOT_PATH" 2>/dev/null || echo "0")
          if [ "$FILE_SIZE" == "0" ]; then
            echo "WARNING: Reduce script reported success but produced empty file (Conforma CLI bug)"
            echo "Performing manual reduction as workaround"
            
            cp "$SNAPSHOT_BACKUP" "$SNAPSHOT_PATH"
            
            if [ "${SINGLE_COMPONENT}" == "true" ]; then
              echo "Manual reduction: Querying for component name"
              COMPONENT_NAME=""
              if [ -n "${CUSTOM_RESOURCE_NAMESPACE:-}" ]; then
                COMPONENT_NAME=$(kubectl get "$CUSTOM_RESOURCE" \
                  -n "$CUSTOM_RESOURCE_NAMESPACE" -ojson 2>/dev/null | \
                  jq -r '.metadata.labels."appstudio.openshift.io/component" // ""' \
                  2>/dev/null || echo "")
              else
                COMPONENT_NAME=$(kubectl get "$CUSTOM_RESOURCE" -ojson 2>/dev/null | \
                  jq -r '.metadata.labels."appstudio.openshift.io/component" // ""' \
                  2>/dev/null || echo "")
              fi
              
              if [ -n "$COMPONENT_NAME" ]; then
                echo "Manual reduction: Reducing to component '$COMPONENT_NAME'"
                TEMP_SNAPSHOT=$(mktemp)
                jq --arg component "$COMPONENT_NAME" \
                  '.components = [.components[] | select(.name == $component)]' \
                  "$SNAPSHOT_PATH" > "$TEMP_SNAPSHOT"
                mv "$TEMP_SNAPSHOT" "$SNAPSHOT_PATH"
                echo "Manual reduction: Successfully reduced to 1 component"
              else
                echo "Manual reduction: Could not determine component name, keeping original"
              fi
            fi
          fi
        else
          echo "WARNING: Reduce script did not create output file"
          echo "Creating snapshot file from backup to prevent downstream failures"
          cp "$SNAPSHOT_BACKUP" "$SNAPSHOT_PATH"
        fi
        
        rm -f "$SNAPSHOT_BACKUP"
        
        exit "${exit_code:-0}"
      onError: continue
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
