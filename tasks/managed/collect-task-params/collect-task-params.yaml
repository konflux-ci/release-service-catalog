---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: collect-task-params
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task that extracts values from the data JSON file based on specified keys and exposes them as task results.
    The task takes an array of resultIndex/key pairs and extracts the corresponding values from the dataPath JSON file.
    Each extracted value is placed at the specified resultIndex in the extractedValues array for use by downstream
    tasks. Optional default values can be provided for keys that may not exist in the data file. If no default is
    provided and the key does not exist, the task will fail.
  params:
    - name: dataPath
      type: string
      description: Path to the JSON string of the merged data containing the values to extract
    - name: keysToExtract
      type: string
      description: |
        JSON array of objects with "resultIndex", "key", and optional "default" fields. Each object specifies the array
        index where the extracted value should be placed, the JSON path key to extract from the data file, and an
        optional default value to use if the key is not found. Example: [{"resultIndex": 1,
        "key": ".releaseNotes.summary"}, {"resultIndex": 0, "key": ".foo", "default": "fallback_value"}]
    - name: configKeysToExtract
      type: string
      description: |
        JSON array of objects with "resultIndex", "key", "config_map_name", "config_ns", and
        optional "default" fields.
        Each object specifies the array index where the extracted value should be placed, the JSON
        path key to extract from <config_ns>/<config_map_name> configMap, and an
        optional default value to use if the key is not found. Example: [{"resultIndex": 1,
        "key": ".releaseNotes.summary", "config_map_name": "config_1", "config_ns":"project1"},
        {"resultIndex": 0, "key": ".foo", "default": "fallback_value",
        "config_map_name": "config_1", "config_ns":"project1"}]
      default: "[]"
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: extractedValues
      type: array
      description: |
        Array of extracted values. Each value is placed at the resultIndex specified in the keysToExtract parameter.
        Values can be accessed by their specified index in downstream tasks.
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
          cpu: 30m
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: validate-inputs
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits:
          memory: 128Mi
          cpu: 50m
        requests:
          memory: 128Mi
          cpu: 50m
      env:
        - name: "KEYS_JSON"
          value: "$(params.keysToExtract)"
        - name: "KEYS_JSON_CONFIG"
          value: "$(params.configKeysToExtract)"
      script: |
        #!/usr/bin/env bash
        set -x
        # Validate KEYS_JSON format

        if ! jq -e 'type == "array"' <<< "$KEYS_JSON" > /dev/null; then
            echo "keysToExtract must be a valid JSON array"
            echo "Received value: $KEYS_JSON"
            exit 1
        fi
        if ! jq -e 'type == "array"' <<< "$KEYS_JSON_CONFIG" > /dev/null; then
            echo "configKeysToExtract must be a valid JSON array"
            echo "Received value: $KEYS_JSON_CONFIG"
            exit 1
        fi

        # Combine two source and get max resultIndex
        KEY_COUNT=$({ echo "$KEYS_JSON"; echo "$KEYS_JSON_CONFIG";} |\
                    jq --slurp 'add | max_by(.resultIndex) | .resultIndex')

        if [ "$KEY_COUNT" == "null" ]; then
            echo "keysToExtract combined with configKeysToExtract is empty"
            exit 1
        fi

        DUPLICATE_INDEXES=$({ echo "$KEYS_JSON"; echo "$KEYS_JSON_CONFIG";} |\
        jq -r --slurp '[add | group_by(.resultIndex)[] | select(length>1)] | length')

        if [ "$DUPLICATE_INDEXES" -gt 0 ]; then
            echo "Duplicate resultIndex values found across keysToExtract and configKeysToExtract"
            exit 1
        fi

        # make KEY_COUNT to be a count not an index
        KEY_COUNT=$((KEY_COUNT + 1))

        DATA_FILE="$(params.dataDir)/$(params.dataPath)"
        if [ ! -f "${DATA_FILE}" ] ; then
            echo "No valid data file was provided."
            exit 1
        fi
    - name: collect-task-params
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits:
          memory: 128Mi
          cpu: 50m
        requests:
          memory: 128Mi
          cpu: 50m
      env:
        - name: "KEYS_JSON"
          value: "$(params.keysToExtract)"
        - name: "KEYS_JSON_CONFIG"
          value: "$(params.configKeysToExtract)"
      script: |
        #!/usr/bin/env bash
        set -x
        DATA_FILE="$(params.dataDir)/$(params.dataPath)"

        # Initialize result array with empty strings since it may not be populated in order based on
        # keysToExtract resultIndex input
        KEY_COUNT=$({ echo "$KEYS_JSON"; echo "$KEYS_JSON_CONFIG";} |\
                    jq --slurp 'add | max_by(.resultIndex) | .resultIndex')
        # make KEY_COUNT to be a count not an index
        KEY_COUNT=$((KEY_COUNT + 1))

        if ! [[ "$KEY_COUNT" =~ ^[0-9]+$ ]]; then
            echo "Error: resultIndex must be a non-negative integer, got: $RESULT_INDEX"
            exit 1
        fi
        declare -A CONFIG_MAP_CACHE

        RESULT_ARRAY="[]"
        for i in $(seq 0 $((KEY_COUNT - 1))); do
            RESULT_ARRAY=$(jq '. += [""]' <<< "$RESULT_ARRAY")
        done

        for i in $(seq 0 $((KEY_COUNT - 1))); do
            KEY=$(jq -r "[.[]|select(.resultIndex == $i)][0].key" <<< "$KEYS_JSON" 2>/dev/null)
            if [ "$KEY" = "null" ]; then # if there's no KEY, try to get it from configKeysToExtract
              KEY=$(jq -r "[.[]|select(.resultIndex == $i)][0].key" <<< "$KEYS_JSON_CONFIG" 2>/dev/null)
              if [ "$KEY" = "null" ]; then
                echo "Invalid key extraction specification at index $i: missing key in both "\
                     "keysToExtract and configKeysToExtract"
                exit 1
              else
                KEY_IN_CONFIG=1
                RESULT_INDEX=$(jq -r "[.[]|select(.resultIndex == $i)][0].resultIndex" <<< "$KEYS_JSON_CONFIG")
                DEFAULT_VALUE=$(jq -r "[.[]|select(.resultIndex == $i)][0].default // null" <<< "$KEYS_JSON_CONFIG")
                CONFIG_NAME=$(jq -r "[.[]|select(.resultIndex == $i)][0].config_map_name" <<< "$KEYS_JSON_CONFIG")
                CONFIG_NS=$(jq -r "[.[]|select(.resultIndex == $i)][0].config_ns" <<< "$KEYS_JSON_CONFIG") 
                if [ "$CONFIG_NAME" = "null" ] || [ "$CONFIG_NS" = "null" ]; then
                  echo "Invalid config key extraction specification at resultIndex $i:"
                  echo "  missing config_map_name or config_ns"
                  exit 1
                fi

                if [ "${CONFIG_MAP_CACHE[$CONFIG_NS/$CONFIG_NAME]}" ]; then
                  echo "reading config map $CONFIG_NS/$CONFIG_NAME from cache"
                  CONFIG_MAP_JSON=${CONFIG_MAP_CACHE["$CONFIG_NS/$CONFIG_NAME"]}
                else
                  CONFIG_MAP_JSON=$(kubectl get configmap "$CONFIG_NAME" \
                    -n "$CONFIG_NS" -o jsonpath='{.data}' 2>/dev/null)
                  if [ "$CONFIG_MAP_JSON" = "" ]; then
                    echo "Error fetching configmap $CONFIG_NS/$CONFIG_NAME for key extraction"
                    exit 1
                  fi
                  CONFIG_MAP_CACHE["$CONFIG_NS/$CONFIG_NAME"]="$CONFIG_MAP_JSON"
                fi
              fi
            else
              KEY_IN_CONFIG=0
              RESULT_INDEX=$(jq -r "[.[]|select(.resultIndex == $i)][0].resultIndex" <<< "$KEYS_JSON")
              DEFAULT_VALUE=$(jq -r "[.[]|select(.resultIndex == $i)][0].default // null" <<< "$KEYS_JSON")
            fi

            if [ "$RESULT_INDEX" = "null" ] || [ "$KEY" = "null" ]; then
                echo "Invalid key extraction result index $i is missing both in "\
                "keysToExtract and configKeysToExtract"
                exit 1
            fi

            # Check if resultIndex is a valid integer
            if ! [[ "$RESULT_INDEX" =~ ^[0-9]+$ ]]; then
                echo "Error: resultIndex at position $i must be a non-negative integer, got: $RESULT_INDEX"
                exit 1
            fi

            # Check if resultIndex is within valid bounds
            if [ "$RESULT_INDEX" -ge "$KEY_COUNT" ]; then
                echo "Error: resultIndex $RESULT_INDEX at position $i is out of bounds."
                echo "Valid range is 0 to $((KEY_COUNT - 1))"
                exit 1
            fi

            # Extract the value from the data file using the specified key
            TRANSFORMED_KEY=$(echo "$KEY" | sed -E 's/\.([^\."\[]+|"[^"]+")/."\1"/g')
            if [ $KEY_IN_CONFIG -eq 0 ]; then
              echo "Reading '$KEY' from data-file"
              VALUE=$(jq -r "$TRANSFORMED_KEY" "$DATA_FILE" 2>/dev/null)
            else
              echo "Reading '$KEY' from config map $CONFIG_NS/$CONFIG_NAME"
              VALUE=$(jq -r "$TRANSFORMED_KEY" <<< "$CONFIG_MAP_JSON" 2>/dev/null)
            fi

            # Check if the key exists in the data file
            if [ "$VALUE" = "null" ]; then
                if [ "$DEFAULT_VALUE" != "null" ]; then
                    echo "Key $KEY not found in data file, using default value: $DEFAULT_VALUE"
                    VALUE="$DEFAULT_VALUE"
                else
                    echo "Error: Key $KEY not found in data file, and no default value for it was passed"
                    exit 1
                fi
            fi

            # Update the array at the specified resultIndex
            RESULT_ARRAY=$(jq --argjson idx "$RESULT_INDEX" --arg value "$VALUE" '.[$idx] = $value' <<< "$RESULT_ARRAY")
        done

        # Write the array result
        jq <<< "$RESULT_ARRAY" | tee "$(results.extractedValues.path)"
