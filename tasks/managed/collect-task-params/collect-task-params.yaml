---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: collect-task-params
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task that extracts values from the data JSON file based on specified keys and exposes them as task results.
    The task takes an array of resultIndex/key pairs and extracts the corresponding values from the dataPath JSON file.
    Each extracted value is placed at the specified resultIndex in the extractedValues array for use by downstream
    tasks. Optional default values can be provided for keys that may not exist in the data file. If no default is
    provided and the key does not exist, the task will fail.
  params:
    - name: dataPath
      type: string
      description: Path to the JSON string of the merged data containing the values to extract
    - name: keysToExtract
      type: string
      description: |
        JSON array of objects with "resultIndex", "key", and optional "default" fields. Each object specifies the array
        index where the extracted value should be placed, the JSON path key to extract from the data file, and an
        optional default value to use if the key is not found. Example: [{"resultIndex": 1,
        "key": ".releaseNotes.summary"}, {"resultIndex": 0, "key": ".foo", "default": "fallback_value"}]
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
    - name: caCertPath
      type: string
      description: Path to CA certificate bundle for TLS verification with self-signed certificates
      default: /mnt/trusted-ca/ca-bundle.crt
  results:
    - name: extractedValues
      type: array
      description: |
        Array of extracted values. Each value is placed at the resultIndex specified in the keysToExtract parameter.
        Values can be accessed by their specified index in downstream tasks.
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: caCertPath
          value: $(params.caCertPath)
    - name: collect-task-params
      image: quay.io/konflux-ci/release-service-utils@sha256:7d3882010af8c5da95f71890a34e3af8967019a4a8c175974a27e2e113700e50
      computeResources:
        limits:
          memory: 192Mi
          cpu: 50m
        requests:
          memory: 192Mi
          cpu: 50m
      command: ["/home/scripts/python/tasks/managed/collect_task_params.py"]
      args:
        - "--data-file"
        - "$(params.dataDir)/$(params.dataPath)"
        - "--keys-json"
        - "$(params.keysToExtract)"
      env:
        - name: DATA_DIR
          value: "$(params.dataDir)"
        - name: DATA_PATH
          value: "$(params.dataPath)"
        - name: KEYS_JSON
          value: "$(params.keysToExtract)"
        - name: RESULT_EXTRACTED_VALUES
          value: "$(results.extractedValues.path)"
