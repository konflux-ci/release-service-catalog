---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-collect-task-params-fail-not-array-cluster
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Test that collect-task-params fails when keysToExtract is not an array
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "foo": {
                  "bar": "nested test value"
                },
                "simpleValue": "hello world"
              }
              EOF
              cat > "/tmp/configMap.json" << EOF
              {
                  "apiVersion": "v1",
                  "data": {
                      "defaultOIDCIssuer": "issuer",
                      "fulcioInternalUrl": "https://fulcio.local",
                      "fulcioExternalUrl": "https://fulcio.global",
                      "rekorInternalUrl": "https://rekor.local",
                      "rekorInternalUrl": "https://rekor.global",
                      "tufInternalUrl": "https://tuf.local",
                      "tufExternalUrl": "https://tuf.global"
                  },
                  "kind": "ConfigMap",
                  "metadata": {
                      "name": "cluster-config",
                      "namespace": "konflux-info"
                  }
              }
              EOF
              kubectl delete configmap --namespace konflux-info cluster-config \
                --timeout=30s || true
              kubectl create -f /tmp/configMap.json
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: collect-task-params
      params:
        - name: dataPath
          value: "$(context.pipelineRun.uid)/data.json"
        - name: keysToExtract
          value: '[{"resultIndex": 0, "key": ".simpleValue"}]'
        - name: configKeysToExtract
          value: '{"resultIndex": 0, "key": ".simpleValue",
                   "config_map_name": "cluster-config", "config_map_namespace": "konflux-info"}'
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
