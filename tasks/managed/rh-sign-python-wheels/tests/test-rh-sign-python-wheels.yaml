---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-rh-sign-python-wheels
spec:
  description: Test creating and signing attestations for Python wheels
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:6979552f11f042b8730abcb1be4ec6cfb0553a069cc352643f88d8996041abf8
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/files"
              mkdir -p "$(params.dataDir)/files/chains-provenance"

              # Create mock wheel and sdist files
              echo "mock wheel content" > "$(params.dataDir)/files/my_package-1.0.0-py3-none-any.whl"
              echo "mock sdist content" > "$(params.dataDir)/files/my_package-1.0.0.tar.gz"

              # Create mock Chains provenance (SLSA v1 format)
              cat > "$(params.dataDir)/files/chains-provenance/sha256:abc123.json" << 'PROVEOF'
              {
                "predicateType": "https://slsa.dev/provenance/v1",
                "predicate": {
                  "buildDefinition": {
                    "buildType": "https://tekton.dev/chains/v2/slsa",
                    "externalParameters": {
                      "runSpec": {
                        "pipelineRef": {"name": "build-python-wheels-oci-ta"},
                        "params": [{"name": "PACKAGES", "value": ["my_package==1.0.0"]}]
                      }
                    },
                    "internalParameters": {
                      "tekton-pipelines-feature-flags": {"EnableStepActions": "true"}
                    },
                    "resolvedDependencies": [
                      {
                        "uri": "git+https://github.com/calungaproject/index.git",
                        "digest": {"sha1": "abc123def456"},
                        "name": "pipelineTask"
                      }
                    ]
                  },
                  "runDetails": {
                    "builder": {
                      "id": "https://konflux-ci.dev/chains/v2"
                    },
                    "metadata": {
                      "invocationId": "calunga-tenant/build-run-12345",
                      "startedOn": "2026-02-19T21:40:00Z",
                      "finishedOn": "2026-02-19T21:51:09Z"
                    }
                  }
                }
              }
              PROVEOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: rh-sign-python-wheels
      params:
        - name: secretName
          value: test-aws-kms-secret
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: filesDir
          value: files
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: attestationCount
          value: "$(tasks.run-task.results.attestationCount)"
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: attestationCount
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:6979552f11f042b8730abcb1be4ec6cfb0553a069cc352643f88d8996041abf8
            script: |
              #!/usr/bin/env bash
              set -eux

              FILES_DIR="$(params.dataDir)/files"

              # Check attestation count
              if [ "$(params.attestationCount)" != "2" ]; then
                echo "ERROR: Expected 2 attestations, got $(params.attestationCount)"
                exit 1
              fi

              # Check that attestation files were created
              if [ ! -f "${FILES_DIR}/my_package-1.0.0-py3-none-any.whl.attestation" ]; then
                echo "ERROR: Wheel attestation file not found"
                exit 1
              fi

              if [ ! -f "${FILES_DIR}/my_package-1.0.0.tar.gz.attestation" ]; then
                echo "ERROR: Sdist attestation file not found"
                exit 1
              fi

              # Check that attestation files are valid JSON with PEP 740 structure
              for att_file in "${FILES_DIR}"/*.attestation; do
                echo "Checking attestation file: ${att_file}"
                if ! jq -e '.version == 1' "${att_file}" > /dev/null; then
                  echo "ERROR: Attestation file ${att_file} does not have version: 1"
                  exit 1
                fi
                if ! jq -e 'has("envelope")' "${att_file}" > /dev/null; then
                  echo "ERROR: Attestation file ${att_file} does not have envelope field"
                  exit 1
                fi

                # Decode the DSSE payload and verify SLSA v1 predicate structure
                STATEMENT=$(jq -r '.envelope.statement' "${att_file}" | base64 -d 2>/dev/null || true)
                if [ -n "${STATEMENT}" ]; then
                  echo "  Checking SLSA v1 predicate structure..."
                  if ! echo "${STATEMENT}" | jq -e '.predicate | has("buildDefinition")' > /dev/null 2>&1; then
                    echo "ERROR: Predicate missing buildDefinition"
                    exit 1
                  fi
                  if ! echo "${STATEMENT}" | jq -e '.predicate | has("runDetails")' > /dev/null 2>&1; then
                    echo "ERROR: Predicate missing runDetails"
                    exit 1
                  fi
                  if ! echo "${STATEMENT}" | jq -e '.predicate.runDetails | has("builder")' > /dev/null 2>&1; then
                    echo "ERROR: Predicate missing runDetails.builder"
                    exit 1
                  fi
                  BD='.predicate.buildDefinition'
                  if ! echo "${STATEMENT}" | jq -e "$BD | has(\"buildType\")" > /dev/null 2>&1; then
                    echo "ERROR: Predicate missing buildDefinition.buildType"
                    exit 1
                  fi
                  echo "  SLSA v1 predicate structure OK"
                fi
              done

              # Verify chains-provenance directory was cleaned up
              if [ -d "${FILES_DIR}/chains-provenance" ]; then
                echo "ERROR: chains-provenance directory should have been removed"
                exit 1
              fi

              echo "All checks passed!"
      runAfter:
        - run-task
