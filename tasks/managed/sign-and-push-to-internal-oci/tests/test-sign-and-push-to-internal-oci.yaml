---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-sign-and-push-to-internal-oci
spec:
  description: |
    Run sign-and-push-to-internal-oci with staged artifacts and verify the InternalRequest
    arguments and results file returned through the trusted artifact.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the OCI repository.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: ociStorage
            type: string
          - name: ociArtifactExpiresAfter
            type: string
          - name: orasOptions
            type: string
          - name: trustedArtifactsDebug
            type: string
          - name: dataDir
            type: string
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: ORAS_OPTIONS
              value: $(params.orasOptions)
            - name: DEBUG
              value: $(params.trustedArtifactsDebug)
        steps:
          - name: create-inputs
            image: quay.io/konflux-ci/release-service-utils@sha256:8ac7a9b0bb623775eca570edef8a0fc34f693f50a7e0a50547a4e496875d68b9
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              jq -n '{spec: {origin: "test-origin"}}' \
                > "$(params.dataDir)/$(context.pipelineRun.uid)/release-plan-admission.json"
              jq -n '{intention: "staging"}' \
                > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json"
              jq -n '{
                application: "test-app",
                components: [
                  {
                    name: "mac-component",
                    containerImage: "quay.io/test/mac@sha256:abc",
                    metadata: {labels: [{name: "test-label", value: "test-value"}]},
                    staged: {files: [{filename: "app.dmg"}]}
                  },
                  {
                    name: "windows-component",
                    metadata: {env_variables: {KEY: "VALUE"}},
                    staged: {files: [{filename: "app.exe"}, {filename: "app.zip"}]}
                  },
                  {name: "unstaged-component"}
                ]
              }' > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot.json"
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: sign-and-push-to-internal-oci
      params:
        - name: snapshotPath
          value: $(context.pipelineRun.uid)/snapshot.json
        - name: dataPath
          value: $(context.pipelineRun.uid)/data.json
        - name: releasePlanAdmissionPath
          value: $(context.pipelineRun.uid)/release-plan-admission.json
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
        - name: resultsDirPath
          value: $(context.pipelineRun.uid)/results
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
      runAfter:
        - run-task
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: ORAS_OPTIONS
              value: $(params.orasOptions)
            - name: DEBUG
              value: $(params.trustedArtifactsDebug)
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:8ac7a9b0bb623775eca570edef8a0fc34f693f50a7e0a50547a4e496875d68b9
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              RESULTS_DIR="$(params.dataDir)/$(context.pipelineRun.uid)/results"
              jq -e '. == {artifacts: ["app.dmg", "app.exe", "app.zip"]}' \
                "${RESULTS_DIR}/sign-internal-oci.json"
              test ! -e "${RESULTS_DIR}/push-artifacts-results.json"

              jq -e --arg uid "$(context.pipelineRun.uid)" \
                --slurpfile snapshot "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot.json" '
                .pipeline == "sign-and-push-to-internal-oci" and
                .params == {
                  snapshot_json: .params.snapshot_json,
                  quayURL: "quay.io/konflux-artifacts/nonprod",
                  destQuayURL: "quay.io/redhat-user-workloads",
                  origin: "test-origin",
                  macSigningScript: "/Users/konflux-release-signing-sa/mac-signing/sign_mac_wrapper.sh",
                  windowsSigningScript: "C:/Users/binary_signer/windows-signing/sign_windows_wrapper.ps1",
                  destQuaySecret: "quay-internal-oci",
                  taskGitUrl: "http://localhost",
                  taskGitRevision: "main"
                } and
                (.params.snapshot_json | fromjson) == ($snapshot[0] | .components |= map(del(.metadata))) and
                (.labels | length) == 2 and
                .labels["internal-services.appstudio.openshift.io/pipelinerun-uid"] == $uid and
                (.labels["internal-services.appstudio.openshift.io/group-id"] | length) > 0 and
                .labels["internal-services.appstudio.openshift.io/group-id"] != $uid and
                .service_account == "release-service-account" and
                .sync == true and
                .pipeline_timeout == "24h0m0s" and
                .task_timeout == "23h50m0s" and
                .finally_timeout == "0h10m0s" and
                .timeout == 86700
              ' "${RESULTS_DIR}/internal-request.json"
