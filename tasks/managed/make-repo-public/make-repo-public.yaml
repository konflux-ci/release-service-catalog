---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: make-repo-public
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task that makes repositories public using the Quay API
  params:
    - name: dataPath
      type: string
      description: Path to the merged data JSON file generated by collect-data task
    - name: snapshotPath
      type: string
      description: Path to the JSON string of the Snapshot spec in the data workspace
    - name: registrySecret
      type: string
      description: "The kube secret to use the Quay API, containing one key: token"
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
    - name: caCertPath
      type: string
      description: Path to CA certificate bundle for TLS verification with self-signed certificates
      default: /mnt/trusted-ca/ca-bundle.crt
  results:
    - description: Produced trusted data artifact
      name: sourceDataArtifact
      type: string
  volumes:
    - name: workdir
      emptyDir: {}
    - name: registry-secret-vol
      secret:
        secretName: $(params.registrySecret)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true

  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /etc/ssl/certs
        readOnly: true
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: caCertPath
          value: $(params.caCertPath)
    - name: make-repo-public
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits:
          memory: 256Mi
        requests:
          memory: 256Mi
          cpu: 150m
      volumeMounts:
        - name: registry-secret-vol
          mountPath: "/etc/secrets"
      script: |
        #!/usr/bin/env bash
        set -eu

        REGISTRY_TOKEN="$(cat /etc/secrets/token)"

        if [ -f "/mnt/trusted-ca/ca-bundle.crt" ]; then
          CA_BUNDLE=$(mktemp)
          { cat /etc/pki/tls/certs/ca-bundle.crt; echo; cat /mnt/trusted-ca/ca-bundle.crt; } > "$CA_BUNDLE"
          export CURL_CA_BUNDLE="$CA_BUNDLE"
        fi

        declare -A QUAY_REGISTRY_CACHE

        set -x

        function is_quay_registry() {
          local registry="$1"
          if [[ -v "QUAY_REGISTRY_CACHE[$registry]" ]]; then
            [ "${QUAY_REGISTRY_CACHE[$registry]}" = "true" ]
            return
          fi
          set +x
          local http_code
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 3 \
            "https://${registry}/api/v1/discovery")
          set -x
          if [ "$http_code" = "200" ]; then
            QUAY_REGISTRY_CACHE[$registry]="true"
            return 0
          else
            QUAY_REGISTRY_CACHE[$registry]="false"
            return 1
          fi
        }

        function make_repo_public() {
          local registry="$1"
          local repo_path="$2"
          set +x
          if curl -X POST \
            --fail-with-body --retry 3 \
            --header "Authorization: Bearer ${REGISTRY_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"visibility": "public"}' \
            "https://${registry}/api/v1/repository/${repo_path}/changevisibility"
          then
            echo Success
          else
            echo "Error: Failed to make repo ${registry}/${repo_path} public."\
              "Make sure the secret $(params.registrySecret) contains"\
              " the \"token\" key with token that has permission to"\
              " Administer Repositories."
            exit 1
          fi
          set -x
        }

        DATA_FILE="$(params.dataDir)/$(params.dataPath)"
        if [ ! -f "${DATA_FILE}" ] ; then
            echo "No valid data file was provided."
            exit 1
        fi

        SNAPSHOT_FILE="$(params.dataDir)/$(params.snapshotPath)"
        if [ ! -f "${SNAPSHOT_FILE}" ] ; then
            echo "No valid snapshot file was provided."
            exit 1
        fi

        DEFAULT="$(jq -r '.mapping.defaults.public // false' "$DATA_FILE")"

        TARGET_REGISTRY=""

        NUM_COMPONENTS=$(jq '.components | length' "$SNAPSHOT_FILE")
        for ((i=0; i < NUM_COMPONENTS; i++)); do
          COMPONENT="$(jq -c ".components[$i]" "$SNAPSHOT_FILE")"
          if [ "$(jq -r --arg default "$DEFAULT" '.public // $default' <<< "$COMPONENT")" = true ] ; then
            repositories=$(jq -c '.repositories' <<< "$COMPONENT")
            NUM_REPOS=$(jq 'length' <<< "$repositories")

            for ((j = 0; j < NUM_REPOS; j++)); do
              REPO=$(jq -r --argjson j "$j" '.[$j]."url"' <<< "$repositories")

              echo "Making repository $REPO public..."

              registry=$(echo "$REPO" | cut -d '/' -f 1)
              repo_path=${REPO#"${registry}/"}
              repo_path=${repo_path%/}

              if ! is_quay_registry "$registry"; then
                echo "Warning: Registry ${registry} is not a Quay instance. Skipping."
                continue
              fi

              if [ -z "$TARGET_REGISTRY" ]; then
                TARGET_REGISTRY="$registry"
              elif [ "$TARGET_REGISTRY" != "$registry" ]; then
                echo "Error: Multiple Quay registries found (${TARGET_REGISTRY} and ${registry})."\
                  " Only a single Quay registry is supported because the registrySecret"\
                  " contains a token for one registry."
                exit 1
              fi

              make_repo_public "$registry" "$repo_path"
            done
          fi
        done
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
        - name: caCertPath
          value: $(params.caCertPath)
