---
# Declarative mocks for Tekton tests of this task (Python entrypoint). Rendered
# by .github/scripts/render_python_task_mocks_from_yaml.py when
# test_tekton_tasks.sh runs.
version: 1
services:
  - type: http_json
    port: 8443
    bind: 127.0.0.1
    tls: true
    hostname: "127.0.0.1"
    routes:
      - path_contains: /api/v1/discovery
        body: '{"apis": []}'
      - path_contains: /changevisibility
        method: POST
        body: '{"success": true}'
    rewrite_ca_cert_env:
      env_var: CA_CERT_PATH
