---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: upload-npm-pulp
spec:
  description: |
    Upload npm package tarballs to a Pulp npm repository via the synchronous
    content upload API. Sets tl.compliance_level from adjacent
    *.tl-compliance.json sidecars when present. When ATTESTATION_IMAGE_PREFIX
    (or COMPLIANCE_IMAGE_PREFIX) is set, signs adjacent .tgz with cosign
    (generate-and-sign-npm-attestations), pushes attestation OCI to Quay, and
    sets tl.oci_registry_base / tl.attestation_oci_digest /
    tl.attestation_predicate_type. Idempotent: skips packages already present
    with matching sha256; fails if the same name/version exists with different
    content. On skip, still applies compliance and attestation labels so
    reruns can attach metadata. Requires at least one .tgz under FILES_DIR.
    Business logic runs as npm-release-upload in the slan-cuan image.
  params:
    - name: SERVICE_ACCOUNT_SECRET_NAME
      type: string
      description: >-
        Secret with Pulp username/password keys (same as Python wheel release)
      default: rhtl-pulp-credentials-secret
    - name: COSIGN_SECRET_NAME
      type: string
      description: >-
        Secret with cosign.key or SIGN_KEY + AWS_* for package attestations.
        Attestation is skipped when signing material is absent unless
        REQUIRE_ATTESTATIONS=true
      default: konflux-cosign-signing-production
    - name: REQUIRE_ATTESTATIONS
      type: string
      description: When true, fail if signing material or .att files are missing
      default: "false"
    - name: PULP_BASE_URL
      type: string
      description: The base URL of the Pulp server
    - name: PULP_API_ROOT
      type: string
      description: The API root path of the Pulp server
      default: "/api/"
    - name: PULP_DOMAIN
      type: string
      description: The domain to use for Pulp operations
    - name: PULP_REPOSITORY
      type: string
      description: The Pulp npm repository to upload to
    - name: PULP_FILE_REPOSITORY
      type: string
      description: >
        Optional Pulp file repository for adjacent *.tl-compliance.json uploads.
        When empty, sidecar file uploads are skipped (compliance labels still apply)
      default: ""
    - name: COMPLIANCE_IMAGE_PREFIX
      type: string
      description: >
        Quay repository prefix used for attestation OCI (and shared
        tl.oci_registry_base). Empty skips sign + attestation publish
      default: ""
    - name: ATTESTATION_IMAGE_PREFIX
      type: string
      description: >
        Optional override for attestation OCI repo. Defaults to
        COMPLIANCE_IMAGE_PREFIX when empty
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Trusted Artifact containing extracted npm packages
    - name: dataDir
      type: string
      description: The location where data will be stored
      default: /var/workdir/content
    - name: filesDir
      type: string
      description: The relative path within dataDir where package files are located
      default: files
    - name: ociArtifactExpiresAfter
      type: string
      description: Expiration date for the trusted artifacts created
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: taskGitUrl
      type: string
      description: >-
        The url to the git repo where the release-service-catalog tasks and
        stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: ociStorage
      type: string
      description: The OCI repository where the Trusted Artifacts are stored
  results:
    - description: Produced trusted data artifact
      name: sourceDataArtifact
      type: string
  volumes:
    - name: service-account-secret
      secret:
        secretName: $(params.SERVICE_ACCOUNT_SECRET_NAME)
    - name: cosign-secret
      secret:
        secretName: $(params.COSIGN_SECRET_NAME)
        optional: true
    - name: workdir
      emptyDir: {}
  stepTemplate:
    securityContext:
      runAsUser: 1001
    env:
      # Writable HOME so Tekton creds-init can copy SA dockerconfig secrets for Quay.
      - name: HOME
        value: /var/workdir
      - name: PULP_BASE_URL
        value: $(params.PULP_BASE_URL)
      - name: PULP_API_ROOT
        value: $(params.PULP_API_ROOT)
      - name: PULP_DOMAIN
        value: $(params.PULP_DOMAIN)
      - name: PULP_REPOSITORY
        value: $(params.PULP_REPOSITORY)
      - name: PULP_FILE_REPOSITORY
        value: $(params.PULP_FILE_REPOSITORY)
      - name: COMPLIANCE_IMAGE_PREFIX
        value: $(params.COMPLIANCE_IMAGE_PREFIX)
      - name: ATTESTATION_IMAGE_PREFIX
        value: $(params.ATTESTATION_IMAGE_PREFIX)
      - name: REQUIRE_ATTESTATIONS
        value: $(params.REQUIRE_ATTESTATIONS)
      - name: FILES_DIR
        value: $(params.dataDir)/$(params.filesDir)
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 10m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: upload
      image: quay.io/light-castle/slan-cuan@sha256:83035a79fb86968dcc6dffcfba3d9921fdc3fdbd8e78d01f49448512d0f12c23
      volumeMounts:
        - name: service-account-secret
          mountPath: "/etc/service-account-secret"
          readOnly: true
        - name: cosign-secret
          mountPath: "/etc/cosign-secret"
          readOnly: true
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: 100m
      command: ["npm-release-upload"]
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
