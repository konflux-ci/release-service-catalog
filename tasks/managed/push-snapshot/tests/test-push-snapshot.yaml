---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-push-snapshot
spec:
  description: |
    Smoke test for the push-snapshot task. Sets up a minimal snapshot and data
    file, runs the task with mock CLI binaries, and verifies the results file
    is produced.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              mkdir -p "$(params.dataDir)/results"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "mapping": {
                  "defaults": {
                    "pushSourceContainer": false
                  }
                }
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot.json" << EOF
              {
                "componentGroup": "test-group",
                "components": [
                  {
                    "name": "component1",
                    "containerImage": "registry.io/org/image1@sha256:abc123def456",
                    "repositories": [
                      {
                        "url": "prod.io/org/image1",
                        "tags": ["v1.0", "latest"]
                      }
                    ]
                  }
                ]
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: push-snapshot
      params:
        - name: snapshotPath
          value: "$(context.pipelineRun.uid)/snapshot.json"
        - name: dataPath
          value: "$(context.pipelineRun.uid)/data.json"
        - name: resultsDirPath
          value: "results"
        - name: retries
          value: "0"
        - name: concurrentLimit
          value: "5"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: verify
      taskSpec:
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: "$(tasks.run-task.results.sourceDataArtifact)"
          - name: check-results
            image: quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
            script: |
              #!/usr/bin/env bash
              set -eux

              RESULTS_FILE="$(params.dataDir)/results/push-snapshot-results.json"

              if [ ! -f "${RESULTS_FILE}" ]; then
                echo "ERROR: Results file not found at ${RESULTS_FILE}"
                exit 1
              fi

              echo "Results file contents:"
              cat "${RESULTS_FILE}"

              # Verify the results JSON structure
              jq -e '.images | length > 0' "${RESULTS_FILE}"
              jq -e '.images[0].name == "component1"' "${RESULTS_FILE}"
              jq -e '.images[0].shasum != ""' "${RESULTS_FILE}"
              jq -e '.images[0].arches | length > 0' "${RESULTS_FILE}"
              jq -e '.images[0].urls | length > 0' "${RESULTS_FILE}"

              echo "All checks passed!"
      runAfter:
        - run-task
