---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-push-disk-images-fail-no-contentgateway-data
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Run the push-disk-images task with no contentGateway data and verify the task fails as expected
  workspaces:
    - name: tests-workspace
  tasks:
    - name: setup
      taskSpec:
        steps:
          - name: setup
            image: quay.io/konflux-ci/release-service-utils:2424158f96aab289e19d1e2802af63294fc63de9
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir "$(workspaces.data.path)/results"
              cat > "$(workspaces.data.path)/data.json" << EOF
              {
                "cdn": {
                  "env": "production"
                }
              }
              EOF
      workspaces:
        - name: data
          workspace: tests-workspace
    - name: run-task
      taskRef:
        name: push-disk-images
      params:
        - name: snapshotPath
          value: "snapshot_spec.json"
        - name: dataPath
          value: "data.json"
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: resultsDirPath
          value: results
        - name: taskGitUrl
          value: https://localhost
        - name: taskGitRevision
          value: main
      runAfter:
        - setup
      workspaces:
        - name: data
          workspace: tests-workspace
