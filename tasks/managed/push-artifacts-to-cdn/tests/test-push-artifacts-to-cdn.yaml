---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-push-artifacts-to-cdn
spec:
  description: |
    Run the push-artifacts-to-cdn task with the stage env and verify the InternalRequest
    arguments, results file, and checksum_map result
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:441db22666c241ce1f3030615af90cb72d39626b74faa1a42fe5a302531b7259
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              mkdir "$(params.dataDir)/$(context.pipelineRun.uid)/results"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot_spec.json" << EOF
              {
                "application": "artifacts",
                "components": [
                  {
                    "name": "test-component",
                    "containerImage": "quay.io/workload/tenant/artifacts/test@sha256:123456",
                    "repository": "repo1",
                    "staged": {
                      "files": [
                        {
                          "filename": "test-artifact-1.0.tar.gz",
                          "source": "artifact.tar.gz"
                        }
                      ]
                    }
                  }
                ]
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "contentGateway": {
                  "productName": "Konflux test product",
                  "productCode": "KTestProduct",
                  "productVersionName": "KTestProduct 1"
                },
                "cdn": {
                  "env": "stage"
                },
                "sign": {
                  "configMapName": "test-signing-config-map"
                }
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/release.json" << EOF
              {
                "status": {
                  "attribution": {
                    "author": "testuser"
                  }
                }
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: push-artifacts-to-cdn
      params:
        - name: releasePath
          value: "$(context.pipelineRun.uid)/release.json"
        - name: snapshotPath
          value: "$(context.pipelineRun.uid)/snapshot_spec.json"
        - name: dataPath
          value: "$(context.pipelineRun.uid)/data.json"
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: resultsDirPath
          value: "$(context.pipelineRun.uid)/results"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "https://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: checksumMap
          value: "$(tasks.run-task.results.checksum_map)"
      runAfter:
        - run-task
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
          - name: checksumMap
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:441db22666c241ce1f3030615af90cb72d39626b74faa1a42fe5a302531b7259
            script: |
              #!/usr/bin/env bash
              set -ex

              results=$(cat "$(params.dataDir)/$(context.pipelineRun.uid)/results/push-artifacts-results.json")

              expected="test-artifact-1.0.tar.gz"
              if [ "$(jq -r '.artifacts[]' <<< "$results")" != "$expected" ]; then
                echo "push-artifacts-to-cdn results do not contain expected file names"
                exit 1
              fi

              jq -e --arg uid "$(context.pipelineRun.uid)" '
                .pipeline == "push-artifacts-to-cdn" and
                .params.author == "testuser" and
                .params.signingKeyName == "test-signing-key" and
                .params.exodusGwSecret == "exodus-prod-secret" and
                .params.exodusGwEnv == "pre" and
                .params.pulpSecret == "rhsm-pulp-stage-secret" and
                .params.udcacheSecret == "udcache-stage-secret" and
                .params.cgwHostname == "https://developers.qa.redhat.com/content-gateway/rest/admin" and
                .params.cgwSecret == "cgw-service-account-stage-secret" and
                .params.quayURL == "quay.io/konflux-artifacts/prod" and
                .params.taskGitUrl == "https://localhost" and
                .params.taskGitRevision == "main" and
                .labels == {"internal-services.appstudio.openshift.io/pipelinerun-uid": $uid} and
                .service_account == "release-service-account" and
                .sync == true and
                .pipeline_timeout == "24h0m0s" and
                .task_timeout == "23h50m0s" and
                .finally_timeout == "0h10m0s" and
                .timeout == 86700
              ' "$(params.dataDir)/$(context.pipelineRun.uid)/results/internal-request.json"

              if [ "$(params.checksumMap)" != "quay.io/checksum-map@sha256:abcdef" ]; then
                echo "push-artifacts-to-cdn did not set the expected checksum_map result"
                exit 1
              fi
