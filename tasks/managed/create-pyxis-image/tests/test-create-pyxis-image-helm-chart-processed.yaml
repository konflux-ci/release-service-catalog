---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-create-pyxis-image-helm-chart-processed
spec:
  description: |
    Run the create-pyxis-image task with processHelmCharts set to true.
    Verify that the Helm chart IS processed through Pyxis (not skipped).
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:6979552f11f042b8730abcb1be4ec6cfb0553a069cc352643f88d8996041abf8
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/mydata.json" << EOF
              {
                "pyxis": {
                  "server": "stage",
                  "certified": false,
                  "secret": "pyxis"
                }
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/mapped_snapshot.json" << EOF
              {
                "application": "myapp",
                "components": [
                  {
                    "name": "caching-helm-test-rhel9",
                    "containerImage": "registry.io/helm-chart@sha256:helmdigest",
                    "repositories": [
                      {
                        "url": "quay.io/redhat-pending/dev-release-team-tenant----caching-helm-test-rhel9",
                        "rh-registry-repo": "registry.redhat.io/dev-release-team-tenant/caching-helm-test-rhel9",
                        "tags": ["0.1.1352_568b799"]
                      }
                    ]
                  }
                ]
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: create-pyxis-image
      params:
        - name: pyxisSecret
          value: test-create-pyxis-image-cert
        - name: server
          value: stage
        - name: processHelmCharts
          value: "true"
        - name: snapshotPath
          value: $(context.pipelineRun.uid)/mapped_snapshot.json
        - name: dataPath
          value: $(context.pipelineRun.uid)/mydata.json
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: pyxisDataPath
          value: $(tasks.run-task.results.pyxisDataPath)
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: dataDir
            description: The location where data will be stored
            type: string
          - name: pyxisDataPath
            type: string
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:6979552f11f042b8730abcb1be4ec6cfb0553a069cc352643f88d8996041abf8
            script: |
              #!/usr/bin/env bash
              set -eux

              pyxis_file="$(params.dataDir)/$(params.pyxisDataPath)"
              echo "Contents of pyxis.json:"
              cat "$pyxis_file"

              # With processHelmCharts=true, the Helm chart should be processed (not skipped)
              component_count=$(jq '.components | length' "$pyxis_file")
              if [ "$component_count" != "1" ]; then
                echo "Error: Expected 1 component in pyxis.json (Helm chart processed), but got $component_count"
                exit 1
              fi

              # Verify the component was NOT skipped
              skipped=$(jq -r '.components[0].skipped // "false"' "$pyxis_file")
              if [ "$skipped" == "true" ]; then
                echo "Error: Helm chart was skipped but processHelmCharts was true"
                exit 1
              fi

              # Verify it has pyxisImages (meaning it was actually processed through Pyxis)
              pyxis_image_count=$(jq '.components[0].pyxisImages | length' "$pyxis_file")
              if [ "$pyxis_image_count" -lt 1 ]; then
                echo "Error: Expected at least 1 pyxisImage for processed Helm chart, got $pyxis_image_count"
                exit 1
              fi

              # Verify the containerImage matches our Helm chart
              container_image=$(jq -r '.components[0].containerImage' "$pyxis_file")
              if [[ "$container_image" != *"helm-chart"* ]]; then
                echo "Error: Expected helm-chart in containerImage, got $container_image"
                exit 1
              fi

              echo "SUCCESS: Helm chart was processed through Pyxis with processHelmCharts=true"
      runAfter:
        - run-task
