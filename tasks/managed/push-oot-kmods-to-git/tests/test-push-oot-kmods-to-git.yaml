---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-push-oot-kmods-to-git
spec:
  description: |
    Happy-path test for push-oot-kmods-to-git with a multi-architecture
    build. The git mock verifies the pushed artifacts pushed to correct path
    for each architecture, plus the multi-arch summary.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
    - name: taskGitUrl
      type: string
      default: "http://localhost"
    - name: taskGitRevision
      type: string
      default: "main"
  tasks:
    - name: setup
      taskSpec:
        params:
          - name: dataDir
            type: string
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils:on-pr-86cbf6218d76ec34202bc34b1e886a9b20002701
            script: |
              #!/usr/bin/env bash
              set -eux

              SIGNED_KMODS="$(params.dataDir)/signed-kmods"

              for arch in x86_64 aarch64; do
                ARCH_DIR="${SIGNED_KMODS}/${arch}"
                mkdir -p "${ARCH_DIR}/driver/subdir"
                echo "MODULE1" > "${ARCH_DIR}/mod1.ko"
                echo "NESTED" > "${ARCH_DIR}/driver/subdir/nested.ko"
                cat > "${ARCH_DIR}/envfile" << EOF
              DRIVER_VENDOR=mocked-vendor
              DRIVER_VERSION=1.0.0
              KERNEL_VERSION=6.5.0.${arch}
              EOF
                cd "${ARCH_DIR}"
                sha256sum mod1.ko driver/subdir/nested.ko > "signed_kmods_checksums_${arch}.txt"
              done

              echo "signed by vendor CI" > "${SIGNED_KMODS}/signing_summary.txt"
              echo "extracted x86_64 and aarch64" > "${SIGNED_KMODS}/extraction_summary.txt"

              cd "$(params.dataDir)"
              tar -czf signed-kmods.tar.gz signed-kmods
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
      params:
        - name: dataDir
          value: $(params.dataDir)
    - name: run-task
      taskRef:
        name: push-oot-kmods-to-git
      params:
        - name: signedKmodsPath
          value: signed-kmods
        - name: dataDir
          value: $(params.dataDir)
        - name: gitRepoUrl
          value: "gitlab.example.com/group/kmods.git"
        - name: gitBranch
          value: main
        - name: gitTokenSecret
          value: git-token-mock
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: orasOptions
          value: $(params.orasOptions)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: $(params.taskGitUrl)
        - name: taskGitRevision
          value: $(params.taskGitRevision)
      runAfter:
        - setup
