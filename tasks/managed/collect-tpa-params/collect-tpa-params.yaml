---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: collect-tpa-params
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task that collects the TPA server option from the data file.
    It can either parse the cluster configuration stored in konflux-info
    namespace or parse a dataPath JSON file for values.
    
    If the desired configmap is present in konflux-info, it will be used
    as a preferred option.
    
    Otherwise it outputs values based on the value of the "atlas.server" or
    "tpa.servers" field ("stage" or "production"), the output values are used
    to push SBOMs to TPA. Also outputs results used to push SBOMs to an S3
    bucket.
    
    If the configmap in konflux-info cannot be parsed and no TPA fields
    are present in the data file, the task fails. If this is undesired,
    the task can be configured to return empty results instead by setting
    the parameter 'failOnMissing' to 'false'.
  params:
    - name: dataPath
      type: string
      description: |
        Path to the JSON string of the merged data containing the TPA config
      default: ""
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: caCertPath
      type: string
      description: Path to CA certificate bundle for TLS verification with self-signed certificates
      default: /mnt/trusted-ca/ca-bundle.crt
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
    - name: configMapNamespace
      type: string
      description: The namespace where the ConfigMap is located
      default: konflux-info
    - name: configMapName
      type: string
      description: The name of the ConfigMap to read TPA parameters from
      default: cluster-config
    - name: failOnMissing
      type: string
      description: Specify if this task should fail on missing parameters
      default: 'true'
  results:
    - name: atlasApiUrl
      type: string
      description: |
        URL of the TPA API.
    - name: ssoTokenUrl
      type: string
      description: |
        URL of the SSO token issuer.
    - name: secretName
      type: string
      description: |
        The kubernetes secret to use to authenticate to TPA.
    - name: retryAWSSecretName
      type: string
      description: |
        The kubernetes secret to use to authenticate to the S3 retry mechanism bucket.
    - name: retryS3Bucket
      type: string
      description: |
        Name of the S3 retry mechanism bucket.
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: caCertPath
          value: $(params.caCertPath)
    - name: collect-tpa-params
      image:
        quay.io/konflux-ci/release-service-utils@sha256:e08d3a8dc0f29ef6e46b1c401662ff99e2efa2ff48694974e1e5709612a8b0da
      computeResources:
        limits:
          memory: 192Mi
        requests:
          memory: 192Mi
          cpu: 50m
      env:
        - name: RESULT_ATLAS_API_URL
          value: "$(results.atlasApiUrl.path)"
        - name: RESULT_SSO_TOKEN_URL
          value: "$(results.ssoTokenUrl.path)"
        - name: RESULT_SECRET_NAME
          value: "$(results.secretName.path)"
        - name: RESULT_RETRY_AWS_SECRET_NAME
          value: "$(results.retryAWSSecretName.path)"
        - name: RESULT_RETRY_S3_BUCKET
          value: "$(results.retryS3Bucket.path)"
      command: ["python3", "-m", "collect_tpa_params"]
      args:
        - "--data-dir"
        - "$(params.dataDir)"
        - "--data-path"
        - "$(params.dataPath)"
        - "--configmap-name"
        - "$(params.configMapName)"
        - "--configmap-namespace"
        - "$(params.configMapNamespace)"
        - "--fail-on-missing"
        - "$(params.failOnMissing)"
