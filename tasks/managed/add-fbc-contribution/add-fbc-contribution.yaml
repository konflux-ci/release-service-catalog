---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: add-fbc-contribution
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Task to create internalrequests to add fbc contributions to index images. It can batch
    multiple fragments into a single IIB request and can also split requests according
    to their OCP versions.

    This task batches FBC fragments to submit them to IIB in sets of params.maxBatchSize.
    The Snapshot has been previously augmented by prepare-fbc-snapshot to include OCP and
    target index metadata for each component.

    In this task, we split fragments up by their OCP versions and then process each of these
    in series. For each OCP version, we chain together batches so that the final targetIndex
    produced will have all fragments added. This means that the index_image from one internal
    request will be set as the fromIndex for the next request within that OCP version.

    Since we have seen flakiness in IIB requests in the past, we retry failed batches
    and internal requests can attach onto currently in progress IIB requests. We retry batches
    at the end to allow for timed out requests to finish so that we can just get the final
    result. This will slightly compress the time in which batches are entered into the IIB
    queue to reduce the effect of a full queue on a single release.

    The task is organized into three processing steps:
      1. prepare-inputs: validates inputs, groups components by OCP version, writes config
      2. process-ocp-groups: executes IIB requests per OCP group with batching and retries
      3. collect-and-deduplicate: aggregates results, deduplicates, produces final output
  params:
    - name: snapshotPath
      description: Path to the JSON string of the mapped Snapshot spec in the data workspace
      type: string
    - name: dataPath
      description: Path to the JSON string of the merged data to use in the data workspace
      type: string
    - name: pipelineRunUid
      type: string
      description: The uid of the current pipelineRun. Used as a label value when creating internal requests
    - name: resultsDirPath
      type: string
      description: Path to the results directory in the data workspace
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: maxBatchSize
      type: string
      description: Maximum number of FBC fragments to process in a single batch
      default: "5"
    - name: mustPublishIndexImage
      type: string
      description: Whether the index image should be published (from prepare-fbc-parameters)
    - name: mustOverwriteFromIndexImage
      type: string
      description: Whether to overwrite the from index image (from prepare-fbc-parameters)
    - name: iibServiceAccountSecret
      type: string
      description: IIB service account secret name (from prepare-fbc-parameters)
    - name: maxRetries
      description: Maximum number of retry attempts for failed internal requests
      type: string
      default: "3"
    - name: batchRetryDelaySeconds
      description: Delay between batch retry attempts in seconds
      type: string
      default: "60"
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: buildTimestamp
      description: Build timestamp from the IIB build
    - name: requestResultsFile
      description: Internal Request results file
    - name: internalRequestResultsFile
      description: Additional Internal Request results file
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: orasOptions
          value: $(params.orasOptions)
    - name: add-fbc-contribution
      image: quay.io/konflux-ci/release-service-utils@sha256:179335741bd23ef73d55965db0304a173cdcb54d8ddc0e7587b984af25cbbfdc
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: 200m
      script: |
        #!/usr/bin/env bash
        set -o pipefail

        /home/scripts/python/tasks/managed/add_fbc_contribution.py \
          --data-dir "$(params.dataDir)" \
          --data-path "$(params.dataPath)" \
          --snapshot-path "$(params.snapshotPath)" \
          --pipeline-run-uid "$(params.pipelineRunUid)" \
          --task-run-uid "$(context.taskRun.uid)" \
          --results-dir-path "$(params.resultsDirPath)" \
          --task-git-url "$(params.taskGitUrl)" \
          --task-git-revision "$(params.taskGitRevision)" \
          --max-batch-size "$(params.maxBatchSize)" \
          --must-publish-index-image "$(params.mustPublishIndexImage)" \
          --must-overwrite-from-index-image "$(params.mustOverwriteFromIndexImage)" \
          --iib-service-account-secret "$(params.iibServiceAccountSecret)" \
          --max-retries "$(params.maxRetries)" \
          --batch-retry-delay-seconds "$(params.batchRetryDelaySeconds)" \
          --request-results-file-result "$(results.requestResultsFile.path)" \
          --internal-request-results-file-result "$(results.internalRequestResultsFile.path)" \
          --build-timestamp-result "$(results.buildTimestamp.path)"
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
