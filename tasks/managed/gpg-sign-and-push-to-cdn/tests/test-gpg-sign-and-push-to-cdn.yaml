---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-gpg-sign-and-push-to-cdn
spec:
  description: Test the happy path for gpg-sign-and-push-to-cdn
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils:on-pr-d8e01994f25a41ef3919398ff7e889cacf4efcbf
            script: |
              #!/usr/bin/env bash
              set -euxo pipefail

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot_spec.json" << EOF
              {
                "components": [
                  {
                    "name": "test-component",
                    "containerImage": "quay.io/workload/tenant/artifacts/test@sha256:abc123",
                    "contentGateway": {
                      "productName": "Test Product",
                      "productCode": "TestProd",
                      "productVersionName": "1.0",
                      "contentType": "binary",
                      "mirrorOpenshiftPush": true
                    }
                  }
                ]
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "sign": {
                  "configMapName": "signing-config-map"
                },
                "cdn": {
                  "env": "stage"
                },
                "intention": "staging"
              }
              EOF

          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: gpg-sign-and-push-to-cdn
      params:
        - name: snapshotPath
          value: $(context.pipelineRun.uid)/snapshot_spec.json
        - name: dataPath
          value: $(context.pipelineRun.uid)/data.json
        - name: requester
          value: testuser
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils:on-pr-d8e01994f25a41ef3919398ff7e889cacf4efcbf
            script: |
              #!/usr/bin/env bash
              set -euxo pipefail

              # Verify signing request
              sign_file="$(params.dataDir)/mock_signing_request.json"
              if [ ! -f "${sign_file}" ]; then
                echo "Error: no signing request was submitted"
                exit 1
              fi

              sign=$(head -1 "${sign_file}")
              jq -e '
                .pipeline == "generic-signing" and
                .keyname == "redhate2etesting" and
                .sign_method == "detachsign" and
                .onbehalfof == "testuser" and
                .kerberos_keytab_secret == "kerberos-keytab-secret" and
                .kerberos_keytab == "/etc/kerberos/keytab" and
                .kerberos_principal == "signing@EXAMPLE.COM" and
                .service_account == "signing-pipeline-sa" and
                .intention == "staging" and
                .source_data_artifact != ""
              ' <<< "${sign}"
              echo "Signing request checks passed"

              # Verify publish InternalRequest was created
              ir_file="$(params.dataDir)/mock_publish_ir.json"
              if [ ! -f "${ir_file}" ]; then
                echo "Error: no publish InternalRequest was created"
                exit 1
              fi

              ir=$(head -1 "${ir_file}")
              jq -e '
                .pipeline == "gpg-sign-and-push-to-cdn" and
                .params.exodusGwSecret == "exodus-prod-secret" and
                .params.exodusGwEnv == "pre" and
                .params.cgwHostname == "https://developers.qa.redhat.com/content-gateway/rest/admin" and
                .params.cgwSecret == "cgw-service-account-stage-secret" and
                .params.snapshot_json != "" and
                .params.signed_artifacts_json != ""
              ' <<< "${ir}"
              echo "Publish IR check passed"

              echo "All checks passed"
      runAfter:
        - run-task
