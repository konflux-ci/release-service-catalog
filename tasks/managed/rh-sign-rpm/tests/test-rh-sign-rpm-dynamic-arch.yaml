---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-rh-sign-rpm-dynamic-arch
spec:
  description: Test creating internal request with empty snapshotBuildId and multi-arch artifacts.json
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:6979552f11f042b8730abcb1be4ec6cfb0553a069cc352643f88d8996041abf8
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)/artifacts"

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot_spec.json" << EOF
              {
                "application": "myapp",
                "components": [
                  {
                    "name": "rpm-comp0",
                    "source": {
                      "git": {
                        "revision": "deadbeef"
                      }
                    },
                    "containerImage": "quay.io/test/rpm-component@sha256:1111"
                  }
                ]
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "signOptions": {
                  "signKeytab": {
                    "principal": "test-principal@REDHAT.COM",
                    "name": "test-keytab",
                    "secret": "test-keytab-secret"
                  },
                  "signPipelineImage": "quay.io/redhat-isv/operator-pipelines-images:released",
                  "signKeyAlias": {
                    "key": "devkey1"
                  }
                },
                "sign": {
                  "request": "rpm-signing-pipeline"
                }
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/release_plan_admission.json" << EOF
              {
                "spec": {
                  "pipeline": {
                    "pipelineRef": {
                      "resolver": "git",
                      "params": [
                        {
                          "name": "url",
                          "value": "https://localhost.git"
                        },
                        {
                          "name": "revision",
                          "value": "main"
                        },
                        {
                          "name": "pathInRepo",
                          "value": "pipelines/rpm-signing/rpm-signing.yaml"
                        }
                      ]
                    },
                    "serviceAccountName": "release-service-account"
                  }
                }
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/artifacts/artifacts.json" << EOF
              {
                "artifacts": {
                  "test-rpm-1.0-1.el9.x86_64.rpm": {
                    "labels": {"arch": "x86_64"},
                    "url": "https://pulp.example.com/api/pulp-content/test/x86_64/Packages/t/test-rpm-1.0-1.el9.x86_64.rpm",
                    "sha256": "abc123def456"
                  },
                  "common-lib-1.0-1.el9.noarch.rpm": {
                    "labels": {"arch": "noarch"},
                    "url": "https://pulp.example.com/api/pulp-content/test/aarch64/Packages/c/common-lib-1.0-1.el9.noarch.rpm",
                    "sha256": "noarch123abc"
                  },
                  "test-rpm-1.0-1.el9.src.rpm": {
                    "labels": {"arch": "source"},
                    "url": "https://pulp.example.com/api/pulp-content/test/source/Packages/t/test-rpm-1.0-1.el9.src.rpm",
                    "sha256": "def789ghi012"
                  }
                },
                "distributions": {
                  "aarch64": "https://pulp.example.com/api/pulp-content/test/aarch64/",
                  "x86_64": "https://pulp.example.com/api/pulp-content/test/x86_64/",
                  "source": "https://pulp.example.com/api/pulp-content/test/source/"
                }
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: rh-sign-rpm
      params:
        - name: requester
          value: testuser-rpm
        - name: requestTimeout
          value: "1800"
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: dataPath
          value: $(context.pipelineRun.uid)/data.json
        - name: artifactsJsonPath
          value: $(context.pipelineRun.uid)/artifacts/artifacts.json
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
        - name: snapshotBuildId
          value: ""
        - name: unsignedRpmsDomain
          value: "rok-storage"
        - name: signedRpmsDomain
          value: "rok-storage"
        - name: unsignedRpmsSubpath
          value: ""
        - name: signedRpmsSubpath
          value: ""
        - name: signedRpmsUploadSubpath
          value: ""
        - name: PULP_SECRET_NAME
          value: "mock-pulp-secret"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:6979552f11f042b8730abcb1be4ec6cfb0553a069cc352643f88d8996041abf8
            script: |
              #!/usr/bin/env bash
              set -eux

              internalRequests="$(kubectl get internalrequest -o json --sort-by=.metadata.creationTimestamp | jq -c)"
              irsLength=$(jq ".items | length" <<< "${internalRequests}" )

              echo "Found ${irsLength} internal requests"

              # We expect 1 internal request with all RPMs (single-request mode)
              if [ "${irsLength}" != "1" ]; then
                echo "Expected 1 internal request, found ${irsLength}"
                exit 1
              fi

              params_json=$(jq -r ".items[0].spec.params" <<< "${internalRequests}")

              # Verify unsigned_rpms_location uses "all" repo when snapshotBuildId is empty
              unsigned_location=$(jq -r '.unsigned_rpms_location' <<< "${params_json}")
              if [ "${unsigned_location}" != "rok-storage/all" ]; then
                echo "Expected unsigned_rpms_location 'rok-storage/all', got '${unsigned_location}'"
                exit 1
              fi

              signed_destination=$(jq -r '.signed_rpms_destination' <<< "${params_json}")
              if [ "${signed_destination}" != "rok-storage/all" ]; then
                echo "Expected signed_rpms_destination 'rok-storage/all', got '${signed_destination}'"
                exit 1
              fi

              # Verify artifact_json contains all 3 RPMs (x86_64, noarch, source)
              artifactJson=$(jq -r '.artifact_json' <<< "${params_json}")
              decodedArtifact=$(base64 -d <<< "${artifactJson}" | gunzip)
              artifactCount=$(jq '.artifacts | length' <<< "${decodedArtifact}")
              if [ "${artifactCount}" != "3" ]; then
                echo "Expected 3 artifacts in artifact_json, found ${artifactCount}"
                exit 1
              fi

              echo "Test passed: single request created with all RPMs when snapshotBuildId is empty"
      runAfter:
        - run-task
  finally:
    - name: cleanup
      taskSpec:
        steps:
          - name: delete-crs
            image: quay.io/konflux-ci/release-service-utils@sha256:6979552f11f042b8730abcb1be4ec6cfb0553a069cc352643f88d8996041abf8
            script: |
              #!/usr/bin/env bash
              set -eux

              kubectl delete internalrequests --all
