---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-rh-sign-rpm-dynamic-arch
spec:
  description: Test creating internal requests with dynamic architecture detection from artifacts.json
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)/artifacts"

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot_spec.json" << EOF
              {
                "application": "myapp",
                "components": [
                  {
                    "name": "rpm-comp0",
                    "source": {
                      "git": {
                        "revision": "deadbeef"
                      }
                    },
                    "containerImage": "quay.io/test/rpm-component@sha256:1111"
                  }
                ]
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "signOptions": {
                  "signKeytab": {
                    "principal": "test-principal@REDHAT.COM",
                    "name": "test-keytab",
                    "secret": "test-keytab-secret"
                  },
                  "signPipelineImage": "quay.io/redhat-isv/operator-pipelines-images:released",
                  "signKeyAlias": {
                    "key": "devkey1"
                  }
                },
                "sign": {
                  "request": "rpm-signing-pipeline"
                }
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/release_plan_admission.json" << EOF
              {
                "spec": {
                  "pipeline": {
                    "pipelineRef": {
                      "resolver": "git",
                      "params": [
                        {
                          "name": "url",
                          "value": "https://localhost.git"
                        },
                        {
                          "name": "revision",
                          "value": "main"
                        },
                        {
                          "name": "pathInRepo",
                          "value": "pipelines/rpm-signing/rpm-signing.yaml"
                        }
                      ]
                    },
                    "serviceAccountName": "release-service-account"
                  }
                }
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/artifacts/artifacts.json" << EOF
              {
                "artifacts": {
                  "test-rpm-1.0-1.el9.x86_64.rpm": {
                    "labels": {"arch": "x86_64"},
                    "url": "https://pulp.example.com/pulp/content/test/x86_64/test-rpm-1.0-1.el9.x86_64.rpm",
                    "sha256": "abc123def456"
                  },
                  "another-rpm-2.0-1.el9.x86_64.rpm": {
                    "labels": {"arch": "x86_64"},
                    "url": "https://pulp.example.com/pulp/content/test/x86_64/another-rpm-2.0-1.el9.x86_64.rpm",
                    "sha256": "xyz789abc123"
                  },
                  "test-rpm-1.0-1.el9.src.rpm": {
                    "labels": {"arch": "source"},
                    "url": "https://pulp.example.com/pulp/content/test/source/test-rpm-1.0-1.el9.src.rpm",
                    "sha256": "def789ghi012"
                  }
                },
                "distributions": {
                  "x86_64": "https://pulp.example.com/pulp/content/test/x86_64/",
                  "source": "https://pulp.example.com/pulp/content/test/source/"
                }
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: rh-sign-rpm
      params:
        - name: requester
          value: testuser-rpm
        - name: requestTimeout
          value: "1800"
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: snapshotPath
          value: $(context.pipelineRun.uid)/snapshot_spec.json
        - name: dataPath
          value: $(context.pipelineRun.uid)/data.json
        - name: releasePlanAdmissionPath
          value: $(context.pipelineRun.uid)/release_plan_admission.json
        - name: artifactsJsonPath
          value: $(context.pipelineRun.uid)/artifacts/artifacts.json
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
        - name: snapshotBuildId
          value: ""
        - name: unsignedRpmsDomain
          value: "rok-storage"
        - name: signedRpmsDomain
          value: "rok-storage"
        - name: unsignedRpmsSubpath
          value: ""
        - name: signedRpmsSubpath
          value: ""
        - name: signedRpmsUploadSubpath
          value: ""
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -eux

              internalRequests="$(kubectl get internalrequest -o json --sort-by=.metadata.creationTimestamp | jq -c)"
              irsLength=$(jq ".items | length" <<< "${internalRequests}" )

              echo "Found ${irsLength} internal requests"

              # We expect 2 internal requests (one for x86_64, one for source)
              if [ "${irsLength}" != "2" ]; then
                echo "Expected 2 internal requests (one per architecture), found ${irsLength}"
                exit 1
              fi

              # Check that filtered artifacts.json files were created
              if [ ! -f "$(params.dataDir)/artifacts-x86_64.json" ]; then
                echo "Expected filtered artifacts-x86_64.json file not found"
                exit 1
              fi

              if [ ! -f "$(params.dataDir)/artifacts-source.json" ]; then
                echo "Expected filtered artifacts-source.json file not found"
                exit 1
              fi

              # Verify x86_64 filtered file contains only x86_64 artifacts
              x86_count=$(jq '.artifacts | length' "$(params.dataDir)/artifacts-x86_64.json")
              if [ "${x86_count}" != "2" ]; then
                echo "Expected 2 artifacts in x86_64 filtered file, found ${x86_count}"
                exit 1
              fi

              # Verify source filtered file contains only source artifacts
              source_count=$(jq '.artifacts | length' "$(params.dataDir)/artifacts-source.json")
              if [ "${source_count}" != "1" ]; then
                echo "Expected 1 artifact in source filtered file, found ${source_count}"
                exit 1
              fi

              # Verify all artifacts in x86_64 file have arch=x86_64
              x86_archs=$(jq -r '.artifacts[].labels.arch' "$(params.dataDir)/artifacts-x86_64.json" | sort -u)
              if [ "${x86_archs}" != "x86_64" ]; then
                echo "x86_64 filtered file contains non-x86_64 artifacts: ${x86_archs}"
                exit 1
              fi

              # Verify all artifacts in source file have arch=source
              source_archs=$(jq -r '.artifacts[].labels.arch' "$(params.dataDir)/artifacts-source.json" | sort -u)
              if [ "${source_archs}" != "source" ]; then
                echo "source filtered file contains non-source artifacts: ${source_archs}"
                exit 1
              fi

              # Verify the internal requests have correct unsigned_rpms_location
              for i in 0 1; do
                params_json=$(jq -r ".items[$i].spec.params" <<< "${internalRequests}")
                unsigned_location=$(jq -r '.unsigned_rpms_location' <<< "${params_json}")

                # Should be either rok-storage/x86_64 or rok-storage/source
                if [[ "${unsigned_location}" != "rok-storage/x86_64" ]] && \
                   [[ "${unsigned_location}" != "rok-storage/source" ]]; then
                  echo "Unexpected unsigned_rpms_location: ${unsigned_location}"
                  exit 1
                fi
              done

              echo "Test passed: Multiple InternalRequests created with filtered artifacts.json files"
      runAfter:
        - run-task
  finally:
    - name: cleanup
      taskSpec:
        steps:
          - name: delete-crs
            image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
            script: |
              #!/usr/bin/env bash
              set -eux

              kubectl delete internalrequests --all
