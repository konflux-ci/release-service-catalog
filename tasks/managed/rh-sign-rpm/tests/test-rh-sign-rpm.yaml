---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-rh-sign-rpm
spec:
  description: Test creating an internal request to sign RPMs
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:6d4dee971855fe55724c16b049e21a396287b53766ffd3fa984ee91895e9f099
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)/artifacts"

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "signOptions": {
                  "signKeytab": {
                    "principal": "test-principal@REDHAT.COM",
                    "name": "test-keytab",
                    "secret": "test-keytab-secret"
                  },
                  "signKeyAlias": {
                    "key": "devkey1"
                  }
                }
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/artifacts/artifacts.json" << EOF
              {
                "artifacts": {
                  "test-rpm-1.0-1.el9.x86_64.rpm": {
                    "labels": {"arch": "x86_64"},
                    "url": "https://pulp.example.com/api/pulp-content/test/x86_64/Packages/t/test-rpm-1.0-1.el9.x86_64.rpm",
                    "sha256": "abc123def456"
                  },
                  "test-rpm-1.0-1.el9.src.rpm": {
                    "labels": {"arch": "source"},
                    "url": "https://pulp.example.com/api/pulp-content/test/source/Packages/t/test-rpm-1.0-1.el9.src.rpm",
                    "sha256": "def789ghi012"
                  }
                },
                "distributions": {
                  "x86_64": "https://pulp.example.com/api/pulp-content/test/x86_64/",
                  "source": "https://pulp.example.com/api/pulp-content/test/source/"
                }
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: rh-sign-rpm
      params:
        - name: requester
          value: testuser-rpm
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
        - name: dataPath
          value: $(context.pipelineRun.uid)/data.json
        - name: artifactsJsonPath
          value: $(context.pipelineRun.uid)/artifacts/artifacts.json
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
        - name: destinationArtifactStorageDomain
          value: "rok-storage"
        - name: useTargetArchRepo
          value: "false"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: signedRpmsOciArtifacts
          value: "$(tasks.run-task.results.signedRpmsOciArtifacts)"
      runAfter:
        - run-task
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
          - name: signedRpmsOciArtifacts
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:6d4dee971855fe55724c16b049e21a396287b53766ffd3fa984ee91895e9f099
            script: |
              #!/usr/bin/env bash
              set -ex

              request_file="$(params.dataDir)/$(context.pipelineRun.uid)/internal-request.json"
              if [ ! -f "${request_file}" ]; then
                echo "rh_sign_rpm did not create an InternalRequest"
                exit 1
              fi
              request=$(cat "${request_file}")

              jq -e --arg uid "$(context.pipelineRun.uid)" '
                .pipeline == "direct-rpm-signing" and
                .params.oci_storage == "$(params.ociStorage)" and
                .params.kerberos_principal == "test-principal@REDHAT.COM" and
                .params.kerberos_keytab == "test-keytab" and
                .params.kerberos_keytab_secret == "test-keytab-secret" and
                .params.signing_alias == "devkey1" and
                .params.artifact_storage_secret == "signing-artifact-storage-preprod" and
                .params.destination_artifact_storage_domain == "rok-storage" and
                .params.use_target_arch_repo == "false" and
                .params.skip_upload_to_pulp == "false" and
                .params.create_oci_artifact == "false" and
                .params.requester == "testuser-rpm" and
                .params.force == "false" and
                .params.taskGitUrl == "https://gitlab.cee.redhat.com/signing/signing.git" and
                .params.taskGitRevision == "845e5e2e1a625ea84fec4aed50c05c0313890a1f" and
                .params.oci_artifact_expires_after == "$(params.ociArtifactExpiresAfter)" and
                .labels == {"internal-services.appstudio.openshift.io/pipelinerun-uid": $uid} and
                .sync == true and
                .timeout == 4500 and
                .service_account == "release-service-account" and
                .pipeline_timeout == "1h10m0s" and
                .task_timeout == "1h0m0s"
              ' <<< "${request}"

              artifact_json=$(jq -r '.params.artifact_json' <<< "${request}")
              decoded=$(echo "${artifact_json}" | base64 -d | gunzip)

              expected_sha=$(jq -r '.artifacts["test-rpm-1.0-1.el9.x86_64.rpm"].sha256' <<< "${decoded}")
              if [ "${expected_sha}" != "abc123def456" ]; then
                echo "artifact_json does not contain the expected artifacts.json content"
                exit 1
              fi

              if [ "$(params.signedRpmsOciArtifacts)" != "oci://registry.example.com/signed-rpms@sha256:abc123" ]; then
                echo "rh-sign-rpm did not set the expected signedRpmsOciArtifacts result"
                exit 1
              fi

              echo "All checks passed"
      runAfter:
        - run-task
