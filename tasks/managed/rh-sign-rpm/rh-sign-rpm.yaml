---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rh-sign-rpm
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: sign-rpm
spec:
  description: |-
    Tekton task to create internalrequests to sign RPMs
  params:
    - name: snapshotPath
      type: string
      description: |
        Path to the JSON file of the mapped Snapshot spec in the data workspace
    - name: dataPath
      type: string
      description: |
        Path to the JSON file of the merged data to use in the data workspace
    - name: snapshotBuildId
      type: string
      description: |
        Pulp repository name to use for RPM signing. If provided, this value is used directly.
        If empty, repositories are determined dynamically from the architectures in artifacts.json.
      default: ""
    - name: releasePlanAdmissionPath
      description: Path to the JSON string of the releasePlanAdmission in the data workspace
      type: string
    - name: artifactsJsonPath
      type: string
      description: |
        Path to the artifacts.json file in the data workspace (pulp-tool format with RPM metadata)
      default: ""
    - name: requester
      type: string
      description: Name of the user that requested the signing, for auditing purposes
    - name: requestTimeout
      type: string
      default: "1800"
      description: InternalRequest timeout
    - name: pipelineRunUid
      type: string
      description: The uid of the current pipelineRun. Used as a label value when creating internal requests
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: ociArtifactExpiresAfter
      description: >-
        Expiration date for the trusted artifacts created in the OCI repository.
        An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: unsignedRpmsDomain
      type: string
      description: The domain to use for pulling unsigned RPMs
      default: rok-storage
    - name: signedRpmsDomain
      type: string
      description: The domain to use for pushing signed RPMs
      default: rok-storage
    - name: unsignedRpmsSubpath
      type: string
      description: |
        Subpath appended after the repo for unsigned RPMs location (e.g., "rpms" results in domain/repo/rpms).
        Set to empty string for no subpath.
      default: "rpms"
    - name: signedRpmsSubpath
      type: string
      description: |
        Subpath appended after the repo for signed RPMs destination
        (e.g., "rpms-signed" results in domain/repo/rpms-signed).
        Set to empty string for no subpath.
      default: "rpms-signed"
    - name: signedRpmsUploadSubpath
      type: string
      description: |
        Subpath for uploading signed RPMs within the signing pipeline.
        Set to empty string for no subpath.
      default: ""
  results:
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
  volumes:
    - name: workdir
      emptyDir: {}
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
          cpu: 30m
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: rh-sign-rpm
      image: quay.io/konflux-ci/release-service-utils:d08bdfa3733a7c75d5334aaa77b7aa46fbace00b
      computeResources:
        limits:
          memory: 2Gi
          cpu: "1"
        requests:
          memory: 2Gi
          cpu: "1"
      env:
        - name: SNAPSHOT_SPEC_FILE
          value: $(params.dataDir)/$(params.snapshotPath)
        - name: DATA_FILE
          value: $(params.dataDir)/$(params.dataPath)
        - name: ARTIFACTS_JSON_FILE
          value: $(params.dataDir)/$(params.artifactsJsonPath)
      script: |
        #!/usr/bin/env bash
        set -e

        if [ ! -f "${SNAPSHOT_SPEC_FILE}" ] ; then
            echo "No valid snapshot file was provided."
            exit 1
        fi

        if [ ! -f "${DATA_FILE}" ] ; then
            echo "No data JSON was provided."
            exit 1
        fi

        RPA_FILE="$(params.dataDir)/$(params.releasePlanAdmissionPath)"
        if [ ! -f "${RPA_FILE}" ] ; then
            echo "No valid rpa file was provided."
            exit 1
        fi

        if [ -z "$(params.artifactsJsonPath)" ] || [ ! -f "${ARTIFACTS_JSON_FILE}" ]; then
            echo "No valid artifacts.json file was provided."
            exit 1
        fi

        set -x

        PIPELINERUN_LABEL="internal-services.appstudio.openshift.io/pipelinerun-uid"

        # Extract signing configuration from data file
        KERBEROS_PRINCIPAL=$(jq --exit-status -r '.signOptions.signKeytab.principal' "${DATA_FILE}")
        KERBEROS_KEYTAB=$(jq --exit-status -r '.signOptions.signKeytab.name' "${DATA_FILE}")
        KERBEROS_KEYTAB_SECRET=$(jq --exit-status -r '.signOptions.signKeytab.secret' "${DATA_FILE}")
        PIPELINE_IMAGE=$(jq --exit-status -r '.signOptions.signPipelineImage' "${DATA_FILE}")
        SIGNING_ALIAS=$(jq --exit-status -r '.signOptions.signKeyAlias.key' "${DATA_FILE}")

        # Determine repos to process and whether to filter artifacts
        FILTER_ARTIFACTS="false"
        HAS_NOARCH="false"
        if [ -n "$(params.snapshotBuildId)" ]; then
            # Use provided snapshotBuildId as the repo
            REPOS="$(params.snapshotBuildId)"
            echo "Using provided snapshotBuildId as repo: ${REPOS}"
        else
            # Extract unique architectures from artifacts.json
            # Filter out "noarch" - noarch RPMs are uploaded to all arch repos by push-rpms-to-pulp
            # and should be signed as part of actual arch repos, not a separate "noarch" repo
            ALL_ARCHS=$(jq -r '.artifacts | .[].labels.arch // empty' "${ARTIFACTS_JSON_FILE}" | sort -u)

            if echo "${ALL_ARCHS}" | grep -q "^noarch$"; then
                HAS_NOARCH="true"
            fi

            # Start with arch-specific repos from artifacts
            REPOS=$(echo "${ALL_ARCHS}" | grep -v "^noarch$" || true)
            echo "Extracted repos from artifacts.json architectures: ${REPOS:-<none>}"

            # When noarch RPMs exist, use distributions to determine all repos that have content
            # This reflects where push-rpms-to-pulp actually uploaded noarch RPMs
            if [ "${HAS_NOARCH}" = "true" ]; then
                echo "noarch RPMs found - adding all arch repos from distributions"
                DIST_REPOS=$(jq -r '.distributions | keys[]' "${ARTIFACTS_JSON_FILE}" \
                  | grep -v "^source$" || true)
                for dist_repo in ${DIST_REPOS}; do
                    if ! echo "${REPOS}" | grep -q "^${dist_repo}$"; then
                        if [ -z "${REPOS}" ]; then
                            REPOS="${dist_repo}"
                        else
                            REPOS="${REPOS}"$'\n'"${dist_repo}"
                        fi
                        echo "  Adding repo from distributions: ${dist_repo}"
                    fi
                done
            fi

            # Add source if present in artifacts
            if echo "${ALL_ARCHS}" | grep -q "^source$"; then
                REPOS="${REPOS}"$'\n'"source"
            fi

            if [ -z "${REPOS}" ]; then
                echo "No architectures found in artifacts.json"
                exit 1
            fi
            echo "Final repos to process: ${REPOS}"
            FILTER_ARTIFACTS="true"
        fi

        # Process each repo
        for REPO in ${REPOS}; do
            echo "Creating internal-request for RPM signing (repo: ${REPO})..."

            # Determine which artifacts.json to use
            if [ "${FILTER_ARTIFACTS}" = "true" ]; then
                # Create filtered artifacts.json for this architecture
                FILTERED_ARTIFACTS_FILE="$(params.dataDir)/artifacts-${REPO}.json"
                if [ "${HAS_NOARCH}" = "true" ] && [ "${REPO}" != "source" ]; then
                    # Include both arch-specific AND noarch artifacts in each arch repo
                    # noarch RPMs exist in all arch repos, so each needs to be signed
                    jq --arg arch "${REPO}" '{
                      artifacts: (.artifacts | to_entries
                        | map(select(.value.labels.arch == $arch or .value.labels.arch == "noarch"))
                        | from_entries),
                      distributions: {($arch): .distributions[$arch]}
                    }' "${ARTIFACTS_JSON_FILE}" > "${FILTERED_ARTIFACTS_FILE}"
                    echo "Created filtered artifacts.json for ${REPO} (including noarch)"
                else
                    jq --arg arch "${REPO}" '{
                      artifacts: (.artifacts | to_entries | map(select(.value.labels.arch == $arch))
                        | from_entries),
                      distributions: {($arch): .distributions[$arch]}
                    }' "${ARTIFACTS_JSON_FILE}" > "${FILTERED_ARTIFACTS_FILE}"
                    echo "Created filtered artifacts.json for ${REPO}"
                fi
                ARTIFACT_JSON_PATH="${FILTERED_ARTIFACTS_FILE}"
            else
                ARTIFACT_JSON_PATH="${ARTIFACTS_JSON_FILE}"
            fi

            # Build unsigned RPMs location path
            if [ -n "$(params.unsignedRpmsSubpath)" ]; then
                UNSIGNED_LOCATION="$(params.unsignedRpmsDomain)/${REPO}/$(params.unsignedRpmsSubpath)"
            else
                UNSIGNED_LOCATION="$(params.unsignedRpmsDomain)/${REPO}"
            fi

            # Build signed RPMs destination path
            if [ -n "$(params.signedRpmsSubpath)" ]; then
                SIGNED_DESTINATION="$(params.signedRpmsDomain)/${REPO}/$(params.signedRpmsSubpath)"
            else
                SIGNED_DESTINATION="$(params.signedRpmsDomain)/${REPO}"
            fi

            echo "Unsigned RPMs location: ${UNSIGNED_LOCATION}"
            echo "Signed RPMs destination: ${SIGNED_DESTINATION}"

            internal-request \
              --pipeline "direct-rpm-signing" \
              -p image="${PIPELINE_IMAGE}" \
              -p artifact_json="${ARTIFACT_JSON_PATH}" \
              -p ociStorage="$(params.ociStorage)" \
              -p kerberos_principal="${KERBEROS_PRINCIPAL}" \
              -p kerberos_keytab="${KERBEROS_KEYTAB}" \
              -p kerberos_keytab_secret="${KERBEROS_KEYTAB_SECRET}" \
              -p signing_alias="${SIGNING_ALIAS}" \
              -p unsigned_rpms_location="${UNSIGNED_LOCATION}" \
              -p signed_rpms_destination="${SIGNED_DESTINATION}" \
              -p requester="$(params.requester)" \
              -p force="false" \
              -p signed_rpms_upload_subpath="$(params.signedRpmsUploadSubpath)" \
              -p taskGitUrl="https://gitlab.cee.redhat.com/signing/signing.git" \
              -p taskGitRevision="main" \
              -l ${PIPELINERUN_LABEL}="$(params.pipelineRunUid)" \
              -t "$(params.requestTimeout)" \
              --pipeline-timeout "0h30m0s" \
              --task-timeout "0h25m0s" \
              -s true

            echo "RPM signing request completed for repo: ${REPO}"
        done

        echo "All RPM signing requests completed"
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
          cpu: 250m
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
