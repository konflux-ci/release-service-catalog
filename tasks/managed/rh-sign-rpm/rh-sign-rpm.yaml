---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rh-sign-rpm
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: sign-rpm
spec:
  description: |-
    Tekton task to create internalrequests to sign RPMs
  params:
    - name: dataPath
      type: string
      description: |
        Path to the JSON file of the merged data to use in the data workspace
    - name: artifactsJsonPath
      type: string
      description: |
        Path to the artifacts.json file in the data workspace (pulp-tool format with RPM metadata)
      default: "artifacts.json"
    - name: requester
      type: string
      description: Name of the user that requested the signing, for auditing purposes
    - name: requestTimeout
      type: string
      default: "1800"
      description: InternalRequest timeout
    - name: pipelineTimeout
      type: string
      default: "0h30m0s"
      description: Pipeline timeout for the signing InternalRequest
    - name: taskTimeout
      type: string
      default: "0h25m0s"
      description: Task timeout for the signing InternalRequest
    - name: pipelineRunUid
      type: string
      description: The uid of the current pipelineRun. Used as a label value when creating internal requests
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: ociArtifactExpiresAfter
      description: >-
        Expiration date for the trusted artifacts created in the OCI repository.
        An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: destinationArtifactStorageDomain
      type: string
      description: The domain to use for uploading signed RPMs
      default: rok-storage
    - name: useTargetArchRepo
      type: string
      description: >-
        Use architecture as repository name instead of build-id (true/false).
        When true, RPMs go to {namespace}/{arch}/ instead of {namespace}/{build-id}/rpms-signed
      default: "false"
    - name: createOciArtifact
      type: string
      description: >-
        Whether the signing pipeline should create an OCI artifact from the signed RPMs.
        Set to "true" to enable
      default: "false"
    - name: signingRepo
      type: string
      description: >-
        Git repository URL containing the signing tasks
      default: "https://gitlab.cee.redhat.com/signing/signing.git"
    - name: signingRevision
      type: string
      description: >-
        Git revision (branch, tag, or commit) in the signing repository
      default: "3d4879b7f6910f36306ad379dd0ef8512f90a961"
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
    - name: signedRpmsOciArtifacts
      type: string
      description: OCI artifact reference containing the signed RPMs
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
          cpu: 30m
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: rh-sign-rpm
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits:
          memory: 512Mi
          cpu: 250m
        requests:
          memory: 512Mi
          cpu: 250m
      env:
        - name: DATA_FILE
          value: $(params.dataDir)/$(params.dataPath)
        - name: ARTIFACTS_JSON_FILE
          value: $(params.dataDir)/$(params.artifactsJsonPath)
        - name: HOME
          value: /tmp
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [ ! -f "${DATA_FILE}" ] ; then
            echo "No data JSON was provided."
            exit 1
        fi

        if [ -z "$(params.artifactsJsonPath)" ] || [ ! -f "${ARTIFACTS_JSON_FILE}" ]; then
            echo "No valid artifacts.json file was provided."
            exit 1
        fi

        PIPELINERUN_LABEL="internal-services.appstudio.openshift.io/pipelinerun-uid"
        IR_FILE="$(params.dataDir)/ir-output.txt"

        # Extract signing configuration from data file
        KERBEROS_PRINCIPAL=$(jq --exit-status -r '.signOptions.signKeytab.principal' "${DATA_FILE}")
        KERBEROS_KEYTAB=$(jq --exit-status -r '.signOptions.signKeytab.name // "keytab"' "${DATA_FILE}")
        KERBEROS_KEYTAB_SECRET=$(jq --exit-status -r '.signOptions.signKeytab.secret' "${DATA_FILE}")
        SIGNING_ALIAS=$(jq --exit-status -r '.signOptions.signKeyAlias.key' "${DATA_FILE}")
        SKIP_UPLOAD_TO_PULP=$(jq --exit-status -r '.signOptions.skipUploadToPulp // "false"' "${DATA_FILE}")
        SERVICE_ACCOUNT=$(jq --exit-status -r \
            '.signOptions.signPipelineServiceAccount // "release-service-account"' "${DATA_FILE}")
        ARTIFACT_STORAGE_SECRET=$(jq --exit-status -r \
            '.signOptions.artifactStorageSecret // "signing-artifact-storage-preprod"' "${DATA_FILE}")

        SIGNING_PIPELINE_GIT_URL="$(params.signingRepo)"
        SIGNING_PIPELINE_GIT_REVISION="$(params.signingRevision)"

        # Prepare artifacts.json for signing pipeline
        echo "Preparing artifacts.json for signing pipeline..."
        # Use gzip compression to avoid ARG_MAX limit for large artifact lists
        ARTIFACT_JSON="$(gzip -c "${ARTIFACTS_JSON_FILE}" | base64 -w0)"
        echo "Artifact JSON size (compressed): $(echo -n "${ARTIFACT_JSON}" | wc -c) bytes"

        internal-request \
          --pipeline direct-rpm-signing \
          -p artifact_json="${ARTIFACT_JSON}" \
          -p oci_storage="$(params.ociStorage)" \
          -p kerberos_principal="${KERBEROS_PRINCIPAL}" \
          -p kerberos_keytab="${KERBEROS_KEYTAB}" \
          -p kerberos_keytab_secret="${KERBEROS_KEYTAB_SECRET}" \
          -p signing_alias="${SIGNING_ALIAS}" \
          -p artifact_storage_secret="${ARTIFACT_STORAGE_SECRET}" \
          -p destination_artifact_storage_domain="$(params.destinationArtifactStorageDomain)" \
          -p use_target_arch_repo="$(params.useTargetArchRepo)" \
          -p skip_upload_to_pulp="${SKIP_UPLOAD_TO_PULP}" \
          -p create_oci_artifact="$(params.createOciArtifact)" \
          -p oci_artifact_expires_after="$(params.ociArtifactExpiresAfter)" \
          -p requester="$(params.requester)" \
          -p force="false" \
          -p taskGitUrl="${SIGNING_PIPELINE_GIT_URL}" \
          -p taskGitRevision="${SIGNING_PIPELINE_GIT_REVISION}" \
          -l "${PIPELINERUN_LABEL}=$(context.pipelineRun.uid)" \
          -t "$(params.requestTimeout)" \
          --service-account "${SERVICE_ACCOUNT}" \
          --pipeline-timeout "$(params.pipelineTimeout)" \
          --task-timeout "$(params.taskTimeout)" \
          -s true | tee "${IR_FILE}"

        # Get the InternalRequest name and extract signed RPMs artifact
        internalRequest=$(awk -F\' '/created/ { print $2 }' "${IR_FILE}")
        echo "Internal request created: ${internalRequest}"

        results=$(kubectl get internalrequest "${internalRequest}" -o=jsonpath='{.status.results}')
        echo "Internal request results: ${results}"

        signedRpmsOciArtifact=$(jq -r '.signed_rpms_oci_artifact // ""' <<< "${results}")
        if [ -z "${signedRpmsOciArtifact}" ]; then
            echo "Error: signed_rpms_oci_artifact not found in InternalRequest results"
            exit 1
        fi
        echo "Signed RPMs OCI artifact: ${signedRpmsOciArtifact}"

        # Write signed RPMs OCI artifact to result
        echo -n "${signedRpmsOciArtifact}" > "$(results.signedRpmsOciArtifacts.path)"

        echo "RPM signing request completed"
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
          cpu: 250m
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
