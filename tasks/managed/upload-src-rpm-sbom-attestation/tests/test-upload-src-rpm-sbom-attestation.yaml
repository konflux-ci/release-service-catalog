---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-upload-src-rpm-sbom-attestation
spec:
  description: |
    Run the upload-src-rpm-sbom-attestation task with required parameters - a happy path scenario.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: HOME
              value: /var/workdir
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/lgallovi-test/release-service-utils:ubi10-test2
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot_spec.json" << EOF
              {
                "application": "rpms",
                "artifacts": {},
                "components": [
                  {
                    "containerImage": "quay.io/test/happypath@sha256:12345",
                    "name": "test",
                    "source": {
                      "git": {
                        "revision": "32c8f78c26e5831a87aa865ea80452fadbb3a95e",
                        "url": "https://gitlab.example.com/rpms/test"
                      }
                    },
                    "rpmsToPublish": [
                      {
                        "rpm": "hello-2.12.1-6.fc44.src.rpm",
                        "rpmname": "hello",
                        "arch": "src",
                        "epoch": "0",
                        "version": "2.12.1",
                        "release": "6.fc44",
                        "sha256": "abc123",
                        "targetRepos": [{"repository_id": "1", "repository_name": "source"}]
                      },
                      {
                        "rpm": "hello-2.12.1-6.fc44.x86_64.rpm",
                        "rpmname": "hello",
                        "arch": "x86_64",
                        "epoch": "0",
                        "version": "2.12.1",
                        "release": "6.fc44",
                        "sha256": "def456",
                        "targetRepos": [{"repository_id": "2", "repository_name": "x86_64"}]
                      }
                    ]
                  }
                ]
              }
              EOF

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/data.json" << EOF
              {
                "mapping": {
                  "rpm-repositories": []
                }
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: upload-src-rpm-sbom-attestation
      params:
        - name: snapshotPath
          value: "$(context.pipelineRun.uid)/snapshot_spec.json"
        - name: PULP_DOMAIN
          value: "mock"
        - name: PULP_SECRET_NAME
          value: "pulp-task-pulp-secret"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
          - name: dataDir
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/lgallovi-test/release-service-utils:ubi10-test2
            script: |
              #!/usr/bin/env bash
              set -eux

              ls -lR "$(params.dataDir)"

              # Verify cosign was called twice (SBOM and attestation)
              if [ ! -f "$(params.dataDir)/mock_cosign.txt" ]; then
                echo "Error: cosign was not called"
                exit 1
              fi
              cosign_calls=$(wc -l < "$(params.dataDir)/mock_cosign.txt")
              if [ "$cosign_calls" != 2 ]; then
                echo "Error: cosign was expected to be called 2 times. Actual: $cosign_calls"
                cat "$(params.dataDir)/mock_cosign.txt"
                exit 1
              fi

              # Verify pulp was called:
              # 1x file repository list + 2x file content list + 2x file content upload = 5
              pulp_calls=$(wc -l < "$(params.dataDir)/mock_pulp.txt")
              if [ "$pulp_calls" != 5 ]; then
                echo "Error: pulp was expected to be called 5 times. Actual: $pulp_calls"
                cat "$(params.dataDir)/mock_pulp.txt"
                exit 1
              fi

              # Verify file uploads were called (SBOM and attestation)
              file_upload_count=$(grep -c "file content upload" "$(params.dataDir)/mock_pulp.txt" || true)
              if [ "${file_upload_count:-0}" != 2 ]; then
                echo "Error: expected 2 file content uploads. Actual: $file_upload_count"
                cat "$(params.dataDir)/mock_pulp.txt"
                exit 1
              fi

              # Verify snapshot was updated with sbomPath and attestationPath
              snapshot="$(params.dataDir)/$(context.pipelineRun.uid)/snapshot_spec.json"
              sbom_path=$(jq -r '.components[0].rpmsToPublish[0].sbomPath // empty' "$snapshot")
              att_path=$(jq -r '.components[0].rpmsToPublish[0].attestationPath // empty' "$snapshot")

              if [ -z "$sbom_path" ]; then
                echo "Error: sbomPath not found in snapshot for source RPM"
                jq '.' "$snapshot"
                exit 1
              fi

              if [ -z "$att_path" ]; then
                echo "Error: attestationPath not found in snapshot for source RPM"
                jq '.' "$snapshot"
                exit 1
              fi

              # Verify non-source RPM does NOT have sbomPath or attestationPath
              x86_sbom=$(jq -r '.components[0].rpmsToPublish[1].sbomPath // empty' "$snapshot")
              x86_att=$(jq -r '.components[0].rpmsToPublish[1].attestationPath // empty' "$snapshot")

              if [ -n "$x86_sbom" ]; then
                echo "Error: x86_64 RPM should not have sbomPath"
                jq '.' "$snapshot"
                exit 1
              fi

              if [ -n "$x86_att" ]; then
                echo "Error: x86_64 RPM should not have attestationPath"
                jq '.' "$snapshot"
                exit 1
              fi

              echo "Test passed: SBOM and attestation uploaded successfully"
      runAfter:
        - run-task
