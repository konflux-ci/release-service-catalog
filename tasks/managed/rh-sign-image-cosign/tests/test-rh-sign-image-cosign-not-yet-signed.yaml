---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-rh-sign-image-cosign-not-yet-signed
spec:
  description: |
    Test the realistic "first time signing an image" case: "cosign verify" has
    nothing to find yet, so it genuinely fails (non-zero exit, no output) rather
    than succeeding with an empty result. Verify that this is correctly treated
    as "signature missing" and that the image gets signed, instead of being
    mistaken for a broken cosign tool.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:95f602cfb374c4798e4fbf3d298efe0218ac55308446d3f70f5df8add9675e83
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(params.dataDir)/$(context.pipelineRun.uid)"
              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/snapshot_spec.json" << EOF
              {
                "application": "myapp",
                "components": [
                  {
                    "name": "comp0",
                    "containerImage": "quay.io/redhat-user-workloads/test-product/test-image2@sha256:2222",
                    "repositories": [
                      {
                        "url": "quay.io/redhat-pending/test-product----test-image2",
                        "rh-registry-repo": "registry.stage.redhat.io/test-product/test-image2",
                        "tags": ["t1"]
                      }
                    ]
                  }
                ]
              }
              EOF

              # "cosign verify" genuinely fails (no signature exists yet: no
              # output, non-zero exit) - mock_cosign_verify_exit_codes is left empty.
              # "cosign sign" then succeeds.
              echo "0" >> "$(params.dataDir)/mock_cosign_sign_exit_codes"

              cat > "$(params.dataDir)/$(context.pipelineRun.uid)/signRegistryAccess.txt" << EOF
              test-product/test-image2
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: rh-sign-image-cosign
      params:
        - name: snapshotPath
          value: $(context.pipelineRun.uid)/snapshot_spec.json
        - name: secretName
          value: 'test-cosign-secret'
        - name: signRegistryAccessPath
          value: $(context.pipelineRun.uid)/signRegistryAccess.txt
        - name: retries
          value: "0"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
    - name: check-result
      params:
        - name: sourceDataArtifact
          value: "$(tasks.run-task.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
      taskSpec:
        params:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: use-trusted-artifact
            ref:
              name: use-trusted-artifact
            params:
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(params.sourceDataArtifact)
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils@sha256:95f602cfb374c4798e4fbf3d298efe0218ac55308446d3f70f5df8add9675e83
            script: |
              #!/usr/bin/env bash
              set -eux
              echo "check results"
              _TEST_PUB_REPO="registry.stage.redhat.io/test-product/test-image2"
              _TEST_REPO="quay.io/redhat-pending/test-product----test-image2"

              # the failed verify attempt must have been made
              CALLS=$(cat "$(params.dataDir)/mock_cosign_verify_calls")
              EXPECTED="verify --new-bundle-format=false --insecure-ignore-tlog=true \
              --key temp_key_file ${_TEST_REPO}@sha256:2222"
              if [ "$CALLS" != "$EXPECTED" ]; then
                echo "Diff:"
                diff <(echo "$EXPECTED") <(echo "$CALLS")
                exit 1
              fi

              # signing must still have happened, since the failed verify means
              # "no signature found", not "cosign is broken"
              CALLS=$(cat "$(params.dataDir)/mock_cosign_sign_calls")
              EXPECTED="-t 3m0s sign --new-bundle-format=false --tlog-upload=false \
              --key aws://arn:mykey --sign-container-identity \
              ${_TEST_PUB_REPO}:t1 ${_TEST_REPO}@sha256:2222"
              if [ "$CALLS" != "$EXPECTED" ]; then
                echo "Diff:"
                diff <(echo "$EXPECTED") <(echo "$CALLS")
                exit 1
              fi
      runAfter:
        - run-task
