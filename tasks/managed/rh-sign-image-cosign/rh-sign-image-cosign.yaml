---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rh-sign-image-cosign
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to sign container images in snapshot by cosign.
  params:
    - name: snapshotPath
      description: Path to the JSON string of the mapped Snapshot spec in the data workspace
      type: string
    - name: secretName
      description: Name of secret containing needed credentials
      type: string
    - name: signRegistryAccessPath
      type: string
      description: |
        The relative path in the workspace to a text file that contains a list of repositories
        that needs registry.access.redhat.com image references to be signed (i.e.
        requires_terms=true), one repository string per line, e.g. "rhtas/cosign-rhel9".
        If empty, no registry.access.redhat.com signatures will be created
      default: ""
    - name: signExternalRegistries
      type: string
      description: |
        When set to "true", sign images that don't have rh-registry-repo by using the repository
        url field directly. This is useful for signing images released to external registries
        like quay.io/konflux-ci. When "false" (default), only sign images with rh-registry-repo
      default: "false"
    - name: retries
      description: Retry cosign N times
      type: string
      default: "3"
    - name: concurrentLimit
      type: string
      default: 90
      description: The maximum number of concurrent cosign signing jobs
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - description: Produced trusted data artifact
      name: sourceDataArtifact
      type: string
  volumes:
    - name: workdir
      emptyDir: {}
    - name: secret-vol
      secret:
        secretName: $(params.secretName)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true

  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser:
        1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: sign-image
      image: quay.io/konflux-ci/release-service-utils@sha256:95f602cfb374c4798e4fbf3d298efe0218ac55308446d3f70f5df8add9675e83
      computeResources:
        limits:
          memory: 2.5Gi
        requests:
          memory: 2.5Gi
          cpu: "2"
      volumeMounts:
        - name: secret-vol
          mountPath: "/etc/secrets"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        AWS_DEFAULT_REGION="$(cat /etc/secrets/AWS_DEFAULT_REGION)"
        AWS_ACCESS_KEY_ID="$(cat /etc/secrets/AWS_ACCESS_KEY_ID)"
        AWS_SECRET_ACCESS_KEY="$(cat /etc/secrets/AWS_SECRET_ACCESS_KEY)"
        export AWS_DEFAULT_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY

        SIGN_KEY="$(cat /etc/secrets/SIGN_KEY)"
        REKOR_URL_PATH="/etc/secrets/REKOR_URL"
        if [ -f "${REKOR_URL_PATH}" ] && [ -s "${REKOR_URL_PATH}" ]; then
          REKOR_URL="$(cat /etc/secrets/REKOR_URL)"
        fi
        PUBLIC_KEY="$(cat /etc/secrets/PUBLIC_KEY)"
        REKOR_PUBLIC_KEY="$(cat /etc/secrets/REKOR_PUBLIC_KEY)"

        set -x

        SNAPSHOT_PATH=$(params.dataDir)/$(params.snapshotPath)
        COMPONENTS_LENGTH=$(jq '.components |length' "${SNAPSHOT_PATH}")

        # If signRegistryAccessPath is empty, use /dev/null
        # (no registry.access.redhat.com signatures will be created)
        if [ -z "$(params.signRegistryAccessPath)" ]; then
            SIGN_REGISTRY_ACCESS_FILE=/dev/null
            echo "signRegistryAccessPath is empty, no registry.access.redhat.com signatures will be created"
        else
            SIGN_REGISTRY_ACCESS_FILE=$(params.dataDir)/$(params.signRegistryAccessPath)
            if [ ! -f "${SIGN_REGISTRY_ACCESS_FILE}" ] ; then
                echo "No valid file was provided as signRegistryAccessPath."
                exit 1
            fi
        fi
        PUBLIC_KEY_FILE=$(mktemp)
        id
        pwd
        ls -ld /tekton/home
        echo -n "${PUBLIC_KEY:?}" > "$PUBLIC_KEY_FILE"
        ls -ld "$PUBLIC_KEY_FILE"

        # Initialize memory throttling
        # This file is located at utils/memory-throttle.sh in the release-service-utils image
        # shellcheck source=/dev/null
        source memory-throttle.sh
        # This function is stored in the utils/memory-throttle.sh file
        log_memory_throttle_status 80

        RUNNING_JOBS="\j" # Bash parameter for number of jobs currently running
        BURST_SIZE=5
        STABILIZATION_DELAY=2

        jobpid(){
            pid=$(cut -d' ' -f4 < /proc/self/stat)
            echo "$pid"
        }
        echopid(){
            pid=$(jobpid)
            # Written to stderr so it never leaks into a caller's $(...) capture,
            # e.g. run_cosign's stdout is captured as cosign's own JSON output.
            echo "${pid}: $*" >&2
        }
        run_cosign () { # Expected arguments are [digest_reference, tag_reference]
            attempt=0
            backoff1=2
            backoff2=3
            until [ "$attempt" -gt "$(params.retries)" ] ; do # 3 retries by default
                cosign3 "$@" && break
                sleep $backoff2

                # Fibbonaci backoff
                old_backoff1=$backoff1
                backoff1=$backoff2
                backoff2=$((old_backoff1 + backoff2))
                attempt=$((attempt+1))
            done
            if [ "$attempt" -gt "$(params.retries)" ] ; then
              echopid "Max retries exceeded."
              exit 1
            fi
        }
        function check_missing_signatures() {
          local identities="$1"
          local reference="$2"
          local digest="$3"
          declare -a COSIGN_REKOR_ARGS=()
          if [ -v REKOR_URL ]; then
              COSIGN_REKOR_ARGS+=("--rekor-url=$REKOR_URL")
              REKOR_PUBLIC_KEY_FILE=$(mktemp)
              echo -n "$REKOR_PUBLIC_KEY" > "$REKOR_PUBLIC_KEY_FILE"
              export SIGSTORE_REKOR_PUBLIC_KEY="$REKOR_PUBLIC_KEY_FILE"
          else
              COSIGN_REKOR_ARGS+=("--insecure-ignore-tlog=true")
          fi
          found_sigs_file=$(mktemp --suffix sigs)
          expected_sigs_file=$(mktemp --suffix sigs)
          verify_output=$(run_cosign verify --new-bundle-format=false \
                          "${COSIGN_REKOR_ARGS[@]}" --key "$PUBLIC_KEY_FILE" "$reference")
          if [ -z "$verify_output" ]; then
            verify_output="[]"
          fi
          if ! found_sigs=$(echo "$verify_output" | jq --argjson identities "$identities" -j '['\
        '.[]|select(.critical.image."docker-manifest-digest"| contains("'"$digest"'"))'\
        '|select(.critical.identity."docker-reference" as $reference | $identities | index($reference))'\
        ']|[.[]|{identity:.critical.identity."docker-reference",'\
        'manifest_digest:.critical.image."docker-manifest-digest"}]'); then
            echopid "ERROR: cosign verify output for ${reference} was not valid JSON: ${verify_output}"
            exit 1
          fi

          echo "$found_sigs" > "$found_sigs_file"
          if ! expected_sigs=$(echo "$identities" |
          jq --arg digest "$digest" -j '[.[]|'\
        '{identity: ., manifest_digest: $digest}]'); then
            echopid "ERROR: failed to build expected signatures list for ${digest}"
            exit 1
          fi

          echo "$expected_sigs" > "$expected_sigs_file"

          if ! missing_signatures=$(jq -s '.[0] - .[1]' "$expected_sigs_file" "$found_sigs_file"); then
            echopid "ERROR: failed to compute missing signatures for ${digest}"
            exit 1
          fi
          echo "$missing_signatures"
        }
        function check_and_sign() {
          local identities=$1
          local reference=$2
          local digest=$3
          local tag=$4

          # cosign has very limited support for selecting the right auth entry,
          # so create a custom auth file with just one entry.
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          select-oci-auth "${reference}" > "${DOCKER_CONFIG}/config.json"
          identities_with_tag=$(jq --arg tag "$tag" -R -s \
                                '[gsub("\r?\n"; "")|split(",")|.[]|.+":"+$tag]' <<< "$identities")

          declare -a COSIGN_REKOR_ARGS=()
          missing_signatures=$(check_missing_signatures "$identities_with_tag" "$reference@$digest" "$digest")

          if [ -v REKOR_URL ]; then
              # --use-signing-config defaults to true and conflicts with an explicit
              # --rekor-url ("cannot specify service URLs and use signing config")
              COSIGN_REKOR_ARGS+=("-y" "--rekor-url=$REKOR_URL" "--use-signing-config=false")
              REKOR_PUBLIC_KEY_FILE=$(mktemp)
              echo -n "$REKOR_PUBLIC_KEY" > "$REKOR_PUBLIC_KEY_FILE"
              export SIGSTORE_REKOR_PUBLIC_KEY="$REKOR_PUBLIC_KEY_FILE"
          else
              COSIGN_REKOR_ARGS+=("--tlog-upload=false")
          fi
          identities_args=""
          for missing in $(echo "$missing_signatures" | jq -rc '.[]|.identity'); do
            identities_args="${missing},${identities_args}"
          done
          if [ "${identities_args}" != "" ]; then
            run_cosign -t 3m0s sign --new-bundle-format=false "${COSIGN_REKOR_ARGS[@]}" \
              --key "$SIGN_KEY" \
              --sign-container-identity "${identities_args::-1}" \
              "$reference@$digest"
          else
            echopid "Skip signing (${digest})"
          fi
        }

        declare -a to_sign=()
        for (( COMPONENTS_INDEX=0; COMPONENTS_INDEX<COMPONENTS_LENGTH; COMPONENTS_INDEX++ )); do
            COMPONENT_NAME=$(jq -r ".components[${COMPONENTS_INDEX}].name" "${SNAPSHOT_PATH}")
            echo "Processing component ${COMPONENT_NAME}"

            COMPONENT=$(jq -c ".components[${COMPONENTS_INDEX}]" "${SNAPSHOT_PATH}")

            # Check if image is manifest list
            BUILD_CONTAINER_IMAGE=$(jq -r ".components[${COMPONENTS_INDEX}].containerImage" "${SNAPSHOT_PATH}")
            DIGEST="${BUILD_CONTAINER_IMAGE/*@}"
            LIST=0
            MANIFEST_DIGESTS=""

            # First, try to get imageDigests from the snapshot
            # (avoids calling skopeo on inaccessible registries, like IIB)
            IMAGE_DIGESTS=$(jq -c ".components[${COMPONENTS_INDEX}].imageDigests // []" "${SNAPSHOT_PATH}")
            IMAGE_DIGESTS_LENGTH=$(jq 'length' <<< "$IMAGE_DIGESTS")

            if [ "$IMAGE_DIGESTS_LENGTH" -gt 0 ]; then
              # imageDigests available - use them (IIB always produces multi-arch manifest lists)
              LIST=1
              MANIFEST_DIGESTS=$(jq -r '.[]' <<< "$IMAGE_DIGESTS")
            else
              IMAGE=$(skopeo inspect --raw "docker://${BUILD_CONTAINER_IMAGE}")
              MEDIA_TYPE=$(echo "$IMAGE" | jq -r '.mediaType')
              if [ "$MEDIA_TYPE" = "application/vnd.docker.distribution.manifest.list.v2+json" ]; then LIST=1; fi
              if [ "$MEDIA_TYPE" = "application/vnd.oci.image.index.v1+json" ]; then LIST=1; fi
              if [ $LIST -eq 1 ]; then
                MANIFEST_DIGESTS=$(echo "$IMAGE" | jq -r '.manifests[]|.digest')
              fi
            fi

            # Process repositories array (apply-mapping guarantees this exists)
            NUM_REPOSITORIES=$(jq '.repositories | length' <<< "$COMPONENT")
            for (( i = 0; i < NUM_REPOSITORIES; i++ )); do
                REPOSITORY_OBJECT=$(jq -c ".repositories[${i}]" <<< "$COMPONENT")

                # Get repository URL and use it as INTERNAL_CONTAINER_REF
                INTERNAL_CONTAINER_REF=$(jq -r '.url' <<< "$REPOSITORY_OBJECT")
                rh_registry_repo=$(jq -r '."rh-registry-repo" // empty' <<< "$REPOSITORY_OBJECT")
                registry_access_repo=$(jq -r '."registry-access-repo" // empty' <<< "$REPOSITORY_OBJECT")

                # Get tags from repository object
                REPO_TAGS=$(jq -r '.tags[]? // empty' <<< "$REPOSITORY_OBJECT")
                if [ -z "$REPO_TAGS" ]; then
                    echo "No tags found for repository ${INTERNAL_CONTAINER_REF}, skipping signing"
                    continue
                fi

                # Determine which registry references to sign based on rh-registry-repo presence
                # and signExternalRegistries parameter
                declare -a REGISTRY_REFERENCES=()
                if [ "$rh_registry_repo" != "" ] && [ "$rh_registry_repo" != "null" ]; then
                    # Sign rh-registry-repo references (always) and registry-access-repo references
                    # (only if signatures for this registry are required)
                    repository="${rh_registry_repo#*/}"
                    REGISTRY_REFERENCES=("${rh_registry_repo}")
                    if [ "$registry_access_repo" != "" ] && [ "$registry_access_repo" != "null" ] && \
                       grep -q "^${repository}$" "${SIGN_REGISTRY_ACCESS_FILE}"; then
                        REGISTRY_REFERENCES+=("${registry_access_repo}")
                    fi
                elif [ "$(params.signExternalRegistries)" = "true" ]; then
                    # When signExternalRegistries is enabled and no rh-registry-repo is present,
                    # sign using the repository url directly (for external registries like quay.io)
                    echo "Signing external registry image: ${INTERNAL_CONTAINER_REF}"
                    REGISTRY_REFERENCES=("${INTERNAL_CONTAINER_REF}")
                else
                    echo "No rh-registry-repo found for repository ${INTERNAL_CONTAINER_REF}, skipping signing"
                    continue
                fi

                # Collect data for signing
                # Sign each manifest in the manifest list
                if [ $LIST -eq 1 ]; then
                    for MDIGEST in $MANIFEST_DIGESTS; do
                        for TAG in $REPO_TAGS; do
                            registry_refs=""
                            for REGISTRY_REF in "${REGISTRY_REFERENCES[@]}"; do
                              registry_refs="${REGISTRY_REF},${registry_refs}"
                            done
                            registry_refs="${registry_refs::-1}"
                            to_sign+=("${registry_refs}#${MDIGEST}#${INTERNAL_CONTAINER_REF}#${TAG}")
                        done
                    done
                fi
                # Sign manifest list itself or manifest if it's not list
                for TAG in $REPO_TAGS; do
                    registry_refs=""
                    for REGISTRY_REF in "${REGISTRY_REFERENCES[@]}"; do
                      registry_refs="${REGISTRY_REF},${registry_refs}"
                    done
                    registry_refs="${registry_refs::-1}"
                    to_sign+=("${registry_refs}#${DIGEST}#${INTERNAL_CONTAINER_REF}#${TAG}")
                done
            done
        done
        spawn_count=0
        echo "${to_sign[@]}" | python3 -c "
        import sys
        from itertools import zip_longest
        digest_groups = {}
        data = sys.stdin.read().strip()
        if not data:
          raise SystemExit(0)
        # Make groups based on reference + digest to avoid signing same digest in parallel
        # #
        for x in data.split(' '):
          public_refs, digest, internal_ref, tag = x.split('#')
          digest_groups.setdefault(internal_ref+'@'+digest, []).append(
            (internal_ref, public_refs, digest, tag)
          )
        for to_yield in zip_longest(*digest_groups.values()):
          for entry in filter(None, to_yield):
            print(' '.join(entry))
          print('---') # group separator
        " | {
          SUCCESS=true
          while read -r ENTRY; do
            if [ "$ENTRY" = "---" ]; then
              echo "... waiting for group to be signed ..."
              # wait for group to finish
              while (( ${RUNNING_JOBS@P} > 0 )); do
                wait -n || SUCCESS=false
              done
              spawn_count=0
              continue
            fi
            INTERNAL_REF=$(echo "$ENTRY" | cut -d' ' -f1)
            PUBLIC_REFS=$(echo "$ENTRY" | cut -d' ' -f2)
            DIGEST=$(echo "$ENTRY" | cut -d' ' -f3)
            TAG=$(echo "$ENTRY" | cut -d' ' -f4)
            # This function is stored in the utils/memory-throttle.sh file
            # Wait for memory and concurrent limit
            wait_for_memory 80
            while (( ${RUNNING_JOBS@P} >= $(params.concurrentLimit) )); do
              wait -n || SUCCESS=false
            done
            check_and_sign "${PUBLIC_REFS}" "${INTERNAL_REF}" "${DIGEST}" "${TAG}" &
            spawn_count=$((spawn_count + 1))

            # Allow memory usage to stabilize every BURST_SIZE spawns.
            if (( spawn_count % BURST_SIZE == 0 )); then
              sleep $STABILIZATION_DELAY
            fi
          done
          if [ "$SUCCESS" != true ]; then
            echo "ERROR: One or more signing jobs failed"
            exit 1
          fi
        }
        # Note: The pipe runs the while loop in a subshell, but every group ends with "---"
        # which waits for all jobs in that group, so no jobs remain when the subshell exits.
        echo "done"
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
