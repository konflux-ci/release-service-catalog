---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-update-infra-deployments
spec:
  description: |
    Run the update-infra-deployments task with snapshot and data files, apply a
    mocked infra update script, and open or refresh the GitHub pull request.
  params:
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: "--insecure"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable.
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
  tasks:
    - name: setup
      taskSpec:
        results:
          - name: sourceDataArtifact
            type: string
        volumes:
          - name: workdir
            emptyDir: {}
        stepTemplate:
          volumeMounts:
            - mountPath: /var/workdir
              name: workdir
          env:
            - name: IMAGE_EXPIRES_AFTER
              value: $(params.ociArtifactExpiresAfter)
            - name: "ORAS_OPTIONS"
              value: "$(params.orasOptions)"
            - name: "DEBUG"
              value: "$(params.trustedArtifactsDebug)"
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils@sha256:6979552f11f042b8730abcb1be4ec6cfb0553a069cc352643f88d8996041abf8
            script: |
              #!/usr/bin/env bash
              set -eux

              uid_dir="$(params.dataDir)/$(context.pipelineRun.uid)"
              mkdir -p "${uid_dir}"

              cat > "${uid_dir}/snapshot.json" << 'EOF'
              {
                "application": "myapp",
                "components": [
                  {
                    "name": "my-app",
                    "containerImage": "quay.io/org/img@sha256:abc",
                    "source": {
                      "git": {
                        "revision": "abc123def456",
                        "url": "https://github.com/org/my-app.git"
                      }
                    }
                  }
                ]
              }
              EOF

              cat > "${uid_dir}/data.json" << 'EOF'
              {
                "targetGHRepo": "test-org/infra-deployments",
                "githubAppID": "12345",
                "githubAppInstallationID": "67890",
                "infra-deployment-update-script": "sed -i 's/old-revision-sha/abc123def456/' config/deployment.yaml\n"
              }
              EOF
          - name: create-trusted-artifact
            ref:
              name: create-trusted-artifact
            params:
              - name: ociStorage
                value: $(params.ociStorage)
              - name: workDir
                value: $(params.dataDir)
              - name: sourceDataArtifact
                value: $(results.sourceDataArtifact.path)
    - name: run-task
      taskRef:
        name: update-infra-deployments
      params:
        - name: snapshotPath
          value: $(context.pipelineRun.uid)/snapshot.json
        - name: dataJsonPath
          value: $(context.pipelineRun.uid)/data.json
        - name: ociStorage
          value: $(params.ociStorage)
        - name: orasOptions
          value: $(params.orasOptions)
        - name: sourceDataArtifact
          value: "$(tasks.setup.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: $(params.trustedArtifactsDebug)
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
      runAfter:
        - setup
