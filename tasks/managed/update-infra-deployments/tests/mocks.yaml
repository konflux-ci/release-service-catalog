---
# Declarative mocks for Tekton tests of this task (Python entrypoint). Rendered
# by .github/scripts/render_python_task_mocks_from_yaml.py when
# test_tekton_tasks.sh runs.
version: 1
services:
  - type: http_json
    bind: 127.0.0.1
    port: 8080
    mock_server_for_env_var: GITHUB_API_URL
    mock_server_api_path: ""
    routes:
      - path_contains: /access_tokens
        body: '{"token": "mock-github-token"}'
      - path_suffix: /pulls/1
        body: '{"body": "Included PRs:\n- https://github.com/org/my-app/pull/99"}'
      - path_contains: /compare/
        body: >-
          {"commits": [{"sha": "bbbbbbbcccccccdddddddeeeeeeeeffffffff001",
          "html_url": "https://github.com/org/my-app/commit/bbbbbbb",
          "commit": {"message": "feat: demo\n\nbody", "author": {"name": "Dev"}},
          "author": {"login": "devuser"}}]}
      - path_contains: /search/issues
        body: >-
          {"items": [{"pull_request":
          {"html_url": "https://github.com/org/my-app/pull/99"}}]}
      - path_contains: /pulls
        body: >-
          {"url": "/repos/test-org/infra-deployments/pulls/1",
          "body": "Included PRs:"}
