---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-fbc-parameters
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Task to prepare FBC parameters from all fragments with comprehensive validation.

    Includes package validation, version consistency checking, opt-in status collection,
    and strategy-aware publishing decisions (hotfix, staging, etc.).

    Expects each component in the snapshot to have an ocpVersion field (e.g., "v4.14"),
    which is automatically attached by the filter-published-fbc-images task.
  params:
    - name: snapshotPath
      description: Path to the JSON string of the mapped Snapshot spec in the data workspace
      type: string
    - name: dataPath
      description: Path to the JSON string of the merged data to use in the data workspace
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: pyxisSecret
      description: Name of secret which contains the required credentials for authentication to pyxis
      type: string
    - name: pyxisServer
      description: Pyxis server to use
      type: string
      default: production
    - name: maxRetries
      description: Maximum number of retry attempts for failed internal requests
      type: string
      default: "3"
    - name: retryDelaySeconds
      description: Delay between retry attempts in seconds
      type: string
      default: "30"
    - name: pipelineRunUid
      type: string
      description: The uid of the current pipelineRun. It is only available at the pipeline level
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: fbcOptIn
      type: string
      description: Whether components have opted into FBC fragment-based catalog publishing
    - name: validationPassed
      type: string
      description: Whether validation checks passed successfully
    - name: mustPublishIndexImage
      type: string
      description: Whether the index image should be published (strategy-aware decision)
    - name: mustSignIndexImage
      type: string
      description: Whether the index image should be signed (strategy-aware decision)
    - name: mustOverwriteFromIndexImage
      type: string
      description: Whether to overwrite the from index image (based on opt-in status)
    - name: iibServiceAccountSecret
      type: string
      description: IIB service account secret name (environment-aware)
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    securityContext:
      runAsUser: 1001
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: collect-parameters
      image: quay.io/konflux-ci/release-service-utils@sha256:0faf6492943a05ad89a450667c08c614bf9f36bca25e0b6eac025e7beed27bbe
      computeResources:
        limits:
          memory: 3Gi
        requests:
          memory: 3Gi
          cpu: '1'
      command: ["python3"]
      args:
        - "-u"
        - "/home/src/tasks/managed/prepare_fbc_parameters/prepare_fbc_parameters.py"
      env:
        - name: PARAM_SNAPSHOT_PATH
          value: "$(params.snapshotPath)"
        - name: PARAM_DATA_PATH
          value: "$(params.dataPath)"
        - name: PARAM_DATA_DIR
          value: "$(params.dataDir)"
        - name: PARAM_PYXIS_SERVER
          value: "$(params.pyxisServer)"
        - name: TASK_GIT_URL
          value: "$(params.taskGitUrl)"
        - name: TASK_GIT_REVISION
          value: "$(params.taskGitRevision)"
        - name: PIPELINE_RUN_UID
          value: "$(params.pipelineRunUid)"
        - name: TASK_RUN_UID
          value: "$(context.taskRun.uid)"
        - name: RESULT_FBC_OPT_IN
          value: "$(results.fbcOptIn.path)"
        - name: RESULT_VALIDATION_PASSED
          value: "$(results.validationPassed.path)"
        - name: RESULT_MUST_PUBLISH_INDEX_IMAGE
          value: "$(results.mustPublishIndexImage.path)"
        - name: RESULT_MUST_SIGN_INDEX_IMAGE
          value: "$(results.mustSignIndexImage.path)"
        - name: RESULT_MUST_OVERWRITE_FROM_INDEX_IMAGE
          value: "$(results.mustOverwriteFromIndexImage.path)"
        - name: RESULT_IIB_SERVICE_ACCOUNT_SECRET
          value: "$(results.iibServiceAccountSecret.path)"
