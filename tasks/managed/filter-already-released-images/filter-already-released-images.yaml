---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: filter-already-released-images
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to filter out images from a snapshot that have already been released.
    This task checks target registries to determine if push-snapshot has completed successfully
    for each component by validating that ALL required tags exist with the correct digest.
    Components that are fully released (all tags present) are filtered out before conforma validation.

    Tag-level validation ensures complete releases and prevents filtering components with
    partial tag pushes. A component is only filtered if ALL repositories have ALL
    required tags pointing to the correct digest.

    The task overwrites the original snapshot file in place with a filtered version
    containing only unpublished or partially published images.

    This task must run AFTER apply-mapping since it needs the mapped target repositories
    and their required tags from the enriched snapshot stored in trusted artifacts
  params:
    - name: snapshotPath
      description: Path to the JSON string of the Snapshot spec in the data workspace
      type: string
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: ociArtifactExpiresAfter
      description: |-
        Expiration date for the trusted artifacts created in the OCI repository.
        An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks to be used are stored
      default: https://github.com/konflux-ci/release-service-catalog.git
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
    - name: caCertPath
      type: string
      description: Path to CA certificate bundle for TLS verification with self-signed certificates
      default: /mnt/trusted-ca/ca-bundle.crt
  results:
    - name: skip_release
      description: Whether to skip release tasks (true if all components are already released)
    - name: sourceDataArtifact
      description: The location of the source data artifact in the OCI repository
  volumes:
    - name: workdir
      emptyDir: {}
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
        - name: caCertPath
          value: $(params.caCertPath)
    - name: filter-already-released-images
      image: quay.io/konflux-ci/release-service-utils@sha256:83fefd72e54d3b87017a12dbe483db52ad1c692e1aec9ab042c1382a0c41e550
      computeResources:
        limits:
          memory: 1536Mi
        requests:
          memory: 1536Mi
          cpu: 300m
      env:
        - name: RESULT_SKIP_RELEASE
          value: "$(results.skip_release.path)"
        - name: CA_CERT_PATH
          value: "$(params.caCertPath)"
      command: ["/home/scripts/python/tasks/managed/filter_already_released_images.py"]
      args: ["--snapshot-path", "$(params.dataDir)/$(params.snapshotPath)"]
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
        - name: caCertPath
          value: $(params.caCertPath)
