---
version: 1
services:
  - type: http_json
    port: 8443
    bind: 127.0.0.1
    tls: true
    hostname: "127.0.0.1"
    routes:
      - path_contains: /rest/api/2/issue/ISSUE-123
        body: '{"fields": {"security": null, "issuetype": {"name": "Bug"}}}'
      - path_contains: /rest/api/2/issue/
        body: '{"fields": {"security": null, "issuetype": {"name": "Bug"}}}'
    mock_server_for_env_var: JIRA_BASE_URL
    mock_server_api_path: ""
    rewrite_ca_cert_env:
      env_var: REQUESTS_CA_BUNDLE
