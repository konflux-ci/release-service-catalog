---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-oot-kmods-to-s3
spec:
  description: >-
    Task to upload out-of-tree kernel modules to an S3 bucket
  params:
    - name: signedKmodsPath
      type: string
      description: Path where the kernel modules are stored relative to the dataDir
    - name: dataDir
      type: string
      description: The absolute path to the working directory
      default: /var/workdir/release
    - name: s3Endpoint
      type: string
      description: The S3 endpoint URL
    - name: s3Bucket
      type: string
      description: The name of the destination S3 bucket
    - name: s3CredentialsSecret
      type: string
      description: The name of the Kubernetes secret containing S3 credentials
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: taskGitUrl
      type: string
      description: The git repository URL for task and StepAction resolution
      default: https://github.com/konflux-ci/release-service-catalog.git
    - name: taskGitRevision
      type: string
      description: The git revision for task and StepAction resolution
      default: main
  volumes:
    - name: workdir
      emptyDir: {}
    - name: s3-credentials-vol
      secret:
        secretName: $(params.s3CredentialsSecret)
  stepTemplate:
    securityContext:
      runAsUser: 1001
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
    env:
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: push-oot-kmods-to-s3
      image: quay.io/lgallovi-test/release-service-utils@sha256:5b716f013dc7c08bfe68da69f8e730bf9870ec9469a957b7b2e9cbe0d138edd8
      computeResources:
        limits:
          memory: 768Mi
        requests:
          memory: 768Mi
          cpu: 400m
      volumeMounts:
        - name: s3-credentials-vol
          mountPath: /var/secrets/s3
          readOnly: true
      env:
        - name: PARAM_DATA_DIR
          value: $(params.dataDir)
        - name: PARAM_SIGNED_KMODS_PATH
          value: $(params.signedKmodsPath)
        - name: PARAM_S3_ENDPOINT
          value: $(params.s3Endpoint)
        - name: PARAM_S3_BUCKET
          value: $(params.s3Bucket)
        - name: PARAM_S3_CREDENTIALS_MOUNT
          value: /var/secrets/s3
      command: ["python3", "-m", "release_service_utils.tasks.managed.push_oot_kmods_to_s3"]
