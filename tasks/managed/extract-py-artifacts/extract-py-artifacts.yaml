---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: extract-py-artifacts
spec:
  description: |
    Extract Python packages from OCI artifacts for signing and upload.
    Parses wheel SBOMs for pkg:pypi PURLs, populates releaseNotes.content.artifacts,
    and ensures mapping.components entries have contentType set to "generic" for
    downstream advisory creation. Also verifies and retrieves Tekton Chains SLSA
    provenance using cosign with the public key from k8s://openshift-pipelines/public-key.
    The pipeline service account must have get access to this secret
  params:
    - name: SNAPSHOT_PATH
      type: string
      description: Path to the snapshot spec file containing image information
    - name: sourceDataArtifact
      type: string
      description: Trusted Artifact to use to obtain the Snapshot
    - name: dataDir
      type: string
      description: The location where data will be stored
      default: /var/workdir
    - name: filesDir
      type: string
      description: The relative path within dataDir where files will be extracted
      default: files
    - name: ociStorage
      type: string
      description: The OCI repository where the Trusted Artifacts are stored
    - name: ociArtifactExpiresAfter
      type: string
      description: Expiration date for the trusted artifacts created
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: dataPath
      type: string
      description: Path to data.json relative to dataDir
  results:
    - name: sourceDataArtifact
      description: Produced trusted data artifact
      type: string
  volumes:
    - name: workdir
      emptyDir: {}
  stepTemplate:
    securityContext:
      runAsUser: 1001
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 10m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: extract-py-artifacts
      image: quay.io/konflux-ci/release-service-utils@sha256:17e594729947b9313ce32c9dc0ec10a12f29407fb1360c7706a317af85972b8e
      computeResources:
        limits:
          memory: 512Mi
          cpu: 200m
        requests:
          memory: 512Mi
          cpu: 200m
      env:
        - name: PARAM_DATA_DIR
          value: $(params.dataDir)
        - name: PARAM_SNAPSHOT_PATH
          value: $(params.SNAPSHOT_PATH)
        - name: PARAM_DATA_PATH
          value: $(params.dataPath)
        - name: PARAM_FILES_DIR
          value: $(params.filesDir)
      command: ["python3", "-m", "release_service_utils.tasks.managed.extract_py_artifacts"]
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
