---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: extract-py-artifacts
spec:
  description: |
    Extract Python packages from OCI artifacts for signing and upload.
    The populate-release-notes step parses wheel SBOMs for pkg:pypi PURLs,
    populates releaseNotes.content.artifacts, and ensures mapping.components
    entries have contentType set to "generic" for downstream advisory creation.
    The fetch-chains-provenance step verifies and retrieves Tekton Chains SLSA provenance
    using cosign with the public key from k8s://openshift-pipelines/public-key.
    The pipeline service account must have get access to this secret
  params:
    - name: SNAPSHOT_PATH
      type: string
      description: Path to the snapshot spec file containing image information
    - name: sourceDataArtifact
      type: string
      description: Trusted Artifact to use to obtain the Snapshot
    - name: dataDir
      type: string
      description: The location where data will be stored
      default: /var/workdir
    - name: filesDir
      type: string
      description: The relative path within dataDir where files will be extracted
      default: files
    - name: ociStorage
      type: string
      description: The OCI repository where the Trusted Artifacts are stored
    - name: ociArtifactExpiresAfter
      type: string
      description: Expiration date for the trusted artifacts created
      default: "1d"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: dataPath
      type: string
      description: Path to data.json relative to dataDir
  results:
    - name: sourceDataArtifact
      description: Produced trusted data artifact
      type: string
  volumes:
    - name: workdir
      emptyDir: {}
  stepTemplate:
    securityContext:
      runAsUser: 1001
    env:
      - name: SNAPSHOT_PATH
        value: $(params.SNAPSHOT_PATH)
      - name: IMAGES_TXT
        value: $(params.dataDir)/images.txt
      - name: FILES_DIR
        value: $(params.dataDir)/$(params.filesDir)
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: TRUSTED_ARTIFACTS_EXTRACT_DIR
        value: $(params.dataDir)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
  steps:
    - name: prepare-workdir
      image: quay.io/lgallovi-test/release-service-utils:ubi10-test2
      computeResources:
        limits:
          memory: 32Mi
        requests:
          memory: 32Mi
          cpu: 10m
      command:
        - mkdir
        - -p
        - $(params.dataDir)
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 10m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: get-image-urls
      image: quay.io/konflux-ci/buildah-task:latest@sha256:b82d465a06c926882d02b721cf8a8476048711332749f39926a01089cf85a3f9
      computeResources:
        limits:
          memory: 64Mi
        requests:
          memory: 64Mi
          cpu: 10m
      script: |
        #!/bin/bash
        set -euo pipefail

        < "${TRUSTED_ARTIFACTS_EXTRACT_DIR}/${SNAPSHOT_PATH}" jq -r '.components[].containerImage' | tee "${IMAGES_TXT}"

    - name: extract-artifacts
      image: quay.io/konflux-ci/oras:latest@sha256:1beeecce012c99794568f74265c065839f9703d28306a8430b667f639343a98b
      computeResources:
        limits:
          memory: 256Mi
        requests:
          memory: 256Mi
          cpu: 100m
      script: |
        #!/bin/bash
        set -euo pipefail

        AUTHFILE='/tmp/auth.json'
        mkdir -p "${FILES_DIR}"
        while read -r IMAGE; do
          echo "Processing ${IMAGE}"
          select-oci-auth "${IMAGE}" > "${AUTHFILE}"
          retry oras pull --registry-config "${AUTHFILE}" "${IMAGE}" -o "${FILES_DIR}"
        done < "${IMAGES_TXT}"

        echo "Extracted files:"
        ls -la "${FILES_DIR}"

    - name: populate-release-notes
      image: quay.io/lgallovi-test/release-service-utils:ubi10-test2
      computeResources:
        limits:
          memory: 256Mi
        requests:
          memory: 256Mi
          cpu: 100m
      script: |
        #!/bin/bash
        set -euo pipefail

        DATA_FILE="$(params.dataDir)/$(params.dataPath)"

        parse_wheel_platform() {
          local platform="$1"

          if [[ "$platform" == "any" || "$platform" == "none" ]]; then
            echo "noarch any"
            return
          fi

          # Extract arch from platform tag (last underscore-separated segment)
          local arch="${platform##*_}"

          # Derive OS from platform prefix
          local os="any"
          if [[ "$platform" == manylinux* || "$platform" == musllinux* || "$platform" == linux* ]]; then
            os="linux"
          elif [[ "$platform" == macosx* ]]; then
            os="macos"
          elif [[ "$platform" == win* ]]; then
            os="windows"
          fi

          echo "$arch $os"
        }

        # Collect artifact entries as JSON lines for later deduplication
        ARTIFACTS_JSONL=$(mktemp)

        for whl in "${FILES_DIR}"/*.whl; do
          [ -f "$whl" ] || continue
          filename=$(basename "$whl")
          echo "Processing wheel: $filename"

          # Parse PEP 427 filename: {name}-{version}(-{build})?-{python}-{abi}-{platform}.whl
          stem="${filename%.whl}"
          IFS='-' read -ra parts <<< "$stem"
          num_parts=${#parts[@]}

          if [[ $num_parts -lt 5 || $num_parts -gt 6 ]]; then
            echo "ERROR: Cannot parse wheel filename: $filename"
            exit 1
          fi

          name="${parts[0]}"
          version="${parts[1]}"
          platform="${parts[$((num_parts - 1))]}"

          # Extract SBOM from wheel zip
          dist_info="${name}-${version}.dist-info"
          sbom_path="${dist_info}/sboms/redhat.spdx.json"
          echo "  Extracting SBOM: $sbom_path"
          sbom_json=$(unzip -p "$whl" "$sbom_path" 2>/dev/null) || {
            echo "ERROR: SBOM not found in wheel: $sbom_path"
            exit 1
          }

          # Find pkg:pypi PURL from SPDX SBOM
          purl=$(jq -r '
            [.packages[]?.externalRefs[]?
              | select(.referenceType == "purl")
              | .referenceLocator
              | select(startswith("pkg:pypi/"))] | first // empty
          ' <<< "$sbom_json")

          if [[ -z "$purl" ]]; then
            echo "ERROR: No pkg:pypi PURL found in SBOM for wheel: $filename"
            exit 1
          fi
          echo "  Found PURL: $purl"

          # Parse platform tag
          read -r arch os <<< "$(parse_wheel_platform "$platform")"
          echo "  Platform: $platform -> arch=$arch, os=$os"

          # Build artifact entry as JSON line
          jq -nc \
            --arg component "$name" \
            --arg purl "$purl" \
            --arg architecture "$arch" \
            --arg os "$os" \
            '{component: $component, purl: $purl, architecture: $architecture, os: $os}' \
            >> "$ARTIFACTS_JSONL"
        done

        # Deduplicate by (name, version, architecture, os).
        # Since purl encodes name@version, deduplicating by (component, purl, arch, os) is equivalent.
        DEDUPED=$(jq -sc '
          group_by(.component + "|" + .purl + "|" + .architecture + "|" + .os)
          | map(.[0])
        ' "$ARTIFACTS_JSONL")
        rm -f "$ARTIFACTS_JSONL"

        ARTIFACT_COUNT=$(jq 'length' <<< "$DEDUPED")
        if [[ "$ARTIFACT_COUNT" -eq 0 ]]; then
          echo "ERROR: No .whl files found in ${FILES_DIR}"
          exit 1
        fi
        echo "Adding $ARTIFACT_COUNT artifact(s) to releaseNotes.content.artifacts"

        # Append entries to .releaseNotes.content.artifacts[] in data.json
        TMP_DATA=$(mktemp)
        jq --argjson artifacts "$DEDUPED" '
          .releaseNotes.content.artifacts = (.releaseNotes.content.artifacts // []) + $artifacts
        ' "$DATA_FILE" > "$TMP_DATA" && mv "$TMP_DATA" "$DATA_FILE"

        # Ensure mapping.components[] includes each artifact component with contentType
        COMPONENT_NAMES=$(jq -r '[.[].component] | unique | .[]' <<< "$DEDUPED")
        MAPPING_ENTRIES="[]"
        while IFS= read -r comp; do
          MAPPING_ENTRIES=$(jq -c --arg name "$comp" \
            '. + [{name: $name, contentType: "generic"}]' \
            <<< "$MAPPING_ENTRIES")
        done <<< "$COMPONENT_NAMES"
        jq --argjson new_comps "$MAPPING_ENTRIES" '
          ($new_comps | map(.name)) as $names |
          (.mapping.components // []) as $existing |
          ($existing | map(.name)) as $existing_names |
          .mapping.components = [
            $existing[] |
            if (.name as $n | $names | index($n))
               and ((.contentGateway?.contentType //
                     .contentType // "") == "")
            then . + {contentType: "generic"}
            else . end
          ] + [
            $new_comps[]
            | select(.name as $n |
                $existing_names | index($n) | not)
          ]
        ' "$DATA_FILE" > "$TMP_DATA" && mv "$TMP_DATA" "$DATA_FILE"

        echo "Done. Updated artifacts:"
        jq '.releaseNotes.content.artifacts' "$DATA_FILE"

    - name: fetch-chains-provenance
      image: quay.io/lgallovi-test/release-service-utils:ubi10-test2
      computeResources:
        limits:
          memory: 256Mi
          cpu: 100m
        requests:
          memory: 256Mi
          cpu: 100m
      script: |
        #!/bin/bash
        set -euo pipefail

        PROVENANCE_DIR="${FILES_DIR}/chains-provenance"
        DOCKER_CONFIG="$(mktemp -d)"
        export DOCKER_CONFIG
        mkdir -p "${PROVENANCE_DIR}"

        while read -r IMAGE; do
          echo "Fetching Chains provenance for ${IMAGE}"

          select-oci-auth "${IMAGE}" > "${DOCKER_CONFIG}/config.json"

          # Use the image digest as the filename so downstream can
          # match provenance to the image that produced it.
          DIGEST="${IMAGE##*@}"
          PROVENANCE_FILE="${PROVENANCE_DIR}/${DIGEST}.json"

          # Chains uses AWS KMS for signing, not public Sigstore/Rekor,
          # so transparency log and SCT verification are skipped.
          COSIGN_STDERR="/tmp/cosign-stderr-${DIGEST}.log"
          if cosign verify-attestation \
            --type=slsaprovenance \
            --insecure-ignore-tlog=true \
            --insecure-ignore-sct=true \
            --key k8s://openshift-pipelines/public-key \
            "${IMAGE}" 2>"${COSIGN_STDERR}" | head -1 | jq '.payload | @base64d | fromjson' > "${PROVENANCE_FILE}"; then
            echo "  Saved Chains provenance to ${PROVENANCE_FILE}"
          else
            echo "ERROR: Failed to fetch Chains provenance for ${IMAGE}"
            cat "${COSIGN_STDERR}"
            exit 1
          fi
          rm -f "${COSIGN_STDERR}"
        done < "${IMAGES_TXT}"

        echo "Chains provenance files:"
        ls -la "${PROVENANCE_DIR}"

    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
